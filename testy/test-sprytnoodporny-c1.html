    const sameCat = (mapaKategorii[kat] || []).filter(w => w.id !== target.id);
    const otherCat = pula.filter(w => w.id !== target.id && !sameCat.includes(w));
    const allCandPool = sameCat.concat(otherCat);

    let prompt = '';
    let poprawna = '';
    let extractor = null;

    if (tryb === 'en_to_pl') {
      prompt = usunNawiasy(target.en);
      poprawna = usunNawiasy(target.pl);
      extractor = w => usunNawiasy(w.pl);
    } else if (tryb === 'en_to_def') {
      prompt = usunNawiasy(target.en);
      poprawna = usunNawiasy(target.def);
      extractor = w => usunNawiasy(w.def);
    } else if (tryb === 'def_to_en') {
      prompt = usunNawiasy(target.def);
      poprawna = usunNawiasy(target.en);
      extractor = w => usunNawiasy(w.en);
    } else { // pl_to_en
      prompt = usunNawiasy(target.pl);
      poprawna = usunNawiasy(target.en);
      extractor = w => usunNawiasy(w.en);
    }

    // Wybór dystraktorów z dopasowaniem długości (eliminacja heurystyki najdłuższej odpowiedzi)
    const poprLen = poprawna.length;
    const kandydaci = allCandPool
      .map(w => extractor(w))
      .filter(txt => txt && txt.toLowerCase() !== poprawna.toLowerCase());

    kandydaci.sort((a, b) => Math.abs(a.length - poprLen) - Math.abs(b.length - poprLen));

    // Bierzemy próbkę z 12 najbliższych długością
    const pulaDystraktorow = kandydaci.slice(0, 12);
    // Losujemy 3 różne
    const wybraneDystraktory = [];
    const uzyte = new Set();
    for (let d of pulaDystraktorow) {
      if (!uzyte.has(d) && d !== poprawna) {
        uzyte.add(d);
        wybraneDystraktory.push(d);
        if (wybraneDystraktory.length === 3) break;
      }
    }

    const opcje = [poprawna, ...wybraneDystraktory];
    // Tasowanie opcji
    for (let i = opcje.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [opcje[i], opcje[j]] = [opcje[j], opcje[i]];
    }

    return {
      kategoria: target.category,
      prompt: prompt,
      opcje: opcje,
      poprawnaIndeks: opcje.indexOf(poprawna),
      definicja: usunNawiasy(target.def),
      pulapka: usunNawiasy(target.trap)
    };
  }

  // Stan testu
  let kolejkaPytan = [];
  let aktualnyIndeks = 0;
  let punkty = 0;
  let zakonczone = 0;

  const panelKonfig = document.getElementById('panel-konfig');
  const strefaTestu = document.getElementById('strefa-testu');
  const ekranPodsumowania = document.getElementById('ekran-podsumowania');

  const pasekLicznik = document.getElementById('pasek-licznik');
  const pasekWynik = document.getElementById('pasek-wynik');
  const pytKategoria = document.getElementById('pyt-kategoria');
  const pytTresc = document.getElementById('pyt-tresc');
  const pytOpcje = document.getElementById('pyt-opcje');
  const pytWyjasnienie = document.getElementById('pyt-wyjasnienie');
  const pytPulapka = document.getElementById('pyt-pulapka');
  const btnDalej = document.getElementById('btn-dalej');

  function startTestu() {
    const pula = filtrujPule();
    if (pula.length === 0) {
      alert('Pula jest pusta');
      return;
    }

    // Przetasuj pulę i wybierz N pytań
    const przetasowana = pula.slice();
    for (let i = przetasowana.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [przetasowana[i], przetasowana[j]] = [przetasowana[j], przetasowana[i]];
    }

    const liczba = Math.min(wybranaLiczba, przetasowana.length);
    kolejkaPytan = przetasowana.slice(0, liczba).map(target => generujPytanieSprytnoodporne(target, wybranyTryb, pula));

    aktualnyIndeks = 0;
    punkty = 0;
    zakonczone = 0;

    panelKonfig.style.display = 'none';
    ekranPodsumowania.style.display = 'none';
    strefaTestu.style.display = 'block';

    pokazPytanie();
  }

  function pokazPytanie() {
    if (aktualnyIndeks >= kolejkaPytan.length) {
      zakonczTest();
      return;
    }

    const p = kolejkaPytan[aktualnyIndeks];
    pasekLicznik.textContent = 'Pytanie ' + (aktualnyIndeks + 1) + ' z ' + kolejkaPytan.length;
    pasekWynik.textContent = 'Wynik: ' + punkty + ' z ' + zakonczone;

    pytKategoria.textContent = p.kategoria;
    pytTresc.textContent = p.prompt;
    pytOpcje.innerHTML = '';
    pytWyjasnienie.style.display = 'none';
    pytPulapka.style.display = 'none';
    btnDalej.style.display = 'none';

    const litery = ['A', 'B', 'C', 'D'];
    p.opcje.forEach((opc, idx) => {
      const btn = document.createElement('button');
      btn.className = 'opcja-odpowiedzi';
      btn.innerHTML = '<span class="opcja-litera">' + litery[idx] + '</span><span>' + opc + '</span>';

      btn.addEventListener('click', () => {
        Array.from(pytOpcje.children).forEach((b, bIdx) => {
          b.disabled = true;
          if (bIdx === p.poprawnaIndeks) b.classList.add('dobra');
          else if (bIdx === idx) b.classList.add('zla');
        });

        zakonczone++;
        if (idx === p.poprawnaIndeks) {
          punkty++;
        }
        pasekWynik.textContent = 'Wynik: ' + punkty + ' z ' + zakonczone;

        if (p.definicja) {
          pytWyjasnienie.textContent = 'Definicja C1: ' + p.definicja;
          pytWyjasnienie.style.display = 'block';
        }
        if (p.pulapka) {
          pytPulapka.textContent = 'Pułapka wykładowcy: ' + p.pulapka;
          pytPulapka.style.display = 'block';
        }
        btnDalej.style.display = 'block';
      });

      pytOpcje.appendChild(btn);
    });
  }

  btnDalej.addEventListener('click', () => {
    aktualnyIndeks++;
    pokazPytanie();
    window.scrollTo(0, 0);
  });

  function zakonczTest() {
    strefaTestu.style.display = 'none';
    ekranPodsumowania.style.display = 'block';

    const proc = Math.round((punkty / kolejkaPytan.length) * 100);
    document.getElementById('podsum-procent').textContent = proc + '%';

    let ocena = 'Ocena 5.0 (Doskonały wynik)';
    if (proc < 60) ocena = 'Wymaga powtórki (Poniżej 60%)';
    else if (proc < 75) ocena = 'Ocena 3.5 (Dobra baza, doszlifuj szczegóły)';
    else if (proc < 90) ocena = 'Ocena 4.5 (Bardzo wysoki poziom)';

    document.getElementById('podsum-ocena').textContent = ocena;
    document.getElementById('stat-dobre').textContent = punkty;
    document.getElementById('stat-bledy').textContent = kolejkaPytan.length - punkty;
    document.getElementById('stat-razem').textContent = kolejkaPytan.length;
  }

  document.getElementById('btn-start').addEventListener('click', startTestu);
  document.getElementById('btn-restart').addEventListener('click', () => {
    ekranPodsumowania.style.display = 'none';
    panelKonfig.style.display = 'block';
  });

})();
</script>
