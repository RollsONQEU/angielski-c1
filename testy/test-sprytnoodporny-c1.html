Ratio", "pl": "wskaźnik leverage", "def": "The relationship between a company's total debt and its equity, used to measure financial risk.", "trap": "Not the same as 'Interest Coverage Ratio', which measures a company's ability to meet its debt obligations with earnings.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 423, "en": "currency collar", "pl": "kolarz walutowy", "def": "A trading strategy involving the use of both a put option and a call option to limit price movement in a foreign currency.", "trap": "A common mistake is confusing it with a currency swap, which involves exchanging principal and interest payments.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 424, "en": "strike price sensitivity", "pl": "czułość do ceny wykupu", "def": "The degree to which the value of an option changes in response to a change in its strike price.", "trap": "It is not the same as delta, which measures the sensitivity to underlying asset price changes.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 425, "en": "exchange rate basis", "pl": "bazowy kurs wymiany", "def": "The difference between the spot exchange rate and a forward exchange rate for the same currency pair.", "trap": "It should not be confused with the interest rate parity, which relates to the difference in interest rates between two countries.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 426, "en": "intrinsic value", "pl": "wartość wewnętrzna", "def": "The inherent value of an option derived from the difference between the market price of the underlying asset and the strike price.", "trap": "It is distinct from extrinsic value, which relates to the time value of an option.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 427, "en": "foreign exchange risk management", "pl": "zarządzanie ryzykiem wymiany obcej", "def": "The process of identifying, assessing, and mitigating risks associated with fluctuations in foreign currency exchange rates.", "trap": "It is not limited to just hedging but encompasses a broader range of risk mitigation techniques.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 428, "en": "option premium discounting", "pl": "rabat na premię opcji", "def": "The process of adjusting the option premium to reflect changes in market conditions or risk assessments.", "trap": "It is different from regular discounting, which involves reducing the overall cost of an asset.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 429, "en": "Constructive Trust", "pl": "Zaufanie konstrukcyjne", "def": "A legal arrangement where a person holds property for another's benefit without formal trust documents.", "trap": "Confuse with actual trust agreements, which require formal documentation.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 430, "en": "Equitable Estoppel", "pl": "Zakłócające zasady sprawiedliwego przysługiwania", "def": "A principle preventing a party from denying the truth of previously stated facts, even if false at the time.", "trap": "Not to be confused with promissory estoppel, which applies more broadly.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 431, "en": "Good Faith Requirement", "pl": "Wymóg uczciwości", "def": "A legal obligation to act in a manner that is fair and reasonable under the circumstances.", "trap": "Can be confused with strict liability, which does not require proof of fault.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 432, "en": "Interpleader Action", "pl": "Działanie interpleaderskie", "def": "A legal proceeding where a person holding property belonging to multiple parties files suit to determine the rightful owner.", "trap": "Distinct from class action lawsuits, which involve many plaintiffs against one defendant.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 433, "en": "Pari Passu Clause", "pl": "Klauzula równieczynna", "def": "A clause in a debt agreement stating that all creditors are to be treated equally.", "trap": "Can sometimes conflict with other contractual provisions, requiring careful negotiation.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 434, "en": "Set-Off Clause", "pl": "Klauzula ustawienia na pokrycie", "def": "A clause allowing a party to offset one obligation against another.", "trap": "Not to be confused with novation, which involves transferring the entire obligation to a third party.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 435, "en": "Demurrage Charges", "pl": "Zarządzanie kosztami demuracji", "def": "Charges levied by a carrier for delaying the pickup or delivery of goods beyond agreed terms.", "trap": "Be aware that 'demurrage' and 'detention' are similar but distinct concepts; demurrage relates to delays in pickup or delivery, while detention typically involves holding a vessel beyond its contractual time.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 436, "en": "Supply Chain Decoupling", "pl": "Decydowanie łańcucha dostaw", "def": "The process of separating different functions within a supply chain to improve flexibility and responsiveness.", "trap": "Decoupling should not be confused with 'decentralization', which implies dispersing decision-making power rather than separating specific functions.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 437, "en": "Nearshoring", "pl": "Bliskostronnictwo", "def": "The strategic relocation of manufacturing or service operations to a nearby country for reasons such as cost savings, reduced lead times, and improved supply chain agility.", "trap": "Nearshoring is distinct from 'onshoring', which refers to bringing operations back within the home country, rather than moving closer.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 438, "en": "Freight Forwarding Agency", "pl": "Agencja przewozowa", "def": "A business that organizes the logistics of international shipping and transportation for clients.", "trap": "While 'freight forwarder' is a common term, it's essential to understand the broader concept of an 'agency', which encompasses various logistics services.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 439, "en": "Bottleneck Mitigation", "pl": "Zarządzanie zwężonymi punktami", "def": "The process of identifying and resolving constraints in a supply chain to enhance overall efficiency and throughput.", "trap": "Mitigation focuses on reducing the impact of bottlenecks, whereas elimination aims at removing them entirely. Ensure students understand these nuances.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 440, "en": "Just-In-Case Inventory Management", "pl": "Zarządzanie zapasami zapobiegawczymi", "def": "An approach to inventory management that maintains a safety stock level to protect against potential shortages.", "trap": "This concept is often contrasted with 'just-in-time' (JIT) inventory, which aims for minimal stock levels. Ensure students understand the trade-offs between these strategies.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 441, "en": "cross-currency swap", "pl": "swap krzyżowy walutowy", "def": "A derivative contract where two parties agree to exchange principal and interest payments in different currencies over a specified period.", "trap": "Confusing with single-currency swap, which involves only one currency pair.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 442, "en": "inflation-linked foreign exchange (ILFX) derivative", "pl": "derywatywa obrotów walutowych połączonych z inflacją", "def": "A financial derivative whose value is adjusted for inflation, used to protect against or benefit from changes in the purchasing power of a currency.", "trap": "Misinterpreting as standard FX derivative without inflation adjustment.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 443, "en": "foreign exchange (FX) carry trade", "pl": "transakcja noszenia walut", "def": "A trading strategy where an investor borrows a currency with a low interest rate to buy another currency with a higher interest rate, hoping to profit from the difference in interest rates.", "trap": "Ignoring exchange rate risks and potential market reversals.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 444, "en": "foreign exchange (FX) forward contract", "pl": "umowa o przyszłe wymianę walut", "def": "A financial instrument in which two parties agree to buy or sell a specified amount of currency at a predetermined exchange rate on a future date.", "trap": "Misunderstanding the non-standardized nature of forwards compared to standardized futures contracts.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 445, "en": "foreign exchange (FX) option", "pl": "opcja na waluty obrotową", "def": "A financial derivative that gives the buyer the right, but not the obligation, to buy or sell a specified amount of currency at a predetermined exchange rate on or before a certain date.", "trap": "Confusing with FX swaps, which involve both the buying and selling of currencies.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 446, "en": "Breach of Warranty Clause", "pl": "Klauzula o naruszeniu gwarancji", "def": "A clause that addresses the consequences if a warranty provided in a contract is breached.", "trap": "Understand the difference between express and implied warranties; not all breaches are enforceable.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 447, "en": "Binding Arbitration Clause", "pl": "Klauzula o wiążącej arbitrażu", "def": "A clause that requires disputes arising from the contract to be resolved through arbitration.", "trap": "Arbitration clauses often limit the rights of parties, such as appeal rights, so they should be carefully negotiated.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 448, "en": "Dispute Settlement Mechanism (DSM)", "pl": "Mechanizm rozstrzygania sporów", "def": "A structured process for resolving disputes that may include mediation, arbitration, or other methods.", "trap": "The effectiveness of a DSM depends on the willingness and cooperation of all parties involved.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 449, "en": "Consequential Damages", "pl": "Zwolenie odwrotne", "def": "Damages that are a natural and foreseeable result of the breach of contract.", "trap": "Consequential damages can be harder to quantify than direct damages.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 450, "en": "Termination Clause", "pl": "Klauzula o zakończeniu", "def": "A clause that outlines the conditions under which a contract can be terminated.", "trap": "Termination clauses must be carefully drafted to avoid ambiguity.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 451, "en": "Equitable Relief", "pl": "Zasada równości", "def": "Legal remedies that are fair and just but may not be strictly compensatory.", "trap": "Equitable relief is discretionary and depends on the court's discretion.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 452, "en": "Good Faith Purchaser", "pl": "Dobry sprzedawca", "def": "A buyer who acts in good faith and without knowledge of any hidden defects or encumbrances on the property.", "trap": "Good faith status can be challenged if the buyer had actual or constructive knowledge of defects.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 453, "en": "Warranty Deed", "pl": "Dekret o zabezpieczeniach", "def": "A legal instrument that provides a guarantee or warranty, often used in real estate transactions.", "trap": "A warranty deed does not transfer ownership but guarantees the seller's rights.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 454, "en": "Collateral Agreement", "pl": "Porozumienie o zabezpieczeniach", "def": "An agreement that provides security for the obligations under another contract.", "trap": "Collateral agreements must be carefully structured to ensure enforceability.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 455, "en": "Exculpatory Clause", "pl": "Pozawalający klauzula", "def": "A clause in a contract that limits or excludes liability for certain acts or omissions.", "trap": "This term is often used interchangeably with indemnity clauses, but they have distinct purposes.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 456, "en": "Material Adverse Change (MAC) Clause", "pl": "Klauzula Materialnej Zmiany Uwarunków", "def": "A clause that allows one party to terminate or renegotiate a contract if there is a significant change in circumstances.", "trap": "MAC clauses should be carefully drafted to avoid being too broad, which could lead to frequent disputes.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 457, "en": "Good Faith Indemnity", "pl": "Zwierciedlenie obowiązku sprawiedliwej zachowania", "def": "An indemnity clause that compensates the other party for losses resulting from a breach of good faith.", "trap": "This clause is often overlooked, but it can be crucial in maintaining trust between parties.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 458, "en": "Concurrent Conditions", "pl": "Warunki współistniejące", "def": "Conditions that must be satisfied simultaneously for a contract to become effective.", "trap": "Misunderstanding the timing of these conditions can lead to delays or misunderstandings.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 459, "en": "Equitable Relief from Frustration", "pl": "Rozwiązanie równożyciowe z frustracji", "def": "A legal doctrine allowing a party to be released from contractual obligations due to an unforeseen event beyond the parties' control.", "trap": "This concept is often misunderstood and may not always be applicable.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 460, "en": "Choice of Forum Clause", "pl": "Klauzula wyboru sędziów", "def": "A clause that specifies the legal forum where disputes arising from the contract will be resolved.", "trap": "This clause can significantly impact the costs and accessibility of legal proceedings.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 461, "en": "Force Majeure Provisions", "pl": "Warunki siły wyższej", "def": "A clause in a contract that frees the parties from liability or obligation when an extraordinary event or circumstance beyond the control of the parties, such as a war, strike, riot, crime, or an event described by the term Act of God occurs.", "trap": "Ensure not to confuse with 'Act of God' which is a subset.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 462, "en": "Fiduciary Duties of the Board", "pl": "Obowiązki fiducjarnych członków rady zarządczej", "def": "Legal obligations that board members owe to the company and its shareholders, requiring them to act in good faith and with loyalty, and to prioritize the interests of the company above their own.", "trap": "Confusion with 'corporate governance' which is a broader term.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 463, "en": "block trade", "pl": "handel blokowy", "def": "A large-scale transaction of securities involving a significant number of shares or bonds.", "trap": "Block trade is not the same as over-the-counter trading; it specifically refers to large volumes.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 464, "en": "capital allocation", "pl": "dystrybucja kapitału", "def": "The process of assigning capital resources among different investment opportunities or assets.", "trap": "Capital allocation is distinct from budgeting; it focuses on strategic deployment of funds rather than day-to-day expenses.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 465, "en": "credit rating downgrade", "pl": "obniżenie klasy kredytowej", "def": "A decrease in the credit rating assigned to a borrower or security by a credit rating agency.", "trap": "Downgrading is not synonymous with default; it indicates reduced confidence in repayment ability.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 466, "en": "derivative instrument", "pl": "instrument pochodny", "def": "A financial contract whose value is derived from an underlying asset, index, or interest rate.", "trap": "Derivatives are not the same as primary securities; they derive their value from other assets.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 467, "en": "equity research analyst", "pl": "analysta badawczy wartości akcyjnych", "def": "A financial professional who performs in-depth analysis of companies' stocks and equity-related data.", "trap": "Equity research is distinct from investment banking; it focuses on analysis rather than underwriting.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 468, "en": "margin call", "pl": "wywołanie保证金", "def": "A demand by a broker or lender for additional collateral to bring the investor's account back up to the required maintenance margin.", "trap": "Margin call is not related to dividends; it concerns the amount of money an investor must maintain in their account.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 469, "en": "cryptocurrency exchange platform", "pl": "platforma wymiany kryptowalut", "def": "A financial service that allows users to buy, sell, or trade cryptocurrencies for fiat money or other digital assets.", "trap": "Be cautious of terms like 'cryptocurrency wallet', which refers to the storage, not the exchange.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 470, "en": "real-time payment processing system", "pl": "system przetwarzania płatności w czasie rzeczywistym", "def": "A payment solution that facilitates the immediate transfer of funds between accounts, enabling transactions to be completed almost instantly.", "trap": "Do not confuse with 'batch payment processing', which involves processing multiple payments at once, not in real time.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 471, "en": "decentralized finance (DeFi) ecosystem", "pl": "ekosystem finansów decentralizowanych (DeFi)", "def": "A financial system built on blockchain technology that operates without central intermediaries, enabling direct peer-to-peer transactions and services.", "trap": "Be aware that 'centralized finance' refers to traditional banking systems, which are the opposite of DeFi.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 472, "en": "multi-factor authentication (MFA) protocol", "pl": "protokół uwierzytelniania wieloskładnikowego (MFA)", "def": "A security procedure requiring two or more distinct verification methods to authenticate a user's identity.", "trap": "Do not mix up with 'single-factor authentication', which relies on only one method for verification.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 473, "en": "smart asset management system", "pl": "system inteligentnej zarządzania aktywami", "def": "A technology-driven platform that uses algorithms and data analytics to optimize the allocation and management of assets in a portfolio.", "trap": "Be careful not to confuse with 'manual asset management', which relies on human intervention.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 474, "en": "federated identity management solution", "pl": "rozwinięte rozwiązanie zarządzania tożsamościami", "def": "A system that allows multiple organizations to share and manage user identities securely, enabling seamless access across different platforms.", "trap": "Avoid the misconception that 'single-identity management' can replace federated solutions for complex organizational needs.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 475, "en": "Market capitalization", "pl": "kapitalizacja rynkowa", "def": "The total value of a company's outstanding shares, calculated by multiplying the number of shares by the current price per share.", "trap": "Do not confuse with share capital.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 476, "en": "Liquidity risk", "pl": "ryzyko likuidności", "def": "The risk that an asset cannot be quickly sold without significant price loss.", "trap": "Not to be confused with market risk.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 477, "en": "Duration (bond)", "pl": "czas trwania obligacji", "def": "A measure of the sensitivity of a bond's price to interest rate changes.", "trap": "Focus on its use in bond valuation.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 478, "en": "Volatility index", "pl": "indeks wolaatylnościowy", "def": "An index that measures the level of fluctuation or volatility in financial markets.", "trap": "Not to be confused with a volatility surface.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 479, "en": "Structured product", "pl": "produkt złożony", "def": "A financial instrument whose value is derived from the performance of one or more underlying assets.", "trap": "Distinguish it from derivatives.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 480, "en": "Bull Call Spread", "pl": "spread bull-call", "def": "A market strategy involving buying call options and selling put options on the same underlying asset.", "trap": "Be aware of its opposite, bear call spread.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 481, "en": "Blockchain interoperability framework", "pl": "ramka współdziałania blockchainu", "def": "A set of protocols and standards that enable different blockchain networks to communicate and interact with each other.", "trap": "Be cautious not to confuse with 'blockchain fragmentation', which refers to the opposite concept.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 482, "en": "Digital asset custody service", "pl": "usługa skarbniictwa aktywów cyfrowych", "def": "A service that provides secure storage and management of digital assets, ensuring their safety and accessibility.", "trap": "Do not mix up with 'digital wallet', which primarily focuses on transactional storage rather than custody.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 483, "en": "Cross-border payment reconciliation platform", "pl": "platforma reconcilementu płatności międzynarodowych", "def": "A platform that facilitates the matching and settling of cross-border payments between different financial institutions.", "trap": "Beware of 'cross-border payment facilitation', which focuses on processing rather than reconciliation.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 484, "en": "Quantitative risk assessment model", "pl": "model oceny ryzyka ilościowego", "def": "A statistical and mathematical model used to quantify and assess financial risks in a systematic manner.", "trap": "Avoid confusing with 'qualitative risk assessment', which relies more on subjective judgments.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 485, "en": "API-driven payment gateway integration", "pl": "integracja bramy płatniczej oparta na interfejsach API", "def": "The process of integrating a payment gateway using application programming interfaces (APIs) to enable seamless transaction processing.", "trap": "Do not mistake for 'API-first development', which focuses on designing APIs from the start rather than integrating them.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 486, "en": "Biometric authentication scalability solution", "pl": "rozwijalna metoda uwierzytelniania biometycznego", "def": "A scalable technology solution that uses biometric data (e.g., fingerprints, facial recognition) for secure user authentication.", "trap": "Be careful not to confuse with 'biometric data management', which focuses on handling rather than authenticating.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 487, "en": "hostile takeover defense", "pl": "obrona przed nieprzyjałym przejęciem", "def": "A set of strategies employed by a target company to fend off an unwanted acquisition attempt.", "trap": "Not to be confused with 'friendly takeover', which is a cooperative acquisition.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 488, "en": "white knight defense", "pl": "obrona biały konik", "def": "A strategy where a target company seeks to be acquired by an amicable third party rather than facing an unwanted takeover.", "trap": "A 'white knight' is not always guaranteed and may still face regulatory hurdles.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 489, "en": "earn-out provision", "pl": "warunek wypłaty uzależniony od wyników", "def": "A contractual arrangement in which a seller's compensation is contingent upon the future financial performance of the acquired company.", "trap": "Earn-outs can lead to prolonged negotiations and disputes if the targets' financial results do not meet expectations.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 490, "en": "break-up fee", "pl": "opłata za rozwieszczenie", "def": "A non-refundable fee paid by a buyer to the seller if the acquisition deal is terminated before closing.", "trap": "Break-up fees can be significant and may influence a buyer's decision to pursue or abandon a transaction.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 491, "en": "material adverse change clause", "pl": "klauzula o istotnych szkodach", "def": "A contractual provision that allows a party to terminate an agreement if there is a material adverse change in the circumstances of the deal.", "trap": "MAC clauses can be ambiguous and may lead to disputes over what constitutes a 'material adverse change'.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 492, "en": "Interest Rate Swap", "pl": "Zamiana oprocentowań", "def": "A financial derivative contract through which two parties agree to exchange interest payments based on a notional principal amount.", "trap": "Not to be confused with currency swaps, where both principal and interest are exchanged in different currencies.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 493, "en": "Credit Default Swap", "pl": "Zamiana pochodzenia kredytowego", "def": "A financial derivative instrument used to transfer the credit risk of a bond or loan between two parties.", "trap": "Understanding the difference between CDS and insurance policies is crucial; CDS does not guarantee payment.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 494, "en": "Collateralized Debt Obligation (CDO)", "pl": "Obligacja zależna od zabezpieczenia (OZZ)", "def": "A type of asset-backed security where the cash flows from a pool of various debt instruments are used to pay investors.", "trap": "CDOs can be complex, involving multiple tranches with different levels of risk and return.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 495, "en": "Revolving Credit", "pl": "Kredyt obracalny", "def": "A type of loan where the borrower can draw down funds up to a predetermined limit and repay as needed, with periodic renewals.", "trap": "Revolving credit is different from term loans, which have fixed repayment schedules.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 496, "en": "Debt Service Coverage Ratio (DSCR)", "pl": "Współczynnik pokrywania kosztów spłat długów", "def": "A financial metric used to evaluate a company's ability to service its debt obligations.", "trap": "A DSCR above 1 indicates that the borrower can cover its debt payments with its operating cash flow.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 497, "en": "Letter of Credit (LC)", "pl": "List kredytowa", "def": "A document issued by a bank guaranteeing payment to a beneficiary upon presentation of certain documents.", "trap": "A LC is not an insurance policy and does not cover all risks related to trade.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 498, "en": "GAAP convergence", "pl": "zjednolicanie standardów GAAP", "def": "The process of aligning Generally Accepted Accounting Principles (GAAP) with International Financial Reporting Standards (IFRS).", "trap": "Note that while 'convergence' implies alignment, it does not necessarily mean full equivalence.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 499, "en": "Tax carryforward", "pl": "przeniesienie podatku", "def": "The process of carrying forward unused tax credits or losses from one accounting period to another for potential future offset.", "trap": "Ensure distinction between 'carryforward' and 'carryback', as carryback involves applying losses or credits against prior periods.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 500, "en": "Non-GAAP measures", "pl": "miary niestandardowe", "def": "Financial measures and metrics that do not comply with Generally Accepted Accounting Principles (GAAP) but are used by companies to provide additional insights into their performance.", "trap": "Be aware that while these measures can offer valuable information, they must be clearly disclosed and not misleading.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 501, "en": "Amortization schedule", "pl": "plan amortyzacji", "def": "A detailed timetable that outlines the periodic allocation of an intangible asset's cost over its useful life.", "trap": "Amortization is specific to intangibles, whereas depreciation concerns tangible assets.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 502, "en": "Qualified opinion with emphasis paragraph", "pl": "opinia kwalifikowana z dodatkową uwagią", "def": "An audit opinion that expresses reservation about the financial statements, accompanied by a specific statement highlighting significant matters that affect the presentation of the financial information.", "trap": "Be cautious as this type of opinion may indicate material weaknesses in the company's accounting practices.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 503, "en": "Fraud detection and prevention", "pl": "wykrywanie i zapobieganie oszustwom", "def": "A set of strategies, policies, and procedures implemented to identify, prevent, and mitigate fraudulent activities within an organization.", "trap": "Ensure that these measures are continuously reviewed and updated to adapt to evolving threats.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 504, "en": "monetary overhang", "pl": "nadmiar monetarny", "def": "A situation where the monetary supply exceeds the economy's needs, leading to potential inflationary pressures.", "trap": "It may be confused with 'fiscal overhang', which refers to excessive government spending.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 505, "en": "credit crunch", "pl": "zapaść kredytowa / kryzys kredytowy (drastyczne ograniczenie pożyczek przez banki)", "def": "A severe economic condition where banks abruptly reduce the availability of loans and credit, while hiking interest rates, making borrowing extremely difficult.", "trap": "Wystąpiło w kryzysie 2007-2008. Nie mylić z recesją (recesja dotyczy całej gospodarki i PKB, credit crunch dotyczy zapaści w systemie bankowo-kredytowym).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 506, "en": "real interest rate", "pl": "realna stopa procentowa", "def": "The nominal interest rate adjusted for the effects of inflation, reflecting the actual cost of borrowing or return on savings.", "trap": "It is often misinterpreted as the 'nominal interest rate' without considering inflation.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 507, "en": "fiscal multiplier", "pl": "mnożnik publicznych wydatków", "def": "A measure of the change in gross domestic product (GDP) resulting from a change in government spending or taxation.", "trap": "It is sometimes misinterpreted as the 'money multiplier', which relates to monetary policy rather than fiscal policy.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 508, "en": "Adjusted Present Value (APV)", "pl": "Wartość Bieżąca Ustabilowana (WBU)", "def": "A method for valuing a project by considering the impact of financing decisions on its value.", "trap": "APV is not to be confused with NPV; it specifically adjusts for financing effects.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 509, "en": "Equity Risk Premium (ERP)", "pl": "Premia Ryzyka Na Akcje (PREA)", "def": "The additional return required by investors to compensate for the greater risk of owning equity compared to debt.", "trap": "ERP can vary significantly between industries and markets.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 510, "en": "Net Operating Profit After Tax (NOPAT)", "pl": "Zysk Operacyjny Po Podatku (ZOPO)", "def": "A measure of a company's operating profit after taxes have been paid, excluding non-operating income and expenses.", "trap": "NOPAT excludes interest expense, so it should not be adjusted by WACC.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 511, "en": "Free Cash Flow to Firm (FCFF)", "pl": "Wolny Przepływ Gotówki Do Firmy (WPFDZ)", "def": "The cash generated by a company's operations, minus capital expenditures needed to maintain its asset base, available for distribution to all investors.", "trap": "FCFF assumes that the company's capital structure remains constant.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 512, "en": "Real Options Analysis", "pl": "Analiza Rzeczywistych Opcji (ARO)", "def": "A valuation method that incorporates the value of managerial flexibility and strategic options embedded in business decisions.", "trap": "ROA can be complex and requires assumptions about future scenarios.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 513, "en": "monetary policy normalization", "pl": "normalizacja zasad monetarnych", "def": "The process of returning monetary policy settings to more neutral levels after an extended period of unconventional measures.", "trap": "Normalization implies a gradual return to standard practices, not necessarily a reversal.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 514, "en": "credit line agreement", "pl": "umowa o linijkę kredytową", "def": "An arrangement between a financial institution and a borrower that specifies the amount of funds available to be drawn upon as needed.", "trap": "A credit line is not a loan but an agreement that allows borrowing up to a specified limit.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 515, "en": "sterilization effect", "pl": "efekt neutralizacji monetarnej", "def": "The process by which central banks attempt to offset the impact of foreign exchange market interventions on domestic monetary conditions.", "trap": "Sterilization is not about eliminating the effects entirely, but rather managing them.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 516, "en": "inflation targeting framework", "pl": "ramka celu wzmocnienia stabilności cennych papierów monetarnych", "def": "A monetary policy strategy where the central bank sets explicit, measurable inflation targets to guide its actions.", "trap": "Inflation targeting does not guarantee zero inflation, but aims for a low and stable rate.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 517, "en": "monetary union", "pl": "união monetária", "def": "An arrangement where multiple countries share a common currency, often managed by a central bank.", "trap": "Monetary union implies shared fiscal policies as well, not just a single currency.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 518, "en": "fiscal policy coordination", "pl": "koordynacja zasad budżetowych", "def": "The process of aligning fiscal policies across multiple countries or jurisdictions to achieve common economic goals.", "trap": "Coordination does not imply identical policies, but rather complementary actions towards shared objectives.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 519, "en": "triple net lease (NNN)", "pl": "leasinga trójny-netowy (NNN)", "def": "A type of commercial lease where the tenant is responsible for property taxes, insurance, and maintenance costs.", "trap": "Ensure students understand the tenant's broader financial obligations compared to other types of leases.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 520, "en": "cap rate (capitalization rate)", "pl": "stopa zwrotu kapitału (CAP RATE)", "def": "A percentage used to estimate the potential return on a real estate investment, calculated by dividing net operating income by the property's value.", "trap": "Emphasize that cap rates vary across regions and asset classes.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 521, "en": "property foreclosure", "pl": "zakłóca property", "def": "The legal process by which a lender seizes and sells a piece of real estate when the borrower fails to make mortgage payments.", "trap": "Discuss the impact of foreclosures on local economies and tenant rights.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 522, "en": "rent review indexation", "pl": "indeksowanie recenzji wynajmu", "def": "A clause in a lease agreement that specifies how rent will be adjusted based on changes in an economic indicator, such as the Consumer Price Index.", "trap": "Caution students about potential inflationary pressures and their impact on financial planning.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 523, "en": "Customs Brokerage", "pl": "Biuro Czynności Występowalnych w Zakresie Dutów i Tarafniczenia", "def": "A professional service that handles customs procedures and duties on behalf of importers or exporters.", "trap": "Not all customs clearance services are created equal; choose a broker familiar with your specific industry.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 524, "en": "Supply Chain Visibility", "pl": "Widoczność Łańcucha Supli", "def": "The ability to monitor and trace the movement of goods throughout the entire supply chain in real time.", "trap": "Supply chain visibility is not just about tracking; it involves analyzing data to make informed decisions.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 525, "en": "Freight Consolidation", "pl": "Zjednoczanie Frachtu", "def": "The process of combining multiple smaller shipments into a single large shipment to optimize transportation costs and efficiency.", "trap": "Freight consolidation can reduce shipping costs but may increase lead times due to the need for additional handling.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 526, "en": "Incoterms (CIF)", "pl": "Warunki Incoterm CIF", "def": "A trade term under the Incoterms rules where the seller delivers the goods on board a vessel at the named port of shipment, with the buyer responsible for all costs and risks after that point.", "trap": "CIF does not include insurance; the buyer must arrange their own coverage.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 527, "en": "Lead Time Optimization", "pl": "Optymalizacja Czasu Poczekiwania", "def": "The process of reducing the time between initiating an order and receiving the finished product, aiming to improve efficiency and responsiveness.", "trap": "Optimizing lead times can lead to increased inventory holding costs; a balance must be struck.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 528, "en": "Bottleneck Analysis", "pl": "Analiza Sterna", "def": "The process of identifying and analyzing the slowest or most constrained part of a supply chain to understand its impact on overall performance.", "trap": "Bottlenecks are not always visible; sometimes, they require deeper investigation to identify.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 529, "en": "monetary policy accommodation", "pl": "akkomodacyjna polityka monetarna", "def": "A reduction in the level of interest rates or other measures taken by a central bank to stimulate economic growth.", "trap": "Monetary policy accommodation is not the same as contractionary policies.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 530, "en": "currency repurchase agreement (repo)", "pl": "umowa o kupno i sprzedaż z zwrotu gotówki", "def": "A short-term borrowing arrangement where securities are used as collateral, commonly used in forex trading for liquidity purposes.", "trap": "It is not related to forward contracts but rather to short-term funding.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 531, "en": "delta hedging", "pl": "hedging z użyciem delty", "def": "A risk management strategy used to reduce the impact of price fluctuations on an asset by offsetting its position with a derivative.", "trap": "It only addresses changes in value due to price movement, not other risks.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 532, "en": "foreign exchange spot market", "pl": "rynок stradowy giełdy walut", "def": "A financial market for the immediate or near-immediate settlement of foreign currency transactions.", "trap": "It is distinct from forward markets, which involve future settlements.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 533, "en": "maturity mismatch", "pl": "nierównowaga matury", "def": "A situation where the maturity of assets and liabilities in a financial portfolio do not match, potentially leading to interest rate risk.", "trap": "Maturity mismatch is distinct from 'credit mismatch', which pertains to the mismatch between credit ratings of assets and liabilities.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 534, "en": "delta-neutral strategy", "pl": "strategia neutralna delta", "def": "A trading approach designed to offset the exposure to price movements of an asset by taking opposing positions in related derivatives.", "trap": "Delta neutrality should not be confused with gamma neutrality, which also aims at managing risk but focuses on second-order price effects.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 535, "en": "foreign exchange exposure", "pl": "eksponencja wymiany", "def": "The level of risk a company is exposed to due to its foreign currency transactions and assets.", "trap": "Foreign exchange exposure differs from 'currency exposure', which typically refers to direct currency holdings.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 536, "en": "structured note", "pl": "notatka złożona", "def": "A financial product that combines traditional debt instruments with derivatives to offer customized risk and return profiles.", "trap": "Structured notes are distinct from 'structured products', which can refer more broadly to any financial derivative with complex features.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 537, "en": "basis point", "pl": "punkt bazowy", "def": "A unit of measurement equal to one-hundredth of a percentage point.", "trap": "Confusion with percentage points; note that 100 basis points = 1 percentage point.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 538, "en": "gamma", "pl": "gamma", "def": "A measure of the rate of change of delta with respect to the underlying asset's price.", "trap": "Confusion with delta; gamma measures the second derivative of option value.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 539, "en": "strike price", "pl": "cena ściągnięcia", "def": "The fixed price at which the underlying asset can be bought or sold when an option is exercised.", "trap": "Misunderstanding its role; it's not a transaction cost but a reference point for option exercise.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 540, "en": "spot versus forward parity", "pl": "parzystość spot versus forward", "def": "The relationship between the spot exchange rate and the forward exchange rate, taking into account interest rate differentials.", "trap": "Ignoring the impact of interest rates; the parity does not always hold due to market imperfections.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 541, "en": "counterparty risk", "pl": "ryzyko kontrahenta", "def": "The risk that a counterparty may default on its financial obligations, leading to potential losses.", "trap": "Confusing with market risk; counterparty risk is specific to the creditworthiness of the other party involved in a transaction.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 542, "en": "currency futures contract", "pl": "kontrakt futures na walutę", "def": "A standardized financial derivative agreement to buy or sell a specific amount of a currency at a predetermined price and future date.", "trap": "Do not confuse with forward contracts, which are similar but have different terms.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 543, "en": "volatility swap", "pl": "swap na wariowatość", "def": "A financial derivative contract that allows parties to exchange future payments based on the realized versus implied volatility of an underlying asset.", "trap": "This is not related to spot or forward transactions; it focuses specifically on volatility.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 544, "en": "in-the-money option", "pl": "opcja w zasięgu", "def": "An options contract where the strike price is below the market price for a call option, or above the market price for a put option.", "trap": "It is important to distinguish between in-the-money and out-of-the-money options.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 545, "en": "out-of-the-money option", "pl": "opcja poza zasięgiem", "def": "An options contract where the strike price is above the market price for a call option, or below the market price for a put option.", "trap": "This is the opposite of in-the-money options; it does not guarantee future profitability.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 546, "en": "implied volatility", "pl": "wariowatość niejawna", "def": "The expected future volatility of the underlying asset derived from the price of an option.", "trap": "It is distinct from historical volatility and reflects market sentiment.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 547, "en": "currency overlay strategy", "pl": "strategia nakładu na waluty", "def": "A risk management technique that involves using derivatives to adjust the currency exposure of an investment portfolio.", "trap": "It is different from traditional hedging methods, focusing on dynamic adjustment rather than static protection.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 548, "en": "exotic option", "pl": "opcja exoticzna", "def": "An option with terms and conditions that are more complex or less common than standard options, often based on less liquid underlying assets.", "trap": "May involve higher risks due to lower liquidity and understanding.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 549, "en": "currency basket", "pl": "sztuczka walutowa", "def": "A weighted average of a selection of currencies, often used as a reference rate or to diversify currency risk.", "trap": "Can be complex to construct and manage due to varying weights and currencies.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 550, "en": "creditor rights litigation", "pl": "rozrywki prawne kredytorów", "def": "Legal disputes involving the rights and obligations of creditors in insolvency cases.", "trap": "This term does not refer to environmental law or consumer rights, but specifically to financial disputes.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 551, "en": "bankruptcy discharge", "pl": "wykup z rozbrotu", "def": "The legal process by which a debtor's obligation to repay debts is relieved upon the completion of bankruptcy proceedings.", "trap": "This term should not be confused with 'bankruptcy dismissal', which indicates the termination of bankruptcy proceedings without a discharge.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 552, "en": "cross-default provision", "pl": "klauzula krzyżowego defauldu", "def": "A condition in a loan agreement that triggers default on one obligation if another obligation, such as another loan or bond, defaults.", "trap": "This term is not related to cross-border transactions or international trade agreements.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 553, "en": "equity stakeholder dilution", "pl": "rozdilu udziałów akcyjnych", "def": "The reduction in the percentage ownership or voting power of existing shareholders due to the issuance of new shares.", "trap": "This term does not refer to environmental impact assessments or property development.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 554, "en": "pre-packaged bankruptcy", "pl": "rozbrot przedprogramowany", "def": "A bankruptcy filing that includes a pre-approved restructuring plan, often agreed upon with creditors before the formal bankruptcy process begins.", "trap": "This term is not related to pre-paid services or subscription-based models.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 555, "en": "debtor-in-possession financing", "pl": "finansowanie debitora w posesji", "def": "Short-term financing provided to a debtor in bankruptcy proceedings to enable them to continue operating and implementing the restructuring plan.", "trap": "This term should not be confused with debtor-in-need financing, which refers to general corporate lending.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 556, "en": "Economic Substance Doctrine", "pl": "Zasada Substancji Ekonomicznej", "def": "The principle that legal form must be consistent with economic reality in terms of substance.", "trap": "Not to confuse with mere formalities or nominal presence without actual operations.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 557, "en": "Digital Services Tax (DST)", "pl": "Podatek od Usług Cyfrowych", "def": "A tax imposed on revenue generated from digital services provided to consumers in a specific jurisdiction.", "trap": "To be aware of varying interpretations and exemptions across different jurisdictions.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 558, "en": "Transfer Pricing Adjustment (TPA)", "pl": "Dostosowanie Cennika Transferowego", "def": "The process of reviewing and adjusting intercompany transactions to ensure they are at arm's length.", "trap": "To understand the complexities and potential penalties for non-compliance.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 559, "en": "Hybrid Misalignment", "pl": "Nierównomierna Traktacja Podatkowa", "def": "A situation where a financial instrument or transaction is taxed differently in two jurisdictions.", "trap": "To recognize the potential for double taxation or avoidance strategies.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 560, "en": "General Anti-Avoidance Principle (GAAP)", "pl": "Ogólna Zasada Unikania Ucieczki Podatkowej", "def": "A principle that aims to prevent taxpayers from engaging in artificial arrangements solely for tax avoidance.", "trap": "To distinguish between legitimate business decisions and those motivated primarily by tax considerations.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 561, "en": "Permanent Establishment (PE)", "pl": "Stałe Zajezdnie", "def": "A concept under international tax law indicating a sufficient degree of physical presence in another country.", "trap": "To be familiar with the specific criteria for establishing a PE under various international treaties.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 562, "en": "carbon offset credits", "pl": "kredyty do kompensacji węglowych", "def": "Certificates representing a reduction in carbon emissions that can be bought and sold to offset other emissions.", "trap": "These are not the same as renewable energy certificates.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 563, "en": "greenwashing", "pl": "wesprzedażka", "def": "The practice of misleading consumers into believing that a company's products or services are environmentally friendly.", "trap": "It is important to distinguish between genuine sustainability efforts and greenwashing.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 564, "en": "corporate sustainability reporting directive (CSRD)", "pl": "dyrektywa raportowania o zrównoważonym rozwoju firmowym", "def": "A regulatory directive requiring companies to disclose detailed sustainability information.", "trap": "This is distinct from the Integrated Reporting Framework (IRF).", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 565, "en": "scope 1, 2, 3 emissions", "pl": "emisje w zakresie 1, 2 i 3", "def": "Classification of a company's greenhouse gas emissions into direct (scope 1), indirect from energy use (scope 2), and all other indirect emissions (scope 3).", "trap": "Scope 4 emissions do not exist.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 566, "en": "impact investing", "pl": "inwestowanie z wpływem społecznym", "def": "Investment strategy that aims to generate social or environmental impact alongside financial returns.", "trap": "Impact investing is not the same as philanthropy.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 567, "en": "social taxonomy", "pl": "taksonomia działań społecznych", "def": "A system for classifying and defining the range of economic activities that contribute to social objectives.", "trap": "It should not be confused with environmental taxonomy.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 568, "en": "Private placement", "pl": "Placement prywatny", "def": "A method of raising capital by selling securities directly to a limited number of accredited investors.", "trap": "This term is often confused with public offerings but involves direct sales rather than through a stock exchange.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 569, "en": "Bear Call Spread", "pl": "Rozkład Bęgła i Voli", "def": "A financial strategy involving the purchase of a put option and the sale of a call option with different strike prices on the same underlying asset.", "trap": "While similar in name to Bull Call Spread, it operates under different market conditions.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 570, "en": "Market Impact Cost", "pl": "Koszt Wpływowy Rynek", "def": "The cost incurred when buying or selling large quantities of securities, which affects the market price due to significant trading activity.", "trap": "This term is not directly related to yield curve or credit spread but is crucial in understanding large-scale trading activities.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 571, "en": "Secondary Market Discount", "pl": "Znizka na Rynek Pośrednim", "def": "The difference between the price at which a security is issued and its trading price in the secondary market.", "trap": "This term focuses specifically on bond pricing rather than other securities.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 572, "en": "Structured Investment Product (SIP)", "pl": "Produkt Inwestycyjny Strukturalny", "def": "A financial product designed to meet specific investment objectives by combining various securities and derivatives.", "trap": "This term is similar to 'Structured product' but has distinct implications in financial offerings.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 573, "en": "Quantum key distribution (QKD) system", "pl": "system dystrybucji kluczy kwantowych (QKD)", "def": "A cryptographic technique that uses quantum mechanics to secure communication channels.", "trap": "Confusing QKD with classical encryption methods.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 574, "en": "Decentralized Autonomous Organization (DAO)", "pl": "Zdecydralizowana Samoodręczna Organizacja (DAO)", "def": "A self-regulating organization that operates on a blockchain network without central authority.", "trap": "Misinterpreting DAO as a traditional corporation.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 575, "en": "Digital twin financial services", "pl": "Usługi finansowe dwuosiówek cyfrowych", "def": "A virtual representation of a physical or conceptual entity used for monitoring and optimizing real-world operations.", "trap": "Failing to distinguish between digital twins and other simulation technologies.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 576, "en": "Blockchain-based reputation management system", "pl": "System zarządzania reputacją oparty na blockchainu", "def": "A system that uses blockchain technology to record and verify the credibility of entities or individuals.", "trap": "Mixing up blockchain-based systems with traditional credit rating methods.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 577, "en": "Hyperledger fabric", "pl": "Sieć Hyperledger Fabric", "def": "A permissioned blockchain platform designed for business-to-business transactions.", "trap": "Considering Hyperledger Fabric as an open-source public blockchain.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 578, "en": "AI-driven fraud detection algorithm", "pl": "Algorytm wykrywania oszustwa oparty na sztucznym inteligencji", "def": "An algorithm that uses artificial intelligence and machine learning to identify fraudulent activities.", "trap": "Overlooking the human oversight required in AI systems.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 579, "en": "synergy", "pl": "sinergia", "def": "The combined effect of two or more entities operating together that is greater than the sum of their separate effects.", "trap": "Synergy refers specifically to the positive interaction, not just combined operations.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 580, "en": "consolidation", "pl": "akumulacja", "def": "The process of combining smaller or fewer companies into a larger one, often to increase market share or efficiency.", "trap": "Consolidation implies growth and centralization, not just combining similar entities.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 581, "en": "divestiture", "pl": "wy sprzedaż", "def": "The sale of a company's assets or business units to another party in order to focus on core activities.", "trap": "Divestiture is not just selling off assets, but a strategic decision often driven by market conditions.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 582, "en": "cross-border merger", "pl": "merger międzynarodowy", "def": "A business combination where the merging companies are based in different countries.", "trap": "Ensure you understand that 'cross-border' refers specifically to different countries, not just regions.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 583, "en": "Syndicated Loan Agreement", "pl": "Umowa Kredytu Syndykowanego", "def": "A formal agreement between a borrower and multiple lenders in a syndicate to provide funds.", "trap": "Do not confuse it with a simple loan agreement.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 584, "en": "Bridge Financing Facility", "pl": "Zasób Finansowania Przejściowego", "def": "A short-term financial arrangement provided to bridge a gap between two funding sources.", "trap": "It is not intended for long-term use.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 585, "en": "Credit Facility Documentation", "pl": "Dokumentacja Zasobu Kredytowego", "def": "A set of official documents required to establish and manage a credit facility.", "trap": "It includes more than just loan agreements.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 586, "en": "Covenants and Conditions Precedent", "pl": "Warunki i Warunki Wstępne", "def": "Agreed-upon terms that the borrower must meet before a credit facility can be activated.", "trap": "These are enforceable legal obligations.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 587, "en": "Debt Restructuring Support Services", "pl": "Usługi Wsparcia do Restrukturyzacji Dłużności", "def": "Professional services aimed at reorganizing a company's debt structure to improve financial health.", "trap": "It involves more than just refinancing.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 588, "en": "Non-Performing Loan Monitoring System", "pl": "System Monitorowania Niewydajnych Kredytów", "def": "A systematic approach for tracking and managing non-performing loans within a financial institution.", "trap": "It requires continuous updating and analysis.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 589, "en": "cross-border restructuring", "pl": "restrukturyzacja transgraniczna", "def": "A corporate restructuring process that involves multiple countries, often aimed at optimizing operations and reducing costs.", "trap": "Not to be confused with 'cross-border merger', which specifically involves the merging of two separate companies.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 590, "en": "post-merger integration (PMI)", "pl": "integracja po połączeniu", "def": "The process of combining the operations, culture, and management structures of two companies after a merger.", "trap": "PMI is often confused with 'due diligence', which occurs before the deal is finalized.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 591, "en": "earn-out structure", "pl": "struktura wynagrodzenia oparta na wynikach", "def": "A financial arrangement in which the seller receives additional payment contingent on the performance of the company after acquisition.", "trap": "This term is distinct from 'earn-out provision', which refers specifically to a contractual clause rather than the overall arrangement.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 592, "en": "Cryptocurrency wallet aggregation service", "pl": "usługa agregacji portfela kryptowalut", "def": "A financial service that consolidates multiple cryptocurrency wallets into a single interface for easier management and transaction.", "trap": "This term is often confused with 'wallet provider' but specifically refers to the consolidation of multiple wallets.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 593, "en": "Real-time risk assessment engine", "pl": "silnik oceny ryzyka w czasie rzeczywistym", "def": "A sophisticated system that evaluates financial risks instantly to support real-time decision-making.", "trap": "This term does not refer to post-event analysis but rather continuous, instant risk evaluation.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 594, "en": "Distributed Ledger Technology (DLT) compliance framework", "pl": "ramka zgodności technologii rozproszonej ledgeru", "def": "A structured set of guidelines and rules designed to ensure DLT systems comply with relevant financial regulations.", "trap": "This term is distinct from 'Blockchain interoperability framework' and specifically addresses legal compliance.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 595, "en": "Biometric authentication verification system", "pl": "system weryfikacji uwierzytelniania biometrycznego", "def": "A technological solution that verifies user identity through biometric data for enhanced security.", "trap": "This term should not be confused with 'biometric authentication scalability solution' which focuses on capacity.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 596, "en": "Open Banking API ecosystem", "pl": "ecosystem otwartej bankowości interfejsu API", "def": "A network of APIs that enable third-party services to access and utilize banking data securely.", "trap": "This term specifically refers to an ecosystem, not just a single API or platform.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 597, "en": "Tokenization of real estate assets", "pl": "tokenizacja majątku immobiliarnego", "def": "The process of converting ownership interests in real estate into digital tokens for easier trading and investment.", "trap": "This term should not be confused with 'tokenization of assets' which is a broader concept.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 598, "en": "Free Cash Flow to Equity (FCFE)", "pl": "Wolne przepływy gotówki do równych (WFPR)", "def": "The amount of cash generated by a company that is available to its equity holders after paying for operating expenses, capital expenditures, and changes in working capital.", "trap": "Ensure proper adjustment for non-cash items when calculating FCFE.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 599, "en": "Real Options Analysis (ROA)", "pl": "Analiza rzeczywistych opcji (ARO)", "def": "A method for valuing the strategic flexibility embedded in business decisions, incorporating factors such as growth opportunities and operational risks.", "trap": "ROA can be complex; ensure a clear understanding of the underlying assumptions.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 600, "en": "stagflationary pressures", "pl": "ciśnienia stagflacyjne", "def": "Economic conditions characterized by high inflation and low economic growth.", "trap": "Note that 'stagflation' itself refers to a state, not just pressures.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 601, "en": "quantitative tightening vs quantitative easing", "pl": "spojecie spuszczania i skracania ilościowej", "def": "A comparison between reducing the money supply (quantitative tightening) and increasing it (quantitative easing).", "trap": "Ensure understanding that 'tightening' reduces the money supply while 'easing' increases it.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 602, "en": "balance of payments adjustment", "pl": "korekta balansu płatniczego", "def": "The process by which a country adjusts its economic policies to correct an imbalance in its balance of payments.", "trap": "Be aware that adjustments may involve changes in trade policies, exchange rates, or fiscal and monetary actions.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 603, "en": "Cryptographic hash function", "pl": "funkcja skrótu kryptograficznego", "def": "A mathematical algorithm that produces a fixed-size string of bytes from variable-length input data, used to ensure data integrity and non-repudiation.", "trap": "Do not confuse it with encryption; hashing is a one-way process.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 604, "en": "Decentralized Finance (DeFi) platform", "pl": "platforma DeFi (Finansy Decentralizowane)", "def": "A blockchain-based ecosystem that allows for the creation and use of financial applications without traditional intermediaries.", "trap": "DeFi is not synonymous with cryptocurrencies; it encompasses a broader range of applications.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 605, "en": "Smart contract audit", "pl": "audyt smart contractów", "def": "A thorough examination of the code in a smart contract to ensure it meets security and functionality requirements.", "trap": "The term 'audit' might imply less rigorous checks; a smart contract audit is more comprehensive.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 606, "en": "Multi-signature wallet", "pl": "portfel wielokluczowy", "def": "A digital wallet that requires multiple signatures before a transaction can be authorized.", "trap": "It is not the same as a regular shared account; it requires separate approvals.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 607, "en": "Cross-border payment processing", "pl": "przetwarzanie płatności międzynarodowych", "def": "The process of transferring funds from one country to another using digital or online methods.", "trap": "Ensure understanding that this involves more than just currency exchange; it includes regulatory compliance.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 608, "en": "Real-time transaction monitoring", "pl": "monitorowanie transakcji w czasie rzeczywistym", "def": "The continuous observation and analysis of transactions as they occur to detect fraud or unusual activity.", "trap": "It is not just about speed; it involves deep data analytics for accurate insights.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 609, "en": "Freight Insurance", "pl": "Ubezpieczenie towarów", "def": "Insurance coverage for goods in transit, protecting against damage or loss.", "trap": "Freight insurance is distinct from marine cargo insurance and has different coverage options.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 610, "en": "Electronic Data Interchange (EDI)", "pl": "Zmiana danych elektronicznych (EDI)", "def": "A standardized electronic format for the exchange of business documents between parties.", "trap": "EDI is not just about email; it requires specific protocols and standards.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 611, "en": "Warehouse Management System (WMS)", "pl": "System zarządzania magazynem (WMS)", "def": "A software application that controls warehouse functions such as inventory tracking and order fulfillment.", "trap": "WMS is more than just a storage solution; it includes order picking, packing, and shipping capabilities.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 612, "en": "Reverse Logistics", "pl": "Logistyka odwrotna", "def": "The process of managing the flow of products from end-users back to manufacturers or distributors.", "trap": "Reverse logistics is not just about product returns; it includes recycling and refurbishment processes.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 613, "en": "Multi-Modal Transportation", "pl": "Transport wielomodalny", "def": "The use of multiple modes of transportation (e.g., sea, road, rail) for a single consignment.", "trap": "Multi-modal transportation requires careful coordination between different transport modes.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 614, "en": "Stakeholder matrix", "pl": "macierz zaangażowanych stron", "def": "A tool used to identify and prioritize stakeholders based on their level of interest and influence.", "trap": "Do not confuse with 'SWOT analysis', which focuses on internal strengths, weaknesses, opportunities, and threats.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 615, "en": "Best alternative to a negotiated agreement (BATNA)", "pl": "najlepsza alternatywa do negocjowanego porozumienia (BATNA)", "def": "The most favorable alternative that a party can achieve if negotiations fail.", "trap": "BATNA should not be confused with 'Worst Alternative to a Negotiated Agreement (WATNA)', which is the least favorable outcome.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 616, "en": "Concession matrix", "pl": "macierz zezwoleń", "def": "Something allowed or given up, often in order to end a disagreement.", "trap": "It is important to carefully balance giving and receiving concessions to maintain a favorable negotiating position.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 617, "en": "Non-verbal communication", "pl": "komunikacja nieverbalna", "def": "Communication that does not use words, including gestures, facial expressions, and body posture.", "trap": "Non-verbal communication can sometimes contradict spoken words, so it is crucial to pay attention to both.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 618, "en": "Escalation clause", "pl": "klauzula eskalacji", "def": "A contractual term that outlines the procedures for escalating a dispute or issue to higher levels of management or legal action.", "trap": "Escalation clauses should be clearly defined and understood by all parties involved to avoid misunderstandings.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 619, "en": "Continuous improvement cycle (PDCA)", "pl": "cykl ciągłego poprawiania (PDCA)", "def": "A four-step process used to improve business processes and products, consisting of planning, doing, checking, and acting.", "trap": "It is important to ensure that each step in the PDCA cycle is completed thoroughly before moving on to the next.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 620, "en": "Indemnification Agreement", "pl": "Umowa o indemnifikację", "def": "A legal agreement where one party agrees to compensate another for losses, damages, or liabilities that may arise.", "trap": "Do not confuse with 'exculpatory clause', which limits liability rather than requiring compensation.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 621, "en": "Novation Clause", "pl": "Klauzula nowoczesności", "def": "A contractual provision that allows a third party to replace one of the original parties as the obligor or obligee.", "trap": "Ensure that all parties are fully aware and consent to the novation process.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 622, "en": "Good Faith Obligation", "pl": "Obligacja dobrej sprawiedliwości", "def": "A legal requirement for parties to act honestly and in the best interests of the other party.", "trap": "This obligation can be implied, so it's important to clarify expectations in writing.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 623, "en": "Equitable Distribution Clause", "pl": "Klauzula równomiernego rozłożenia", "def": "A clause that specifies how risks or benefits should be fairly distributed among parties.", "trap": "This clause can lead to disputes if not clearly defined, especially in cases of unequal contributions.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 624, "en": "Concurrent Performance Clause", "pl": "Klauzula równoległego wykonywania", "def": "A clause requiring both parties to perform their obligations simultaneously.", "trap": "Failure to comply with this requirement can lead to breach of contract.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 625, "en": "Consequential Losses Clause", "pl": "Klauzula Stratowych Utrat", "def": "A clause in a contract that limits the liability of one party for losses suffered by another due to unforeseen circumstances.", "trap": "This is often confused with liquidated damages clauses, which are different in scope and purpose.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 626, "en": "Termination for Convenience Clause", "pl": "Klauzula Odmowy W Zależności od Konieczności", "def": "A provision that allows one party to terminate a contract without liability, often used in long-term agreements.", "trap": "This clause can be easily overlooked but provides significant flexibility.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 627, "en": "Non-Compete Agreement", "pl": "Porozumienie o Nieudziałzie w Komercyjności", "def": "A legal agreement that restricts an employee from engaging in business activities that compete with their employer.", "trap": "Ensure the non-compete clause is reasonable t
