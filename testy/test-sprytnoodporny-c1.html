o avoid being deemed unenforceable.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 628, "en": "Exhaustion of Remedies Clause", "pl": "Klauzula Wyżyczenia Praw", "def": "A clause that requires a party to exhaust all available remedies before seeking legal action.", "trap": "This clause can be used as a defense against immediate legal action.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 629, "en": "Confidentiality Undertaking", "pl": "Zobowiązanie do Utrzymania Tajemnicy", "def": "A legal commitment to keep certain information confidential and not disclose it to third parties.", "trap": "Confidentiality undertakings often include exceptions for pre-existing knowledge and legal obligations.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 630, "en": "Gross Negligence Clause", "pl": "Klauzula Grobowej Niewykorzystki", "def": "A clause that imposes stricter liability on a party for actions resulting from gross negligence.", "trap": "This type of clause is often used to mitigate the insurer's risk but can lead to higher premiums.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 631, "en": "Exclusion Clause", "pl": "Klauzula wykluczająca odpowiedzialność", "def": "A clause that limits or excludes liability for certain types of loss or damage.", "trap": "Do not confuse with 'waiver' which involves intentional relinquishment of a right.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 632, "en": "Good Faith Adjustment Clause", "pl": "Klauzula dostosowania zgodnie z dobrymi praktykami", "def": "A clause that requires parties to make adjustments in good faith when interpreting certain terms.", "trap": "Ensure not to mix with 'liquidated damages' which are pre-determined amounts for breach.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 633, "en": "Anti-Dilution Clause", "pl": "Klauzula ochrony przed rozcieńczaniem udziałów", "def": "A clause designed to protect shareholders from the dilution of their ownership interests.", "trap": "Be aware that this is different from 'liquidation preference' which pertains to the order of payment in liquidation.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 634, "en": "Right of First Refusal", "pl": "Prawo pierwszej rezygnacji", "def": "A right granted to a party to purchase an asset before it is offered to others.", "trap": "Do not confuse with 'right of first offer' which gives a party the obligation to make an offer before selling.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 635, "en": "Mandatory Arbitration Clause", "pl": "Klauzula obowiązkowej aryuści", "def": "A clause that mandates the use of arbitration as the sole means of dispute resolution.", "trap": "Ensure distinction with 'voluntary arbitration' where parties agree to arbitrate without compulsion.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 636, "en": "Covenant Not to Compete", "pl": "Spiewka o niezabieganiu konkurencji", "def": "An agreement that restricts a party from engaging in competing activities within a certain geographic area and time frame.", "trap": "Be cautious as overly broad covenants may be deemed unenforceable.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 637, "en": "Value Proposition Canvas", "pl": "Kanwa Wartościowej Propozycji", "def": "A strategic tool used to create and communicate the unique benefits a product or service offers to customers.", "trap": "Confusing it with a simple USP (Unique Selling Proposition).", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 638, "en": "Customer Lifetime Value (CLV)", "pl": "Wartość Życiowa Klienta (WZK)", "def": "The total amount of revenue a business can expect to generate from a customer over their entire relationship with the company.", "trap": "Mixing it up with Customer Acquisition Cost (CAC).", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 639, "en": "Competitive Landscape Analysis", "pl": "Analiza Pola Gospodarczego Konkurencji", "def": "A comprehensive study of the market environment and competitive positioning of a company.", "trap": "Focusing only on competitors without considering broader industry trends.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 640, "en": "Price Elasticity of Demand", "pl": "Wrażliwość Popytu na Cenę", "def": "A measure that indicates how the quantity demanded of a good responds to a change in its price.", "trap": "Forgetting that non-price factors also influence demand.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 641, "en": "SWOT Analysis", "pl": "Analiza SWOT", "def": "A framework for identifying a company's internal strengths and weaknesses as well as external opportunities and threats.", "trap": "Neglecting the importance of continuous updates.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 642, "en": "Differentiation Strategy", "pl": "Strategia Dostosowywania", "def": "A strategy aimed at making a product or service unique and distinct from competitors' offerings.", "trap": "Confusing it with cost leadership or focus strategies.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 643, "en": "Executive remuneration package", "pl": "Pakiet wynagrodzenia dla wykonańców", "def": "Money paid for work or a service.", "trap": "Definicja lektorki: 'money paid for work or a service'. Formalne określenie obejmujące pensję i benefity.", "category": "Human Resources, Labor & Compensation", "source": "lekcja_handout_matching"}, {"id": 644, "en": "Stock option vesting schedule", "pl": "Harmonogram odrobienia opcji na akcje", "def": "The predetermined time frame during which an employee acquires the right to exercise stock options.", "trap": "Misinterpreting 'vesting' as immediate ownership of the stocks.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 645, "en": "Golden handshake", "pl": "Czekoladka zlota", "def": "A generous severance package offered to an employee as a reward for their service and contributions.", "trap": "Golden handshake is not always financially beneficial if the terms are unfavorable.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 646, "en": "Headhunting retained search", "pl": "Poszukiwanie nagłówkowych", "def": "A specialized recruitment process conducted by external experts to identify and attract top-level executives for a company.", "trap": "Confusing 'headhunting' with general recruitment, which it is more focused on attracting senior executives.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 647, "en": "Performance appraisal system", "pl": "System oceny wydajności", "def": "A structured and formal method used to assess an employee's work performance against set criteria.", "trap": "Performance appraisal can be misinterpreted as informal or subjective, but it is typically formal and data-driven.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 648, "en": "Substance over form doctrine", "pl": "Zasada zasubstancji nad formą", "def": "The principle that the true economic nature and purpose of a transaction or arrangement should be considered in determining its tax implications.", "trap": "This term is similar to 'Economic Substance Doctrine', but it focuses more on the true economic activity rather than the legal structure.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 649, "en": "Fiscal arbitrage", "pl": "Arbiteria fiskalna", "def": "The practice of taking advantage of differences in tax rates or regulations to achieve a tax benefit.", "trap": "This term is not related to financial market arbitrage but specifically refers to exploiting tax differences.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 650, "en": "Permanent Differences", "pl": "Różnice trwałe", "def": "Discrepancies between accounting income and taxable income that are not expected to be reversed in the future.", "trap": "Permanent differences should not be confused with temporary differences, which are expected to reverse.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 651, "en": "Revenue-based taxation", "pl": "Podatek opierający się na dochodach", "def": "A tax system that levies taxes primarily based on a company's income or revenue.", "trap": "This term is distinct from expenditure-based taxation, which focuses on business expenses rather than income.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 652, "en": "Hybrid entity", "pl": "Firma hybrydowa", "def": "A legal structure that combines elements of different types of entities to optimize tax treatment.", "trap": "Hybrid entities can lead to complex tax issues, including double taxation and hybrid mismatches.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 653, "en": "Tax equity", "pl": "Jednolitość podatkowa", "def": "The principle of fairness in taxation, ensuring that similar taxpayers are taxed similarly.", "trap": "Tax equity is not about equalizing absolute tax burdens but rather treating similar situations equally.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 654, "en": "Exclusionary clause", "pl": "klauzula wykluczająca", "def": "A contractual term that excludes certain employees from receiving benefits or protections.", "trap": "This term is often confused with 'inclusivity' but has a restrictive legal meaning.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 655, "en": "Performance-linked bonus", "pl": "bonус powiązany z wynikami pracy", "def": "A compensation structure where bonuses are tied to specific key performance indicators (KPIs).", "trap": "It is important to clearly define the KPIs to avoid disputes over performance measurement.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 656, "en": "Employment at will", "pl": "zatrudnienie na czas nieokreślony", "def": "An employment arrangement where either party can terminate the contract without notice or justification.", "trap": "This term is often misunderstood; it does not imply a lack of legal protection for employees.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 657, "en": "Non-solicitation agreement", "pl": "porozumienie o niezajecie", "def": "A legal agreement that prohibits employees from soliciting or recruiting other employees away from their current employer.", "trap": "Ensure clarity on what constitutes 'soliciting' to avoid potential disputes.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 658, "en": "Equity-based compensation", "pl": "kompensacja oparta na akcjach", "def": "A type of remuneration that includes stock options, restricted shares, or other equity instruments.", "trap": "Understanding the vesting schedule and exercise terms is crucial for employees.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 659, "en": "Retention bonus", "pl": "bonus zatrzymania", "def": "A financial reward given to an employee as a gesture of appreciation for their continued service to the company.", "trap": "Ensure that the bonus structure does not incentivize employees to leave and then return.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 660, "en": "Book building process", "pl": "Proces budowy książki", "def": "A method used in the issuance of securities, where a group of investment banks collects information from potential investors to gauge interest and determine an appropriate offering price.", "trap": "Be careful not to confuse 'book building' with 'roadshow', which involves direct communication with potential investors.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 661, "en": "Underwriting syndicate", "pl": "Syndykat zabezpieczający", "def": "A group of banks or financial institutions that collectively agree to purchase securities issued by a company, thus underwriting the risk.", "trap": "Remember that 'syndicate' implies collective action, not a single entity handling the entire process.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 662, "en": "Yield curve inversion", "pl": "Odwrócony wykres rentowności", "def": "A situation in the bond market where shorter-term interest rates are higher than longer-term interest rates, indicating potential economic changes.", "trap": "Do not mistake 'yield curve inversion' for 'flat yield curve', which indicates similar rates across different maturities.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 663, "en": "High-frequency algorithmic trading", "pl": "Algorytmiczne handelowanie o wysokiej częstotliwości", "def": "A type of automated trading that executes trades in milliseconds, using complex algorithms to take advantage of price discrepancies.", "trap": "Be cautious not to confuse 'high-frequency algorithmic trading' with 'low-frequency trading', which involves fewer, slower transactions.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 664, "en": "tax optimization strategy", "pl": "strategia optymalizacji podatkowej", "def": "A methodical approach designed to minimize a company's tax liability while ensuring compliance with all relevant laws and regulations.", "trap": "Do not confuse it with 'tax avoidance', which may involve illegal practices.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 665, "en": "tax-efficient investment", "pl": "investycja optymalna z podatkowego punktu widzenia", "def": "An investment that is structured to minimize tax liability for the investor while achieving financial returns.", "trap": "Ensure that such investments comply with all local and international tax laws.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 666, "en": "withholding tax reduction", "pl": "zredzonie podatku zatrzymanego", "def": "A measure implemented to decrease the amount of withholding tax deducted from payments, such as dividends or royalties.", "trap": "This does not eliminate the tax liability but reduces the upfront deduction.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 667, "en": "tax shield benefit", "pl": "korzyść z ochrony podatkowej", "def": "The financial advantage derived from using tax-deductible expenses or investments to reduce overall tax liability.", "trap": "Not all expenses are eligible for tax shielding; ensure compliance with local regulations.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 668, "en": "double taxation relief", "pl": "wykojenie podwójnej opodatkowania", "def": "Mechanisms or agreements designed to prevent a company or individual from being taxed twice on the same income in different jurisdictions.", "trap": "Double taxation relief does not eliminate taxes but can reduce overall liability.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 669, "en": "tax haven regulation", "pl": "regulacja tajemnic podatkowych", "def": "Legal and regulatory measures implemented by governments to curb the use of tax havens for avoiding taxes.", "trap": "Tax haven regulations are continuously evolving; staying updated with changes is crucial.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 670, "en": "Senior Secured Loan", "pl": "Dług Seniorny Zabezpieczony", "def": "A senior secured loan is a debt instrument where the borrower pledges assets as collateral to secure the repayment of principal and interest.", "trap": "This type of loan prioritizes asset recovery in case of default.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 671, "en": "Subordinated Debt", "pl": "Podległe Zaciąganie", "def": "Subordinated debt is a type of bond or loan that ranks below other obligations in terms of claim on assets and income.", "trap": "Subordinated debt holders receive payments only after all senior debts are satisfied.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 672, "en": "Lease Financing", "pl": "Finansowanie Wypożyczeniowe", "def": "Lease financing is a method of acquiring assets by making periodic payments over an agreed period, rather than purchasing them outright.", "trap": "Lease terms can include purchase options or reversion clauses.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 673, "en": "Fiscal engineering", "pl": "Inżynieria podatkowa", "def": "The practice of designing or altering tax systems to achieve specific fiscal goals.", "trap": "Not to be confused with economic engineering.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 674, "en": "Transfer pricing policy", "pl": "Polityka cennikowa transferowa", "def": "A company's approach to setting prices for transactions between related parties.", "trap": "Ensure distinction from general pricing strategies.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 675, "en": "Double taxation relief mechanism", "pl": "Mechanizm odszkodowania podwójnej opодowy", "def": "A system designed to prevent the imposition of taxes twice on the same income.", "trap": "Not to be confused with double taxation avoidance agreements.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 676, "en": "Corporate tax haven", "pl": "Krajowy ochroniarz podatkowy", "def": "A jurisdiction known for its low or zero taxes, attracting companies seeking to minimize their tax burden.", "trap": "Not all low-tax jurisdictions are considered true tax havens.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 677, "en": "Withholding tax compliance", "pl": "Zgodność z podatkiem od wypłat", "def": "The process of ensuring that withholding taxes are correctly calculated, deducted, and reported.", "trap": "May differ from income tax compliance.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 678, "en": "Fiscal optimization framework", "pl": "Ramka optymalizacyjna podatkowa", "def": "A structured approach to managing and reducing corporate tax liabilities through strategic planning.", "trap": "Not limited to tax avoidance but includes compliance.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 679, "en": "structural unemployment", "pl": "niezwykłej bezrobocie strukturalne", "def": "Unemployment that results from a mismatch between the skills of the workforce and the requirements of jobs available in the economy.", "trap": "This term should not be confused with frictional or cyclical unemployment.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 680, "en": "currency appreciation", "pl": "zwiększenie wartości waluty", "def": "An increase in the value of a currency relative to another, usually expressed as an upward movement in the exchange rate.", "trap": "Currency depreciation is the opposite process.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 681, "en": "monetary base", "pl": "podstawy monetarne", "def": "The total amount of currency in circulation plus reserves held by commercial banks at the central bank.", "trap": "Monetary policy tools often target the monetary base.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 682, "en": "inflationary expectations", "pl": "oczekiwania dotyczące inflacji", "def": "The anticipated rate of inflation based on market forecasts and public perceptions.", "trap": "Inflationary expectations can influence actual inflation outcomes.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 683, "en": "foreign exchange intervention", "pl": "wstrzymanie rynku wymiany walut", "def": "Actions taken by a central bank to buy or sell foreign currency in the open market to influence its exchange rate.", "trap": "Intervention can have significant economic implications.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 684, "en": "fiscal austerity", "pl": "akcyza finansowa", "def": "A set of measures aimed at reducing government spending and increasing taxes to decrease the budget deficit.", "trap": "Fiscal austerity can have short-term economic costs.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 685, "en": "Real-time payment reconciliation", "pl": "Zrównoważanie płatności w czasie rzeczywistym", "def": "The process of comparing and adjusting payment transactions in real-time to ensure accuracy and reduce discrepancies.", "trap": "Do not confuse with batch processing methods.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 686, "en": "Cross-border remittance platform", "pl": "Platforma do przekazywania środków międzynarodowych", "def": "A financial technology service that facilitates the transfer of funds across borders efficiently and cost-effectively.", "trap": "Focus on efficiency, not just affordability.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 687, "en": "Decentralized identity verification system", "pl": "System weryfikacji tożsamości decentralizowanej", "def": "A technology that enables users to control their digital identities without relying on centralized authorities.", "trap": "Centralized systems still have a role in critical applications.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 688, "en": "Smart asset management application", "pl": "Aplikacja do inteligentnej zarządzania aktywami", "def": "A software application that uses artificial intelligence to manage and optimize investment portfolios automatically.", "trap": "Manual oversight is still necessary.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 689, "en": "Transshipment Agreement", "pl": "Porozumienie o transshipmentie", "def": "A contractual agreement between parties for the transportation of goods via a third party.", "trap": "Confuse with 'transfer agreement', which typically involves asset transfer rather than transportation.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 690, "en": "Cross-Docking", "pl": "Krzyżowe zatowarzczanie", "def": "A logistics process where goods are received at a warehouse and then immediately shipped to the next destination without being stored.", "trap": "Do not confuse with 'cross-border logistics', which involves international transportation.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 691, "en": "Inventory Turnover Ratio", "pl": "Stosunek obrótu zapasów", "def": "A financial metric that measures how many times inventory is sold and replaced over a period.", "trap": "Be aware of 'account receivable turnover', which measures how quickly a company collects payment on its credit sales.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 692, "en": "Freight Rate Index", "pl": "Wskaźnik cen transportu", "def": "An economic indicator that tracks the average price of transporting goods over a specified period.", "trap": "Do not mix with 'consumer price index', which measures inflation in consumer prices.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 693, "en": "Logistics Network Design", "pl": "Projektowanie sieci logistycznej", "def": "The process of strategically designing and optimizing the flow of goods from suppliers to customers.", "trap": "Confuse with 'production network design', which focuses on manufacturing processes rather than logistics.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 694, "en": "Demand Forecasting", "pl": "Prognozowanie popytu", "def": "The process of estimating future customer demand for a product or service based on historical data and market trends.", "trap": "Do not mistake with 'sales prediction', which focuses solely on sales figures rather than overall demand.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 695, "en": "Minutes review", "pl": "Recenzja aktów zjeczynnych", "def": "The process of reviewing and verifying the accuracy and completeness of meeting minutes.", "trap": "Do not confuse with 'minute-taking', which refers to the act of writing down the minutes.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 696, "en": "Agenda prioritization", "pl": "Priorytetyzacja listy porządkowej", "def": "The process of determining the order and importance of items on a meeting agenda.", "trap": "Ensure that 'prioritization' is not mistakenly used for 'scheduling'.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 697, "en": "Quorum attendance", "pl": "Obecność kworumu", "def": "The act of ensuring that the required number of attendees is present for a meeting to proceed legally.", "trap": "This term should not be confused with 'attendance' in general.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 698, "en": "Concession strategy", "pl": "Strategia wykupów", "def": "A plan designed to make compromises or give up certain demands in a negotiation to achieve an agreement.", "trap": "Do not mix with 'compromise', which is the act of making a concession.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 699, "en": "Win-win negotiation", "pl": "Negocjacje win-win", "def": "A negotiation approach aimed at achieving a favorable outcome for all parties involved.", "trap": "This term should not be confused with 'zero-sum negotiation', which benefits one party at the expense of another.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 700, "en": "Call to order", "pl": "Oproclaimedzenie", "def": "A formal phrase used at the beginning of a meeting to bring order and signal the start of proceedings.", "trap": "It is not the same as 'call for action', which refers to a request or plea for people to do something.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 701, "en": "Parliamentary procedure", "pl": "Zasady parlamenarne", "def": "A set of rules and conventions governing the conduct of meetings and assemblies.", "trap": "It should not be confused with 'parliamentary debate', which involves formal discussions on specific issues.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 702, "en": "Tablettee", "pl": "Zmiana", "def": "A proposal to alter or add to a motion, document, or plan during a meeting.", "trap": "It is not the same as 'tabular', which relates to being in table form.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 703, "en": "Quorum requirement", "pl": "Wymagane kworumat", "def": "The minimum number of attendees required for a meeting to be officially convened and valid.", "trap": "It should not be confused with 'quota', which refers to a fixed amount or share of something.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 704, "en": "Standing agenda", "pl": "Stały program", "def": "A standard set of items regularly discussed at meetings, especially in a recurring context.", "trap": "It is not the same as 'ad-hoc agenda', which is created for specific, one-time meetings.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 705, "en": "Compromise solution", "pl": "Rozstrzygnięcie kompromisowe", "def": "A mutually agreeable resolution that partially satisfies all parties involved in a negotiation.", "trap": "It should not be confused with 'concession', which implies giving up something in a negotiation.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 706, "en": "Action-oriented agenda", "pl": "Agenda skierunkowa", "def": "A meeting agenda that is designed to ensure the discussion and achievement of specific, actionable goals.", "trap": "This term emphasizes practical outcomes rather than just discussion.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 707, "en": "Delegation matrix", "pl": "Macierz delegowania obowiązków", "def": "A tool used to outline the distribution of tasks and responsibilities within a team or organization.", "trap": "This term is related but distinct from task allocation and should be distinguished in exams.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 708, "en": "Adjournment notice", "pl": "Ogłoszenie o zakończeniu sesji", "def": "A formal communication sent to participants indicating that a meeting is concluded and how it will be followed up.", "trap": "This term specifically refers to concluding a meeting, not merely ending discussions.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 709, "en": "Veto power", "pl": "Rzeczoznawstwo zwrotne", "def": "The authority to reject or block a proposal or decision, typically held by a senior executive or board member.", "trap": "Veto power is absolute and can override other decisions.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 710, "en": "Stakeholder engagement plan", "pl": "Plan angażowania zainteresowanych stron", "def": "A detailed strategy outlining how an organization will interact with and involve stakeholders in its decision-making processes.", "trap": "This term encompasses communication, coordination, and collaboration with stakeholders.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 711, "en": "Best alternative without negotiation (BATNA)", "pl": "Najlepsza alternatywa bez negocjacji (BATNA)", "def": "The best possible outcome that a party can achieve if they fail to reach an agreement with another party.", "trap": "BATNA is crucial for maintaining leverage in negotiations.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 712, "en": "Executive summary", "pl": "Podsumowanie kluczowych punktów", "def": "A brief overview highlighting the most important information or conclusions from a longer document.", "trap": "Do not confuse it with an abstract, which typically provides more detailed background.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 713, "en": "Agenda item", "pl": "Punkt porządku dnia", "def": "A single subject or issue listed on a meeting agenda to be discussed during the session.", "trap": "Be aware that 'agenda' and 'programme' have different meanings in British and American English.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 714, "en": "Adjournment", "pl": "Przerwanie sesji", "def": "The act of ending or suspending a meeting, often to be resumed at a later time.", "trap": "Do not confuse 'adjourn' with 'disband', which means to end an organization permanently.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 715, "en": "Motion to adjourn", "pl": "Propozycja o przerwaniu sesji", "def": "A formal proposal made during a meeting to end the session.", "trap": "Ensure that the procedure for making and voting on motions is followed correctly.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 716, "en": "creditor's committee", "pl": "komisja kredytorów", "def": "A group of creditors appointed to represent the interests of all creditors in bankruptcy proceedings.", "trap": "Do not confuse with 'creditor rights litigation', which is already in the database.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 717, "en": "liquidation value", "pl": "wartość likwidacyjna", "def": "The estimated value of an asset when it is sold in the course of liquidation proceedings.", "trap": "This term refers specifically to the sale in a liquidation context, not just any form of asset valuation.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 718, "en": "restructuring advisor", "pl": "konsultant od restrykturyzacji", "def": "An expert providing strategic advice and assistance in restructuring a financially troubled company.", "trap": "While similar, 'restructuring plan' is a different concept from the person providing advice.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 719, "en": "priority creditor", "pl": "kredytor priorytetowy", "def": "A creditor who has a legal right to be repaid before other creditors in case of liquidation.", "trap": "This term refers specifically to claim priority, not fraudulent conveyance.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 720, "en": "distressed asset sale", "pl": "sprzedaż zasobów w stanie stretnym", "def": "The process of selling assets at a discount due to the financial distress of the company.", "trap": "Ensure distinction from standard asset sales, as this specifically pertains to financially troubled companies.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 721, "en": "Debt Restructuring Framework", "pl": "Ramówka Restrukturyzacji Dłużności", "def": "A structured approach to renegotiate the terms of existing debts.", "trap": "This is not the same as a 'pre-packaged bankruptcy', which involves prearranged plans.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 722, "en": "Creditors' Consent Mechanism", "pl": "Mechanizm Zgody Kredytorów", "def": "A formal process requiring creditors to approve restructuring proposals.", "trap": "This is distinct from a 'creditor's committee', which acts as an advisory body.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 723, "en": "Debt-to-Equity Bridge Financing", "pl": "Finansowanie Przejściowe dla Wymiany Dłużności na Akcje", "def": "Short-term financing to bridge the gap between debt repayment and equity infusion.", "trap": "This is not the same as 'debt-to-equity swap', which involves converting debt into equity.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 724, "en": "Liquidation Preference Rights", "pl": "Prawa Preferencyjne w Likwidacji", "def": "Special rights that give certain investors priority over others in the distribution of assets during liquidation.", "trap": "This is different from 'priority of claims', which refers to the order of payment for debts.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 725, "en": "Debt Cramdown Mechanism", "pl": "Mechanizm Wymuszenia Warunków Dłużności", "def": "A legal provision allowing a court to impose terms of debt repayment that are less favorable to creditors.", "trap": "This is different from 'cramdown', which can also refer to a type of bankruptcy in Canada.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 726, "en": "capital call provision", "pl": "warunki wywołania kapitału", "def": "A clause in a partnership agreement allowing the general partner to request additional capital from limited partners.", "trap": "This is not related to liquidation preference or pre-money valuation.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 727, "en": "co-investment right", "pl": "prawo współinvestycji", "def": "The right granted to a venture capital firm to invest alongside other investors in a target company.", "trap": "This is distinct from the 'co-investment clause' already mentioned.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 728, "en": "equity strip", "pl": "część akcyjna", "def": "The portion of a bond or debt instrument that represents ownership in the underlying asset.", "trap": "This term is specific to structured finance, not directly related to venture capital.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 729, "en": "venture debt financing", "pl": "finansowanie długiem dla projektów przedsiębiorstwowych", "def": "Debt funding provided to startups or early-stage companies.", "trap": "This is different from convertible notes, which offer equity conversion.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 730, "en": "secondaries market", "pl": "rynok drugorzędowy", "def": "A marketplace where private equity investments are bought and sold.", "trap": "This is distinct from the public secondary market for stocks.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 731, "en": "preferred equity", "pl": "akcje preferowane", "def": "Equity instruments that grant investors priority in dividend payments and liquidation proceeds.", "trap": "This is different from common stock, which has no preference rights.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 732, "en": "Revenue recognition policy", "pl": "zasada rozpoznawania przychodów", "def": "A set of guidelines or principles for recognizing revenue in financial statements.", "trap": "This term refers specifically to how revenue is recognized, not just any accounting practice.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 733, "en": "Deferred tax liability", "pl": "zobowiązanie podatkowe odłożone", "def": "A current liability representing the future tax payment obligation arising from temporary differences.", "trap": "It is not related to immediate tax payments, but rather future obligations.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 734, "en": "Amortization expense", "pl": "wydatek amortyzacyjny", "def": "The periodic reduction of the value of intangible assets over their useful lives.", "trap": "It applies specifically to intangibles, not physical assets.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 735, "en": "Forensic audit", "pl": "audyt forencyjny", "def": "A detailed examination of financial records and documents to detect fraud or irregularities.", "trap": "It is more focused on detection than regular compliance audits.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 736, "en": "Qualified opinion with qualifications", "pl": "opinia kwalifikowana z kwalifikacjami", "def": "An audit opinion that includes additional explanations or caveats due to uncertainties or significant issues.", "trap": "It is more severe than an unqualified opinion and requires attention from stakeholders.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 737, "en": "poison pill defense", "pl": "obrona przeciwzajeczalna typu \"lódka trucizniowa\"", "def": "A defensive measure used by a company to make it less attractive for an unwanted takeover.", "trap": "It is often confused with 'golden parachute', which is related to executive compensation.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 738, "en": "strategic alliance", "pl": "akcesja strategiczna", "def": "A long-term cooperative arrangement between companies to share resources or expertise.", "trap": "It is distinct from 'merger', which involves combining two companies.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 739, "en": "Repo Transaction", "pl": "Transakcja repo", "def": "A short-term loan collateralized by securities, commonly used in money markets.", "trap": "Repo is a specialized form of short-term borrowing and lending.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 740, "en": "Mark-to-Market (MtM)", "pl": "Obliczanie wartości rynkowej (OWR)", "def": "The process of valuing financial instruments at their current market prices.", "trap": "This term is often used in the context of derivative valuation.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 741, "en": "Convertible Bond", "pl": "Obligacja konwersyjna", "def": "A debt security that can be converted into a predetermined number of shares of the issuing company.", "trap": "Convertible bonds offer both debt and equity features.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 742, "en": "Bull Spread", "pl": "Spread bullishny", "def": "A trading strategy that profits from the anticipated widening of the price difference between two related financial instruments.", "trap": "This is distinct from Bear Call Spread, which bets on narrowing spreads.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 743, "en": "Deferred tax assets and liabilities", "pl": "Aktywa i zobowiązania podatkowe odłożone", "def": "Financial items representing the difference between taxable income and accounting profit.", "trap": "This term does not refer to deferring payments but relates to the timing of tax recognition.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 744, "en": "Depreciation and amortization", "pl": "Zatroszczenia i rozliczanie", "def": "The process of allocating the cost of tangible and intangible assets over their useful lives.", "trap": "This term does not refer to impairment testing but specifically to asset valuation over time.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 745, "en": "Forensic accounting", "pl": "Księgowość śledcza", "def": "The application of accounting and auditing skills to investigate financial fraud.", "trap": "This term is not related to regular audits but specifically focuses on investigating financial crimes.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 746, "en": "Equity Derivative", "pl": "Deratywny Papir Owładniczy", "def": "A financial instrument whose value is derived from the performance of an underlying equity security.", "trap": "Equity derivatives are not limited to just options; they include various instruments like futures and swaps.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 747, "en": "Volatility Index (VIX)", "pl": "Wskaźnik Wariacyjności (VIX)", "def": "A measure of the expected volatility of the S&P 500 index over the next 30-day period.", "trap": "The VIX is specific to the US stock market; there are equivalent indices for other markets.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 748, "en": "IFRS reconciliation", "pl": "porównanie z IFRS", "def": "The process of aligning a company's financial statements with International Financial Reporting Standards.", "trap": "Ensure not to confuse it with local GAAP.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 749, "en": "Revenue deferral", "pl": "odroczenie przychodu", "def": "The practice of recognizing revenue over a period rather than at the point of sale.", "trap": "Do not confuse it with revenue recognition acceleration.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 750, "en": "Impairment loss", "pl": "strata z obniżenia wartości", "def": "A reduction in the carrying amount of an asset when its recoverable amount is less than its carrying amount.", "trap": "It's distinct from depreciation, which is a systematic allocation over time.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 751, "en": "Contingent asset", "pl": "aktywa zależne od warunków", "def": "An asset that exists only if a specified uncertain future event occurs.", "trap": "Ensure to distinguish it from confirmed assets.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 752, "en": "Balance sheet misstatement", "pl": "bledy w bilansie", "def": "An inaccurate representation of the financial position due to an error or omission in the balance sheet.", "trap": "It can lead to significant legal and financial consequences.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 753, "en": "Audit trail", "pl": "ścieżka audytu", "def": "A chronological record of transactions and events for review and verification during an audit.", "trap": "It's crucial for maintaining transparency and accountability.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 754, "en": "Transfer Pricing Benchmarking", "pl": "Benchmarkowanie cen przeprowadzenia", "def": "The process of establishing fair market values for transactions between related parties based on comparable uncontrolled prices.", "trap": "Benchmarking must be transparent and based on actual market conditions to avoid accusations of abuse.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 755, "en": "Double Taxation Avoidance Agreement (DTAA)", "pl": "Umowa o unikanie podwójnego opodatkowania", "def": "An international agreement between countries to prevent double taxation of income earned by residents of both countries.", "trap": "Ensure the DTAA aligns with local legal requirements and does not create unintended fiscal benefits.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 756, "en": "Base Erosion and Profit Shifting (BEPS) Action Plan", "pl": "Plan akcyjny bazy erózy i przekierowania zysków", "def": "A set of measures aimed at preventing companies from artificially shifting profits to low-tax jurisdictions and eroding the tax bases of other countries.", "trap": "Understanding and complying with BEPS requires ongoing monitoring and adaptation.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 757, "en": "Fiscal Optimization Model", "pl": "Model optymalizacji fiskalnej", "def": "A mathematical model used to determine the most tax-efficient allocation of income and expenses within a multinational corporation.", "trap": "Models are based on assumptions; verify their accuracy with real-world data.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 758, "en": "Corporate Tax Residency Determination", "pl": "Zasada określania podległości do opodatkowania", "def": "The process of determining which country has the right to tax a corporation based on various factors including physical presence and management.", "trap": "Residency status can impact double taxation treaties; consult with local tax authorities.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 759, "en": "inflationary psychology", "pl": "psychologia inflacyjna", "def": "The expectation among consumers and businesses that prices will continue to rise, leading to higher wages and further inflation.", "trap": "It differs from 'deflationary psychology', which involves expectations of falling prices.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 760, "en": "currency mismatch", "pl": "niesprawidłowa proporcja walut zagranicznych", "def": "A situation where an entity's assets and liabilities are denominated in different currencies, leading to potential exchange rate risks.", "trap": "It should not be confused with 'currency hedge', which is a strategy to mitigate this risk.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 761, "en": "output gap", "pl": "odstęp między produktem a pojemnością", "def": "The difference between the actual and potential output of an economy, indicating either underutilization or overutilization of resources.", "trap": "It is different from the 'inflation-output gap', which focuses specifically on price levels.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 762, "en": "financial repression", "pl": "współczesna kontrola finansowa", "def": "A set of policies used by governments to channel savings into government bonds, typically through low interest rates and capital controls.", "trap": "It should not be confused with 'financial liberalization', which is the opposite approach.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 763, "en": "Arm's Length Principle Compliance", "pl": "Zgodność z Zasadą Równości Współczesności", "def": "The process of ensuring that transactions between related parties are conducted at arm's length, as per international tax standards.", "trap": "Ensure not to confuse with 'ALP Benchmarking', which involves setting benchmarks rather than just ensuring compliance.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 764, "en": "Fiscal Loophole Exploitation", "pl": "Zajecie Korzyści z Przegap Finansowych", "def": "The practice of taking advantage of legal loopholes or ambiguities in tax laws to reduce taxable income.", "trap": "Be aware that while exploitation is a common practice, it may lead to legal challenges and reputational damage.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 765, "en": "Double Taxation Treaty Negotiation", "pl": "Negocjacje Umowy o Unikanie Podwójnego Opodatkowania", "def": "The process of negotiating agreements between countries to prevent double taxation of income and assets.", "trap": "Differentiate this from 'DTA Review', which involves reviewing existing treaties rather than negotiating new ones.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 766, "en": "Base Erosion and Profit Shifting Mitigation Strategies", "pl": "Strategie Uniknięcia Zmiany Podstaw i Przekierowania Profitu (BEPS)", "def": "Methods employed by companies to reduce the impact of Base Erosion and Profit Shifting on their tax liabilities.", "trap": "Ensure understanding that mitigation strategies are distinct from avoidance tactics, which may be perceived as aggressive by authorities.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 767, "en": "Corporate Tax Residency Determination Process", "pl": "Proces Określenia Podległości do Opodatkowania Przedsiebiorstw", "def": "The systematic approach to determining a company's tax residency status for international tax purposes.", "trap": "This process is crucial but often overlooked; it can significantly impact a company's global tax strategy.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 768, "en": "Tax Avoidance Strategy Development", "pl": "Tworzenie Strategii Unikania Podatku", "def": "The process of creating plans and strategies to minimize tax liabilities while remaining within legal boundaries.", "trap": "Distinguish between tax avoidance, which is legal, and tax evasion, which is illegal.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 769, "en": "FOB Origin", "pl": "Zasadniczo załadunku w miejscu pochodzenia", "def": "Incoterm indicating that the seller delivers when the goods are on board the vessel at the named port of shipment.", "trap": "Do not confuse with CIF, where the seller pays for insurance.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 770, "en": "Customs Brokerage Services", "pl": "Usługi birokratu celnego", "def": "Professional services provided to help importers and exporters navigate customs regulations and clear goods through customs.", "trap": "Not all brokerage services are created equal; choose a certified broker.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 771, "en": "Freight Forwarding Agreement", "pl": "Umowa doradczy z ciężarówką", "def": "A legal agreement between a shipper and a freight forwarder that outlines the terms of service for moving goods from origin to destination.", "trap": "Ensure the agreement covers all modes of transport and potential risks.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 772, "en": "Buffer Inventory", "pl": "Buforowa zapasów", "def": "An extra stock of inventory maintained to protect against supply disruptions or demand spikes.", "trap": "Buffer inventory can be costly; balance it with just-in-time principles.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 773, "en": "Nearshoring Strategy", "pl": "Strategia blisko-zasobowa", "def": "A business strategy that involves relocating operations or sourcing materials from nearby countries to reduce lead times and lower transportation costs.", "trap": "Nearshoring is not always the solution; consider other factors like labor costs and regulations.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 774, "en": "delta", "pl": "delta", "def": "A measure of the sensitivity of an option's price to a change in the underlying asset's price.", "trap": "Confusing with gamma, which measures the rate of change of delta.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 775, "en": "implied correlation", "pl": "wnioskowana korelacja", "def": "The estimated statistical relationship between the returns of two assets, derived from their derivative prices.", "trap": "Differs from historical correlation, which is based on actual past performance.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 776, "en": "risk management framework", "pl": "ramka zarządzania ryzykiem", "def": "A comprehensive set of policies, procedures, and guidelines designed to identify, measure, monitor, and control risks.", "trap": "Not just about compliance but also about proactive risk identification.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 777, "en": "currency carry trade", "pl": "akcja noszenia waluty", "def": "A trading strategy where an investor borrows a currency with a low interest rate and invests it in a currency with a higher interest rate, profiting from the difference.", "trap": "High leverage can lead to substantial losses if market conditions change unfavorably.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 778, "en": "basis trading", "pl": "akcja handlowa na różnicy cenowej", "def": "A trading strategy that takes advantage of price discrepancies between related assets, such as spot and futures contracts.", "trap": "Requires careful monitoring of both markets to capture the convergence.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 779, "en": "strike price volatility", "pl": "wolatylność ceny wykonywania", "def": "The measure of the extent to which strike prices in financial derivatives fluctuate over time.", "trap": "Strike price volatility can be confused with underlying asset volatility, which refers to price movements of the asset itself.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 780, "en": "cross-currency basis swap", "pl": "swap korelacji krzyżowej walutowej", "def": "A financial instrument that allows investors to exchange the difference between interest rates of two different currencies.", "trap": "Cross-currency basis swaps are distinct from standard currency swaps, which involve exchanging both principal and interest payments.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 781, "en": "Force Majeure Event", "pl": "Zdarzenie Siły Wyzszej", "def": "An unforeseeable and unavoidable event that prevents a party from fulfilling its contractual obligations.", "trap": "Do not confuse with 'frustration of purpose', which is different from force majeure.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 782, "en": "Minute-taking", "pl": "Pisownia minucji", "def": "The process of recording the details and decisions made during a meeting.", "trap": "Ensure to use past tense for actions and decisions.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 783, "en": "Adjournment call", "pl": "Zakończenie sesji", "def": "The final segment of a meeting where conclusions are drawn and next steps are discussed.", "trap": "Avoid long-winded summaries.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 784, "en": "Lay motion", "pl": "Propozycja", "def": "A formal proposal or suggestion made during a meeting for consideration and voting.", "trap": "Ensure clarity in wording.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 785, "en": "Deadlock resolution", "pl": "Rozwiązanie zatrzymania", "def": "The process of resolving a situation where negotiations have reached an impasse.", "trap": "Avoid premature concessions.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 786, "en": "Stakeholder buy-in", "pl": "Zgodzenie stakeholdersów", "def": "The process of gaining agreement and support from all relevant parties involved in a project.", "trap": "Engage all stakeholders equally.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 787, "en": "Brand Equity Dilution", "pl": "Zaniedbanie Wartości Marki", "def": "Brand equity dilution occurs when a company's reputation or value is weakened due to poor product quality, unethical practices, or market missteps.", "trap": "Brand equity is not a one-time investment but requires continuous effort to maintain and build upon.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 788, "en": "Customer Acquisition Cost (CAC)", "pl": "Koszt Zyskania Klienta", "def": "Customer acquisition cost is the total amount spent by a company to acquire a new customer over a given period.", "trap": "CAC is just one metric; it's crucial to balance it against lifetime customer value (CLV) to ensure profitability.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 789, "en": "Eco-labeling", "pl": "etykietowanie ekologiczne", "def": "The process of attaching labels to products indicating their environmental attributes.", "trap": "Eco-labeling is often confused with greenwashing; ensure the labels are based on credible criteria.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 790, "en": "Lifecycle assessment (LCA)", "pl": "analiza cyklu życia", "def": "A method for evaluating the environmental impacts associated with a product or service throughout its entire lifecycle.", "trap": "LCA considers all stages from production to disposal, not just operational emissions.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 791, "en": "Zero-deforestation policy", "pl": "polityka bez deforestacji", "def": "A company's commitment to prevent the conversion of forest areas for agricultural or other purposes.", "trap": "Zero-deforestation policies often require collaboration with suppliers and monitoring systems.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 792, "en": "Corporate social responsibility (CSR) audit", "pl": "audyt odpowiedzialności społecznej firmy", "def": "A systematic assessment of a company's CSR practices and their alignment with ethical standards.", "trap": "CSR audits should be comprehensive, covering all aspects of ESG.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 793, "en": "Sustainable fashion", "pl": "moda ekologiczna", "def": "A sector focused on creating clothing and accessories with minimal environmental impact.", "trap": "Sustainable fashion often involves circular economy principles, such as recycling materials.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 794, "en": "Green bonds", "pl": "zielone obligacje", "def": "Debt instruments used to raise capital for environmentally friendly or sustainable projects.", "trap": "Green bonds must meet specific criteria to ensure the funds are used for legitimate environmental purposes.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 795, "en": "Integrated Reporting Framework (IRF)", "pl": "Ramówka Zintegrowanego Raportowania", "def": "A framework that promotes transparency and accountability by integrating financial, sustainability, and other relevant performance information into a single report.", "trap": "The IRF is not just a financial report but includes non-financial aspects, which can be confusing.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 796, "en": "Materiality Matrix", "pl": "Macierz Materialności", "def": "A tool used to assess the relevance of ESG factors and financial performance to a company's stakeholders.", "trap": "Materiality is subjective and can vary between companies and industries.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 797, "en": "Eco-innovation", "pl": "Innowacja Eko-przyjazna", "def": "The development of new products, processes, or services that reduce environmental impact and promote sustainability.", "trap": "Eco-innovation is not only about reducing negative impacts but also creating positive environmental outcomes.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 798, "en": "Supply Chain Transparency", "pl": "Transparencja Kolejki dostaw", "def": "The practice of making visible all stages of the supply chain, from raw material sourcing to final product delivery.", "trap": "Transparency requires not only visibility but also honesty and accountability in all aspects of the supply chain.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 799, "en": "Responsible Investment", "pl": "Z odpowiedzialnością Inwestowanie", "def": "An investment strategy that seeks to generate long-term social and environmental benefits while aiming for financial returns.", "trap": "Responsible investment is not solely about avoiding negative impacts but also actively contributing to positive outcomes.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 800, "en": "Stakeholder Engagement", "pl": "Angażowanie Staliaków", "def": "The process of involving and communicating with stakeholders to understand their needs, interests, and expectations.", "trap": "Stakeholder engagement is a continuous process that requires active listening and ongoing dialogue.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 801, "en": "carried interest waterfall", "pl": "struktura waterek carried interestu", "def": "A method for distributing profits among partners, typically with a priority to the general partner's carried interest before any return is paid to limited partners.", "trap": "Do not confuse with simple profit-sharing structures.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 802, "en": "pre-money valuation adjustments", "pl": "korekty wartościacyjne przed wpłatą pieniędzy", "def": "Adjustments made to the pre-money valuation of a company based on recent performance, market conditions, or other relevant factors.", "trap": "These adjustments can significantly impact the overall investment structure.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 803, "en": "LBO debt financing", "pl": "finansowanie zakupu杠杆化 (", "def": "Debt financing used in a leveraged buyout (LBO) to fund the purchase of a company, typically involving significant use of borrowed funds.", "trap": "Be aware of the high leverage ratio involved in such financing structures.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 804, "en": "venture capital syndication", "pl": "syndykat finansowania przez kapitał ryzykowny", "def": "The process of spreading a venture capital investment across multiple investors to diversify risk and raise additional funds.", "trap": "Syndication can complicate decision-making processes.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 805, "en": "SAFE agreement refinancing", "pl": "odnowienie umowy SAFE", "def": "The process of converting a SAFE agreement into more traditional debt or equity financing, often involving valuation adjustments.", "trap": "Refinancing can lead to changes in ownership and control.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 806, "en": "term sheet exclusivity period", "pl": "okres wyłączności w umowie term sheet", "def": "A specified period during which the target company agrees not to negotiate with other potential investors, ensuring exclusivity for the investor who provides the term sheet.", "trap": "Exclusivity periods can be negotiable and may impact investment timelines.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 807, "en": "Tenant Default Clause", "pl": "Klauzula o Domyśle Wypowiedzenia Wnajmu", "def": "A contractual provision that outlines the consequences if a tenant fails to meet its obligations under the lease agreement.", "trap": "This term should not be confused with 'Force Majeure Clause', which deals with extraordinary circumstances beyond the control of either party.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 808, "en": "Indemnification Clause", "pl": "Klauzula o Indemnizacji", "def": "A contractual provision where one party agrees to compensate the other for any losses, damages, or liabilities arising from certain actions or inactions.", "trap": "Be aware that this clause can have significant implications for liability and risk management.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 809, "en": "Lease Surrender and Reletting Clause", "pl": "Klauzula o Zakończeniu Wnajmu i Ponownym Wyewidencjonowaniu", "def": "A contractual provision that allows a tenant to surrender its lease and relet the property under certain conditions.", "trap": "This clause often requires the landlord's consent and may include conditions on the reletting process.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 810, "en": "Property Tax Escrow Account", "pl": "Konto Zabezpieczeniowe na Podatki od nieruchomości", "def": "A dedicated account used to collect and hold property taxes, ensuring timely payment without affecting the tenant's rent payments.", "trap": "This account is distinct from other escrow accounts and should be clearly defined in the lease agreement.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 811, "en": "Amortization Clause", "pl": "Klauzula o Zniesieniu na Kredyt", "def": "A contractual provision that allows the lessee to pay off a lease obligation over time in installments.", "trap": "This clause should specify the amortization period and interest rate clearly to avoid misunderstandings.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 812, "en": "Stakeholder capitalism", "pl": "Biznes zorientowany na interesariuszy", "def": "A business approach that prioritizes the interests of all stakeholders, including shareholders, employees, customers, and the environment.", "trap": "'Stakeholder capitalism' should not be confused with 'shareholder primacy', which focuses solely on shareholder interests.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 813, "en": "Carbon footprint audit", "pl": "Audyt odcisku węgla", "def": "A comprehensive assessment to measure a company's total greenhouse gas emissions over a specific period.", "trap": "'Carbon footprint audit' is distinct from 'life cycle analysis', which considers emissions throughout the entire product life cycle.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 814, "en": "Sustainable supply chain", "pl": "Ciąg dostawowy zrównoważony z ekologicznego punktu widzenia", "def": "A supply chain designed to be environmentally sustainable, considering factors like resource efficiency and waste reduction.", "trap": "'Sustainable supply chain' should not be confused with 'green supply chain', which may imply only limited eco-friendly aspects.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 815, "en": "Drag-Along and Tag-Along Rights", "pl": "prawa drag-and-tag", "def": "Rights that allow a majority shareholder to force minority shareholders to join in the sale of the company or participate in future fundraising rounds.", "trap": "Misinterpreting 'drag-along' as a right for minority shareholders, which is actually the opposite.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 816, "en": "Convertible Notes", "pl": "noty konwertowalne", "def": "Debt instruments that can be converted into equity at a future date, often used in early-stage financing.", "trap": "Confusing 'convertible notes' with traditional loans that do not offer conversion rights.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 817, "en": "Dry Powder", "pl": "bezczynne środki", "def": "Unallocated investment capital available for future opportunities.", "trap": "Failing to recognize that 'dry powder' refers specifically to uninvested funds, not total assets.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 818, "en": "Post-Money Valuation", "pl": "ocena po finansowaniu", "def": "The company's value after a new round of financing has been added to its capitalization.", "trap": "Mixing up 'post-money' with 'pre-money', which refers to the company's value before new funding.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 819, "en": "Anti-Dilution Protection", "pl": "ochrona przed rozluźnieniem udziałów", "def": "Clause in an investment agreement that protects investors from dilution of their ownership stake due to future financings.", "trap": "Overlooking the primary purpose of 'anti-dilution' as a protective mechanism against ownership stake erosion.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 820, "en": "Scope 1, Scope 2, Scope 3 Emissions", "pl": "Emisje w zakresie 1, 2, 3", "def": "Categories of greenhouse gas emissions measured by a company: Scope 1 are direct emissions from owned or controlled sources; Scope 2 are indirect emissions from purchased electricity and heat; Scope 3 are all other indirect emissions related to the value chain.", "trap": "", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 821, "en": "Integrative Sustainability Reporting (ISR)", "pl": "Raport Integracyjnej Odpowiedzialności Sztucznego Inteligencji", "def": "A comprehensive reporting framework that combines financial, social, and environmental metrics.", "trap": "Do not confuse with CSR audit or IRF.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 822, "en": "Sustainable Development Goals (SDGs)", "pl": "Cele Rozwoju Nachodzącego na Ziemi", "def": "A set of 17 interconnected goals designed to be achieved by 2030, aimed at ending poverty and inequality.", "trap": "Be aware of the different targets within each goal.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 823, "en": "Eco-Accounting Standards", "pl": "Standardy Kontozbirożyciarskie Ekologiczne", "def": "Financial accounting standards that incorporate environmental impacts and costs.", "trap": "Distinguish from traditional accounting practices.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 824, "en": "Stakeholder Governance Framework", "pl": "Ramka Gospodarkowa Zainteresowanych Stron", "def": "A systematic approach to identifying and managing stakeholders' interests in corporate decision-making.", "trap": "Do not confuse with shareholder governance.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 825, "en": "Supply Chain Decarbonization", "pl": "Demokarbonizacja Łańcucha Dostaw", "def": "The process of reducing the carbon footprint across all stages of a supply chain.", "trap": "Be aware that this may involve changes in sourcing and logistics.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 826, "en": "Consolidated financial statements", "pl": "Spójne finansowe sprawozdania", "def": "Financial reports that present the combined results of a parent company and its subsidiaries as a single entity.", "trap": "Do not confuse with 'separate' or 'unconsolidated' financial statements.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 827, "en": "Materiality principle", "pl": "Zasada istotności", "def": "The rule in accounting that an item is considered material if it could influence the decisions of users relying on financial statements.", "trap": "Remember that materiality can be subjective and depends on the specific circumstances.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 828, "en": "Impairment loss assessment", "pl": "Ocenka straty z obniżoną wartością", "def": "The process of identifying and measuring an impairment loss for assets that are impaired below their carrying amount.", "trap": "Ensure you understand the difference between 'impairment' and 'depreciation'.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 829, "en": "Audit committee", "pl": "Komisja audytna", "def": "A board-level committee responsible for overseeing the financial reporting process and ensuring the independence of external auditors.", "trap": "Note that the audit committee is distinct from the board of directors.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 830, "en": "Qualified unmodified opinion", "pl": "Opinia niezmodyfikowana z dodatkami", "def": "An unmodified audit opinion that includes an explanatory paragraph about matters that do not affect the overall fairness of the financial statements.", "trap": "Be aware that this is different from a 'qualified modified opinion' or an 'adverse opinion'.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 831, "en": "Cash flow statement", "pl": "Sprawozdanie o przepływie gotówki", "def": "A financial statement that provides information about the inflows and outflows of cash and cash equivalents over a period.", "trap": "Do not confuse with 'income statement' or 'balance sheet'.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 832, "en": "Neobank ecosystem", "pl": "EkoSystem nowoczesnych banków", "def": "A comprehensive digital banking environment that provides various financial services through online channels.", "trap": "Ecosystem may imply more than just banking services; it includes a wide range of financial products and services.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 833, "en": "Payment gateway optimization", "pl": "Optymalizacja bramy płatniczej", "def": "The process of improving the efficiency and speed of a payment gateway to handle transactions more effectively.", "trap": "Optimization may not always mean increasing capacity; it can also involve improving processing times and security.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 834, "en": "Peer-to-peer (P2P) lending underwriting", "pl": "Ocena ryzyka w kredytach peer-to-peer", "def": "The process of evaluating the creditworthiness of borrowers in a peer-to-peer lending platform to mitigate risks.", "trap": "Underwriting involves not just risk assessment but also setting loan terms and conditions.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 835, "en": "Smart contract lifecycle management", "pl": "Zarządzanie cyklem życia umowy inteligentnej", "def": "The process of overseeing the creation, execution, and termination of smart contracts to ensure compliance and efficiency.", "trap": "Lifecycle management includes not just monitoring but also auditing and archiving of contracts.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 836, "en": "Digital asset custody services", "pl": "Usługi opieki nad aktywami cyfrowymi", "def": "Professional services provided to securely store and manage digital assets like cryptocurrencies.", "trap": "Custody involves not just storage but also compliance with regulatory requirements.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 837, "en": "Regulatory sandbox testing", "pl": "Testowanie w piaskownicy regulacyjnej", "def": "A controlled environment where fintech innovations can be tested under real-world conditions before full-scale deployment.", "trap": "Sandbox testing should not only focus on innovation but also ensure compliance with existing regulations.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 838, "en": "Fair Value Adjustment", "pl": "Korekta wartości rynkowej", "def": "An adjustment made to a financial statement item to reflect its fair value.", "trap": "Do not confuse with 'historical cost', which is the original purchase price.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 839, "en": "Subsequent Events", "pl": "Zdarzenia późniejsze", "def": "Events that occur after the balance sheet date but before the financial statements are issued.", "trap": "These events can change the financial statements, so they require careful attention.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 840, "en": "Qualified Opinion", "pl": "Opinia z zastrzeżeniem", "def": "An unmodified opinion that includes a disclaimer regarding a significant matter.", "trap": "Not to be confused with a 'disclaimer of opinion', which is more severe.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 841, "en": "Going Concern", "pl": "Zajecie dalszej działalności", "def": "The assumption that a company will continue to operate for the foreseeable future.", "trap": "This is a critical element of an unqualified audit opinion.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 842, "en": "Provisions for Contingent Liabilities", "pl": "Zasoby do kontynuacji działalności", "def": "Estimates of potential future liabilities based on uncertain events.", "trap": "These provisions
