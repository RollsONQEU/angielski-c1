reviation for someone whose job is helping someone in a higher position.", "trap": "Definicja lektorki: 'abbreviation for someone whose job is helping someone in a higher position'. Rozwinięcie: Personal Assistant.", "category": "Operations & Business Communication", "source": "lekcja_handout_matching"}, {"id": 1214, "en": "to stretch a brand / brand stretching", "pl": "poszerzyć markę na nowy sektor (np. wejście supermarketu w usługi bankowe)", "def": "To leverage a respected brand name developed in one consumer category to introduce goods or services in an entirely different sector.", "trap": "Zelazna kolokacja C1: 'to stretch a brand INTO a new sector' (poszerzyc marke). Nie mowimy *to push a brand* ani *to divert a brand*.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1215, "en": "to comply with (policies / regulations)", "pl": "przestrzegać / stosować się do polityk, regulacji lub norm prawnych", "def": "To act in accordance with an established formal policy, statutory standard, environmental regulation, or contractual rule.", "trap": "KORONNA PULAPKA PRZYIMKOWA: to comply WITH (zawsze z with!). To appeal to oznacza odwolac sie do czegos lub podobac sie. To bring about oznacza spowodowac.", "category": "ESG, Sustainability & Corporate Ethics", "source": "lekcja"}, {"id": 1216, "en": "delivery note", "pl": "dowód dostawy / dokument WZ (podpisywany przez odbiorcę przy przyjęciu towaru)", "def": "A commercial document dispatched with a consignment of goods detailing the quantity and specification of items, signed by the recipient upon delivery.", "trap": "NAJWIEKSZA PULAPKA Z DOKUMENTOW TRANSPORTOWYCH: Delivery note = dowod dostawy (podpisywany przy odbiorze). Advice note = awizo wysylki (wysylane wczesniej). Cover note = tymczasowe zaswiadczenie o ubezpieczeniu!", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1217, "en": "advice note", "pl": "awizo wysyłki / zawiadomienie o ekspedycji towaru", "def": "A formal notice dispatched by a supplier to inform a buyer that a consignment of goods has been packed and dispatched on a specific date.", "trap": "Advice note to zawiadomienie wysylane przed dostawa. Dokument, ktory odbiorca podpisuje w momencie doreczenia to delivery note!", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1218, "en": "cover note", "pl": "tymczasowa polisa ubezpieczeniowa / zaświadczenie o objęciu ochroną", "def": "A temporary binding certificate issued by an insurer verifying that insurance cover is active while the formal policy is being drafted.", "trap": "Cover note to dokument ubezpieczeniowy. Nie ma nic wspolnego z odbiorem towaru w magazynie (do tego sluzy delivery note).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1219, "en": "tax return / to submit a tax return", "pl": "deklaracja podatkowa / zeznanie podatkowe składane do urzędu skarbowego", "def": "A form on which a taxpayer makes an annual statement of income and personal circumstances, used by the tax authorities to assess liability for tax.", "trap": "Zeznanie podatkowe to 'tax return'. Remittance to przekaz pieniezny/przelew. Application to wniosek.", "category": "Taxation & Fiscal Optimization", "source": "lekcja"}, {"id": 1220, "en": "pricing policy / pricing strategy", "pl": "polityka cenowa / strategia ustalania cen produktów", "def": "A standardized corporate framework defining how an enterprise prices its goods and services to achieve market share and revenue targets.", "trap": "Kolokacja z review to 'pricing policy' (polityka cenowa). Prediction to prognoza, a value to wartosc.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1221, "en": "retail outlets / outlet", "pl": "punkty sprzedaży detalicznej / placówki handlowe", "def": "A store that sells a particular company's products or products of a specific type.", "trap": "Definicja lektorki: 'a store that sells a particular company's products or products of a specific type'.", "category": "Commerce & Supply Chain", "source": "lekcja_handout_matching"}, {"id": 1222, "en": "window displays", "pl": "wystawy sklepowe / witryny ekspozycyjne w sklepach detalicznych", "def": "An artistic commercial arrangement of featured merchandise showcased in the front windows of a store to attract shoppers.", "trap": "Ekspozycja sklepowa za szyba to 'window display'. Znajduje sie w 'retail outlets'.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1223, "en": "to summarise / summary", "pl": "podsumować / zwięźle zreferować", "def": "To give a brief, concise statement of the main points, facts, or findings of a business report or presentation.", "trap": "Pisownia UK: summarise; US: summarize. Nie mylic z authorise (zatwierdzic platnosc) ani analyse (badac).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1224, "en": "to analyse / analysis", "pl": "analizować / badać dane liczbowe i rynkowe", "def": "To examine methodically the financial constitution or structure of data, trends, or balance sheets for decision making.", "trap": "Pisownia UK: to analyse; US: to analyze. Rzeczownik: analysis (l.mn. analyses /əˈnæl.ə.siːz/).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1225, "en": "construction / construction industry", "pl": "budownictwo / branża budowlana", "def": "The economic sector dedicated to erecting buildings, industrial facilities, infrastructure, and engineering works.", "trap": "Construction to wznoszenie budynkow. Fizyczne miejsce siedziby to location, a tytul prawny najmu to leasehold.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1226, "en": "sales representative / representative", "pl": "przedstawiciel handlowy / reprezentant firmy", "def": "A commercial agent appointed by a firm to visit prospective clients, negotiate orders, and represent company products.", "trap": "Representative to przedstawiciel handlowy. Decyzja jednoglosna bez glosow sprzeciwu to unanimous decision!", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1227, "en": "to innovate / innovation", "pl": "wprowadzać innowacje / tworzyć nowatorskie rozwiązania produktowe", "def": "To pioneer, develop, and commercialize novel products, business processes, or operational paradigms.", "trap": "Innovate to tworzenie nowosci. Wejscie w inna galaz uslug (np. supermarket w bankowosc) to to diversify into!", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1228, "en": "ideals / personal ideals", "pl": "ideały / szlachetne zasady i przekonania", "def": "Conceptions of what is perfection, noble, or desirable, often based on philosophical or moral values.", "trap": "Ideals to osobiste idealy. Formalne zasady firmy to ethical policies (strict ethical policies on child labour).", "category": "ESG, Sustainability & Corporate Ethics", "source": "lekcja"}, {"id": 1229, "en": "sophisticated", "pl": "zaawansowany technicznie / wyrafinowany / skomplikowany", "def": "Highly developed, complex, and refined in technology, design, or intellectual conception.", "trap": "Sophisticated oznacza skomplikowany/zaawansowany. Plan tani i efektywny przy malym budzecie to cost-effective!", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1230, "en": "corporate values / values", "pl": "wartości korporacyjne / fundamentalne wartości firmy", "def": "The core guiding principles, beliefs, and cultural ethics that an enterprise adopts to direct its conduct and culture.", "trap": "Values to wartosci korporacyjne. Chwytliwe hasla w spotach reklamowych to advertising slogans!", "category": "ESG, Sustainability & Corporate Ethics", "source": "lekcja"}, {"id": 1231, "en": "to cater for / cater to", "pl": "zaspokajać potrzeby określonej grupy / obsługiwać niszowy segment klientów", "def": "Provide people with food and drink at a social event or other gathering.", "trap": "KORONNA REGULA PRZYIMKOWA: to cater FOR (UK) lub to cater TO (US). Bez przyimka nie laczy sie z demand (mowi sie: to satisfy demand / meet demand)!", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1232, "en": "brainstorming / brainstorming session", "pl": "burza mózgów / kreatywna sesja generowania pomysłów", "def": "A group creativity technique designed to generate a large volume of spontaneous ideas and solutions to a designated challenge.", "trap": "Brainstorming to generowanie pomyslow. Bezposredni nadzor nad pracownikiem/stazysta to supervision (lack of adequate supervision)!", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1233, "en": "public transport", "pl": "transport publiczny / komunikacja zbiorowa", "def": "Buses, trains, subways, and other transport systems operating on established routes and available to the general public.", "trap": "Public transport przewozi pasazerow. Do przewozu ciezkich maszyn produkcyjnych sluzy haulage firm!", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1234, "en": "sensible vs sensitive", "pl": "rozsądny / roztropny (sensible) vs wrażliwy / podatny na wstrząsy (sensitive)", "def": "Sensible: possessing or displaying practical wisdom, prudence, and good judgment. Sensitive: easily influenced, offended, or reactive to external stimuli.", "trap": "TOP FALSE FRIEND C1: 'sensible' oznacza ROZSĄDNY (a sensible plan = rozsadny plan). 'Sensitive' oznacza WRAŻLIWY (sensitive skin / price-sensitive). W zdanou 40 uzyto substantial (pokaźna inwestycja).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1235, "en": "suitable", "pl": "odpowiedni / stosowny / właściwy do danych celów", "def": "Right or appropriate for a particular person, purpose, or commercial situation.", "trap": "Suitable oznacza odpowiedni/wlasciwy. Inwestycja o bardzo duzych nakladach to substantial investment.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1236, "en": "established / established corporation", "pl": "o ugruntowanej pozycji rynkowej / renomowane przedsiębiorstwo", "def": "Having been in commercial existence for a long time and recognized for stability, reliability, and market share.", "trap": "Przeciwienstwo modych start-upow (start-up dotcom companies).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1237, "en": "preliminary / preliminary results", "pl": "wstępny / wstępne wyniki finansowe (przed audytem)", "def": "Preceding, done, or published in preparation for the main, final, or verified accounting report.", "trap": "Preliminary to wstepny. Mloda spolka na poczatku dzialalnosci to start-up.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 1238, "en": "chief executive / CEO", "pl": "dyrektor generalny / prezes zarządu (Chief Executive Officer)", "def": "The highest-ranking executive corporate manager charged with overarching operational governance and strategy.", "trap": "Chief executive zarzadza cala korporacja. Zwykly pracownik operacyjny raportuje co dwa tygodnie do swojego line managera!", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1239, "en": "executive assistant", "pl": "asystent zarządu / asystent wykonawczy", "def": "A senior administrative professional who provides high-level support, scheduling, and project management to C-suite executives.", "trap": "Executive assistant to asystent wspierajacy prezesa. Przelozony w strukturze raportowania to line manager.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1240, "en": "apprentice / apprenticeship", "pl": "uczeń zawodu / praktykant / staż rzemieślniczy", "def": "A person who is learning a trade from a skilled employer.", "trap": "Definicja lektorki: 'a person who is learning a trade from a skilled employer'. Osoba to 'apprentice', sam okres nauki to 'apprenticeship'.", "category": "HR & Workplace", "source": "lekcja_handout_matching"}, {"id": 1241, "en": "to appeal to", "pl": "przemawiać do odbiorców / podobać się klientom; lub: odwołać się", "def": "To be attractive or of interest to consumers; or to make a formal request to a higher authority for a reversal of a decision.", "trap": "To appeal to = podobac sie / przemawiac. Przestrzeganie regulaminow i polityk etycznych to to comply WITH!", "category": "ESG, Sustainability & Corporate Ethics", "source": "lekcja"}, {"id": 1242, "en": "to bring about", "pl": "doprowadzić do / spowodować zmianę lub reformę", "def": "To cause something substantial to happen, develop, or occur in corporate or public governance.", "trap": "Bring about to wywolac skutek. Stosowanie sie do przepisow to to comply with.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1243, "en": "pending payment", "pl": "pending payment", "def": "It means that the payment process still needs to be completed. In most cases, this simply means that you need to wait for this to happen.", "trap": "Definicja dokladnie z bazy wykladowcy: It means that the payment process still needs to be completed. In most cases, this simply means that you need to wait for this to happen.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1244, "en": "line-manager", "pl": "line-manager", "def": "A person with direct managerial responsibility for a particular employee.", "trap": "Definicja dokladnie z bazy wykladowcy: A person with direct managerial responsibility for a particular employee.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1245, "en": "come up", "pl": "pojawić się niespodziewanie / wyniknąć (np. nieoczekiwane wydatki)", "def": "(Intransitive phrasal verb) To happen or arise unexpectedly, demanding immediate attention or financial resources.", "trap": "Czasownik NIEPRZECHODNI (intransitive) : nie łączy się bezpośrednio z dopełnieniem! Nie mów: *come up expenses*, lecz: *unexpected expenses come up*.", "category": "Money & Currency", "source": "lekcja"}, {"id": 1246, "en": "set up", "pl": "założyć / utworzyć (np. fundusz powierniczy, konto, firmę)", "def": "(Transitive separable phrasal verb) To formally establish, create, or arrange a legal or financial structure such as a trust fund, bank account, or enterprise.", "trap": "Czasownik ROZDZIELNY (separable). Z zaimkiem: *set it up* (nigdy *set up it*).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1247, "en": "trust fund", "pl": "fundusz powierniczy", "def": "A legal financial arrangement in which funds or property are held and managed by a trustee for the benefit of a specified beneficiary.", "trap": "Nie myl z hedge fund (fundusz hedgingowy/spekulacyjny) ani mutual fund (fundusz inwestycyjny). Trust fund to fundusz powierniczy na rzecz beneficjenta.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1248, "en": "get by on", "pl": "wyżyć z / wiązać koniec z końcem na (określonej kwocie/budżecie)", "def": "(Inseparable phrasal verb with preposition) To manage to live, survive, or cope financially with only a minimal amount of money or resources.", "trap": "Nierozdzielny z przyimkiem *on*. Mówimy: *get by on 500 euros a month*, nie: *get on by*.", "category": "Money & Currency", "source": "lekcja"}, {"id": 1249, "en": "dip into", "pl": "sięgać do oszczędności / naruszać rezerwy finansowe", "def": "(Inseparable phrasal verb with preposition) To spend a portion of accumulated savings or reserves that are normally kept untouched.", "trap": "Nierozdzielny (inseparable): *dip into them* (nigdy *dip them into* w znaczeniu finansowym).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1250, "en": "put down a deposit / put a deposit down", "pl": "wpłacić kaucję / wnieść zadatek lub wkład początkowy", "def": "(Transitive separable phrasal verb) To pay an initial sum of money as part of the total payment or as security when renting or buying property.", "trap": "Rozdzielny: dopuszczalne zarówno *put down a deposit*, jak i *put a deposit down*. Z zaimkiem wyłącznie: *put it down*.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1251, "en": "put up", "pl": "podnieść / zwiększyć (ceny, czynsz, kieszonkowe, opłaty)", "def": "(Transitive separable phrasal verb) To raise or increase the level, price, rate, or amount of something.", "trap": "Rozróżnij: *put up* (podnieść coś: przechodni) vs *go up* (wzrosnąć samoczynnie: nieprzechodni). Nie myl z *put up with* (znosić/tolerować).", "category": "Money & Currency", "source": "lekcja"}, {"id": 1252, "en": "cut down on", "pl": "zredukować / ograniczyć (koszty, wydatki, konsumpcję)", "def": "(Inseparable phrasal verb with preposition) To reduce the quantity, frequency, or expenditure on a particular activity or item.", "trap": "Trzyczęściowy czasownik nierozdzielny: *cut down on something* / *cut down on it* (nigdy *cut it down on*).", "category": "Money & Currency", "source": "lekcja"}, {"id": 1253, "en": "put by", "pl": "odkładać / oszczędzać (pieniądze regularnie na przyszłość)", "def": "(Transitive separable phrasal verb) To regularly save money over time for a future planned purpose or unexpected contingency.", "trap": "Brytyjski synonim *put aside* lub *set aside*. Rozdzielny: *she put 300 pounds by* / *she put it by*.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1254, "en": "take out a loan", "pl": "zaciągnąć pożyczkę / wziąć kredyt w banku", "def": "(Transitive separable phrasal verb) To formally apply for and secure a financial borrowing arrangement, mortgage, or insurance policy from an institution.", "trap": "Z zaimkiem: *take it out* (np. to take out a loan -> to take it out). Nie myl z *draw down* (uruchomienie transzy).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1255, "en": "put off", "pl": "odłożyć na później / przełożyć w czasie / odroczyć", "def": "(Transitive separable phrasal verb) To postpone, defer, or delay an action, plan, or commitment until a future time.", "trap": "Wymaga formy -ing (gerund), nie bezokolicznika: *put off studying* (nigdy *put off to study*).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1256, "en": "break down", "pl": "zepsuć się (o sprzęcie, maszynie) / ulec awarii", "def": "(Intransitive phrasal verb) To stop functioning or cease operating properly due to mechanical or electronic failure.", "trap": "W znaczeniu awarii sprzętu jest NIEPRZECHODNI: *the computer broke down* (bez dopełnienia).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1257, "en": "go up", "pl": "wzrosnąć / pójść w górę (np. czynsz, koszty, ceny)", "def": "(Intransitive phrasal verb) To increase or rise in cost, level, or quantity without taking a direct object.", "trap": "Czasownik NIEPRZECHODNI: *prices go up* (ceny rosną). Porównaj z przechodnim: *landlords put prices up*.", "category": "Money & Currency", "source": "lekcja"}, {"id": 1258, "en": "eat out", "pl": "jeść na mieście / stołować się w restauracji", "def": "(Intransitive phrasal verb) To have a meal at a restaurant, pub, or café rather than cooking and eating at home.", "trap": "Czasownik NIEPRZECHODNI. Przeciwieństwem jest *eat in*.", "category": "Money & Currency", "source": "lekcja"}, {"id": 1259, "en": "carry on", "pl": "kontynuować / robić coś nadal bez zmian", "def": "(Phrasal verb followed by gerund) To continue an activity, lifestyle, or process without changing behavior.", "trap": "Łączy się wyłącznie z gerundium (-ing): *carry on spending* (nigdy *carry on to spend*).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1260, "en": "unexpected expenses", "pl": "nieprzewidziane / nagłe wydatki", "def": "Unplanned costs and financial obligations that arise suddenly and are not accounted for in routine budgets.", "trap": "Rzeczownik w liczbie mnogiej: mówimy *unexpected expenses* (lub *unexpected costs*), rzadziej w l. pojedynczej w tym sensie.", "category": "Money & Currency", "source": "lekcja"}, {"id": 1261, "en": "savings account", "pl": "konto oszczędnościowe / rachunek oszczędnościowy", "def": "An interest-bearing deposit account held at a bank or other financial institution that provides a modest interest rate.", "trap": "Rachunek bieżący / rozliczeniowy to *current account* (UK) / *checking account* (US). Rachunek oszczędnościowy to *savings account*.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1262, "en": "equity capital", "pl": "kapitał własny / kapitał pozyskany z emisji akcji", "def": "Capital raised by a business through the sale of shares to investors, rather than taking out loans or debt financing.", "trap": "Equity capital NIE generuje obowiązku spłaty rat ani stałych odsetek, ale rozwadnia własność (dilutes ownership) i wiąże się z wypłatą dywidendy.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1263, "en": "interest rate", "pl": "stopa procentowa / oprocentowanie kredytu", "def": "The proportion of a loan that is charged as interest to the borrower, typically expressed as an annual percentage of the principal balance outstanding.", "trap": "Nie myl z fee/charge (jednorazowe prowizje i opłaty manipulacyjne banku). Interest rate to procentowa stawka odsetek naliczanych od kwoty głównej (principal).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1264, "en": "risk capital", "pl": "kapitał podwyższonego ryzyka / venture capital", "def": "Funds invested in speculative start-ups or high-growth ventures that carry a substantial risk of total loss but potential for exceptional financial returns.", "trap": "Synonim venture capital. Przeciwieństwo bezpiecznego długu bankowego.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1265, "en": "cashflow problems", "pl": "problemy z płynnością finansową / zatory płatnicze", "def": "Difficulties in meeting short-term financial obligations because incoming cash does not arrive quickly enough to pay current liabilities.", "trap": "Spółka może być rentowna w rachunku zysków i strat (P&L), a jednocześnie zbankrutować przez brak gotówki na bieżące opłaty (cashflow problems)!", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 1266, "en": "to miss an instalment", "pl": "spóźnić się z ratą / opuścić termin płatności raty kredytowej", "def": "To fail to pay a scheduled periodic debt payment by its contractual due date.", "trap": "Instalment to rata (regular periodic payment). Zgłoszenie niewypłacalności w wyniku opuszczenia rat to default.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1267, "en": "insolvent / insolvent company", "pl": "niewypłacalny / niewypłacalna firma (niezdolna do regulowania długów)", "def": "An organization or individual unable to pay their debts and financial obligations as they become due.", "trap": "Przymiotnik: insolvent (niewypłacalna firma = an insolvent company). Rzeczownik: insolvency (niewypłacalność). Różnica: insolvency to stan faktyczny, bankruptcy to formalny wyrok sądu.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1268, "en": "deduction", "pl": "potrącenie (np. z pensji) / odliczenie podatkowe", "def": "An amount that is subtracted from total gross pay or income (e.g. taxes, health insurance, pension contributions).", "trap": "1. Czasownik: to deduct FROM (np. tax is deducted from your gross salary). 2. Różnica: tax deduction obniża dochód do opodatkowania (taxable income), a tax credit obniża sam wyliczony podatek.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1269, "en": "payslip", "pl": "pasek płacowy / odcinek wypłaty", "def": "A note given to an employee when they have been paid, detailing the amount of pay given, and the tax and insurance deducted.", "trap": "Definicja lektorki: 'a note given to an employee when they have been paid, detailing the amount of pay given, and the tax and insurance deducted'.", "category": "HR & Workplace", "source": "lekcja_handout_matching"}, {"id": 1270, "en": "saturated market / market saturation", "pl": "rynek nasycony / nasycenie rynku (sytuacja, w której popyt jest w pełni zaspokojony)", "def": "Occurs when a market no longer shows new demand for a firm's products.", "trap": "Definicja lektorki: 'occurs when a market no longer shows new demand for a firm's products'. Oznacza brak miejsca na dalszy organiczny wzrost sprzedaży dotychczasowych modeli.", "category": "Marketing & Advertising", "source": "lekcja_handout_matching"}, {"id": 1271, "en": "merchandising / to merchandise", "pl": "merchandising / planowanie ekspozycji towaru i promocji w miejscu sprzedaży", "def": "The activity of promoting the sale of goods at retail, including display presentation, packaging design, and promotional pricing.", "trap": "Merchandise jako rzeczownik oznacza towar, a jako czasownik: promować sprzedaż w sklepie. Nasycenie rynku imitacjami to saturation, nie merchandising.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1272, "en": "to reimburse expenses / expense reimbursement", "pl": "zwrócić / zrefundować wydatki służbowe pracownikowi (np. podróż, hotel, posiłki)", "def": "To pay back an employee or contractor an equivalent amount of money that they previously spent from personal funds on authorized business activities.", "trap": "Poniesione wydatki są zwracane ('reimbursed'). To submit expenses oznacza dopiero złożyć wniosek o ich zwrot, a to allocate oznacza przydzielić budżet z góry.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1273, "en": "to allocate funds / budget allocation", "pl": "przydzielić środki / zaalokować budżet na określony cel", "def": "To designate and apportion financial resources, capital, or workforce for a specific corporate department, project, or operational purpose.", "trap": "Allocate to przydzielenie zasobów przed ich wydaniem. Zwrot pieniędzy wydanych przez pracownika to wyłącznie reimburse.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1274, "en": "minimum hourly wage / wage vs salary", "pl": "minimalna stawka godzinowa / płaca godzinowa (zazwyczaj dla pracowników fizycznych/operacyjnych)", "def": "The legally mandated lowest payment calculated on an hourly basis that employers may pay workers for their labour.", "trap": "RÓŻNICA C1: Wage to stawka godzinowa lub tygodniowa (związana z przepracowanymi godzinami). Salary to stała pensja miesięczna lub roczna (np. kadry menedżerskiej). Nie ma 'hourly salary'!", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1275, "en": "job description", "pl": "opis stanowiska pracy / formalny dokument określający zakres obowiązków i wymagania", "def": "A formal contractual document outlining the core duties, required qualifications, reporting hierarchy, and responsibilities of a specific employment role.", "trap": "Dokument, który się przepisuje lub aktualizuje, to 'job description'. 'Job satisfaction' to poziom zadowolenia pracownika, a 'job security' to pewność zatrudnienia.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1276, "en": "connecting flight / connecting", "pl": "lot przesiadkowy / połączenie lotnicze (z przesiadką na węzłowym lotnisku)", "def": "An air passenger flight requiring travelers to change aircraft or airlines at an intermediate hub airport to reach their final destination.", "trap": "Lot przesiadkowy to 'connecting flight'. Zwrot *transfer flight* nie funkcjonuje jako przymiotnik określający lot (transfer oznacza sam przewóz/przesiadkę). 'Scheduled flight' to lot rejsowy/rozkładowy.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1277, "en": "slump in sales / economic slump", "pl": "załamanie sprzedaży / gwałtowny krach popytu na towary i usługi", "def": "A sudden, severe decline in commercial sales volume, economic activity, or market prices.", "trap": "Slump oznacza głębokie załamanie/spadek. Recovery to ożywienie koniunktury (wtedy zatrudnia się ludzi, nie zwalnia!). Devaluation dotyczy dewaluacji waluty przez bank centralny.", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1278, "en": "letter of appointment / appointment", "pl": "formalne pismo o zatrudnieniu / akt powołania na stanowisko / list intencyjny o przyjęciu do pracy", "def": "An act of assigning a job or position to someone.", "trap": "Definicja lektorki: 'an act of assigning a job or position to someone'. W tym kontekście to nie umówione spotkanie u fryzjera/lekarza, lecz mianowanie na funkcję.", "category": "HR & Workplace", "source": "lekcja_handout_matching"}, {"id": 1279, "en": "advertising jingle / jingle", "pl": "melodyjka reklamowa / krótki, chwytliwy motyw muzyczny marki", "def": "A brief, catchy tune or musical refrain composed specifically for broadcast advertising to implant brand recognition in listeners' memory.", "trap": "To, co można śpiewać w myślach ('singing in my head'), to muzyczny 'jingle'. Slogan to hasło tekstowe (hasło reklamowe). Trademark to zastrzeżony znak towarowy.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1280, "en": "cancelled flight / to cancel a flight", "pl": "odwołany (o locie, spotkaniu, zamówieniu z przyczyn losowych lub technicznych)", "def": "Officially decided that an operational event, flight, meeting, or scheduled journey will not take place.", "trap": "Lot zostaje 'cancelled' (odwołany) lub 'delayed' (opóźniony). Nie używa się *prevented* do lotu (można prevent an accident, ale nie prevent a flight).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1281, "en": "white-collar workers / white-collar", "pl": "pracownicy umysłowi / pracownicy biurowi (w opozycji do fizycznych)", "def": "Employees who perform professional, managerial, administrative, or clerical desk work, typically in an office environment.", "trap": "Pracownicy biurowi (office workers) to 'white-collar'. Pracownicy produkcyjni i fizyczni to 'blue-collar'. 'Apprentice' to praktykant/uczeń w zawodzie.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1282, "en": "attorney / power of attorney", "pl": "adwokat / radca prawny / pełnomocnik procesowy reprezentujący klienta w sądzie", "def": "A licensed legal professional certified to represent clients, present evidence, and argue litigation in court or conduct legal transactions.", "trap": "W sądzie reprezentuje stronę 'attorney' (lub lawyer/solicitor/barrister). 'Judge' to sędzia wydający wyrok (nie reprezentuje żadnej ze stron!). 'Shop steward' to związkowiec/mąż zaufania na hali fabrycznej.", "category": "Legal & Compliance", "source": "lekcja"}, {"id": 1283, "en": "shop steward / union representative", "pl": "zakładowy mąż zaufania / delegat związków zawodowych w miejscu pracy", "def": "A coworker elected by fellow trade union members in a factory or office to represent their grievances and negotiate directly with workplace managers.", "trap": "Shop steward to reprezentant związkowy na poziomie zakładu pracy (fabryki), nie reprezentuje klienta przed sądem powszechnym.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1284, "en": "receipts / proof of purchase", "pl": "paragony / rachunki / dowody zakupu do rozliczenia delegacji służbowej", "def": "Written or printed merchant acknowledgments verifying that goods or services have been delivered and paid for, required for fiscal accounting.", "trap": "KORONNA PUŁAPKA FALSE FRIEND: 'Recipe' (/ˈresɪpi/) to przepis kulinarny! 'Receipt' (/rɪˈsiːt/ z niemym 'p') to paragon/rachunek. 'Payslip' to odcinek wypłaty.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1285, "en": "references / professional references", "pl": "referencje / kontakty do osób referencyjnych na końcu życiorysu zawodowego (CV)", "def": "Formal written statements or the names and contact details of previous supervisors who can endorse a job applicant's competence, character, and track record.", "trap": "W CV podaje się 'references' (lub osoby referencyjne: referees). 'Evaluations' to wewnętrzne oceny okresowe w firmie, a 'records' to kartoteki/akta osobowe.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1286, "en": "mailshot / direct mailshot", "pl": "masowa wysyłka reklamowa / mailing bezpośredni do klientów (pocztą lub e-mailem)", "def": "A dispatch of mail, especially promotional material, to a large number of people.", "trap": "Definicja lektorki: 'a dispatch of mail, especially promotional material, to a large number of people'.", "category": "Marketing & Advertising", "source": "lekcja_handout_matching"}, {"id": 1287, "en": "risk assessment / workplace risk assessment", "pl": "ocena ryzyka zawodowego / badanie czynników szkodliwych i niebezpiecznych w pracy", "def": "A systematic, statutory examination of workplace practices and hazards to identify potential sources of harm, injury, or operational loss.", "trap": "Badanie tego, co może zaszkodzić ludziom w pracy ('what could harm people at work'), to definicja BHP terminu 'risk assessment'. 'Security' to ochrona mienia/danych, a 'damage' to wycena już powstałych zniszczeń.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1288, "en": "to deal with / to handle", "pl": "zajmować się czymś / przetwarzać / koordynować sprawy (np. wnioski wydatkowe)", "def": "To take appropriate executive or administrative action to manage, process, or resolve a task, problem, or workflow.", "trap": "PA 'deals with' claims (obsługuje/rozlicza je). 'Delegates' oznacza zlecanie zadań podwładnym, a 'incurs' oznacza ponoszenie kosztów (koszty ponosi szef, nie asystentka!).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1289, "en": "to incur expenses / to incur costs", "pl": "ponieść wydatki / ściągnąć na siebie koszty w trakcie działalności", "def": "To lose money, owe money, or have to pay money as a result of doing something.", "trap": "Definicja lektorki: 'to lose money, owe money, or have to pay money as a result of doing something'.", "category": "Corporate Finance & Investments", "source": "lekcja_handout_matching"}, {"id": 1290, "en": "performance appraisal / performance review", "pl": "okresowa ocena pracownicza / coroczna rozmowa ewaluacyjna z przełożonym", "def": "A formal periodic review wherein an employee's annual job achievements, competencies, and targets are evaluated by their direct line manager.", "trap": "Formalna rozmowa oceniająca pracownika to 'performance appraisal'. 'Discussion' to zwykła luźna rozmowa, a 'testimonial' to referencje lub świadectwo uznania od zadowolonego klienta.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1291, "en": "point-of-sale advertising / POS advertising", "pl": "reklama w punkcie sprzedaży / materiały promocyjne przy kasach sklepowych (POS / POSM)", "def": "Promotional displays, stands, flyers, or digital screens situated immediately adjacent to supermarket checkouts or retail payment terminals.", "trap": "Reklama przy samych kasach (supermarket check-outs) to definicja materiałów 'point-of-sale' (POS). Billboardy stoją przy drogach, a exhibitions to targi branżowe.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1292, "en": "economic recession / to be in recession", "pl": "recesja gospodarcza / okres ujemnego wzrostu gospodarczego (spadku PKB)", "def": "A sustained period of temporary macroeconomic decline characterized by falling gross domestic product for two or more consecutive fiscal quarters.", "trap": "Ujemny wzrost gospodarczy państwa przez kolejne kwartały to 'recession'. 'Liquidation' to likwidacja pojedynczej spółki, a 'depreciation' to spadek kursu waluty lub odpis amortyzacyjny.", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1293, "en": "to differentiate a product / product differentiation", "pl": "wyróżnić produkt / uwypuklić cechy odróżniające ofertę od konkurencji", "def": "To distinguish a firm's goods or services from competitors by designing unique features, superior branding, or added value.", "trap": "RÓŻNICA GRAMATYCZNA: 'To differentiate' jest czasownikiem przechodnim (wymaga dopełnienia: differentiate sth from sth). Czasownik 'differ' jest nieprzechodni: 'Our product differs from theirs' (nie można powiedzieć *to differ our product*).", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1294, "en": "to take someone to court / to go to court", "pl": "podać kogoś / firmę do sądu / wystąpić na drogę sądową po zwolnieniu z pracy", "def": "To initiate formal civil litigation against an individual or corporate body before a legal judicial tribunal.", "trap": "Idiomatyczny zwrot z powództwem cywilnym to 'to take someone to court'. 'Prosecution' oznacza oskarżenie prokuratorskie w procesie karnym (prawo pracy to proces cywilny).", "category": "Legal & Compliance", "source": "lekcja"}, {"id": 1295, "en": "plaintiff / claimant", "pl": "powód / strona powodowa (osoba wnosząca pozew przeciwko pracodawcy lub firmie)", "def": "The legal person or entity who initiates an actionable civil lawsuit and seeks monetary damages or injunctions against a defendant in a court of law.", "trap": "Osoba, która wnosi pozew i wygrywa sprawę, to 'plaintiff' (w UK również 'claimant'). Druga strona to 'defendant' (pozwany). Świadek to 'witness'.", "category": "Legal & Compliance", "source": "lekcja"}, {"id": 1296, "en": "defendant / defending party", "pl": "pozwany / strona pozwana (osoba lub spółka, przeciwko której wytoczono powództwo)", "def": "An individual, company, or institution sued or accused in a court of law.", "trap": "Definicja lektorki: 'an individual, company, or institution sued or accused in a court of law'. Przeciwieństwo: 'plaintiff'.", "category": "Legal & Compliance", "source": "lekcja_handout_matching"}, {"id": 1297, "en": "marketing campaign / social media campaign", "pl": "kampania marketingowa / zorganizowane działania reklamowe w określonym czasie", "def": "A coordinated series of planned promotional activities across diverse communication media aimed at achieving specific commercial sales or awareness goals.", "trap": "Okresowe działania promocyjne (np. trwające 6 tygodni) to 'campaign'. 'Marketing mix' to koncepcja teoretyczna (4P/7P). 'Prospectus' to prospekt emisyjny spółki giełdowej.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1298, "en": "to go on strike / industrial strike action", "pl": "przystąpić do strajku / rozpocząć strajk w proteście przeciwko niskim płacom", "def": "To collectively refuse to continue work as an organised protest by unionised labourers to enforce economic concessions from employers.", "trap": "Zwrot idiomatyczny: 'to go ON strike'. Wyrażenie *to be in dispute* oznacza być w sporze, ale nie mówi się *went on dispute*. 'Vacation' to urlop wypoczynkowy.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1299, "en": "surplus stock / inventory surplus", "pl": "nadwyżka magazynowa / zapas nadmiarowy (towar niesprzedany wyprzedawany ze zniżką)", "def": "Unsold merchandise or raw material holdings remaining in a warehouse beyond anticipated consumer demand, often liquidated at discounted rates.", "trap": "Zalegające niesprzedane towary to 'surplus stock' (lub surplus inventory). Zwrot *inventory stock* to pleonazm. 'Peak' odnosi się do szczytu sezonu (peak season), a nie do wyprzedawanego towaru.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1300, "en": "to bail out / government bailout", "pl": "uratować przed upadkiem finansowym / dokapitalizować zagrożony podmiot (zwykle przez państwo)", "def": "To rescue a failing corporation or bank from financial ruin by providing capital, emergency loans, or credit guarantees.", "trap": "Rzeczownik pisany razem: 'a bailout'. Czasownik rozdzielny: 'to bail [the bank] out'. Przeciwieństwem jest 'bail-in' (gdzie koszty ponoszą deponenci i akcjonariusze).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1301, "en": "to write off bad debt / debt write-off", "pl": "odpisać nieściągalny dług w koszty / umorzyć dług niemożliwy do wyegzekwowania", "def": "To officially remove an uncollectible account receivable or bad loan from a corporate balance sheet as a recognized loss.", "trap": "Rzeczownik: 'a write-off' (odpis księgowy). Czasownik frazowy: 'to write off [debt]'. Nie mylić z 'write down' (częściowy odpis wartości, podczas gdy write-off to całkowite spisanie do zera).", "category": "Accounting, Audit & Reporting", "source": "lekcja"}, {"id": 1302, "en": "to wind up a company / winding-up order", "pl": "zlikwidować spółkę / postawić przedsiębiorstwo w stan likwidacji przez sąd", "def": "To legally dissolve a commercial corporation, liquidate its assets, and distribute residual proceeds to creditors and shareholders.", "trap": "Czasownik nieregularny: wind: wound: wound. 'Winding-up order' to formalny sądowy nakaz przymusowej likwidacji spółki.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "lekcja"}, {"id": 1303, "en": "to plow back profits / plowback ratio", "pl": "reinwestować wypracowane zyski w rozwój firmy (zamiast wypłacać je w dywidendzie)", "def": "To retain corporate net earnings within a business enterprise rather than distributing them to shareholders as cash dividends.", "trap": "Pisownia brytyjska: 'plough back', amerykańska: 'plow back'. Wskaźnik reinwestycji to 'plowback ratio' = 1: dividend payout ratio.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1304, "en": "to draw down / loan drawdown", "pl": "uruchomić transzę kredytu / pobrać przyznane środki z linii kredytowej", "def": "To access, activate, or withdraw available funds from an agreed credit facility or pre-approved institutional loan.", "trap": "Rzeczownik: 'drawdown' (uruchomienie/wypłata środków). Czasownik: 'to draw down [funds]'. W finansach inwestycyjnych 'drawdown' oznacza też spadek wartości portfela od szczytu do dołka.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1305, "en": "to lay off workers / compulsory layoffs", "pl": "zwolnić pracowników z przyczyn leżących po stronie firmy (brak zamówień, redukcja etatów)", "def": "To terminate the employment contracts of workers due to operational downscaling or lack of business activity, rather than employee fault.", "trap": "KORONNA RÓŻNICA: 'To lay off' to zwolnienie z winy/sytuacji firmy (redukcja etatów). 'To fire / dismiss' to zwolnienie z winy pracownika (za złe wyniki lub przewinienie).", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1306, "en": "to roll over debt / debt rollover", "pl": "zrolować dług / zaciągnąć nowy kredyt na spłatę zapadającego zobowiązania", "def": "To refinance an existing maturing debt obligation by replacing it with a new loan or issuing new bonds with a later maturity date.", "trap": "'Rollover risk' to ryzyko, że pożyczkodawcy odmówią przedłużenia kredytu w momencie jego zapadalności.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1307, "en": "to tap into a market / to tap new revenue streams", "pl": "wejść na nowy rynek / otworzyć nowe źródło przychodów / dotrzeć do niezagospodarowanego segmentu", "def": "To successfully access, exploit, or establish commercial operations in a promising demographic segment or market sector.", "trap": "Czasownik frazowy z 'into': 'to tap into [market / demographic / talent pool]'. Nie używa się samego *to tap a market*.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1308, "en": "poison pill / poison pill defense", "pl": "trująca pigułka", "def": "A defensive corporate tactic used by a takeover target company to make its shares prohibitively expensive or unattractive to an acquiring predator.", "trap": "Termin z teorii fuzji i przejęć (M&A). Sprawia, że najeźdźca (hostile bidder) musiałby ponieść gigantyczne straty przy przejęciu.", "category": "M&A and Corporate Restructuring", "source": "lekcja"}, {"id": 1309, "en": "golden handshake vs golden parachute", "pl": "złoty spadochron / złoty uścisk dłoni", "def": "A lucrative, pre-negotiated severance package or equity bonus guaranteed to top corporate executives upon departure or after a hostile takeover.", "trap": "RÓŻNICA: 'Golden parachute' dotyczy odprawy przy utracie posady na skutek przejęcia firmy (takeover). 'Golden handshake' to ogólna wysoka odprawa na pożegnanie.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1310, "en": "due diligence / to conduct due diligence", "pl": "badanie due diligence", "def": "A rigorous, comprehensive legal and financial appraisal of a commercial business conducted by a prospective buyer prior to signing an M&A contract.", "trap": "Kolokacja z czasownikiem: 'to conduct / carry out due diligence' (nie mówi się *to make due diligence*!).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1311, "en": "leveraged buyout (LBO)", "pl": "wykup lewarowany (LBO)", "def": "The acquisition of another company using a significant amount of borrowed money (bonds or loans) to meet the cost of acquisition.", "trap": "Cechą LBO jest to, że dług zabezpieczany jest na aktywach spółki przejmowanej (target company), a nie kupującego!", "category": "Private Equity & Venture Capital", "source": "lekcja"}, {"id": 1312, "en": "management buyout (MBO)", "pl": "wykup menedżerski (MBO)", "def": "A corporate transaction whereby a company's existing managerial team purchases the assets and operations of the business they manage.", "trap": "Różnica MBO vs MBI: MBO (Management Buyout) = dotychczasowy zarząd kupuje firmę. MBI (Management Buy-In) = zewnętrzny zespół menedżerów kupuje firmę.", "category": "Private Equity & Venture Capital", "source": "lekcja"}, {"id": 1313, "en": "carve-out / equity carve-out", "pl": "wydzielenie części przedsiębiorstwa", "def": "The strategic divestiture of a subsidiary business unit where the parent company sells a minority stake to public investors via an IPO.", "trap": "W carve-out spółka matka zachowuje zazwyczaj kontrolny pakiet akcji, sprzedając jedynie część nowej spółki na rynku.", "category": "M&A and Corporate Restructuring", "source": "lekcja"}, {"id": 1314, "en": "synergy / operational synergy", "pl": "efekt synergii", "def": "The combined economic value and performance of two merged enterprises exceeding the sum of their separate individual parts.", "trap": "Typy synergii: 'cost synergies' (cięcie powielających się działów) vs 'revenue synergies' (wzrost przychodów dzięki wspólnej sieci dystrybucji).", "category": "M&A and Corporate Restructuring", "source": "lekcja"}, {"id": 1315, "en": "asset stripping / asset stripper", "pl": "rozsprzedaż aktywów po wrogim przejęciu", "def": "The practice of buying an undervalued company with the sole intention of selling off its profitable assets separately for quick profit.", "trap": "Termin o pejoratywnym wydźwięku na egzaminach : oznacza niszczenie miejsc pracy dla szybkiego zysku spekulacyjnego.", "category": "M&A and Corporate Restructuring", "source": "lekcja"}, {"id": 1316, "en": "reverse takeover", "pl": "odwrotne przejęcie", "def": "A transaction wherein a private company acquires a publicly listed entity to achieve public listing status without conducting an IPO.", "trap": "Służy do szybkiego wejścia na giełdę bez konieczności przechodzenia długiej procedury prospektowej i tradycyjnego debiutu (IPO).", "category": "M&A and Corporate Restructuring", "source": "lekcja"}, {"id": 1317, "en": "brand dilution", "pl": "rozmycie marki", "def": "The weakening of a brand's reputation, perceived quality, and prestige when overextended into unsuitable market categories.", "trap": "Ryzyko związane z 'brand stretching' (poszerzeniem marki) : jeśli nowa kategoria jest tandetna, następuje 'brand dilution'.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1318, "en": "predatory pricing", "pl": "ceny drapieżne", "def": "The illegal commercial practice of setting prices artificially low to force rival businesses out of the market, establishing a monopoly.", "trap": "W prawie ochrony konkurencji (antitrust law) praktyka ta jest nielegalna, jeśli podmiot ma pozycję dominującą.", "category": "Marketing, Strategy & Pricing", "source": "lekcja"}, {"id": 1319, "en": "loss leader / loss-leader pricing", "pl": "produkt sprzedawany ze stratą (loss leader)", "def": "A product sold at a price below its market production cost in order to stimulate other, more profitable consumer retail sales.", "trap": "Loss leader ma generować ruch (footfall) w sklepie : sklep zarabia na innych produktach o wysokiej marży kupionych przy okazji.", "category": "Marketing, Strategy & Pricing", "source": "lekcja"}, {"id": 1320, "en": "customer lifetime value (CLTV)", "pl": "wartość życiowa klienta (CLTV)", "def": "The total net monetary profit attributed to the entire future relationship between a company and an individual customer.", "trap": "Wysoki CLTV pozwala firmom tolerować wyższy koszt pozyskania (CAC) i inwestować agresywnie w kampanie reklamowe.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1321, "en": "churn rate / customer churn", "pl": "wskaźnik odejść klientów (churn rate)", "def": "The annualized or monthly percentage of existing contractual subscribers who discontinue their service contracts with a provider.", "trap": "Im niższy churn rate, tym dłuższy okres życia klienta i wyższa wycena spółki w modelu SaaS (Software-as-a-Service).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1322, "en": "guerilla marketing", "pl": "marketing partyzancki", "def": "An innovative, unconventional, and low-cost marketing strategy designed to obtain maximum exposure through viral public surprise.", "trap": "Pisownia: 'guerilla' lub 'guerrilla'. Opiera się na kreatywności i szoku, a nie na wielomilionowych budżetach mediowych.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1323, "en": "first-mover advantage", "pl": "przewaga pierwszego gracza", "def": "The strategic competitive advantage gained by the initial significant commercial occupant of a new market segment or industry.", "trap": "Przewaga pierwszego gracza pozwala narzucić standardy technologiczne i zająć najlepsze kanały dystrybucji.", "category": "Marketing, Strategy & Pricing", "source": "lekcja"}, {"id": 1324, "en": "market cannibalization", "pl": "kanibalizacja rynku", "def": "A negative commercial occurrence where sales of a firm's new product undermine and displace sales of its own existing product line.", "trap": "Kanibalizacja jest dopuszczalna tylko wtedy, gdy firma woli sama skanibalizować swój produkt, niż oddać klientów konkurencji.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1325, "en": "garden leave", "pl": "płatne zwolnienie z obowiązku świadczenia pracy w okresie wypowiedzenia (z zachowaniem pełnego wynagrodzenia, by odciąć od tajemnic)", "def": "An executive employment practice where an employee leaving a firm is paid full salary but instructed to stay away from the workplace and clients.", "trap": "Służy ochronie poufnych informacji : pracownik siedzi w domu ('pieli ogródek'), nie ma dostępu do bazy klientów, ale pobiera pensję.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1326, "en": "non-compete clause / restrictive covenant", "pl": "klauzula o zakazie konkurencji", "def": "A contractual agreement clause prohibiting an employee or contractor from working for a competing business within a defined geography and period.", "trap": "W prawie anglosaskim klauzula musi być 'reasonable' (rozsądna co do czasu i terytorium), inaczej sąd uzna ją za nieważną.", "category": "Legal & Compliance", "source": "lekcja"}, {"id": 1327, "en": "summary dismissal / gross misconduct", "pl": "zwolnienie dyscyplinarne / zwolnienie natychmiastowe z powodu ciężkiego naruszenia obowiązków (gross misconduct)", "def": "Immediate termination of an employment contract by an employer without notice or severance pay, typically due to severe misconduct.", "trap": "'Summary dismissal' nie wymaga zachowania okresu wypowiedzenia (notice period), ale pracodawca musi udowodnić 'gross misconduct' (np. kradzież, oszustwo).", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1328, "en": "severance package / redundancy package", "pl": "odprawa pracownicza", "def": "The financial compensation and employee benefits granted to an employee upon involuntary departure, downsizing, or corporate redundancy.", "trap": "W prawie brytyjskim używa się częściej 'redundancy payment' (odprawa z tytułu redukcji etatu), w US: 'severance pay'.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1329, "en": "whistleblowing / whistleblower", "pl": "sygnalizowanie nadużyć (whistleblowing) / sygnalista", "def": "The disclosure by an employee of confidential evidence showing illegal, corrupt, or fraudulent activities within an organization to authorities.", "trap": "Dyrektywy unijne wymuszają w firmach dedykowane, poufne kanały 'whistleblowing procedures' chroniące sygnalistów przed odwetem.", "category": "ESG, Sustainability & Corporate Ethics", "source": "lekcja"}, {"id": 1330, "en": "attrition rate / natural attrition", "pl": "wskaźnik naturalnego ubytku pracowników", "def": "The gradual reduction in corporate workforce numbers occurring through employee retirement or resignation without filling vacancies.", "trap": "Zarząd woli 'natural attrition' niż 'layoffs', ponieważ nie budzi to sprzeciwu związków zawodowych i nie wymaga odpraw.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1331, "en": "headhunting / executive search firm", "pl": "headhunting / poszukiwanie bezpośrednie", "def": "The specialized recruitment practice of actively soliciting and persuading senior executives working for other firms to switch employers.", "trap": "Headhunting dotyczy wyłącznie kluczowych stanowisk (C-level, partnerzy). Do rekrutacji masowej używa się zwykłych agencji pracy (employment agencies).", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1332, "en": "grievance procedure", "pl": "procedura skargowa w firmie", "def": "A formal internal process that allows an employee to lodge a contractual complaint against workplace unfair treatment, bullying, or harassment.", "trap": "Formalny etap w prawie pracy: pracownik musi najpierw przejść 'internal grievance procedure' przed wniesieniem pozwu do sądu pracy.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1333, "en": "collective bargaining / collective agreement", "pl": "rokowania zbiorowe / układ zbiorowy pracy", "def": "The institutional negotiation process between an employer and trade union representatives regarding compensation, hours, and working rules.", "trap": "Układ zbiorowy wiąże pracodawcę wobec wszystkich pracowników objętych porozumieniem, niezależnie od tego, czy należą do związku.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1334, "en": "zero-hours contract", "pl": "umowa zero godzin", "def": "An employment agreement where the employer is not obliged to provide any minimum working hours, paying only for shifts completed.", "trap": "Częsty temat esejów socjologicznych na ALK: zero-hours contracts dają elastyczność firmie, ale przerzucają całe ryzyko braku pracy na pracownika.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1335, "en": "conflict of interest", "pl": "konflikt interesów", "def": "A situation in which a professional or corporate insider has competing private interests that could corrupt impartial decision-making.", "trap": "Procedura korporacyjna wymaga ujawnienia ('to disclose') konfliktu interesów i wyłączenia się z głosowania ('to recuse oneself').", "category": "ESG, Sustainability & Corporate Ethics", "source": "lekcja"}, {"id": 1336, "en": "scope 1, 2, and 3 emissions", "pl": "emisje gazów cieplarnianych zakresu 1, 2 i 3 (zakres 1 = bezpośrednie z fabryk; 2 = z kupionego prądu; 3 = cały łańcuch dostaw)", "def": "The standardized international classification of greenhouse gas emissions categorized by direct operations, electricity consumed, and broader supply chains.", "trap": "'Scope 3' to najtrudniejsza część audytu ESG, bo obejmuje emisje dostawców surowców oraz to, jak konsumenci zużywają i wyrzucają produkt.", "category": "ESG, Sustainability & Corporate Ethics", "source": "lekcja"}, {"id": 1337, "en": "carbon offsetting / carbon credits", "pl": "kompensacja emisji dwutlenku węgla", "def": "The commercial practice of balancing corporate carbon emissions by investing in certified equivalent carbon-reduction environmental projects.", "trap": "Jednostka handlowa: 'carbon credit' = prawo do emisji lub certyfikat usunięcia jednej tony metrycznej CO2 z atmosfery.", "category": "ESG, Sustainability & Corporate Ethics", "source": "lekcja"}, {"id": 1338, "en": "circular economy", "pl": "gospodarka o obiegu zamkniętym", "def": "An industrial economic model designed to eliminate waste and pollution through the continuous reclamation, reuse, and recycling of materials.", "trap": "Przeciwieństwem gospodarki cyrkularnej jest tradycyjny model linearny: 'linear economy' (take: make: dispose / weź: wyprodukuj: wyrzuć).", "category": "ESG, Sustainability & Corporate Ethics", "source": "lekcja"}, {"id": 1339, "en": "agency problem / principal-agent conflict", "pl": "problem agencji", "def": "A corporate governance conflict of priorities between the owners of an asset (the principals) and the executive hired to manage it (the agent).", "trap": "Menedżerowie (agenci) mogą chcieć maksymalizować własne bonusy i wielkość firmy, zamiast dbać o dywidendę dla akcjonariuszy (pryncypałów).", "category": "Contracts, Commercial Law & Governance", "source": "lekcja"}, {"id": 1340, "en": "facilitation payment vs bribe", "pl": "opłata ułatwiająca", "def": "An unofficial, small cash payment made to a government official to expedite or secure the performance of a routine, non-discretionary governmental action.", "trap": "KORONNA PUŁAPKA PRAWNA: Amerykańska ustawa FCPA w pewnych wąskich wypadkach dopuszcza facilitation payments, ale prawo brytyjskie (UK Bribery Act) bezwzględnie ich ZAKAZUJE i traktuje jak łapówkę!", "category": "Legal & Compliance", "source": "lekcja"}, {"id": 1341, "en": "subprime loans / subprime mortgage crisis", "pl": "kredyty subprime", "def": "Mortgages and commercial loans issued to borrowers with compromised credit ratings and high default risk, typically carrying high interest rates.", "trap": "'Prime' = klient o idealnej zdolności kredytowej. 'Subprime' = klient o słabej zdolności kredytowej ('poor credit ratings'), generujący wysokie ryzyko.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1342, "en": "debt covenant / covenant breach", "pl": "kowenant kredytowy", "def": "A legally binding clause in a lending agreement requiring the borrower to fulfill specific financial commitments or maintain balance sheet ratios.", "trap": "Złamanie kowenantu ('covenant breach') daje bankowi prawo do natychmiastowego zażądania zwrotu całej kwoty kredytu (loan acceleration)!", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1343, "en": "haircut on debt / sovereign haircut", "pl": "strzyżenie długu (haircut)", "def": "The strategic percentage reduction in the stated face value of outstanding debt bonds or loans agreed to during debt restructuring.", "trap": "Slang finansowy: 'to take a haircut' oznacza zaakceptować stratę części zainwestowanego kapitału, by odzyskać chociaż resztę.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "lekcja"}, {"id": 1344, "en": "cash burn rate", "pl": "tempo przepalania gotówki (burn rate)", "def": "The rate at which a newly formed, unprofitable enterprise spends its venture capital reserves before generating positive cash flow.", "trap": "Kombinacja z pojęciem 'runway' (pas startowy): czas w miesiącach, jaki spółka przetrwa przy obecnym 'burn rate' bez nowej rundy finansowania.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1345, "en": "debt overhang", "pl": "nawis zadłużeniowy (debt overhang)", "def": "A macroeconomic condition where an enterprise or country has so much existing debt that it cannot borrow additional capital for productive investments.", "trap": "Każdy dodatkowy wypracowany zysk trafia do rąk starych wierzycieli, przez co nowi inwestorzy odmawiają finansowania projektów.", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1346, "en": "to bottom out at / to hit rock bottom", "pl": "osiągnąć punkt zwrotny na samym dnie i przestać spadać / osiągnąć absolutne dno", "def": "To reach the lowest historical point in an economic cycle, share valuation, or market price before stabilizing and rebounding.", "trap": "Składnia trendów: 'to bottom out AT [number / level]'. Wyrażenie potoczne: 'to hit rock bottom' (sięgnąć dna).", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1347, "en": "to level off / to plateau", "pl": "ustabilizować się na stałym poziomie / wypłaszczyć się (o wykresie sprzedaży po okresie dynamicznego wzrostu lub spadku)", "def": "To stop rising or falling and remain steady at a consistent horizontal statistical level over time.", "trap": "Pisownia brytyjska: 'levelled off' (podwójne 'l'), amerykańska: 'leveled off'. Czasownik 'plateau' wymawia się: /ˈplætəʊ/.", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1348, "en": "to rebound / sharp rebound", "pl": "odbić się / dynamiczne odbicie", "def": "To rapidly recover value, production, or volume after experiencing an abrupt economic downturn or market price drop.", "trap": "Rzeczownik: 'a sharp rebound in exports' (akcent na pierwszą sylabę: /ˈriːbaʊnd/). Czasownik: 'exports rebounded' (/rɪˈbaʊnd/).", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1349, "en": "fire hazard / safety hazard", "pl": "zagrożenie pożarowe / czynnik stwarzający ryzyko wybuchu pożaru w biurze lub magazynie", "def": "A material, substance, or action that increases the likelihood of an accidental fire occurring.", "trap": "Definicja lektorki: 'a material, substance, or action that increases the likelihood of an accidental fire occurring'.", "category": "Operations & Business Communication", "source": "lekcja_handout_matching"}, {"id": 1350, "en": "loss-leader / loss leader pricing", "pl": "produkt sprzedawany ze stratą (loss-leader) w celu zdobycia udziału w rynku lub przyciągnięcia klientów", "def": "A product offered for sale at an unprofitable price to attract buyers and expand overall market share.", "trap": "'Gimmick' to tani chwyt/sztuczka marketingowa. 'Sample' to darmowa próbka. Produkt sprzedawany komercyjnie ze stratą to 'loss-leader'.", "category": "Marketing, Strategy & Pricing", "source": "lekcja"}, {"id": 1351, "en": "maternity leave / parental leave", "pl": "urlop macierzyński / roczny płatny urlop po urodzeniu dziecka", "def": "A statutory period of approved absence from work granted to a mother before and after the birth of her child.", "trap": "Urlop po porodzie to 'maternity leave' (dla ojca: 'paternity leave'). 'Annual leave' to zwykły urlop wypoczynkowy, a 'benefit' to zasiłek/świadczenie.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1352, "en": "to slip on a wet floor / slip and fall", "pl": "poślizgnąć się (na mokrej nawierzchni) / wypadek przy pracy na mokrej posadzce", "def": "To lose one's footing, balance, or traction and slide unintentionally on a slick surface.", "trap": "Na mokrej powierzchni człowiek 'slips' (slipped). 'Tripped' oznacza potknąć się o przeszkodę (tripped over a cable), a 'banged' to uderzyć się (banged her arm).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1353, "en": "stock market fluctuations / market fluctuations", "pl": "wahania na giełdzie / fluktuacje kursów akcji uniemożliwiające przewidywanie trendów", "def": "Irregular, unpredictable upward and downward shifts in asset valuations, equities, or commodity prices over time.", "trap": "Nieregularne zmiany cen to 'fluctuations' (lub volatility). 'Excesses' to ekscesy/przesada, a 'improvements' to polepszenie.", "category": "Capital Markets & Securities", "source": "lekcja"}, {"id": 1354, "en": "remuneration package / compensation package", "pl": "pakiet wynagrodzenia / całościowe warunki płacowe i pozapłacowe oferowane w ogłoszeniu o pracę", "def": "The total reward structure offered to an employee, including base salary, performance bonuses, pension contributions, and healthcare.", "trap": "W ogłoszeniu o pracę kusi się 'remuneration package' (pakietem płacowym). 'Redundancy package' to odprawa przy zwolnieniu z pracy, a 'retirement package' to pakiet emerytalny.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1355, "en": "to withdraw a product / product withdrawal", "pl": "wycofać produkt z rynku / wstrzymać sprzedaż z powodu problemów z niezawodnością i usterkami", "def": "To officially remove a defective, unsafe, or unreliable product from retail distribution channels.", "trap": "Wycofanie z powodu usterek to 'to withdraw a product' (lub product recall). 'Launch' to wprowadzenie na rynek (przeciwieństwo!), a 'feedback' to opinie.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1356, "en": "according to my schedule / meeting schedule", "pl": "harmonogram / terminarz spotkań biznesowych (kalendarz godzinowy)", "def": "A structured timetable or agenda listing appointments, tasks, deadlines, and expected meeting times.", "trap": "Terminarz spotkań to 'schedule' (lub diary). 'Inventory' to stan magazynowy towarów, a 'strategy' to długoterminowa strategia.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1357, "en": "objective of the appraisal / appraisal objective", "pl": "cel (np. rozmowy oceniającej) / zamiar strategiczny / cel nadrzędny do osiągnięcia", "def": "A strategic goal or intended purpose that an executive process, appraisal, or commercial project aims to accomplish.", "trap": "'Objective' to nadrzędny cel procesu/rozmowy. 'Target' to mierzalny wskaźnik liczbowy (np. target sprzedażowy), a 'assignment' to zadanie do wykonania.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1358, "en": "supplying retail outlets / retail supply", "pl": "zaopatrywanie placówek handlu detalicznego w towar z magazynu centralnego", "def": "The logistics operation of delivering stock and inventory regularly to physical storefronts and consumer shops.", "trap": "Zaopatruje się 'retail outlets'. Słowo 'chains' oznacza całe sieci, ale punkty to 'outlets'. Słowo *points* to polonizm (kalka z 'punkty sprzedaży').", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1359, "en": "recruited by a headhunter / headhunter recruitment", "pl": "zwerbowany przez łowcę głów (headhuntera) / bezpośrednia rekrutacja specjalisty", "def": "Direct recruitment of an executive candidate initiated by an independent executive search agency rather than by application.", "trap": "'Headhunter' to niezależny rekruter kradnący talenty z innych firm. 'Tribunal' to sąd pracy, a 'selection committee' to wewnętrzna komisja rekrutacyjna.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1360, "en": "website subscriptions / subscriber target", "pl": "subskrypcje internetowe / płatne abonamenty użytkowników serwisu internetowego", "def": "An arrangement to receive something, typically a publication, regularly by paying in advance.", "trap": "Definicja lektorki: 'an arrangement to receive something, typically a publication, regularly by paying in advance'.", "category": "Fintech, Payments & Digital Assets", "source": "lekcja_handout_matching"}, {"id": 1361, "en": "shortage of skilled workers / skills shortage", "pl": "niedobór wykwalifikowanych pracowników / brak rąk do pracy na rynku pracy", "def": "A macroeconomic condition where the corporate demand for qualified labor exceeds the available supply of certified workers.", "trap": "Brak rąk do pracy to 'shortage' (rzeczownik od short). 'Short list' to finałowa lista kandydatów w rekrutacji, a 'short term' to krótki okres.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1362, "en": "boarding gate / airport gate", "pl": "bramka na lotnisku (gate)", "def": "The designated terminal portal through which passengers embark onto an aircraft before departure.", "trap": "Wejście na pokład samolotu (boarding) odbywa się przy 'gate'. 'Lounge' to salonik biznesowy, a 'check-in' to stanowisko odprawy bagażowej.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1363, "en": "to fulfill one's potential / fulfill his potential", "pl": "zrealizować swój potencjał / wykorzystać w pełni wrodzone zdolności i predyspozycje zawodowe", "def": "To completely develop and express the full measure of one's professional abilities and latent talents.", "trap": "Stała kolokacja C1: 'to fulfill one's potential'. Wyraz 'aptitude' to uzdolnienie (nie łączy się z fulfill), a 'prospects' to widoki/perspektywy na przyszłość.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1364, "en": "to appraise performance / appraise staff", "pl": "oceniać wyniki pracowników / przeprowadzać okresową ewaluację personelu w dziale HR", "def": "To systematically review, measure, and evaluate the job achievements, competencies, and outputs of subordinates.", "trap": "Czasownik w HR: 'to appraise performance' (rzeczownik: appraisal). Nie mylić z 'to approve' (zatwierdzić) ani 'to criticise' (krytykować).", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1365, "en": "bad publicity / negative publicity", "pl": "zły rozgłos w prasie / negatywne publikacje medialne uderzające w reputację przedsiębiorstwa", "def": "Notice or attention given to someone or something by the media.", "trap": "Definicja lektorki: 'notice or attention given to someone or something by the media'. Różni się od 'advertising' (które jest płatnym czasem/miejscem).", "category": "Marketing & Advertising", "source": "lekcja_handout_matching"}, {"id": 1366, "en": "members of the trade union / union membership", "pl": "członkowie związku zawodowego / pracownicy zrzeszeni w zakładowej organizacji związkowej", "def": "Employees who hold formal enrolled membership in a recognized labor union to protect their collective employment rights.", "trap": "Pracownicy jako ogół to 'workforce'. Pracownicy zapisują się i są członkami (*members of*) 'trade union' (związku zawodowego).", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1367, "en": "to process claims / automated claim processing", "pl": "przetwarzać wnioski wydatkowe / elektroniczne weryfikowanie i zatwierdzanie rozliczeń delegacji", "def": "To execute the automated verification, accounting reconciliation, and administrative settlement of expense demands.", "trap": "Oprogramowanie przetwarza wnioski: 'process claims'. 'Implement' oznacza wdrożenie całego systemu (system is implemented, but it processes claims).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1368, "en": "black market trade / black market", "pl": "czarny rynek / nielegalny obrót towarami podrobionymi lub kradzionymi z naruszeniem prawa", "def": "An underground, illegal economy where counterfeit products, contraband, or unauthorized goods are bought and sold.", "trap": "Nielegalny handel podróbkami to 'black market'. 'Free market' to legalny wolny rynek, a 'direct market' to sprzedaż bezpośrednia.", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1369, "en": "turnover of staff / high staff turnover", "pl": "rotacja pracowników / wskaźnik odchodzenia personelu z powodu złych warunków pracy", "def": "The number of employees that leave your company and need replacing in a set amount of time.", "trap": "Definicja lektorki: 'the number of employees that leave your company and need replacing in a set amount of time'. Nie mylić z obrotem finansowym (financial turnover).", "category": "HR & Workplace", "source": "lekcja_handout_matching"}, {"id": 1370, "en": "excess baggage fees / excess baggage", "pl": "nadbagaż / bagaż przekraczający wagowo dozwolony limit przewozowy w liniach lotniczych", "def": "Luggage carried on an aircraft that weighs more than the complimentary allowance permitted by the passenger ticket.", "trap": "Płaci się za 'excess baggage'. Bezpłatny limit wagowy pasażera to 'baggage allowance'. Bagaż podręczny to 'hand luggage'.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1371, "en": "boom in sales / sales boom", "pl": "boom w sprzedaży / gwałtowny rozkwit popytu i lawinowy wzrost przychodów w danej kategorii produktowej", "def": "A sudden, dramatic surge in commercial purchasing volume and revenue across an industry or market sector.", "trap": "Kolokacja z przyimkiem 'in': 'the boom IN sales'. Wyraz 'volume' wymaga przyimka 'of' (*the volume OF sales*).", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1372, "en": "to file for bankruptcy / filed for bankruptcy", "pl": "złożyć wniosek o upadłość / zainicjować sądowe postępowanie upadłościowe po latach strat", "def": "To officially register legal insolvency documents with a bankruptcy court upon becoming unable to honor creditor obligations.", "trap": "Ścisły termin prawny: 'to file FOR bankruptcy' (nie mówi się *filed for failure* ani *filed for collapse*).", "category": "Insolvency, Turnaround & Distressed Debt", "source": "lekcja"}, {"id": 1373, "en": "poor timekeeping / bad timekeeping", "pl": "brak punktualności / notoryczne spóźnianie się do pracy stanowiące formalną podstawę do dyscyplinarnego zwolnienia", "def": "The persistent, unexcused failure of an employee to arrive at their designated workplace punctually.", "trap": "Spóźnianie się w HR to 'poor timekeeping'. 'Timing' to wyczucie czasu w działaniu biznesowym, a 'temping' to praca dorywcza (temp work).", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1374, "en": "tribunal", "pl": "trybunał / sąd arbitrażowy / sąd pracy", "def": "A body established to settle certain types of dispute, court of justice.", "trap": "Definicja lektorki: 'a body established to settle certain types of dispute, court of justice'. W kontekście biznesowym to najczęściej Employment Tribunal (sąd pracy).", "category": "Legal & Employment", "source": "lekcja_handout_matching"}, {"id": 1375, "en": "notify", "pl": "powiadomić formalnie / zawiadomić", "def": "Inform (someone) of something, typically in a formal or official manner.", "trap": "Definicja lektorki: 'inform (someone) of something, typically in a formal or official manner'. Wymaga dopełnienia osobowego: 'notify someone of something'.", "category": "Business Communication", "source": "lekcja_handout_matching"}, {"id": 1376, "en": "aptitude", "pl": "uzdolnienie / naturalne predyspozycje", "def": "A natural ability to do something.", "trap": "Definicja lektorki: 'a natural ability to do something'. Częste zestawienie: 'aptitude test' (test predyspozycji).", "category": "HR & Assessment", "source": "lekcja_handout_matching"}, {"id": 1377, "en": "unfair dismissal", "pl": "bezpodstawne zwolnienie z pracy", "def": "A situation in which an employer orders someone to leave their job, when there is not a good reason to do so.", "trap": "Definicja lektorki: 'a situation in which an employer orders someone to leave their job, when there is not a good reason to do so'.", "category": "HR & Employment Law", "source": "lekcja_handout_matching"}, {"id": 1378, "en": "job security", "pl": "pewność zatrudnienia / stabilność pracy", "def": "The fact of your job being permanent, so that you will probably not lose it.", "trap": "Definicja lektorki: 'the fact of your job being permanent, so that you will probably not lose it'.", "category": "HR & Workplace", "source": "lekcja_handout_matching"}, {"id": 1379, "en": "gimmick", "pl": "chwyt marketingowy / trik reklamowy", "def": "A trick or device intended to attract attention, publicity, or trade.", "trap": "Definicja lektorki: 'a trick or device intended to attract attention, publicity, or trade'.", "category": "Marketing & Sales", "source": "lekcja_handout_matching"}, {"id": 1380, "en": "testimonial", "pl": "referencje / oficjalne poświadczenie kwalifikacji lub zadowolenia", "def": "A formal statement testifying to someone's character and qualifications.", "trap": "Definicja lektorki: 'a formal statement testifying to someone's character and qualifications'.", "category": "Marketing & HR", "source": "lekcja_handout_matching"}, {"id": 1381, "en": "submit a document", "pl": "przedłożyć / złożyć formalnie dokument", "def": "Formally send a document, plan, etc. to a person or group in authority.", "trap": "Definicja lektorki: 'formally send a document, plan, etc. to a person or group in authority'.", "category": "Corporate Governance & Administration", "source": "lekcja_handout_matching"}, {"id": 1382, "en": "claim expenses", "pl": "ubiegać się o zwrot kosztów służbowych", "def": "One wants to get reimbursed.", "trap": "Definicja lektorki: 'one wants to get reimbursed'. Kluczowe słowo w definicji to 'reimbursed' (uzyskać zwrot wydanych środków).", "category": "Finance & Corporate", "source": "lekcja_handout_matching"}];

(function(){
  const baza = window.BAZA || [];
  
  // Budowa klastrów kategorii
  const mapaKategorii = {};
  baza.forEach(w => {
    const k = w.category || 'Ogólne';
    if (!mapaKategorii[k]) mapaKategorii[k] = [];
    mapaKategorii[k].push(w);
  });

  // Pomocnik czyszczenia nawiasów
  function usunNawiasy(txt) {
    if (!txt) return '';
    return txt.replace(/\s*\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
  }

  // Konfiguracja
  let wybranyTryb = 'en_to_pl';
  let wybranyZakres = 'lekcja';
  let wybranaLiczba = 25;

  function bindPrzyciski(kontenerId, callback) {
    const el = document.getElementById(kontenerId);
    el.querySelectorAll('.btn-wybor').forEach(btn => {
      btn.addEventListener('click', () => {
        el.querySelectorAll('.btn-wybor').forEach(b => b.classList.remove('aktywny'));
        btn.classList.add('aktywny');
        callback(btn.getAttribute('data-wartosc'));
      });
    });
  }

  bindPrzyciski('grupa-tryb', v => wybranyTryb = v);
  bindPrzyciski('grupa-zakres', v => wybranyZakres = v);
  bindPrzyciski('grupa-liczba', v => wybranaLiczba = parseInt(v, 10));

  // Generowanie pytań sprytnoodpornych
  function filtrujPule() {
    if (wybranyZakres === 'lekcja') {
      return baza.filter(w => w.source === 'lekcja' || w.source === 'lekcja_handout_matching');
    } else if (wybranyZakres === 'finanse') {
      return baza.filter(w => (w.category || '').toLowerCase().includes('financ') || (w.category || '').toLowerCase().includes('bank') || (w.category || '').toLowerCase().includes('money'));
    } else if (wybranyZakres === 'prawo') {
      return baza.filter(w => (w.category || '').toLowerCase().includes('law') || (w.category || '').toLowerCase().includes('contract') || (w.category || '').toLowerCase().includes('govern'));
    } else if (wybranyZakres === 'zarzadzanie') {
      return baza.filter(w => (w.category || '').toLowerCase().includes('hr') || (w.category || '').toLowerCase().includes('operat') || (w.category || '').toLowerCase().includes('workplace'));
    }
    return baza.slice();
  }

  function generujPytanieSprytnoodporne(target, tryb, pula) {
    const kat = target.category || 'Ogólne';
