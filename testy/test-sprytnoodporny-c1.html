powiednik w USA: Savings and Loan (S&L).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1046, "en": "bureau de change / foreign exchange bureau", "pl": "kantor wymiany walut", "def": "A specialised retail business premises or booth where foreign banknotes and travellers cheques are bought and sold at commercial rates.", "trap": "Liczba mnoga z francuską pisownią: bureaux de change.", "category": "Money & Currency", "source": "lekcja"}, {"id": 1047, "en": "traveller's cheque", "pl": "czek podróżny", "def": "A medium of exchange used by tourists abroad, issued by banks for a fixed amount, which can be cashed upon double signature.", "trap": "Pisownia: UK traveller's cheque; US traveler's check.", "category": "Money & Currency", "source": "lekcja"}, {"id": 1048, "en": "paying-in slip / deposit slip", "pl": "dowód wpłaty (formularz bankowy przy wpłacaniu gotówki na konto)", "def": "A small bank document filled in by a depositor showing the date, account number, and amount of currency being paid in.", "trap": "UK to paying-in slip; USA to deposit slip.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1049, "en": "to debit an account", "pl": "obciążyć rachunek (pobrać środki z konta bankowego)", "def": "To take money out of an account to pay for goods, services, or scheduled standing orders.", "trap": "To debit = pobrać/zmniejszyć saldo konta. Przeciwieństwo: to credit an account = zaksięgować wpływ/zwiększyć saldo.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1050, "en": "to arrange an overdraft", "pl": "uzgodnić debet z bankiem / otworzyć linię debetową w koncie", "def": "To formally agree with a bank on a pre-authorized limit permitting withdrawals exceeding the current positive balance.", "trap": "Kolokacja czasownikowa: to ARRANGE an overdraft (nie *make* czy *open*).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1051, "en": "unit trust / mutual fund", "pl": "fundusz inwestycyjny / fundusz powierniczy (zbiorowe inwestowanie)", "def": "An open-ended investment company that pools money from many small investors to purchase a diversified portfolio of shares, bonds, or money market instruments.", "trap": "UK tradycyjnie nazywa to unit trust; w USA i globalnie standardem jest mutual fund.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1052, "en": "devastating drop (in market value)", "pl": "druzgocący spadek (wartości rynkowej) / załamanie wyceny", "def": "A catastrophic and precipitous decline in asset prices, enterprise valuation, or market indices that causes severe financial distress.", "trap": "W teście WB: \"devastating\" (druzgocący / katastrofalny dla wartości rynku), a NIE \"depressing\" (które odnosi się do nastroju psychicznego).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1053, "en": "poor credit rating", "pl": "niska ocena zdolności kredytowej / zły scoring kredytowy", "def": "An unfavourable formal evaluation or score indicating that a borrower has a history of missed payments or high default risk, making credit difficult or expensive to obtain.", "trap": "Kolokacja: \"credit rating\" (ocena/klasa scoringowa), a NIE \"credit crisis\" (kryzys kredytowy jako zjawisko makroekonomiczne).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1054, "en": "global economy", "pl": "gospodarka globalna / gospodarka światowa", "def": "The interconnected worldwide economic system comprising all national production, international trade, financial flows, and cross-border commerce.", "trap": "\"Global economy\" = cała gospodarka światowa (system produkcyjno-handlowy). \"Global finance\" = wyłącznie międzynarodowe rynki finansowe i przepływy kapitałowe.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1055, "en": "financial institutions", "pl": "instytucje finansowe (np. banki komercyjne, fundusze, ubezpieczyciele)", "def": "Regulated legal entities (such as commercial banks, credit unions, investment brokers, or insurance companies) that facilitate financial transactions, pool capital, and lend funds.", "trap": "Poprawna kolokacja biznesowa: financial \"institutions\" (instytucje), a NIE kalka językowa \"financial productions\".", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1056, "en": "drop in value / fall in value", "pl": "spadek wartości / deprecjacja wyceny", "def": "A measurable decrease in the nominal or market purchasing power and market price of an asset, currency, security, or commodity.", "trap": "Rzeczownik: \"a drop in value\". Jako czasownik: \"the asset dropped in value\". Synonimy formalne C1: slump, plunge, plummet.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1057, "en": "billion (1,000,000,000) [false friend]", "pl": "miliard (1 000 000 000 = 10^9) [UWAGA: fałszywy przyjaciel!]", "def": "The cardinal number equal to one thousand million (10^9). In modern international and US/UK English finance, one billion is always 1,000,000,000.", "trap": "KORONNA PUŁAPKA C1 (False Friend): Angielskie \"billion\" to po polsku MILIARD! Polski \"bilion\" (10^12) to po angielsku \"trillion\". Nigdy nie mów bilion na billion!", "category": "Money & Currency", "source": "lekcja"}, {"id": 1058, "en": "decimals in finance (e.g. 17.38%)", "pl": "ułamki dziesiętne w finansach (zasada czytania cyfr pojedynczo)", "def": "The rule for pronouncing decimal numbers in English, where a dot (point) is used instead of a comma, and all digits after the point are read individually.", "trap": "ŻELAZNA REGUŁA C1: Cyfry po kropce ZAWSZE czytamy pojedynczo! 17.38% to \"seventeen point three eight\", a NIGDY *seventeen point thirty-eight*!", "category": "Money & Currency", "source": "lekcja"}, {"id": 1059, "en": "exact vs indefinite figures (millions vs millions of)", "pl": "liczebniki określone vs nieokreślone (brak -s przy konkretnych kwotach)", "def": "The grammatical distinction where words like hundred, thousand, million, billion remain in the singular when preceded by a number, but take plural -s followed by \"of\" when indefinite.", "trap": "Gdy podajesz konkretną kwotę, NIE dodajesz \"s\": \"three million\" (NIGDY *three millions*). Końcówkę -s + of stosujesz tylko przy szacunkach nieokreślonych: \"millions of euros\".", "category": "Money & Currency", "source": "lekcja"}, {"id": 1060, "en": "reading large figures: British vs American (and)", "pl": "odczyt dużych liczb: brytyjski vs amerykański angielski (użycie \"and\")", "def": "The standard linguistic convention where British English requires \"and\" after hundred (e.g. three thousand five hundred and sixty), whereas American English omits \"and\".", "trap": "W brytyjskim angielskim (BrE) \"and\" po \"hundred\" jest OBOWIĄZKOWE. Ponadto w zapisie liczb po angielsku przecinek oddziela tysiące (1,000,000), a kropka oznacza część dziesiętną (16.5) : odwrotnie niż po polsku!", "category": "Money & Currency", "source": "lekcja"}, {"id": 1061, "en": "fractions / vulgar fractions", "pl": "ułamki zwykłe (np. 1/4, 2/3, 3/4) / ułamek kwoty", "def": "Numerical quantities expressed as a numerator over a denominator (such as a quarter, a half, two thirds, three quarters), as opposed to decimals.", "trap": "TERMINOLOGIA: fractions = ułamki zwykłe (1/4, 2/3). Decimals = ułamki dziesiętne (0.25, 0.75). W ułamkach zwykłych: 1/4 to a quarter, 2/3 to two thirds (z końcówką s!).", "category": "Money & Currency", "source": "lekcja"}, {"id": 1062, "en": "decimal point / decimals", "pl": "kropka dziesiętna (odpowiednik polskiego przecinka) / ułamki dziesiętne", "def": "The dot placed after the whole number to separate it from fractional tenths, hundredths, and thousandths in English numerical notation.", "trap": "W języku angielskim przecinek oddziela tysiące (1,000), a KROPKA to decimal point (1.5). Czytamy słowo point, NIGDY comma!", "category": "Money & Currency", "source": "lekcja"}, {"id": 1063, "en": "to soar / to rocket", "pl": "wystrzelić w górę / gwałtownie wzrosnąć (o popycie, cenach lub akcjach)", "def": "To rise or increase very rapidly and dramatically to a high level.", "trap": "Czasowniki nieprzechodnie: nie mówimy *we soared the prices*, tylko *prices soared*! Synonim formalny C1: to surge.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1064, "en": "to plummet / to plunge", "pl": "runąć w dół / gwałtownie zanurkować (o zyskach, sprzedaży lub kursie)", "def": "To fall straight down suddenly, steeply, and very rapidly from a high level.", "trap": "Wymowa \"plummet\": /ˈplʌm.ɪt/. Rzeczownik to zwykle a plunge lub a slump, sam wyraz plummet występuje niemal wyłącznie jako czasownik.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1065, "en": "to level off", "pl": "ustabilizować się / wyrównać się (po okresie wzrostu lub spadku)", "def": "To stop climbing or declining and remain steady at a more or less constant horizontal level.", "trap": "Pisownia: BrE \"levelled off\" (podwójne l), AmE \"leveled off\". Synonim rzeczownikowy: a plateau (/ˈplæt.əʊ/).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1066, "en": "to fluctuate / a fluctuation", "pl": "wahać się nieregularnie / fluktuować (o cenach, kursach walut)", "def": "To rise and fall irregularly in number, value, or amount without maintaining a clear trend.", "trap": "Przymiotnik: fluctuating (np. fluctuating demand). Rzeczownik policzalny: fluctuations.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1067, "en": "to halve / to double / to triple", "pl": "zmniejszyć się o połowę / podwoić się / potroić się", "def": "To reduce by fifty percent (halve); to multiply by two (double); to multiply by three (triple).", "trap": "Wymowa \"halve\": litera l jest NIEMA! Wymawiamy: /hɑːv/ (z dźwięcznym v na końcu, w przeciwieństwie do rzeczownika \"half\" /hɑːf/).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1068, "en": "to peak / to reach a peak of", "pl": "osiągnąć punkt szczytowy / szczytować na poziomie (np. w lipcu)", "def": "To reach the highest point, level, or value in a series of measurements or over a period.", "trap": "Przyimek z wartością: reached a peak OF €7m (rzeczownik), ale jako czasownik: PEAKED AT 10%!", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1069, "en": "to reach a low point of / to bottom out", "pl": "osiągnąć najniższy poziom / sięgnąć dna i zacząć odbijać (bottom out)", "def": "To hit the minimum value during a cycle before recovering or stabilizing.", "trap": "Zwrot biznesowy C1: \"to bottom out\" oznacza osiągnięcie absolutnego dna i przygotowanie do odbicia.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1070, "en": "prepositions of trends (by, to, of, at, from)", "pl": "przyimki opisu trendów: rose BY (o ile), TO (do jakiego poziomu), stand AT (wynosić obecnie)", "def": "The strict grammatical preposition system for reporting movements in finance: from (start) to (finish), by (difference), of (nominal change), at (fixed level).", "trap": "KLUCZ EGZAMINACYJNY C1: Czasownik + BY = RÓŻNICA (rose BY 5%): Czasownik + TO = POZIOM DOCELOWY (rose TO $10m): Rzeczownik + OF = RÓŻNICA (an increase OF 10%): Stan obecny / w danym punkcie = STAND AT (stood AT $4.11)", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1071, "en": "to paint a gloomy picture", "pl": "odmalować ponury obraz / przedstawiać czarne perspektywy gospodarcze", "def": "To describe a business, macroeconomic, or financial situation in a pessimistic, discouraging way.", "trap": "C1 Kolokacja: \"gloomy picture\" (ponury obraz). Synonimy formalne: bleak outlook, grim forecast.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1072, "en": "stress shift in trend words (inCREASE vs INcrease)", "pl": "przesunięcie akcentu: czasownik na 2. sylabę (inCREASE), rzeczownik na 1. sylabę (INcrease)", "def": "The phonetic rule where two-syllable trend words are stressed on the first syllable as nouns, but on the second syllable as verbs.", "trap": "KORONNA PUŁAPKA WYKŁADOWCY NA WYMOWĘ: Czasownik: to inCREASE /ɪnˈkriːs/, to deCREASE /dɪˈkriːs/: Rzeczownik: an INcrease /ˈɪn.kriːs/, a DEcrease /ˈdiː.kriːs/!", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1073, "en": "commercial bank", "pl": "bank komercyjny (instytucja finansowa przyjmująca depozyty i udzielająca kredytów)", "def": "A financial institution that accepts deposits from individuals and businesses, provides checking accounts, and makes loans to earn a profit from the interest rate spread.", "trap": "Nie mylić z investment bank (bank inwestycyjny : emisja akcji, obligacji, M&A) ani central bank (bank centralny : emisja waluty, stopy procentowe). Bank komercyjny to tradycyjny bank depozytowo-kredytowy (retail & corporate).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1074, "en": "bank loan", "pl": "kredyt bankowy / pożyczka bankowa (stała kwota na określony czas z odsetkami)", "def": "A fixed sum of money lent by a commercial bank for a specified period and repaid with interest, typically secured by collateral or personal guarantees.", "trap": "Różnica vs overdraft: bank loan to z góry określona kwota na stały czas z harmonogramem spłat; overdraft to elastyczna linia w koncie bez sztywnego terminu spłaty.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1075, "en": "interest rate spread / spread", "pl": "marża odsetkowa / spread odsetkowy (różnica między oprocentowaniem kredytów a depozytów)", "def": "The difference (differential) between the interest rate a bank charges borrowers on loans and the interest rate it pays depositors on their savings, representing the bank's gross lending margin.", "trap": "W bankowości komercyjnej spread to różnica między oprocentowaniem kredytów (wyższym) a depozytów (niższym). Na giełdzie / forex spread to z kolei bid-ask spread (różnica między kursem kupna i sprzedaży).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1076, "en": "depositor / depositors", "pl": "depozytariusz / deponent (osoba lub firma lokująca oszczędności w banku)", "def": "A person, business, or organization that places funds into a bank account or credit institution for safekeeping, interest accumulation, or transaction settlement.", "trap": "Pisownia: depositor (przez -or, a nie *-er*). Gdy dochodzi do paniki i masowych wypłat, mamy do czynienia z 'run on the bank' (runem na bank).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1077, "en": "to withdraw cash / withdrawal", "pl": "wypłacać gotówkę / podjąć środki z konta (rzeczownik: withdrawal)", "def": "Remove or take away (something) from a particular place or position.", "trap": "Definicja lektorki: 'remove or take away (something) from a particular place or position'. Formy: withdraw : withdrew : withdrawn.", "category": "Banking, Credit & Real Estate", "source": "lekcja_handout_matching"}, {"id": 1078, "en": "cheque / check", "pl": "czek bankowy / forma rozliczenia bezgotówkowego", "def": "A written paper order directing a bank to pay a specified amount of money from the drawer's account to the named payee.", "trap": "Pisownia: UK 'cheque' vs US 'check'. Wyrażenie 'cheque facilities' oznacza możliwość wystawiania i realizacji czeków na danym koncie.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1079, "en": "bank transfer / credit transfer", "pl": "przelew bankowy / elektroniczny transfer środków", "def": "An electronic payment method transferring funds directly from one bank account to another across clearing systems.", "trap": "W UK powszechne jest określenie 'bank transfer' lub BACS / Faster Payments; w USA 'wire transfer' lub ACH transfer.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1080, "en": "to overdraw an account", "pl": "przekroczyć stan konta / zrobić debet (ponad dostępne środki)", "def": "To draw more money from a bank account than is currently deposited, resulting in a negative balance and formal or informal debt.", "trap": "Formy czasownika: overdraw: overdrew: overdrawn. Przymiotnik: 'the account is overdrawn' (konto jest na minusie). Rzeczownik: 'overdraft'.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1081, "en": "loan maturity", "pl": "termin zapadalności kredytu / okres trwania umowy kredytowej", "def": "The final date or duration on which a loan, bond, or debt security must be fully repaid along with all outstanding interest.", "trap": "Maturity oznacza długość trwania / datę wygaśnięcia ('reach maturity' = wygasnąć / osiągnąć termin wykupu/spłaty). W bankowości kluczowe jest pojęcie 'maturity mismatch' (niedopasowanie terminów zapadalności aktywów i pasywów).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1082, "en": "to optimize return on assets", "pl": "optymalizować stopę zwrotu z aktywów (równoważyć rentowność i ryzyko kredytowe)", "def": "To strategically manage a bank's loan portfolio and investment securities to achieve the maximum yield possible while staying within strict regulatory risk and liquidity tolerances.", "trap": "Pisownia: optimize (Oxford / US) lub optimise (standard UK). W bilansie banku aktywami (assets) są KREDYTY (bo przynoszą odsetki), a pasywami (liabilities) są DEPOZYTY (bo bank musi je zwrócić).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1083, "en": "asset and liability management (ALM)", "pl": "zarządzanie aktywami i pasywami banku (równoważenie płynności, ryzyka stóp i terminów zapadalności)", "def": "The supervisory banking practice of managing financial risks that arise due to mismatches between a bank's assets (loans) and liabilities (deposits), especially interest-rate and liquidity risks.", "trap": "Dla studenta finansów kluczowa reguła ALM: bank pożycza krótkoterminowo (depozyty na żądanie) i lokuje długoterminowo (kredyty hipoteczne) : zarządzanie tą luką to istota bankowości komercyjnej!", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1084, "en": "security / guarantee (for a loan)", "pl": "zabezpieczenie / gwarancja spłaty kredytu (zabezpieczenie rzeczowe lub osobiste)", "def": "An asset, property, or third-party contractual commitment pledged by a borrower that a lender can seize or claim if the loan is defaulted on.", "trap": "Synonimem 'security' w kontekście majątkowym jest 'collateral' (zabezpieczenie rzeczowe/hipoteczne). 'Guarantee' to zazwyczaj zobowiązanie podmiotu trzeciego (np. poręczenie cywilne lub gwarancja bankowa).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1085, "en": "yield of a loan", "pl": "rentowność kredytu / roczna stopa zwrotu z pożyczki (wyrażona w %)", "def": "The total annual income or return generated by a loan (from interest payments and fees), expressed as a percentage of the total principal lent.", "trap": "Yield to rentowność / stopa zwrotu (w procentach), podczas gdy 'return' może oznaczać kwotowy lub procentowy zwrot z kapitału. Wykładowcy pytają: 'What determines the yield?' Odpowiedź: interest rate, fees, maturity, and credit risk premium.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1086, "en": "notice account / time deposit", "pl": "rachunek z wymogiem awizowania / lokata terminowa", "def": "A bank savings account that pays higher interest rates than a current account but requires the customer to give advance formal notice (e.g. 30, 60, or 90 days) before funds can be withdrawn.", "trap": "W UK: notice account (awizowane); w US: time deposit lub Certificate of Deposit (CD). Przeciwieństwo to 'demand deposit' / 'sight account' (rachunek a vista, na żądanie).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1087, "en": "to trade in money", "pl": "prowadzić obrót pieniężny / handlować pieniądzem jako towarem", "def": "To buy, sell, borrow, lend, and exchange currency and financial instruments as a core commercial business activity.", "trap": "'To trade IN something' oznacza handlować danym towarem/dobrem (np. trade in money, trade in commodities), natomiast 'to trade WITH someone' oznacza handlować z kimś.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1088, "en": "according to customers' instructions", "pl": "zgodnie z dyspozycjami / zleceniami klientów", "def": "In strict accordance with the authorized directions, payment orders, or mandates issued by bank account holders.", "trap": "Zwróć uwagę na dopełniacz w liczbie mnogiej: customers' (apostrof PO 's', bo chodzi o wielu klientów). 'Instruction' w bankowości oznacza formalną dyspozycję płatniczą (payment instruction).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1089, "en": "non-manual workers vs manual workers", "pl": "pracownicy umysłowi vs pracownicy fizyczni (white-collar vs blue-collar)", "def": "Professional, managerial, and clerical staff who perform intellectual tasks (earning a monthly salary) as opposed to manual laborers performing physical work (traditionally earning weekly cash wages).", "trap": "Klasyczny podział socjoekonomiczny: manual workers (fizyczni, pensja: wages/tygodniówka) vs non-manual workers (umysłowi, pensja: salary/miesięczna pensja). Synonimy: blue-collar vs white-collar.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1090, "en": "paid directly into a bank account", "pl": "przelewany bezpośrednio na rachunek bankowy (np. wynagrodzenie)", "def": "Credited electronically and automatically to an employee's or supplier's bank account without issuing paper cash or checks.", "trap": "Przyimek: paid INTO an account (nie: *paid to an account* ani *on an account*!).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1091, "en": "account holder", "pl": "posiadacz rachunku / właściciel konta bankowego", "def": "The individual, legal entity, or authorized party in whose name a bank account is registered and who holds legal title to the deposited funds.", "trap": "Posiadacz konta to 'account holder', a nie *account owner*. W przypadku konta wspólnego (np. małżeńskiego) mówimy 'joint account holder'.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1092, "en": "to pay little or no interest", "pl": "przynosić znikome odsetki lub brak oprocentowania (o rachunku bieżącym)", "def": "To yield a negligible interest rate or zero financial return on deposited balances, characteristic of standard checking and current accounts.", "trap": "Kolokacja czasownikowa: konto 'pays interest' (bank/konto płaci odsetki), a inwestor/klient 'earns interest' (zarabia na odsetkach).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1093, "en": "with no restrictions", "pl": "bez żadnych ograniczeń / z pełną swobodą dostępu (np. do środków)", "def": "Without operational limitations, withdrawal penalties, lock-in periods, or minimum notice requirements.", "trap": "'With no restrictions' = bez limitów i ograniczeń. Przeciwieństwo: 'subject to withdrawal restrictions' lub 'conditional on prior notice'.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1094, "en": "cheque facilities", "pl": "obsługa czekowa / dostęp do książeczki czekowej na rachunku", "def": "The banking service and contractual feature allowing an account holder to issue checks against their positive balance or agreed overdraft limit.", "trap": "Słowo 'facilities' w bankowości oznacza udogodnienia, linie lub instrumenty operacyjne (np. credit facility = linia kredytowa, overdraft facility = limit debetowy, cheque facilities = obsługa czekowa).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1095, "en": "notice is required (to withdraw money)", "pl": "wymagane jest wcześniejsze uprzedzenie / awizowanie wypłaty (okres wypowiedzenia)", "def": "A contractual stipulation obliging the depositor to notify the bank a designated number of days (e.g. 30, 60, or 90 days) prior to withdrawing capital.", "trap": "'Notice' w tym kontekście to 'wypowiedzenie / zawiadomienie z wyprzedzeniem' (np. 'to give notice' = złożyć dyspozycję z wyprzedzeniem).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1096, "en": "to pay regular bills at regular intervals", "pl": "opłacać cykliczne rachunki w regularnych odstępach czasu", "def": "To settle recurring consumer or corporate liabilities (such as rent, utilities, insurance) on predictable scheduled calendar dates.", "trap": "'Interval' to odstęp czasu (at regular intervals = regularnie/cyklicznie w stałych odstępach).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1097, "en": "fixed sum of money (lent for a fixed period)", "pl": "stała kwota pieniędzy (udzielona na z góry określony czas)", "def": "A predetermined, non-revolving lump sum of credit granted under contractual terms specifying a definitive maturity date and repayment schedule.", "trap": "Cechy charakterystyczne 'term loan' (kredytu terminowego) vs 'revolving credit' (kredytu odnawialnego): stała kwota (fixed sum) i sztywny okres spłaty (fixed period).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1098, "en": "to run up a debt to an agreed limit", "pl": "zaciągnąć zadłużenie do uzgodnionego limitu (narobić długu w debecie)", "def": "To incrementally accumulate debt by borrowing or spending money up to the authorized ceiling granted by the financial institution.", "trap": "Idiomatyczny phrasal verb: 'to run up a debt' / 'to run up debts' = narobić długów / zaciągnąć zadłużenie.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1099, "en": "interest is calculated daily", "pl": "odsetki są naliczane codziennie (w trybie dziennym)", "def": "The computation of finance charges and interest based on the exact end-of-day debt balance rather than an average monthly figure.", "trap": "Zwróć uwagę na stronę bierną i przysłówek: 'is calculated daily' (naliczany w trybie dziennym) vs 'compounded annually' (kapitalizowany rocznie).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1100, "en": "to charge interest on loans", "pl": "pobierać / naliczać odsetki od udzielonych kredytów", "def": "To bill and collect financing charges from borrowers as compensation for lending capital and bearing credit risk.", "trap": "KLUCZOWA PARA PRZYIMKÓW W C1: bank PAYS interest ON deposits (płaci odsetki od depozytów) oraz CHARGES interest ON loans (pobiera odsetki od kredytów).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1101, "en": "differential between interest rates", "pl": "różnica / dysparytet między stopami procentowymi (marża banku)", "def": "The numeric divergence or gap between two interest benchmarks, notably between the borrowing rate and lending rate in commercial banking.", "trap": "'Differential' to rzeczownik oznaczający różnicę/rozstęp (synonimy: margin, spread, gap).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1102, "en": "to find a balance between yield and risk", "pl": "znaleźć równowagę między rentownością a ryzykiem inwestycyjnym", "def": "The foundational investment and treasury principle of maximizing financial returns while keeping the probability of capital loss within prudent risk parameters.", "trap": "Klasyczny 'risk-return trade-off' (kompromis między ryzykiem a zyskiem). Jeśli stopa zwrotu (yield) jest podejrzanie wysoka, ryzyko (risk) niewypłacalności również jest proporcjonalnie wyższe.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1103, "en": "to match assets with liabilities", "pl": "dopasowywać aktywa do pasywów (pod względem terminów zapadalności i stóp)", "def": "The strategic treasury operation of aligning the cash inflows from bank loans (assets) with the cash outflow commitments of deposits and borrowings (liabilities) to prevent insolvency.", "trap": "Pamiętaj, że w bankowości aktywa (assets) to udzielone kredyty, a pasywa (liabilities) to depozyty klientów. 'To match assets with liabilities' to zapobieganie sytuacji, w której deponenci żądają wypłaty, a bank ma zamrożony kapitał w 20-letnich kredytach.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1104, "en": "expressed as a percentage", "pl": "wyrażony w procentach / w ujęciu procentowym (o stopach i rentowności)", "def": "Stated or quantified as a proportion of one hundred, as is standard for interest rates, yields, and margins.", "trap": "Poprawna akademicka fraza to 'expressed AS a percentage' (błędem gramatycznym jest *expressed in percents*!).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1105, "en": "to honour a cheque", "pl": "zrealizować / uhonorować czek (wypłacić środki na jego podstawie)", "def": "For a drawee bank to accept and pay out the face value of a validly presented check against the drawer's sufficient funds or guarantee card limit.", "trap": "Pisownia: UK to 'honour a cheque', US to 'honor a check'. Przeciwieństwo: 'to dishonour a cheque' lub potocznie 'the cheque bounced'.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1106, "en": "cheque guarantee card", "pl": "karta gwarancyjna do czeków (potwierdzenie wypłacalności wystawcy)", "def": "A plastic card formerly issued by British banks guaranteeing payment of cheques up to a specified monetary limit, even if the customer's account is overdrawn.", "trap": "Termin brytyjski (UK banking history). Zabezpieczał sprzedawcę przed ryzykiem braku pokrycia na koncie wystawcy.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1107, "en": "to stop a cheque / to stop payment", "pl": "zastrzec / wstrzymać realizację czeku (zablokować płatność)", "def": "To instruct one's bank not to honour or pay a specific check that has been lost, stolen, or issued by mistake.", "trap": "UK: 'to stop a cheque'; US: 'to stop payment on a check'. Nie mówimy *block a cheque* ani *cancel a cheque* w relacji z bankiem, lecz 'to STOP a cheque'.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1108, "en": "to repay the principal", "pl": "spłacić kwotę główną / kapitał kredytu (bez narosłych odsetek)", "def": "To return the original borrowed capital sum to the lender, distinguishing this base amount from the accrued interest and bank fees.", "trap": "UWAGA NA FALSE FRIEND I HOMOFON: 'principal' (przez -al) = kwota główna długu / kapitał / dyrektor szkoły; 'principle' (przez -le) = zasada / reguła etyczna!", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1109, "en": "to roll over a loan / debt rollover", "pl": "zrolować kredyt / odroczyć spłatę kapitału (zastąpić nowym kredytem w terminie zapadalności)", "def": "To renew, refinance, or extend the maturity date of an existing loan at maturity instead of requiring the borrower to liquidate the principal.", "trap": "Rolowanie długu ('rolling over debt') to powszechna praktyka korporacji i państw. Jeśli rynki zamarzną i nikt nie chce zrolować długu, powstaje 'rollover risk'.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1110, "en": "to cash a cheque", "pl": "zrealizować czek na gotówkę / wymienić czek na pieniądze w okienku", "def": "To exchange a valid bank check for physical banknotes and coins at a bank teller counter or designated financial outlet.", "trap": "Kolokacja czasownikowa: 'to CASH a cheque' (zrealizować na gotówkę) vs 'to deposit a cheque' (wpłacić czek na rachunek).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1111, "en": "lender of last resort", "pl": "pożyczkodawca ostatniej instancji (kluczowa funkcja banku centralnego)", "def": "An apex monetary institution (typically the central bank) that provides liquidity to sound financial institutions facing acute panic or funding shortages when no other commercial lender will.", "trap": "Fraza kluczowa na każdym egzaminie z bankowości: bank centralny jako 'lender of last resort' (pożyczkodawca ostatniej szansy/instancji). Wymaga przedimka lub 'act as lender of last resort'.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1112, "en": "to bail someone out / bailout", "pl": "uratować przed bankructwem / dofinansować z pakietu ratunkowego", "def": "To rescue an enterprise, financial institution, or government from imminent insolvency by providing emergency loans, subsidies, or equity capital.", "trap": "Phrasal verb: 'to bail out' (ratować finansowo). Rzeczownik: 'a bailout' (pakiet ratunkowy). Przeciwieństwo: 'bail-in' (pokrycie strat przez akcjonariuszy i deponentów banku).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1113, "en": "to go bust", "pl": "splajtować / zbankrutować / ulec likwidacji (o firmie)", "def": "To run out of capital, become hopelessly insolvent, and cease trading due to an inability to service outstanding obligations.", "trap": "Kolokwialne, ale powszechnie stosowane w brytyjskim Business English: 'to go bust' = to go bankrupt / to fail / to become insolvent.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1114, "en": "to reimburse extra charges / costs", "pl": "zwrócić niesłusznie pobrane opłaty / zrefundować koszty", "def": "To pay back an amount of money that a customer or employee has spent or had erroneously deducted by an institution.", "trap": "Pisownia: reimburse (przez -ei-). Rzeczownik: 'reimbursement'. Nie mylić z 'refund' (zwrot za zwrócony towar w sklepie) : w banku za pobrane opłaty stosuje się 'to reimburse'.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1115, "en": "to write off a bad debt / debt write-off", "pl": "spisać na straty / umorzyć nieściągalny dług (dokonać odpisu)", "def": "To officially acknowledge in accounting that an outstanding loan or debt is uncollectible and cancel it from the balance sheet as an irrecoverable loss.", "trap": "Phrasal verb rozdzielny: 'to write it off' / 'write off a debt'. Rzeczownik: 'a write-off' (spisanie w straty). W bilansie powoduje bezpośrednie uderzenie w zysk banku.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1116, "en": "to reschedule a debt / debt rescheduling", "pl": "zrestrukturyzować harmonogram spłat długu / odroczyć terminy płatności", "def": "To renegotiate the terms of a loan agreement, typically by extending the repayment horizon or lowering installments, to enable a struggling debtor to avoid outright default.", "trap": "Rescheduling = zmiana TERMINÓW spłaty (wydłużenie). Write-off = CAŁKOWITE UMORZENIE części lub całości długu.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1117, "en": "to settle inter-bank debts / inter-bank clearing", "pl": "rozliczać rozrachunki / zobowiązania międzybankowe w izbie rozliczeniowej", "def": "To discharge, offset, and balance net liabilities between commercial financial institutions via automated clearing house (ACH) systems or real-time gross settlement (RTGS).", "trap": "'To settle' oznacza ostatecznie uregulować/zamknąć rozrachunek. Izba rozliczeniowa to 'clearing house'.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1118, "en": "to grant a loan", "pl": "udzielić pożyczki / przyznać kredyt bankowy", "def": "To formally approve and disburse credit capital to an applicant after satisfying underwriting and solvency checks.", "trap": "Elegancka oficjalna kolokacja C1: 'to GRANT a loan' (udzielić/przyznać). Potocznie: 'to give a loan'.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1119, "en": "to sever all connections / ties (with a bank)", "pl": "zerwać wszelkie relacje biznesowe / zakończyć współpracę z bankiem", "def": "A flight taken from an airport other than that from which the journey began.", "trap": "Definicja lektorki: 'a flight taken from an airport other than that from which the journey began'.", "category": "Banking, Credit & Real Estate", "source": "lekcja_handout_matching"}, {"id": 1120, "en": "to fix the minimum interest rate", "pl": "ustalać / sztywno wyznaczać minimalną stopę procentową (rola banku centralnego)", "def": "For a monetary authority or central bank to determine, peg, or officially fix the benchmark minimum lending rate (discount / base rate) for the banking system.", "trap": "W brytyjskim podręcznikowym Business English w tym zdaniu używa się FIX (3 litery: F-I-X). W żargonie finansowym mówi się również o fixingach stóp procentowych.", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1121, "en": "to service a debt / debt servicing", "pl": "obsługiwać zadłużenie (na bieżąco spłacać odsetki i wymagane raty kapitałowe)", "def": "To make required regular interest payments and contractual amortization installments on outstanding borrowings on schedule.", "trap": "'To service a debt' oznacza dokonywanie bieżących płatności odsetkowych. Różnica vs 'to repay the principal': można sprawnie obsługiwać dług (*service*), nigdy nie spłacając kwoty głównej (*principal*).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1122, "en": "let alone repay the principal", "pl": "a co dopiero spłacić kapitał (nie mówiąc o spłacie kwoty głównej)", "def": "An idiomatic phrase used after a negative statement to emphasize that an even more difficult or larger action is completely impossible.", "trap": "Wyrażenie 'let alone' = 'a co dopiero / tym bardziej nie'. Występuje zawsze po zdaniu przeczącym (np. 'unable to... let alone...').", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1123, "en": "to issue new shares or bonds", "pl": "emitować nowe akcje lub obligacje (rola banku inwestycyjnego)", "def": "To offer and distribute new equity securities or debt instruments to institutional and retail investors to raise fresh corporate capital.", "trap": "Emisją na rynku pierwotnym zajmują się banki inwestycyjne (*investment banks*), a nie banki komercyjne (*commercial banks*). Czasownik: 'to ISSUE shares/bonds'.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1124, "en": "to trade in stocks and bonds", "pl": "handlować / obracać akcjami i obligacjami na rynkach kapitałowych", "def": "To actively buy and sell corporate equity shares and fixed-income debt securities on secondary financial exchanges.", "trap": "Znowu struktura 'to trade IN': trade in stocks (akcje) and bonds (obligacje). W UK akcje nazywane są często 'shares' lub 'equities'.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1125, "en": "to owe the bank money", "pl": "być dłużnym bankowi pieniądze / zalegać z zadłużeniem", "def": "To be under a legal and contractual obligation to pay an outstanding sum of money to a lending institution.", "trap": "Czasownik: owe (/oʊ/). Konstrukcja: 'to owe [person/bank] [amount]' lub 'to owe [amount] TO [person/bank]'. Rzeczownik: debtor (dłużnik).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1126, "en": "to open a savings account", "pl": "otworzyć konto oszczędnościowe / rachunek depozytowy", "def": "To establish an interest-bearing account at a commercial bank or building society designated for holding and accumulating surplus personal or corporate funds.", "trap": "Kolokacja czasownikowa: 'to OPEN an account' (otworzyć konto). Przeciwieństwo: 'to close an account' (zamknąć konto).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1127, "en": "inter-bank clearing system", "pl": "system rozliczeń międzybankowych / izba rozrachunkowa (np. ELIXIR, BACS, CHAPS)", "def": "A financial infrastructure and network through which financial institutions exchange, offset, and settle credit transfers and inter-bank obligations.", "trap": "W Polsce odpowiednikiem jest system ELIXIR / Express ELIXIR (KIR), w UK: BACS / CHAPS, w strefie euro: TARGET2 / SEPA.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1128, "en": "flow chart", "pl": "schemat blokowy / diagram przebiegu procesu", "def": "A diagram of the sequence of movements or actions of people or things involved in a complex system or activity.", "trap": "Nie mylic z graph (wykres liniowy danych liczbowych) ani pie chart (wykres kolowy udzialow procentowych). Do pokazywania logiki i etapow procesu uzywa sie wylacznie flow chart.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1129, "en": "to get a bank loan", "pl": "wziąć / uzyskać kredyt bankowy", "def": "To borrow a fixed principal sum from a commercial banking institution under an agreement to repay it with interest over a predetermined term.", "trap": "W jezyku angielskim mowimy 'to get a bank loan' lub 'to take out a bank loan'. Zwrot *to get a bank credit* jest polonizmem i bledem jezykowym.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1130, "en": "counterfeit / counterfeit products", "pl": "podrobiony / podróbka / towary sfałszowane", "def": "Fakes or unauthorized replicas of the real product.", "trap": "Przeciwienstwa: genuine (oryginalny, prawdziwy) oraz bona fide (autentyczny, w dobrej wierze). Counterfeit oznacza nielegalna podrobke naruszajaca znak towarowy.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1131, "en": "warranty", "pl": "gwarancja (na produkt)", "def": "A written formal guarantee issued by a manufacturer or retailer pledging to repair or replace defective merchandise within a designated timeframe.", "trap": "Nie mylic z 'shelf life' (okres przydatnosci do spozycia/uzycia na polce sklepowej dla artykulow spozywczych lub kosmetykow). Warranty to formalna gwarancja techniczna.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1132, "en": "to authorise a payment", "pl": "autoryzować / formalnie zatwierdzić płatność", "def": "To give official executive sanction, signature, or clearance allowing corporate funds or disbursements to be transferred.", "trap": "Pisownia UK: authorise; US: authorize. Rzeczownik: authorization / authorisation. Nie mylic z analyse (analizowac) ani summarise (podsumowac).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1133, "en": "backlog of orders / backlog", "pl": "spiętrzenie zaległych zamówień / zaległości produkcyjne", "def": "An accumulation of uncompleted work or matters needing to be dealt with.", "trap": "Batch to pojedyncza seria/partia produkcyjna (batch of goods). Backlog to nagromadzona zaleglosc w realizacji. To backdate to antydatowac.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1134, "en": "loss-leader / loss leading", "pl": "produkt sprzedawany ze stratą (artykuł przyciągający klientów)", "def": "A high-demand commercial item sold at an unprofitable price below cost to stimulate store footfall, acquire customers, or seize market share.", "trap": "Kluczowa pulapka marketingowa C1: loss-leader to nie 'przegrany lider', lecz produkt oferowany ze strata, aby zachecic klienta do kupna innych, wysokomarzowych rzeczy w koszyku.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1135, "en": "to pay interest on finance", "pl": "płacić odsetki od pozyskanego kapitału / długu", "def": "To make regular scheduled percentage payments to lenders in exchange for the commercial utilization of debt capital or credit facilities.", "trap": "W zdanou 'on our finance' finance oznacza pozyskany kapital dluzny. Od dluu placi sie odsetki (interest), a nie podatki (tax) czy kary umowne (penalties).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1136, "en": "headquarters location", "pl": "lokalizacja / nowa siedziba firmy", "def": "The geographical place, physical premises, or site where a corporation's executive management is established.", "trap": "Leasehold to prawo dzierzawy/najmu (forma prawna wlasnosci nieruchomosci). Fizyczne miejsce/adres to location. Pamietaj: headquarters ma koncowke -s w l. pojedynczej.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1137, "en": "unanimous decision", "pl": "jednogłośna / jednomyślna decyzja", "def": "A formal resolution or verdict accepted and voted for by all participating board members or voters without a single dissenting voice.", "trap": "Wymowa: /juːˈnæn.ɪ.məs/. Summary decision to decyzja dorazna/skrotowa (bez pelnego procesu prawnego). Representative to reprezentatywny.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1138, "en": "to someone's satisfaction", "pl": "ku czyjemuś zadowoleniu / zgodnie z czyimiś oczekiwaniami", "def": "Meeting or fulfilling an individual's contractual criteria, quality standards, or expectations entirely.", "trap": "Staly zwrot formalny w korespondencji handlowej: 'to your satisfaction' (a nie *to your convenience* czy *to your entertainment*).", "category": "Contracts, Commercial Law & Governance", "source": "lekcja"}, {"id": 1139, "en": "AOB (Any Other Business)", "pl": "AOB / wolne wnioski / sprawy różne (na końcu agendy spotkania)", "def": "A heading on an agenda for a meeting, to show that any topics not listed separately can be discussed at this point, usually the end; abbreviation for 'any other business'.", "trap": "Skrot AOB oznacza 'Any Other Business' (sprawy rozne). SAE to 'Stamped Addressed Envelope' (zaadresowana koperta ze znaczkiem). CEO to 'Chief Executive Officer'.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1140, "en": "claimant / insurance claimant", "pl": "zgłaszający roszczenie / wnioskodawca o odszkodowanie / powód", "def": "A person who brings a case against another in a court of law.", "trap": "Definicja lektorki: 'a person who brings a case against another in a court of law'. W prawie brytyjskim często synonim 'claimant'. Przeciwieństwo to 'defendant'.", "category": "Finance & Corporate Law", "source": "lekcja_handout_matching"}, {"id": 1141, "en": "to streamline the management structure", "pl": "usprawnić / zoptymalizować / odchudzić strukturę zarządzania", "def": "Make (an organization or system) more efficient and effective by employing faster or simpler working methods.", "trap": "Kolokacja rzeczownikowa ze streamline to 'structure' (streamline the management structure), a nie orientation ani administration.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1142, "en": "to diversify into (financial services / new sectors)", "pl": "zdywersyfikować działalność / wejść w nowy sektor (np. usługi finansowe)", "def": "To broaden the range of commercial operations, products, or investments into unrelated sectors to reduce risk or foster growth.", "trap": "Przyimek: 'to diversify INTO something' (wejsc w nowa galeź). Globalise odnosi sie do ekspansji terytorialnej (za granice), a innovate do tworzenia innowacji.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1143, "en": "to upgrade computer systems", "pl": "zmodernizować / zaktualizować systemy komputerowe i IT", "def": "To replace or improve hardware, software, or network architecture with more advanced, modern, or capable versions.", "trap": "Renovate stosuje sie do renowacji budynkow i wnetrz (renovate an office). Construct odnosi sie do wznoszenia budowli. Dla komputerow i sieci uzywa sie to upgrade.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1144, "en": "competitive advantage", "pl": "przewaga konkurencyjna", "def": "A superior operational condition, capability, or asset that enables an enterprise to generate higher margins or outperform market rivals.", "trap": "Zelazna kolokacja akademicka: competitive advantage (przewaga konkurencyjna). Nie uzywa sie 'competitive expectancy' ani 'competitive premium'.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1145, "en": "distribution channels", "pl": "kanały dystrybucji", "def": "The established networks of intermediaries, wholesalers, and logistics routes through which finished goods travel from manufacturers to retail outlets.", "trap": "Kanal przeplywu towaru do sklepow to 'distribution channel'. Consignment to partia towaru przekazana w komis. Transaction to pojedyncza operacja handlowa.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1146, "en": "to allocate a budget", "pl": "alokować / przydzielić / rozdysponować budżet", "def": "To designate, apportion, or distribute specific monetary funds and resources to designated departments or project initiatives.", "trap": "Supervise oznacza nadzorowac ludzi lub zadania. Finance oznacza zapewnic zrodlo finansowania. Rozdysponowanie posiadanych srodkow to to allocate.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1147, "en": "to call in the receivers / receivership", "pl": "wezwać syndyka / powołać zarząd komisaryczny (w obliczu bankructwa)", "def": "To formally appoint official insolvency practitioners (receivers) to take legal control of a bankrupt corporation's assets to satisfy creditor debts.", "trap": "NAJWIEKSZA PULAPKA ZAJEC: 'to call in the receivers' oznacza wezwac syndykow / zarzadcow upadlosciowych (receivers). Auditors to rewizenci badajacy sprawozdania, a accountants to ksiegowi.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1148, "en": "brand awareness", "pl": "świadomość marki / rozpoznawalność marki wśród konsumentów", "def": "The degree of consumer recognition and knowledge regarding a specific brand, its logo, and its product portfolio.", "trap": "Rozpoznawalnosc marki to brand awareness. Brand reputation to opinia/reputacja. Brand feedback to opinie zwrotne klientow.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1149, "en": "to put in a tender / tender", "pl": "złożyć ofertę przetargową / przystąpić do przetargu", "def": "To submit a formal competitive bid specifying execution costs and terms in response to an invitation to deliver commercial construction or supply contracts.", "trap": "Kolokacja czasownikowa: 'to put in a tender' (zlozyc oferte przetargowa). Grant to bezzwrotna dotacja finansowa. Statement to oswiadczenie lub wyciag.", "category": "Contracts, Commercial Law & Governance", "source": "lekcja"}, {"id": 1150, "en": "high-interest deposit account", "pl": "wysoko oprocentowane konto depozytowe / rachunek lokacyjny", "def": "A bank account that earns attractive compound interest rates on deposited customer funds in return for designated holding periods or notice restrictions.", "trap": "Konto depozytowe / oszczednosciowe to deposit account (od deposit = depozyt, lokata). Deficit to deficyt handlowy/budzetowy. Debit to obciazenie rachunku.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1151, "en": "to establish good relationships", "pl": "nawiązywać i budować dobre relacje z klientami", "def": "To actively build, cultivate, and maintain trust-based, collaborative partnerships with customers or stakeholders over time.", "trap": "Kolokacja dla relacji biznesowych to 'to establish relationships' (budowac/nawiazywac relacje). Czasownik to launch stosuje sie do premier produktow (launch a product).", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1152, "en": "outstanding credit", "pl": "niespłacony / pozostający do spłaty kredyt lub zadłużenie", "def": "The remaining balance of borrowed funds, loans, or credit facilities that has yet to be settled or liquidated by a debtor.", "trap": "W bankowosci i rachunkowosci 'outstanding' oznacza NIEURECHOWANY / POZOSTAJACY DO SPLATY. Overdrawn odnosi sie do przekroczonego stanu konta (overdrawn account).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1153, "en": "pie chart", "pl": "wykres kołowy (pokazujący udziały procentowe)", "def": "A circular statistical graphic divided into proportional slices to illustrate numerical proportions, percentages, or market shares.", "trap": "Wykres kolowy (pie chart) sluzy do proporcji i procentow. Nie uzywa sie go do modelowania procesow (do tego sluzy flow chart) ani do trendow czasowych (line graph).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1154, "en": "line graph / graph", "pl": "wykres liniowy / wykres danych liczbowych w czasie", "def": "A visual diagram showing how continuous numerical variables or financial metrics change over specified time intervals.", "trap": "Graph ilustruje dane liczbowe i trendy w czasie. Schemat procesu to flow chart.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1155, "en": "genuine", "pl": "autentyczny / oryginalny / niepodrobiony", "def": "Authentic, original, and produced by the legitimate trademark holder, not counterfeit, forged, or fake.", "trap": "Przeciwienstwo counterfeit (podrobiony/falszywy). Synonim: authentic, bona fide.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1156, "en": "bona fide", "pl": "działający w dobrej wierze / autentyczny / rzetelny", "def": "Undertaken in good faith without intent to deceive or defraud; authentic, legitimate, and sincere in legal commercial dealings.", "trap": "Zwrot lacinski czesto pojawiajacy sie w testach biznesowych C1. Oznacza 'w dobrej wierze' (acting in good faith) lub 'autentyczny/legalny'.", "category": "Contracts, Commercial Law & Governance", "source": "lekcja"}, {"id": 1157, "en": "shelf life", "pl": "okres przydatności do spożycia / okres trwałości na półce sklepowej", "def": "The length of time for which an item remains usable, fit for consumption, or saleable.", "trap": "Pulapka z testu: shelf life odnosi sie do zywotnosci towarow zbywalnych na polce (towary szybko psujace sie). Dla urzadzen technicznych gwarancja to warranty!", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1158, "en": "to backdate / backdating", "pl": "antydatować (opatrzyć wcześniejszą datą umowę lub dokument)", "def": "Put an earlier date to (a document) than the actual one or make (something, especially a pay increase) retrospectively valid.", "trap": "Nie mylic z backlog (spietrzenie zaleglych zamowien). Backdate oznacza wpisanie przeszlej daty na dokumencie.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1159, "en": "batch / batch of goods", "pl": "partia towaru / seria produkcyjna", "def": "Goods to be bought and sold.", "trap": "Definicja lektorki: 'goods to be bought and sold'. 'Merchandise' jest rzeczownikiem niepoliczalnym w tym znaczeniu.", "category": "Commerce & Supply Chain", "source": "lekcja_handout_matching"}, {"id": 1160, "en": "trademark / registered trademark", "pl": "znak towarowy / zastrzeżony znak handlowy", "def": "A symbol, word, or words legally registered or established by use as representing a company or product.", "trap": "Definicja lektorki: 'a symbol, word, or words legally registered or established by use as representing a company or product'. Nie mylić ze 'slogan' ani 'brand name'.", "category": "Contracts, Commercial Law & Governance", "source": "lekcja_handout_matching"}, {"id": 1161, "en": "concession / commercial concession", "pl": "ustępstwo negocjacyjne / koncesja handlowa", "def": "Something granted, yielded, or compromised during tense negotiations in order to reach an accord; or a commercial operating franchise grant.", "trap": "W negocjacjach: to make a concession = pojsc na ustepstwo. Produkt sprzedawany celowo ponizej kosztow to loss-leader.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1162, "en": "penalty clause / penalties", "pl": "kary umowne / odsetki karne za niedotrzymanie warunków umowy", "def": "A contractual provision stipulating a predetermined financial penalty payable by a party that breaches or delays performance obligations.", "trap": "Penalties to kary za naruszenie umowy/opoznienie. Od pozyskanego kapitalu dluznego placi sie interest (odsetki).", "category": "Contracts, Commercial Law & Governance", "source": "lekcja"}, {"id": 1163, "en": "leasehold", "pl": "prawo dzierżawy / najem długoterminowy nieruchomości", "def": "The legal ownership right to occupy and utilize land or commercial property for a fixed period under a lease contract with the freeholder.", "trap": "Leasehold to forma prawna tytulu do nieruchomosci (dzierzawa/najem). Fizyczne przeniesienie siedziby to moving to a new location.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1164, "en": "summary dismissal / summary", "pl": "zwolnienie dyscyplinarne / doraźne / natychmiastowe bez wypowiedzenia", "def": "The immediate termination of an employment contract by management without statutory notice due to gross misconduct.", "trap": "Summary jako przymiotnik oznacza dorazny, skrotowy, natychmiastowy (summary dismissal). Jednoglosna decyzja to unanimous decision!", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1165, "en": "business entertainment / entertainment expenses", "pl": "koszty reprezentacji / podejmowanie klientów i gości biznesowych", "def": "Hospitality provided by a firm to clients, partners, or suppliers, such as meals, corporate boxes, or formal events to foster rapport.", "trap": "W formalnych listach zwrot to 'to your satisfaction' (zgodnie z oczekiwaniami), a nie *to your entertainment*.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1166, "en": "at your earliest convenience", "pl": "w najdogodniejszym / najbliższym możliwym terminie", "def": "A polite business correspondence idiom requesting prompt action or a reply as soon as the recipient has available time.", "trap": "Zwrot uprzejmosciowy w korespondencji: 'at your earliest convenience' (w dogodnym terminie). W zdaniu o warunkach umowy uzywa sie: 'terms are to your satisfaction'.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1167, "en": "SAE (Stamped Addressed Envelope)", "pl": "SAE / zaadresowana koperta zwrotna ze znaczkiem pocztowym", "def": "An envelope that you send someone with your own name and address on it, so that they can send you something in the mail.", "trap": "SAE to termin pocztowy (koperta zwrotna). Wolne wnioski na koncu agendy spotkania to AOB (Any Other Business)!", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1168, "en": "end user", "pl": "użytkownik końcowy (produktu lub oprogramowania)", "def": "The ultimate person or consumer who actually utilizes or operates a product or software application, as opposed to resellers or developers.", "trap": "End user to ostateczny konsument/uzytkownik. W ubezpieczeniach osoba zglaszajaca roszczenie o odszkodowanie to claimant!", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1169, "en": "insurance broker / broker", "pl": "pośrednik ubezpieczeniowy / makler / broker", "def": "An independent financial professional who represents consumers or businesses in arranging and purchasing insurance policies from underwriters.", "trap": "Broker to posrednik aranzujacy polise. Osoba poszkodowana zglaszajaca szkode do wyplaty to claimant!", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1170, "en": "job orientation / employee induction", "pl": "szkolenie wstępne / proces wdrożenia nowego pracownika (onboarding)", "def": "The structured introduction process through which newly appointed employees are familiarized with company policies, culture, and team tools.", "trap": "Orientation to onboarding i wdrozenie pracownika. Struktura zarzadzania redukujaca koszty to management structure.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1171, "en": "to globalise / globalisation", "pl": "umiędzynarodowić działalność / wyjść na rynki globalne", "def": "To expand commercial sales, supply chains, and corporate operations into multiple foreign sovereign territories and continents.", "trap": "Globalise odnosi sie do ekspansji terytorialnej (na caly swiat). Wejscie w inna galeź uslug/produktow to to diversify into!", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1172, "en": "to renovate (offices / buildings)", "pl": "wyremontować / odnowić budynek lub pomieszczenia biurowe", "def": "To restore, redecorate, and modernize an existing physical building, office suite, or architectural facility to good condition.", "trap": "Renovate uzywa sie wylacznie do budynkow, wnetrz i nieruchomosci. W przypadku systemow komputerowych i IT stosuje sie wylacznie to upgrade!", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1173, "en": "life expectancy", "pl": "oczekiwana długość życia (statystyka demograficzna / ubezpieczeniowa)", "def": "The statistically calculated average lifespan an individual or population cohort is expected to live based on demographic morbidity data.", "trap": "Life expectancy to wskaznik demograficzny w ubezpieczeniach. Cecha dajaca przewage nad konkurentami to competitive advantage.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1174, "en": "insurance premium / premium", "pl": "składka ubezpieczeniowa / opłata za polisę", "def": "The periodic fee paid by an insured policyholder to an insurance company in exchange for guaranteed risk coverage against designated losses.", "trap": "Premium to skladka ubezpieczeniowa lub marka premium. W strategii rynkowej mowi sie o competitive advantage.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1175, "en": "consignment / goods on consignment", "pl": "sprzedaż komisowa / partia towaru w komis / przesyłka towarowa", "def": "An arrangement where goods are placed into the care of an agent or retail vendor who retains them until sold, paying the owner only upon sale.", "trap": "Kanal dostarczania towaru do sklepow to distribution channel. Consignment oznacza towar oddany w komis.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1176, "en": "to supervise", "pl": "nadzorować / sprawować bezpośredni nadzór nad pracownikami", "def": "To observe, direct, and oversee the execution of professional tasks by subordinates or apprentices to ensure quality and compliance.", "trap": "Supervise to nadzorowanie ludzi lub prac. Przydzielanie ograniczonego budzetu to to allocate a budget.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1177, "en": "auditors / statutory auditors", "pl": "biegli rewidenci / audytorzy zewnętrzni", "def": "Independent certified public accountants appointed to scrutinize, verify, and validate the accuracy and fairness of a corporation's balance sheets.", "trap": "Auditors badaja sprawozdania finansowe i bilans firmy. W przypadku bankructwa i likwidacji majatku powoluje sie syndykow (receivers)!", "category": "Accounting, Audit & Reporting", "source": "lekcja"}, {"id": 1178, "en": "chartered accountants / accountants", "pl": "biegli księgowi / księgowi dyplomowani", "def": "Qualified financial professionals who maintain company ledgers, compile tax filings, prepare payroll, and produce quarterly management accounts.", "trap": "Accountants prowadza biezaca rachunkowosc i ksiegi. Gdy firma plajtuje, wzywa sie syndyka (called in the receivers).", "category": "Accounting, Audit & Reporting", "source": "lekcja"}, {"id": 1179, "en": "customer feedback", "pl": "opinie klientów / informacja zwrotna od odbiorców", "def": "Information, evaluations, and reactions provided by buyers concerning their satisfaction with a firm's merchandise and support.", "trap": "Feedback to opinia zwrotna. Kampanie reklamowe w mediach spolecznosciowych zwiekszaja swiadomosc i rozpoznawalnosc marki: brand awareness!", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1180, "en": "corporate reputation", "pl": "reputacja przedsiębiorstwa / dobre imię spółki na rynku", "def": "The collective ethical, operational, and commercial standing that an enterprise holds in the estimation of public stakeholders over time.", "trap": "Reputation to jakosciowa ocena dobrego imienia firmy. Podstawowym celem kampanii w social media jest zasieg i znajomosc marki: brand awareness.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1181, "en": "government grant / grant", "pl": "bezzwrotna dotacja rządowa / subwencja celowa", "def": "A direct financial award of public sovereign funds conferred to an enterprise or research institute for a designated public project without repayment.", "trap": "Grant to bezzwrotna dotacja panstwowa. Oferta skladana przez wykonawce w postepowaniu przetargowym to tender (to put in a tender)!", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1182, "en": "bank statement", "pl": "wyciąg bankowy / zestawienie operacji na rachunku", "def": "A formal periodic printed or electronic summary dispatched by a bank documenting all credits, debits, and end-of-month balances on an account.", "trap": "Bank statement to wyciag z konta. W przetargu na budowe wykonawca sklada oferte przetargowa: tender (to put in a tender).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1183, "en": "budget deficit", "pl": "deficyt budżetowy (nadwyżka wydatków nad dochodami)", "def": "A macroeconomic condition occurring when an administration or corporate entity's aggregate expenditures exceed accrued fiscal revenues in a year.", "trap": "Deficit to deficyt finansowy. Oprocentowany rachunek bankowy na oszczednosci to deposit account!", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1184, "en": "debit balance / to debit an account", "pl": "saldo debetowe / obciążenie rachunku kwotą transakcji", "def": "An accounting entry recording an expense or asset reduction; or an account state where withdrawals exceed deposits.", "trap": "Debit to obciazenie konta lub platnosc karta debetowa. Rachunek lokacyjny na oszczednosci to deposit account.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1185, "en": "to launch a product / product launch", "pl": "wprowadzić produkt na rynek / rynkowa premiera handlowa", "def": "To debut and release a newly manufactured commercial product into the consumer marketplace through coordinated marketing campaigns.", "trap": "Launch stosuje sie do wprowadzania produktow na rynek (launch a product). W przypadku relacji z klientami poprawna kolokacja to to establish relationships!", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1186, "en": "to negotiate terms", "pl": "negocjować warunki handlowe lub umowne", "def": "To confer, bargain, and reach mutually agreeable contractual covenants, pricing, and deadlines between transacting business parties.", "trap": "To negotiate terms dotyczy warunkow umowy/cen. Kolokacja dla pielegnowania wiezi z klientami to to establish good relationships.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1187, "en": "pending / pending approval", "pl": "oczekujący na rozpatrzenie / nierozstrzygnięty / w toku decyzji", "def": "Awaiting a formal decision, judicial settlement, or managerial authorization; not yet concluded or resolved.", "trap": "Pending oznacza zawieszony / w toku oczekiwania na zgode. Dlug lub kredyt pozostajacy do splaty to outstanding credit!", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1188, "en": "overdrawn account / to be overdrawn", "pl": "konto na debecie / przekroczony stan rachunku bankowego", "def": "A banking condition wherein an account holder has withdrawn funds exceeding available balance, triggering overdraft penalty interest.", "trap": "Overdrawn opisuje stan konta na minusie (the account is overdrawn). O samej kwocie niesplaconego dlugu lub kredytu mowi sie outstanding credit / balance!", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1189, "en": "ethical policies / corporate ethics", "pl": "zasady etyczne / polityka etyczna przedsiębiorstwa (np. zakaz pracy dzieci)", "def": "Formal corporate guidelines and standards requiring operational integrity, human rights protections, and fair labour practices across the supply chain.", "trap": "Kolokacja z policies to 'ethical' (ethical policies). Ideals oznacza ogolne idealy zyciowe, a brand to marka handlowa.", "category": "ESG, Sustainability & Corporate Ethics", "source": "lekcja"}, {"id": 1190, "en": "infrastructure / transport infrastructure", "pl": "infrastruktura (drogi, lotniska, sieci telekomunikacyjne)", "def": "The fundamental physical and organizational structures and facilities (roads, bridges, power grids, airports) needed for the operation of an economy.", "trap": "Capacity oznacza przepustowosc lub pojemnosc fabryki. Commuting to dojazdy pracownikow do pracy. Siec drog i lotnisk to wylacznie infrastructure.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1191, "en": "commuting / commuter", "pl": "dojazdy do pracy / czas dojazdu pracowników do biura", "def": "The regular daily journey made by employees traveling between their place of residence and their workplace.", "trap": "Commuting dotyczy codziennych podrozy pracownikow dom-praca. Siec drogowa jako calosc to infrastructure.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1192, "en": "cost-effective", "pl": "efektywny kosztowo / dający optymalne rezultaty w relacji do poniesionych kosztów", "def": "Productive in relation to its cost, profitable.", "trap": "Sophisticated oznacza zaawansowany/skomplikowany technicznie. State-of-the-art oznacza najnowoczesniejszy na swiecie (zwykle bardzo drogi). Przy skromnym budzecie wybiera sie plan cost-effective!", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1193, "en": "state-of-the-art", "pl": "najnowocześniejszy / ultranowoczesny (na najwyższym światowym poziomie technicznym)", "def": "Belonging or relating to the most recent stage of technological development; having or using the latest techniques or equipment.", "trap": "Pisownia z myslnikami przed rzeczownikiem: state-of-the-art equipment. Oznacza najwyzsza polke technologiczna (jest przeciwienstwem taniego rozwiazania cost-effective). Rzeczownik MACHINERY jest NIEPOLICZALNY: mówimy *our machinery is*, nigdy *machineries are*!", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1194, "en": "track record", "pl": "dotychczasowe osiągnięcia / udokumentowana historia sukcesów zawodowych lub biznesowych", "def": "The documented past achievements, historical performance, and proven successes of an enterprise or professional.", "trap": "Kolokacja C1: 'to have a good track record OF doing something'. Analysis to analiza danych, a assessment to wycena/oszacowanie.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1195, "en": "advertising slogans / slogan", "pl": "slogany reklamowe / chwytliwe hasła promocyjne", "def": "Memorable and distinctive catchphrases utilized in marketing campaigns to capture consumer attention and communicate brand identity.", "trap": "Slogany w reklamach to advertising slogans. Values to wartosci korporacyjne, a ethics to zasady etyczne.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 1196, "en": "to satisfy demand / to meet demand", "pl": "zaspokoić popyt / sprostać zapotrzebowaniu rynkowemu", "def": "To supply a sufficient volume of products or services to fully match total consumer market purchasing requests.", "trap": "Kolokacja akademicka: to satisfy demand lub to meet demand. Nie mowimy *to produce demand* (bo producenci nie wytwarzaja popytu, tylko towary). Czasownik to cater wymaga przyimka: cater FOR/TO.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1197, "en": "lack of adequate supervision", "pl": "brak odpowiedniego nadzoru / brak opieki nad pracownikiem", "def": "An operational deficiency where apprentices or subordinates are left without proper managerial guidance, oversight, or safety control.", "trap": "Brainstorming to sesja generowania pomyslow (burza mozgow). Kontrola procedur to control. Bezposredni nadzor nad praca ludzi to supervision.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1198, "en": "import tariff / tariff", "pl": "cło importowe / taryfa celna na towary z zagranicy", "def": "A sovereign tax or fiscal duty imposed by a government on imported foreign merchandise to protect domestic manufacturers or generate revenue.", "trap": "Tariff to clo nakladane na granicy na towary importowane. Bonus to premia pracownicza. Price to cena detaliczna.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1199, "en": "haulage firm / road haulage", "pl": "firma transportowa / spedycja ciężka / przedsiębiorstwo przewozów towarowych", "def": "The commercial transport of goods.", "trap": "Ciezki sprzet i maszyny przemyslowe przewozi haulage firm. Kurier (courier) dorecza przesylki paczkowe i dokumenty. Public transport to transport publiczny pasazerski.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1200, "en": "courier / courier service", "pl": "firma kurierska / kurier doręczający przesyłki", "def": "A logistics enterprise or messenger service providing door-to-door, high-speed delivery of parcels, packages, and legal documents.", "trap": "Kurier przewozi drobne przesylki i listy. Do przewozu ciezarowek i ciezkich maszyn uzywa sie firmy spedycyjnej: haulage firm.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1201, "en": "inflation rate / inflation", "pl": "stopa inflacji / wskaźnik wzrostu cen towarów i usług", "def": "The annualized percentage increase in the aggregate price level of consumer goods and services within an economy over time.", "trap": "Gdy ceny nie rosna ('prices haven't increased'), mowa o inflacji (inflation). Income tax to podatek dochodowy, a depreciation to amortyzacja/utrata wartosci.", "category": "Macroeconomics & Monetary Policy", "source": "lekcja"}, {"id": 1202, "en": "to discontinue a product", "pl": "wycofać produkt z produkcji i sprzedaży (z powodu spadku popytu lub starości technologicznej)", "def": "To permanently cease the fabrication, distribution, and commercial retail sale of an obsolete or unprofitable product line.", "trap": "KORONNA PULAPKA EGZAMINACYJNA: To discontinue a product = wycofac z oferty z powodow komercyjnych (spadek sprzedazy). To recall a product = wycofac z rynku z powodu wady fabrycznej lub zagrozenia zycia!", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1203, "en": "product recall / to recall a product", "pl": "wycofanie wadliwego produktu z rynku / akcja serwisowa (ze względów bezpieczeństwa)", "def": "A mandatory request by a manufacturer or regulator to return merchandise due to discovered safety defects or hazardous component flaws.", "trap": "Recall = wycofanie wady grozacej bezpieczenstwu. Wycofanie z powodu spadku popytu to to discontinue a product.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 1204, "en": "travel expenses / to claim back expenses", "pl": "koszty podróży służbowej / zwrot wydatków z delegacji", "def": "Monetary costs incurred by employees during official corporate business travel (lodging, flights, meals) eligible for corporate reimbursement.", "trap": "Wydatki pracownika z wyjazdu sluzbowego to travel expenses. Overheads to koszty stale prowadzenia biura (czynsz, prad). Investments to dlugoterminowe inwestycje kapitalowe.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1205, "en": "overheads / operational overheads", "pl": "koszty ogólne zarządu / stałe koszty operacyjne (czynsz, media, ubezpieczenia)", "def": "The regular and necessary costs, such as rent and heating, that are involved in operating a business.", "trap": "Overheads to stale koszty biezace firmy (nie zalezne bezposrednio od wolumenu). Koszty podrozy pracownikow to travel expenses.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 1206, "en": "point of view", "pl": "punkt widzenia / stanowisko w dyskusji lub negocjacjach", "def": "A particular perspective, cognitive stance, or subjective attitude regarding a commercial proposition or issue.", "trap": "Staly idiom w jezyku angielskim: 'point of view' (nie mowimy *type of view* ani *angle of view* w tym znaczeniu).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1207, "en": "to take out a patent / patent", "pl": "uzyskać / zarejestrować patent na wynalazek lub wzór przemysłowy", "def": "To officially secure an exclusive legal right granted by a sovereign patent office prohibiting rivals from fabricating or copying an invention.", "trap": "Kolokacja: 'to take out a patent' (uzyskac patent). Warranty to gwarancja na naprawy dla konsumenta. Deed to akt notarialny wlasnosci nieruchomosci.", "category": "Contracts, Commercial Law & Governance", "source": "lekcja"}, {"id": 1208, "en": "title deed / deed", "pl": "akt notarialny / dokument poświadczający tytuł prawny do własności", "def": "A formal legal document signed and delivered regarding the transfer or confirmation of ownership of real property or real estate.", "trap": "Deed to akt notarialny tytulu wlasnosci (np. deed of sale). Ochrona wzoru przemyslowego przed kopiowaniem to patent.", "category": "Contracts, Commercial Law & Governance", "source": "lekcja"}, {"id": 1209, "en": "substantial investment", "pl": "pokaźna / znaczna inwestycja kapitałowa (o dużej skali finansowej)", "def": "A very large, significant, and capital-intensive allocation of financial resources into real assets or productive capacity.", "trap": "Sensible oznacza rozsadny/rozsadna (nie spowodowalaby powaznych problemow). Suitable oznacza odpowiedni. Bardzo duza, znaczaca skala to substantial.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1210, "en": "start-up / start-up companies", "pl": "start-up / nowo powstałe przedsiębiorstwo technologiczne", "def": "A newly emerged entrepreneurial venture engineered to develop a scalable business model in conditions of high uncertainty.", "trap": "Przeciwienstwo: established companies (firmy o ugruntowanej pozycji rynkowej). Preliminary oznacza wstepny (np. preliminary results).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1211, "en": "line manager", "pl": "bezpośredni przełożony (w linii raportowania)", "def": "The person with direct managerial responsibility for overseeing, assigning tasks to, and conducting performance reviews for an employee.", "trap": "Pracownik raportuje do swojego direct line managera. Chief executive (CEO) zarzadza cala korporacja. Executive assistant to asystent zarzadu.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 1212, "en": "conference delegates / delegate", "pl": "delegaci na konferencję / oficjalni uczestnicy zjazdu biznesowego", "def": "Elected, appointed, or registered representatives dispatched to attend and vote at an official business congress, convention, or summit.", "trap": "Uczestnicy oficjalnej konferencji zjazdu to delegates. Members to czlonkowie organizacji, a guests to zwykli goscie hotelowi.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 1213, "en": "personal assistant / assistant", "pl": "asystent(ka) / asystent osobisty (zarządzający kalendarzem i korespondencją)", "def": "Abb
