ekcja"}, {"id": 199, "en": "golden handshake / golden parachute", "pl": "zloty spadochron / gigantyczna odprawa dla czlonka zarzadu", "def": "A very lucrative contractual package of financial severance and stock options guaranteed to an executive if they lose their position.", "trap": "Czesto budzi ogromne oburzenie akcjonariuszy, gdy wyplaca sie go prezesowi, ktory doprowadzil firme do kryzysu.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 200, "en": "whistleblower / whistleblowing", "pl": "sygnalista / ujawnianie nieprawidlowosci i korupcji w firmie", "def": "An employee or insider who exposes confidential misconduct, illegality, corruption, or fraud within an organization to authorities or the public.", "trap": "W prawie UE i miedzynarodowym sygnalisci maja specjalna ochrone prawna przed zwolnieniem.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 201, "en": "glass ceiling", "pl": "szklany sufit (niewidzialna bariera awansu zawodowego)", "def": "An unacknowledged, discriminatory barrier that prevents women or minority groups from rising to senior executive leadership roles.", "trap": "Metafora socjologiczna czesto wystepujaca na testach jezykowych C1 w sekcjach Human Resources.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 202, "en": "headhunter / executive search", "pl": "lowca glow / rekrutacja bezposrednia top menedzerow (headhunting)", "def": "A specialized recruitment consultant hired by enterprises to identify, approach, and recruit high-caliber executives from competing firms.", "trap": "Headhunter rekrutuje pasywnych kandydatow (ludzi, ktorzy maja prace i nie szukaja aktywnie ogloszen).", "category": "HR & Workplace", "source": "lekcja"}, {"id": 203, "en": "performance appraisal", "pl": "okresowa ocena pracownika / roczny przeglad wynikow", "def": "Assess the performance of (an employee) formally.", "trap": "Definicja lektorki: 'assess the performance of (an employee) formally'. Nie mylić z 'apprise' (poinformować kogoś).", "category": "HR & Workplace", "source": "lekcja_handout_matching"}, {"id": 204, "en": "outsourcing vs offshoring", "pl": "outsourcing (zlecenie firmie zewnetrznej) vs offshoring (przeniesienie dzialu do tanszego kraju)", "def": "Outsourcing is contracting work to a third-party vendor; offshoring is relocating internal business processes to a foreign jurisdiction.", "trap": "Moze byc outsourcing lokalny (w tym samym miescie) lub offshore outsourcing (zewnetrzna firma w Indiach).", "category": "HR & Workplace", "source": "lekcja"}, {"id": 205, "en": "unique selling proposition (USP)", "pl": "unikalna cecha oferty / unikalna propozycja sprzedazy (USP)", "def": "The distinct feature or benefit that sets a product or service apart from all competitor offerings in the market.", "trap": "Odpowiedz na pytanie klienta: dlaczego mam kupic wlasnie od Ciebie, a nie od konkurencji?", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 206, "en": "price skimming", "pl": "strategia zbierania smietanki (poczatkowo wysoka cena dla entuzjastow)", "def": "A pricing strategy where an enterprise sets a high premium introductory price for an innovative product before gradually reducing it over time.", "trap": "Przeciwienstwo do penetration pricing (poczatkowo niska cena, by szybko zdobyc rynek).", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 207, "en": "penetration pricing", "pl": "strategia cen penetracyjnych (niska cena poczatkowa dla zdobycia rynku)", "def": "A pricing strategy of offering an artificially low introductory price to attract massive customer volume and capture substantial market share.", "trap": "Czesto wiaze sie z chwilowa strata, by wykosic konkurencje z rynku.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 208, "en": "loss leader", "pl": "produkt sprzedawany ponizej kosztow dla przyciagniecia klientow do sklepu", "def": "A product sold at a loss to attract customers.", "trap": "Definicja lektorki: 'a product sold at a loss to attract customers'. Zawsze wiąże się ze świadomą sprzedażą poniżej kosztów produkcji/nabycia.", "category": "Marketing & Advertising", "source": "lekcja_handout_matching"}, {"id": 209, "en": "core competencies", "pl": "kluczowe kompetencje / glowne przewagi konkurencyjne firmy", "def": "The fundamental strengths, technical skills, and specialized capabilities that provide an enterprise with a sustainable competitive advantage.", "trap": "To rzeczy, w ktorych firma jest wybitna i ktore sa trudne do skopiowania przez rywali.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 210, "en": "legal tender", "pl": "prawny srodek platniczy (oficjalna waluta, ktora wierzyciel musi przyjac)", "def": "An offer to carry out work, supply goods, or buy land, shares, or another asset at a stated fixed price.", "trap": "Banknoty o wysokim nominale nie zawsze musza byc przyjmowane w malych sklepach, mimo ze sa legal tender.", "category": "Money & Currency", "source": "lekcja"}, {"id": 211, "en": "petty cash", "pl": "kasa podreczna / pogotowie kasowe (drobne wydatki w biurze)", "def": "A small accessible fund of physical cash kept on company premises for paying minor, unexpected office expenses.", "trap": "Rozliczane na podstawie paragonow (petty cash vouchers) do okreslonego limitu.", "category": "Money & Currency", "source": "lekcja"}, {"id": 212, "en": "counterfeit money", "pl": "falszywe pieniadze / falszywki", "def": "Imitation currency produced without the legal sanction of the state or government, intending to deceive.", "trap": "Rzeczownik/czasownik: to counterfeit (falszowac); forger to falszerz dokumentow/pieniedzy.", "category": "Money & Currency", "source": "lekcja"}, {"id": 213, "en": "grant", "pl": "grant / bezzwrotna dotacja celowa (np. na badania, nauke, rozwoj)", "def": "A quantity of money awarded by the state, university, or foundation for a specific purpose without repayment required.", "trap": "Roznica z loan: grant jest bezzwrotny (nie musisz oddawac), o ile zrealizujesz cel.", "category": "Money & Currency", "source": "lekcja"}, {"id": 214, "en": "allowance", "pl": "kieszonkowe / dodatek na wydatki / dieta", "def": "An amount of money given regularly for personal expenses, or an official tax-free allowance.", "trap": "W podatkach: personal allowance = kwota wolna od podatku.", "category": "Money & Currency", "source": "lekcja"}, {"id": 215, "en": "windfall", "pl": "nieoczekiwany zysk / nagly przyplyw duzej gotowki", "def": "A large, sudden, and completely unexpected amount of money or financial profit received.", "trap": "Pochodzi od jablek stracanych przez wiatr z drzewa (darmowy owoc). W gospodarce: windfall tax = podatek od nadzwyczajnych zyskow.", "category": "Money & Currency", "source": "lekcja"}, {"id": 216, "en": "tip / gratuity", "pl": "napiwek (dobrowolny dodatek do rachunku za usluge)", "def": "A voluntary sum of money given to service personnel (waiters, drivers) for courteous or attentive service.", "trap": "Tip jest potoczne; gratuity jest terminem formalnym uzywanym na rachunkach.", "category": "Money & Currency", "source": "lekcja"}, {"id": 217, "en": "bribe / bribery", "pl": "lapowka / lapowkarstwo (korupcja)", "def": "Money or other inducement offered illicitly to someone in a position of trust to influence their official conduct.", "trap": "Rzeczownik: a bribe (lapowka); proceder: bribery (lapowkarstwo); czasownik: to bribe.", "category": "Money & Currency", "source": "lekcja"}, {"id": 218, "en": "ransom", "pl": "okup (pieniadze zadane za uwolnienie osoby lub odszyfrowanie danych)", "def": "A sum of money demanded or paid for the release of a captive person or seized commercial digital assets.", "trap": "W dobie cyberbezpieczenstwa kluczowe pojecie to ransomware (zlosliwe oprogramowanie szyfrujace dane dla okupu).", "category": "Money & Currency", "source": "lekcja"}, {"id": 219, "en": "stipend", "pl": "uposazenie / stypendium / stala zapomoga (dla stazysty, duchownego lub doktoranta)", "def": "A fixed regular sum paid as a salary or allowance to a student, intern, researcher, or clergyman.", "trap": "Stipend nie jest formalna pensja rynkowa (salary), lecz wsparciem na utrzymanie.", "category": "Money & Currency", "source": "lekcja"}, {"id": 220, "en": "invoice", "pl": "faktura / rachunek handlowy", "def": "An itemized commercial document issued by a seller to a buyer indicating products, quantities, and agreed prices.", "trap": "Rachunek w restauracji to zazwyczaj bill (UK) lub check (US). Oficjalny dokument rozliczeniowy w firmie to zawsze invoice.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 221, "en": "to issue an invoice", "pl": "wystawic fakture", "def": "To officially generate and dispatch a formal billing statement to a purchaser for completed services or deliveries.", "trap": "Zwrot biznesowy: to issue an invoice, a nie *to make / write an invoice*.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 222, "en": "to settle an invoice", "pl": "oplacic / uregulowac fakture", "def": "To pay the full outstanding balance stated on an invoice by the agreed due date.", "trap": "Formalne C1: to settle an invoice / to clear an invoice (bardziej profesjonalne niz potoczne to pay).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 223, "en": "pro-forma invoice", "pl": "faktura pro-forma (dokument wstepny przed realizacja)", "def": "A preliminary estimated bill of sale sent to buyers in advance of a shipment or delivery of goods.", "trap": "Faktura proforma NIE jest dokumentem ksiegowym w sensie podatkowym : sluzy jako wezwanie do zaliczki.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 224, "en": "due date", "pl": "termin platnosci / termin wymagalnosci rachunku", "def": "The final calendar date by which a payment, debt, or financial obligation must be settled.", "trap": "Zwrot formalny: to fall due = stac sie wymagalnym (The loan falls due on 1st November).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 225, "en": "to run up an overdraft / to run up debts", "pl": "narobić długów / wziąć duży dług / wygenerować debet", "def": "To accumulate a substantial amount of debt or negative bank balance through continuous borrowing or spending.", "trap": "UWAGA NA EGZAMINIE: Częsty błąd to mówienie *run out of debts*. RUN OUT OF = skończyć się (np. run out of money), natomiast RUN UP DEBTS = narobić długów / wziąć duże długi!", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 226, "en": "to teeter on the brink of bankruptcy", "pl": "balansowac na krawedzi bankructwa / upadlosci", "def": "To be in an extremely precarious financial position where business collapse or insolvency is imminent.", "trap": "Wyrazenie idiomatyczne z prasy finansowej (Financial Times, The Economist): to teeter on the brink / verge of.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 227, "en": "interim results", "pl": "srodroczne / tymczasowe wyniki finansowe (np. za I polrocze)", "def": "Financial performance figures published by a corporation covering a period shorter than a full fiscal year.", "trap": "Interim = tymczasowy / srodroczny (np. interim dividend, interim CEO).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 228, "en": "market confidence", "pl": "zaufanie uczestnikow rynku / nastroje inwestorow", "def": "The level of optimism and trust that commercial investors and consumers maintain in economic stability.", "trap": "Spadek zaufania (shaken market confidence) czesto wywoluje natychmiastowa wyprzedaz akcji.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 229, "en": "in arrears", "pl": "z zaleglosciami w platnosciach (lub platnosc z dolu)", "def": "Money that is overdue and remains unpaid after the due date, or payment executed at the end of a period.", "trap": "Ma 2 znaczenia: 1) zalegac z platnoscia (in arrears), 2) platnosc z dolu (wages paid in arrears na koniec miesiaca).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 230, "en": "credit control", "pl": "dzial kontroli naleznosci i sciagania dlugow w firmie", "def": "The internal corporate department responsible for vetting customer credit limits and chasing overdue payments.", "trap": "Credit controller odpowiada za to, zeby klienci placili faktury na czas.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 231, "en": "letter of demand", "pl": "wezwanie do zaplaty (ostateczne przedsadowe)", "def": "A formal written legal notice sent to a debtor demanding payment of an outstanding debt under threat of court action.", "trap": "Ostatni krok przed wniesieniem pozwu do sadu (litigation).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 232, "en": "burn rate", "pl": "tempo przepalania gotowki (miesieczne straty gotowkowe w startupie)", "def": "The rate at which a newly formed or loss-making enterprise expends its capital reserves before generating positive cash flow.", "trap": "Kluczowe pojecie w Venture Capital. Okresla, jak szybko firma traci plynne srodki.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 233, "en": "runway", "pl": "finansowy pas startowy (czas do wyczerpania srodkow w kasie)", "def": "The amount of time a business has left before it runs out of cash, calculated as cash reserves divided by burn rate.", "trap": "Wzór: Runway (miesiace) = Dostępna gotówka / Miesięczny burn rate.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 234, "en": "break-even point", "pl": "prog rentownosci (punkt, w ktorym przychody pokrywaja wszystkie koszty)", "def": "The level of sales volume or production output at which total revenue precisely equals total fixed and variable costs.", "trap": "W punkcie break-even zysk wynosi dokladnie 0 (brak zysku, brak straty).", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 235, "en": "discounted cash flow (DCF)", "pl": "metoda zdyskontowanych przeplywow pienieznych (DCF)", "def": "A corporate valuation methodology that estimates the present value of an investment based on its expected future cash flows.", "trap": "Podstawa wyceny w bankowosci inwestycyjnej: pieniadz w przyszlosci jest wart mniej niz pieniadz dzisiaj.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 236, "en": "net present value (NPV)", "pl": "wartosc biezaca netto (NPV)", "def": "The difference between the present value of all cash inflows and the present value of cash outflows over an investment lifecycle.", "trap": "Złota reguła inwestycyjna: Jesli NPV > 0, inwestycje nalezy zaakceptowac.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 237, "en": "golden handcuffs", "pl": "zlote kajdanki (premie i opcje na akcje zatrzymujace kluczowych menedzerow)", "def": "A package of substantial financial perks and delayed stock vesting incentives designed to discourage valuable employees from leaving.", "trap": "Rozrozniaj: Golden parachute = odprawa przy odejsciu; Golden handcuffs = premie zachecajace do ZOSTANIA w firmie.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 238, "en": "clawback provision", "pl": "klauzula zwrotu nienaleznie wyplaconej premii (clawback)", "def": "A contractual clause requiring an executive to repay previously disbursed bonuses if accounting fraud or misconduct is subsequently discovered.", "trap": "Wprowadzona powszechnie po kryzysie finansowym, by karac menedzerow bioracych premie za sfalszowane zyski.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 239, "en": "Weighted Average Cost of Capital (WACC)", "pl": "Z ważonymi średnim kosztem kapitału (ZWCK)", "def": "The rate that represents the average after-tax cost of a company's various sources of capital, including common stock, preferred stock, bonds, and other long-term debt.", "trap": "Be cautious of the accuracy of inputs such as cost of equity and debt.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 240, "en": "Enterprise Value (EV)", "pl": "Wartość przedsiębiorstwa (WP)", "def": "The total market value of a company, calculated as the sum of its equity and long-term debt, minus cash and equivalents.", "trap": "Understand that EV includes both market capitalization and net debt.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 241, "en": "Terminal Value (TV)", "pl": "Wartość terminalna (WT)", "def": "The estimated value of a business beyond the forecast period, often calculated using perpetuity or exit multiple methods.", "trap": "Choose an appropriate growth rate for the terminal period.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 242, "en": "Cost of Equity (COE)", "pl": "Koszt udziały akcyjnych (KUA)", "def": "The return that shareholders require for investing in a company's equity, often estimated using the Capital Asset Pricing Model (CAPM).", "trap": "Be aware that changes in risk-free rate and beta can significantly impact COE.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 243, "en": "Dividend Discount Model (DDM)", "pl": "Model z dyskontowanymi dividendami (MDd)", "def": "A method of valuing a stock by discounting its expected future dividends to the present value.", "trap": "Ensure that growth rates and discount rates are realistic and consistent with market expectations.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 244, "en": "Syndicated Lending", "pl": "Współdziałanie w kredytowaniu", "def": "A method of loan financing in which a loan is provided by a group of banks, each contributing a portion of the total amount.", "trap": "Not to be confused with 'collateralized lending', which involves using collateral as security.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 245, "en": "Bridge Financing", "pl": "Zwrotne finansowanie", "def": "Short-term financing used to bridge the gap between long-term funding sources or during a transition period.", "trap": "It is not permanent and should be replaced by more stable funding.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 246, "en": "Credit Line", "pl": "Linia kredytowa", "def": "A predetermined amount of money that a bank agrees to lend on demand up to a specified limit.", "trap": "It is distinct from a loan, which requires repayment in fixed installments.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 247, "en": "Covenants", "pl": "Klauzule kredytowe", "def": "Agreements that restrict the borrower's actions or financial decisions to protect the lender's interests.", "trap": "They are legally binding and non-compliance can lead to default.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 248, "en": "Debt Restructuring", "pl": "Reorganizacja długów", "def": "The process of modifying the terms of a company's debt to improve its financial health and sustainability.", "trap": "It is not always successful and can lead to further financial distress if poorly executed.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 249, "en": "Non-Performing Loans", "pl": "Niewydajne kredyty", "def": "Loans that are in default or have not met the agreed-upon payment terms for a certain period.", "trap": "They pose significant risk to banks and can impact their capital adequacy ratios.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 250, "en": "Revenue Recognition", "pl": "Znajomość standardów rozliczeń przychódów", "def": "The process of determining the amount and timing of revenue to be recognized in financial statements.", "trap": "Confusing with 'Revenue Forecasting'.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 251, "en": "Deferred Tax Assets", "pl": "Aktywa podlegające odroczeniu podatkowemu", "def": "Assets representing tax benefits that have been recognized in the financial statements but not yet paid.", "trap": "Misinterpreting as 'Deferred Tax Liabilities'.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 252, "en": "Accruals and Prepayments", "pl": "Zależności i zaliczki", "def": "Expenses that have been incurred but not yet paid, or payments made in advance.", "trap": "Confusing with 'Cash Transactions'.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 253, "en": "Depreciation Methods", "pl": "Metody amortyzacji", "def": "Various methods used to allocate the cost of a tangible asset over its useful life.", "trap": "Mixing up with 'Amortization'.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 254, "en": "Audit Opinion", "pl": "Opinia audytora", "def": "A formal statement issued by an auditor expressing their opinion on the financial statements.", "trap": "Confusing with 'Auditor's Report'.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 255, "en": "Impairment Testing", "pl": "Testowanie uszkodzeń", "def": "The process of assessing whether an asset's carrying amount exceeds its recoverable amount.", "trap": "Misinterpreting as 'Depreciation Review'.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 256, "en": "primary market", "pl": "rynок podstawowy", "def": "The primary market is where new securities are first issued to investors.", "trap": "Do not confuse with the secondary market, which involves trading of existing securities.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 257, "en": "underwriting", "pl": "zapewnienie", "def": "Underwriting is the process by which a financial institution agrees to buy securities from an issuer.", "trap": "Ensure you understand the difference between underwriting and broking.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 258, "en": "book building", "pl": "budowanie książki", "def": "Book building is a process used in the issuance of securities where potential investors are solicited to express interest.", "trap": "This term is specific to the primary market and not applicable to secondary market trading.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 259, "en": "short selling", "pl": "krótkie sprzedawanie", "def": "Short selling is the practice of borrowing securities and selling them with the expectation of repurchasing them at a lower price.", "trap": "Be aware that short selling can lead to unlimited losses if the security's price continues to rise.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 260, "en": "market making", "pl": "utrzymanie rynku", "def": "Market making is the practice of buying and selling financial instruments to maintain liquidity in the market.", "trap": "Market makers often provide two-way quotes but do not guarantee a sale or purchase.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 261, "en": "yield curve", "pl": "krzywa zwrotu", "def": "The yield curve is a graphical representation of the relationship between bond yields and their maturities.", "trap": "A flattening yield curve can indicate changes in market expectations about future interest rates.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 262, "en": "friendly takeover", "pl": "przyjazna przejęcie", "def": "A business acquisition where the target company agrees to be bought.", "trap": "Friendly takeovers are generally less costly and time-consuming than hostile ones.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 263, "en": "carve-out", "pl": "wycinka", "def": "A strategic separation of a division or business unit from a larger company.", "trap": "Carving out can lead to tax implications and may require restructuring the remaining business.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 264, "en": "spin-off", "pl": "spink-off", "def": "The creation of a new, independent company from an existing division or subsidiary.", "trap": "Spin-offs can disrupt internal communication and may require significant restructuring efforts.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 265, "en": "joint venture", "pl": "spółdzielnia", "def": "A business partnership between two or more companies to undertake a specific project or share resources.", "trap": "Joint ventures require careful negotiation and clear delineation of responsibilities and profits.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 266, "en": "merger arbitrage", "pl": "arbitraż połączeń i przejęć", "def": "A strategy involving the purchase of stock in companies that are expected to be acquired at a premium.", "trap": "Merger arbitrage carries risks, including deal uncertainty and regulatory hurdles.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 267, "en": "Force Majeure Clause", "pl": "Klauzula o zdarzeniach wyrzecznych", "def": "A clause in a contract that frees the parties from liability or obligation when an extraordinary event or circumstance beyond their control occurs.", "trap": "Ensure the clause is specific and includes a list of qualifying events.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 268, "en": "Liquidated Damages Clause", "pl": "Klauzula o ustalonych szkodach", "def": "A clause in a contract that specifies the amount of damages to be paid if one party breaches the contract.", "trap": "Ensure the amount is reasonable and not a penalty.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 269, "en": "Indemnity Clause", "pl": "Klauzula o indemnizacji", "def": "A clause in a contract that obligates one party to compensate another for any loss or damage caused by the first party.", "trap": "Be aware of potential conflicts with public policy.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 270, "en": "Breach of Warranty", "pl": "Złamanie gwarancji", "def": "A written guarantee, issued to the purchaser of an article by its manufacturer, promising to repair or replace it if necessary within a specified period of time.", "trap": "Distinguish between express and implied warranties.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 271, "en": "Arbitration Proceedings", "pl": "Postępowania arbitrażowe", "def": "A dispute resolution process where an impartial third party makes a binding decision on the parties' disagreement.", "trap": "Be aware of confidentiality and enforceability issues.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 272, "en": "stagflation", "pl": "zagłada inflacyjna", "def": "Economic condition characterized by high inflation and low economic growth.", "trap": "Not to confuse with 'recession' or 'inflation'.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 273, "en": "quantitative tightening", "pl": "wzmocnienie kwantytyczne", "def": "Process of reducing the money supply in an economy by selling securities or raising reserve requirements.", "trap": "Different from 'quantitative easing', which increases the money supply.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 274, "en": "fiscal stimulus", "pl": "stimulacja fiskalna", "def": "Government actions to increase economic activity, typically through increased spending or tax cuts.", "trap": "Should not be confused with 'monetary policy'.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 275, "en": "central bank independence", "pl": "niezależność Banku Centrального", "def": "The degree to which a central bank operates free from government interference in its monetary policy decisions.", "trap": "Can be affected by political pressures.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 276, "en": "reserve requirements", "pl": "wymagania dotyczące rezerw", "def": "Minimum amount of reserves that banks are required to hold against deposits, set by the central bank.", "trap": "Affects money supply and credit availability.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 277, "en": "interest rate corridor", "pl": "pasmo stawek odsetkowych", "def": "Range within which the central bank allows short-term interest rates to fluctuate.", "trap": "Different from 'policy rate' or 'repo rate'.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 278, "en": "executive compensation", "pl": "wygrana dla wykonańców", "def": "Compensation provided to executives for their leadership roles and responsibilities.", "trap": "Ensure you understand the difference between direct and indirect compensation in executive packages.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 279, "en": "stock option grants", "pl": "nadanie opcji na akcje", "def": "The provision of stock options to employees as part of their compensation.", "trap": "Be aware of the vesting period and exercise price in stock option agreements.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 280, "en": "clawback provisions", "pl": "klauzule odwołania", "def": "Legal provisions that allow a company to reclaim compensation if certain conditions are not met.", "trap": "Understand the potential legal implications of clawbacks in different jurisdictions.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 281, "en": "severance pay", "pl": "wygrana na zakończenie pracy", "def": "Compensation paid to an employee upon termination of their employment.", "trap": "Be aware of local labor laws regarding the amount and duration of severance pay.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 282, "en": "collective bargaining", "pl": "zawody", "def": "The process by which trade unions negotiate with employers over terms and conditions of employment.", "trap": "Understand the role of labor laws in shaping collective bargaining outcomes.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 283, "en": "Brand Equity", "pl": "Wartość Marki (WM)", "def": "The total value associated with a brand, including its reputation, loyalty, and perceived quality.", "trap": "Brand equity can be intangible but significantly impacts consumer behavior.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 284, "en": "Market Segmentation", "pl": "Segmentacja Rynek (SR)", "def": "The process of dividing a market into distinct groups of consumers based on similar characteristics.", "trap": "Effective market segmentation requires detailed knowledge of the target audience.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 285, "en": "escrow account", "pl": "konto zaufania", "def": "A bank account where funds are held by a neutral third party until specific conditions are met.", "trap": "Not to be confused with a reserve or contingency account.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 286, "en": "leasehold vs freehold", "pl": "wynajem vs własność", "def": "The legal right to live in or use a building or piece of land for an agreed period of time.", "trap": "Leasehold does not imply permanent use or ownership.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 287, "en": "property appraisal", "pl": "appraisal nieruchomości", "def": "An official estimate of a property's value, typically conducted by a qualified professional.", "trap": "Appraisal is not the same as market value or asking price.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 288, "en": "real estate investment trusts (REIT)", "pl": "fondy inwestycyjne nieruchomości (FNI)", "def": "A type of security that allows investors to own shares in a diversified portfolio of income-producing real estate.", "trap": "REITs are regulated and must distribute most of their taxable income to shareholders.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 289, "en": "Minutes of the meeting", "pl": "Protokół zjecznościowy", "def": "A formal document summarizing the discussions, decisions, and actions taken during a meeting.", "trap": "Ensure to include all key points and decisions in the minutes.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 290, "en": "Agenda setting", "pl": "Ustalanie programu", "def": "The process of planning and organizing the topics to be discussed in a meeting.", "trap": "Prioritize items based on importance and time constraints.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 291, "en": "Adjourning meetings", "pl": "Zakończenie zjeczności", "def": "The formal process of bringing a meeting to an end, often including summarizing key points and assigning follow-up actions.", "trap": "Ensure all outstanding matters are addressed before concluding.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 292, "en": "Motion", "pl": "Rozstrzyganie", "def": "A formal proposal or suggestion for discussion and decision-making in a meeting.", "trap": "Ensure motions are clear, concise, and supported by evidence.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 293, "en": "Quorum", "pl": "Minimalna kworumat", "def": "The minimum number of members required to be present for a meeting or vote to proceed.", "trap": "Verify attendance and ensure compliance with quorum rules.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 294, "en": "Trade-off", "pl": "Zawóg", "def": "A situation where one benefit is gained by accepting a loss in another area.", "trap": "Identify all potential trade-offs and evaluate their impact.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 295, "en": "Terminal Value", "pl": "Wartość terminalna", "def": "The estimated value of a company beyond the forecast period in a discounted cash flow model.", "trap": "Incorrect assumptions about the terminal growth rate can significantly affect valuation.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 296, "en": "Cost of Equity", "pl": "Koszt udzielenia udziałów", "def": "The rate of return that shareholders require for investing in a company's shares.", "trap": "The cost of equity is influenced by market conditions and risk perceptions.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 297, "en": "credit lines", "pl": "linia kredytowa", "def": "A pre-approved amount of money that a bank agrees to lend to a borrower up to a certain limit.", "trap": "Credit lines have limits and conditions, such as interest rates and repayment terms.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 298, "en": "IFRS standards", "pl": "międzynarodowe standardy sprawozdań finansowych", "def": "Global set of accounting and financial reporting standards developed by the International Accounting Standards Board (IASB).", "trap": "IFRS is sometimes confused with GAAP, which are different.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 299, "en": "Executive compensation package", "pl": "pakiet wynagrodzenia dla wykonańców", "def": "A comprehensive set of financial and non-financial benefits provided to high-level executives.", "trap": "Note that this term includes both direct (salary, bonuses) and indirect (perks, stock options) benefits.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 300, "en": "Stock option grant", "pl": "nadanie opcji na akcje", "def": "A formal agreement giving an employee the right to purchase company stock at a predetermined price within a specified period.", "trap": "Be aware that stock options can be subject to vesting periods and expiration dates.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 301, "en": "Constructive dismissal", "pl": "wyjście z pracy w sposób konstruktywny", "def": "A situation where an employee resigns as a result of the employer's conduct, which is so intolerable that it forces the employee to leave.", "trap": "Constructive dismissal can lead to legal action and compensation claims.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 302, "en": "leasehold improvement", "pl": "poprawka lokalu", "def": "Improvements made by a tenant to the property during their lease term.", "trap": "Do not confuse with 'freehold improvement', which refers to improvements made by the property owner.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 303, "en": "rent review", "pl": "reczka wynajmu", "def": "A periodic assessment of the rental rate to ensure it remains fair and competitive.", "trap": "Rent reviews should be conducted transparently and in accordance with local laws.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 304, "en": "real estate investment trust (REIT)", "pl": "trust inwestycyjny nieruchomości", "def": "A company that owns, operates, and manages income-producing real estate properties.", "trap": "REITs are subject to specific regulations; investors should carefully review the trust's financial performance.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 305, "en": "Adjourn meetings", "pl": "Zakończenie spotkania", "def": "The action of bringing a meeting to an end, often formally.", "trap": "Ensure that all necessary actions are completed before adjourning.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 306, "en": "Win-win bargaining", "pl": "Negocjacje win-win", "def": "A negotiation approach aimed at finding a solution that is advantageous for all parties involved.", "trap": "Ensure that all stakeholders are aligned with the final agreement.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 307, "en": "Financial Leverage", "pl": "Finansowe leverage", "def": "The use of debt financing to increase the potential return on equity.", "trap": "High levels of leverage can amplify both gains and losses.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 308, "en": "letters of credit", "pl": "listy poświadczenia kredytu", "def": "A document issued by a bank guaranteeing payment to a beneficiary under specific terms.", "trap": "Confusing with 'guarantees', which are different types of financial assurances.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 309, "en": "Deferred tax asset", "pl": "Aktywa podatkowe odroczone", "def": "An asset representing future tax benefits that arise from deductible expenses or losses.", "trap": "Not to be confused with 'tax carryforward', which refers to the carrying forward of unused tax credits.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 310, "en": "Contingent liabilities", "pl": "Obowiązki warunkowe", "def": "Liabilities that may arise depending on the outcome of a future event.", "trap": "Distinguishing between contingent liabilities and probable liabilities, which are more likely to occur.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 311, "en": "high-frequency trading", "pl": "trading高频", "def": "A type of algorithmic trading that executes a large number of orders in a short period of time.", "trap": "HFT can be controversial due to its potential impact on market liquidity and fairness.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 312, "en": "power of attorney", "pl": "zaufanie", "def": "A legal document granting another person the authority to act on behalf of the grantor.", "trap": "Powers of attorney can be general or specific; ensure they are tailored to the individual's needs.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 313, "en": "FOB (Free On Board)", "pl": "FREIGHT ON BOARD", "def": "A trade term where the seller delivers goods on board a vessel at the named port of shipment.", "trap": "FOB does not include shipping costs, which can be a hidden expense.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 314, "en": "bill of lading", "pl": "listę przewozową", "def": "A document issued by a carrier that serves as proof of the contract of carriage and receipt for goods.", "trap": "The bill of lading is a legal document and must be treated with care.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 315, "en": "customs clearance", "pl": "wyczyśćnienie celnictwa", "def": "The process of obtaining the necessary permits and approvals from customs authorities to import or export goods.", "trap": "Customs regulations vary by country, so thorough research is essential.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 316, "en": "freight forwarding", "pl": "przewóz ładunków", "def": "The service of arranging the transport and delivery of goods from one place to another.", "trap": "Freight forwarding fees can add significantly to overall shipping costs.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 317, "en": "supply chain resilience", "pl": "odporność łańcucha dostaw", "def": "The ability of a supply chain to maintain its performance and recover quickly from disruptions or shocks.", "trap": "Resilience often requires significant investments in redundancy and flexibility.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 318, "en": "leasehold", "pl": "leasing", "def": "A type of property ownership where the tenant has the right to occupy and use the property for a specified period in exchange for rent.", "trap": "Not to be confused with 'freehold', which provides full ownership of the property.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 319, "en": "Adjournment of meetings", "pl": "Zakończenie zebrania", "def": "The formal act of ending a meeting.", "trap": "Ensure all important points are covered before adjourning.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 320, "en": "Deadlock in negotiations", "pl": "Zakłócający stan", "def": "A situation where parties cannot reach an agreement due to opposing viewpoints.", "trap": "Identify key issues and explore alternative solutions to resolve deadlock.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 321, "en": "buffer stock", "pl": "buforów surowców", "def": "An extra amount of inventory kept to guard against stockouts caused by variability in demand or supply.", "trap": "While buffer stocks reduce the risk of stockouts, they also increase holding costs.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 322, "en": "leasehold improvement (LTI)", "pl": "poprawki leasingowe", "def": "Improvements made to a property by a tenant that enhance the property's value and are typically amortized over the lease term.", "trap": "Do not confuse with 'freehold improvement', which refers to improvements made by a freeholder.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 323, "en": "rent review clause", "pl": "klauzula recenzji wynajmu", "def": "A provision in a lease agreement that specifies how and when the rent will be reviewed or adjusted, often based on market conditions or inflation.", "trap": "Be aware of potential legal challenges related to rent reviews and ensure the process is transparent.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 324, "en": "service charge", "pl": "opłata za usługi", "def": "A periodic payment by a tenant to the landlord for services such as utilities, common area maintenance, or property management.", "trap": "Distinguish between 'service charge' and 'additional rent', as they may be taxed differently.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 325, "en": "Freight Forwarder", "pl": "Przewoźca towarów", "def": "A company that organizes and arranges for the transport of goods from one place to another.", "trap": "Freight forwarders are not carriers but intermediaries in the shipping process.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 326, "en": "leasehold estate", "pl": "nieruchomość na najmie", "def": "A form of property ownership where the right to occupy a property is leased for a fixed period.", "trap": "Confusing it with freehold, which implies full ownership.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 327, "en": "Capital Structure", "pl": "Struktura kapitału", "def": "The mix of debt and equity used to finance a company's operations and growth.", "trap": "Changes in market conditions can affect the optimal capital structure.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 328, "en": "high-frequency trading (HFT)", "pl": "trading o wysokiej częstotliwości", "def": "A type of algorithmic trading that involves executing a large number of orders in a short period of time.", "trap": "HFT relies heavily on technology, but can also lead to issues like flash crashes.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 329, "en": "spread", "pl": "różnica cenowa", "def": "The difference between the buying and selling prices of a financial instrument.", "trap": "A narrow spread indicates low trading costs, while a wide spread can indicate market inefficiency.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 330, "en": "fiduciary duties", "pl": "obowiązki fiducyjne", "def": "Obligations owed by a person in a position of trust to another, such as directors and trustees.", "trap": "Fiduciary duties can be enforced by law even if not explicitly stated.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 331, "en": "GDP deflator", "pl": "deflatoryczka GDP", "def": "Measure used to adjust the value of a country's Gross Domestic Product (GDP) for price changes.", "trap": "The GDP deflator is not the same as the consumer price index (CPI); it measures changes in prices across all sectors.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 332, "en": "bottleneck management", "pl": "zarządzanie zwężeniami", "def": "The process of identifying and resolving the constraints or delays in a supply chain that limit overall efficiency.", "trap": "Improving one bottleneck may reveal another; continuous monitoring is essential.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 333, "en": "Valuation Multiples", "pl": "Współczynniki oceny", "def": "Ratios used to compare a company's valuation to similar companies.", "trap": "Understand that different industries have different appropriate multiples.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 334, "en": "IFRS compliance", "pl": "zgodność z międzynarodowymi standardami finansowych (IFRS)", "def": "The adherence to the International Financial Reporting Standards set by the IFRS Foundation.", "trap": "Ensure that 'compliance' is not confused with 'conformity', as they have distinct meanings in accounting.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 335, "en": "due diligence audit", "pl": "audyt sprawdzania ostrożności", "def": "A comprehensive investigation conducted by a potential buyer to assess the financial, legal, and operational aspects of a target company.", "trap": "Be aware of the time-consuming nature and high cost associated with thorough due diligence audits.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 336, "en": "integration planning", "pl": "planowanie integracji", "def": "The process of combining the operations, cultures, and systems of two or more companies post-merger or acquisition.", "trap": "Integration challenges may arise from cultural differences and operational discrepancies.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 337, "en": "Incoterms", "pl": "Warunki Handlowe międzynarodow", "def": "A standardized system of international commercial terms used in the sale of goods.", "trap": "FOB, CIF, and EXW are specific Incoterms that refer to different points of risk transfer.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 338, "en": "leasehold interest", "pl": "zajeczność lokatorska", "def": "The legal right to occupy a property for a specified period under a lease.", "trap": "Do not confuse with 'freehold', which refers to ownership of the land and property.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 339, "en": "service charges", "pl": "opłaty za usługi", "def": "Charges levied on tenants for the upkeep of shared areas in a building.", "trap": "Service charges can significantly impact cash flow; negotiate terms carefully.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 340, "en": "non-performing loans (NPLs)", "pl": "niezdolne do spłaty kredyty", "def": "Loans where the borrower is unable to meet repayment obligations.", "trap": "Do not confuse with 'performing loans', which are loans where the borrower meets all repayment obligations.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 341, "en": "liquidity providers", "pl": "dostawcy płynności", "def": "Financial institutions that supply the necessary funds for trading activities to maintain market liquidity.", "trap": "Not to be confused with 'financial providers', which can include any financial services.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 342, "en": "Incoterms (FOB)", "pl": "Warunki Incotermów (FAB)", "def": "A trade term indicating that the seller delivers when the goods pass over the ship's rail at the named port of shipment.", "trap": "FOB stands for Free On Board, not First Out.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 343, "en": "lead times", "pl": "czas oczekiwania", "def": "The duration between the placement of an order and the delivery of goods.", "trap": "It's not just about speed; it involves planning and coordination.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 344, "en": "subletting", "pl": "podleasing", "def": "The act of leasing a property to another party, typically for a shorter term than the original lease agreement.", "trap": "Check local laws regarding subletting, as it may require landlord approval and can affect your rights.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 345, "en": "golden parachute", "pl": "złoty spadochron", "def": "A generous compensation package offered to key executives of a company in the event of a takeover or restructuring.", "trap": "Golden parachutes can be seen as excessive compensation by shareholders.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 346, "en": "Enterprise Value", "pl": "Wartość przedsiębiorstwa", "def": "The total value of a company, including both debt and equity.", "trap": "Do not confuse with market capitalization, which excludes debt.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 347, "en": "covenant", "pl": "obowiązek finansowy", "def": "A legally binding agreement that restricts the actions of a borrower, often included in loan agreements.", "trap": "Covenants can limit a company's financial flexibility; they should be negotiated carefully.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 348, "en": "non-performing loan", "pl": "pożyczka nieodsetkowa", "def": "A loan where the borrower is unable to meet repayment obligations, typically defined by a certain period of missed payments.", "trap": "High levels of non-performing loans can negatively impact a bank's financial health.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 349, "en": "Adjourn meeting", "pl": "Zakończenie zebrania", "def": "To formally end a meeting, often with the expectation to resume at a later time.", "trap": "Be cautious with 'sine die', which means indefinitely in Latin.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 350, "en": "Stakeholder alignment", "pl": "Zgadnij ze wszystkimi interesariuszami", "def": "The process of ensuring that all stakeholders' interests and expectations are in harmony with the organization's goals.", "trap": "Ensure 'alignment' is not confused with 'align', which can have a different connotation in business contexts.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 351, "en": "secondary market", "pl": "rynok wtórny", "def": "The secondary market is where previously issued securities are bought and sold among investors.", "trap": "Remember that liquidity is typically higher in the secondary market.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 352, "en": "Incoterms FOB", "pl": "Warunki Incotermów FOB", "def": "Trade term where the seller delivers goods on board a vessel at the named port of shipment.", "trap": "FOB stands for Free On Board, not First Out.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 353, "en": "liquidity provider", "pl": "dostawca płynności", "def": "A financial institution that provides liquidity to the market by buying and selling securities.", "trap": "Confusion with 'liability provider' or misunderstanding the role in maintaining market depth.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 354, "en": "arbitrage", "pl": "arbuzowanie", "def": "The practice of taking advantage of price differences between markets for the same or similar financial instruments.", "trap": "Misinterpretation as 'arbitrary trading' or confusion with other forms of speculation.", "category": "Capital Markets & Trading", "source": "dogenerowane"}, {"id": 355, "en": "Balance sheet reconciliation", "pl": "Zrównoważenie bilansu", "def": "The process of comparing and adjusting a company's records to ensure accuracy with bank statements.", "trap": "Avoid overlooking the importance of regular reconciliations for financial integrity.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 356, "en": "indemnity clauses", "pl": "klauzula ochronna", "def": "A provision in a contract that obligates one party to compensate the other for certain losses or liabilities.", "trap": "Indemnity clauses can be broad and may lead to unintended legal consequences if not carefully drafted.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 357, "en": "Qualified audit opinion", "pl": "opinia audytu kwalifikowana", "def": "An audit report issued when the auditor cannot express an unqualified opinion due to significant uncertainties or limitations.", "trap": "A qualified audit opinion does not necessarily indicate fraud but requires further investigation.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 358, "en": "net operating income (NOI)", "pl": "zysk operacyjny netto", "def": "The amount of income generated by a property after subtracting operating expenses.", "trap": "Does not include debt service or taxes.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 359, "en": "rent escalation clause", "pl": "klauzula o zwiększeniu wynajmu", "def": "A clause in a lease that allows for periodic increases in rent based on an agreed formula or index.", "trap": "Ensure understanding of the specific index and adjustment frequency.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 360, "en": "property management company", "pl": "przedsiębiorstwo zarządzania nieruchomości", "def": "A company that handles the day-to-day operations and maintenance of real estate properties.", "trap": "Not to be confused with property development companies, which focus on creating new properties.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 361, "en": "sublease agreement", "pl": "umowa podwynajmu", "def": "An agreement by which a tenant sublets part or all of its leased premises to another party.", "trap": "Ensure compliance with lease terms regarding subleasing.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 362, "en": "Incoterm FOB (Free On Board)", "pl": "Warunki Incoterm FOB (Free On Board)", "def": "A trade term where the seller delivers goods on board a vessel at the named port of shipment, and the buyer takes ownership.", "trap": "Remember that FOB means the risk passes to the buyer once the goods are on board the vessel.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 363, "en": "Just-In-Time (JIT) Inventory System", "pl": "System zapasów just-in-time", "def": "A supply chain management method where goods are produced and delivered as they are needed, minimizing inventory holding costs.", "trap": "Implementing JIT requires precise demand forecasting and reliable supply chain coordination.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 364, "en": "Bill of Lading (B/L)", "pl": "Dowód przewozu", "def": "A legal document that serves as evidence for the receipt and delivery of goods.", "trap": "Do not confuse with 'pro-forma invoice', which is an estimate rather than a contract.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 365, "en": "Just-in-Time (JIT) Inventory Management", "pl": "Zarządzanie zapasami just-in-time", "def": "A system of inventory management where goods are delivered as soon as they are needed.", "trap": "Requires precise coordination between suppliers and manufacturers.", "category": "Supply Chain, Logistics & Trade", "source": "dogenerowane"}, {"id": 366, "en": "co-investment", "pl": "wspólny inwestycja", "def": "A strategic investment made alongside a primary investor, often used by private equity firms to align interests with other stakeholders.", "trap": "Do not confuse with 'synergy', which refers to the combined effect of two entities.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 367, "en": "waterfall distribution", "pl": "dystrybucja cascadowa", "def": "A profit-sharing arrangement in which profits are distributed according to a predetermined hierarchy, typically from the most junior to senior investors.", "trap": "This term is not related to water resources or physical flow.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 368, "en": "equity kicker", "pl": "warstwa ekwituacyjna", "def": "An additional layer of equity provided by the sponsor to incentivize management and align their interests with investors.", "trap": "This is not related to sports or fitness activities.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 369, "en": "preferred return hurdle rate", "pl": "minimalna stopa zwrotu preferowanego inwestora", "def": "A threshold return that limited partners must earn before general partners receive any carried interest.", "trap": "Do not confuse with 'interest rate', which refers to loan rates.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 370, "en": "exit strategy", "pl": "strategia wyjścia z inwestycji", "def": "A comprehensive plan for selling or liquidating an investment, often involving multiple stages and methods.", "trap": "This term is not related to emergency plans or escape routes.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 371, "en": "backstop commitment", "pl": "obowiązek zapasowy", "def": "A financial guarantee provided by a major investor to ensure that other investors will receive their returns, typically in the event of a default.", "trap": "Do not confuse with 'backup plan', which is more general.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 372, "en": "Intercompany financing arrangements", "pl": "arrangements finansowe międzyfirmy", "def": "Financial agreements between related companies within a corporate group.", "trap": "Do not confuse with 'intercompany transactions', which can have different implications.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 373, "en": "Tax loss carryforward", "pl": "przeniesienie strat podatkowych", "def": "The process of carrying forward unused tax losses from one fiscal period to future periods.", "trap": "Be aware that some jurisdictions have limitations on how long losses can be carried forward.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 374, "en": "Value-added tax (VAT) recovery", "pl": "odzyskiwanie podatku od wartości dodanej", "def": "The process of recovering VAT paid on business expenses from the total amount of VAT charged to customers.", "trap": "Ensure compliance with local regulations regarding what types of expenses qualify for VAT recovery.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 375, "en": "Deemed profit method", "pl": "metoda przyznawania przychodu", "def": "A tax valuation method used to determine the taxable income of a company based on assumptions about its profitability.", "trap": "This method can be complex and may require expert analysis.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 376, "en": "Expenditure-based taxation", "pl": "podatek opierający się na wydatkach", "def": "A tax system where businesses can reduce their taxable income by deducting eligible business expenses.", "trap": "Not all expenses are deductible; some may be subject to restrictions.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 377, "en": "Fiscal consolidation", "pl": "spójnienie podatkowe", "def": "The process of combining multiple tax jurisdictions or fiscal units into a single, unified financial entity.", "trap": "Fiscal consolidation can have significant implications for both local and international businesses.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 378, "en": "dynamic hedging strategy", "pl": "strategia dynamicznego zabezpieczenia", "def": "A risk management approach that adjusts the hedge ratio in response to changes in market conditions.", "trap": "This is not the same as static hedging, which does not adjust the hedge ratio.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 379, "en": "interest rate parity", "pl": "parzystość stopni odsetkowych", "def": "A concept in international finance that describes the relationship between spot exchange rates and forward exchange rates, taking into account the difference in interest rates between two countries.", "trap": "It is often confused with covered interest rate parity.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 380, "en": "volatility smile", "pl": "śmiech zjawności", "def": "A graphical representation of the relationship between option strike prices and their implied volatilities, typically showing a curved pattern that resembles a smile.", "trap": "It is different from the volatility skew.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 381, "en": "credit default swap (CDS)", "pl": "swap na ryzyko kredytowe (CDS)", "def": "A financial derivative that allows one party to transfer the credit risk of a bond or loan to another party.", "trap": "It is not related to interest rate swaps.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 382, "en": "overnight index swap (OIS)", "pl": "swap na indeksie nocnym (OIS)", "def": "A financial derivative that involves the exchange of interest payments based on overnight repurchase agreement rates.", "trap": "It is distinct from LIBOR-based swaps.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 383, "en": "basis point (bps)", "pl": "punkt podstawowy (bps)", "def": "A unit used to measure small changes in interest rates or yield, where 1 basis point equals 0.01%.", "trap": "It should not be confused with percentage points.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 384, "en": "integrated reporting framework", "pl": "ramka zgłaszania zintegrowanego", "def": "A standardized framework for organizations to report on their sustainability performance and financial results in a unified manner.", "trap": "This is different from separate sustainability reports.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 385, "en": "materiality assessment", "pl": "oszacowanie ważności", "def": "The process of identifying and evaluating which sustainability topics are significant to stakeholders and therefore should be included in corporate reporting.", "trap": "It's not just about regulatory compliance.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 386, "en": "stakeholder engagement strategy", "pl": "strategia angażowania zaangażowanych stron", "def": "A strategic approach for systematically engaging with stakeholders to understand their needs, expectations, and feedback on corporate sustainability initiatives.", "trap": "It should be more than just public relations.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 387, "en": "environmental impact assessment (EIA)", "pl": "oszacowanie wpływu na środowisko", "def": "A systematic evaluation of the potential environmental impacts of a project, policy, or activity.", "trap": "It must be thorough and legally mandated in many jurisdictions.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 388, "en": "sustainable procurement policies", "pl": "zasady zrównoważonej nabywki", "def": "A set of principles and criteria used by organizations to ensure that their purchasing processes align with sustainability goals, ethical considerations, and environmental impact.", "trap": "It's more than just cost savings.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 389, "en": "climate resilience strategy", "pl": "strategia odporności na klimat", "def": "A strategic approach for identifying and addressing vulnerabilities to climate change impacts, with the goal of maintaining operations and performance.", "trap": "It's not just about emissions reduction.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 390, "en": "co-investment clause", "pl": "klauzula współinvestycji", "def": "A contractual provision that obligates a party to invest alongside another investor in specified circumstances.", "trap": "This is different from a simple co-investment, which may not be legally binding.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 391, "en": "liquidation preference", "pl": "preferencja likwidacyjna", "def": "A clause in a financing agreement that gives certain investors the right to be repaid before others in case of a company's liquidation.", "trap": "It does not guarantee full repayment; it only sets the order of payouts.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 392, "en": "term sheet covenants", "pl": "warunki w terminie", "def": "Specific agreements or commitments outlined in a term sheet that bind the parties to certain terms and conditions.", "trap": "These are non-binding but often precede definitive agreements.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 393, "en": "drag-along rights", "pl": "prawa do zmuszenia do sprzedaży", "def": "A clause allowing a majority shareholder to force other shareholders to sell their shares under certain conditions.", "trap": "It can be used strategically to ensure control and valuation.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 394, "en": "tag-along rights", "pl": "prawa do udziału w sprzedaży", "def": "A clause allowing minority shareholders to sell their shares alongside a majority shareholder under specified conditions.", "trap": "It may limit the freedom of action for minority investors.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 395, "en": "anti-dilution", "pl": "ochrona przed zaniedbanej wartości", "def": "A mechanism to protect shareholders from the potential loss of ownership percentage due to future financings.", "trap": "It can be complex and may affect future fundraising efforts.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 396, "en": "delta-neutral position", "pl": "pozycja neutralna do delty", "def": "A trading strategy where the sensitivity of the portfolio's value to changes in the underlying asset price is offset.", "trap": "Remember, achieving true delta-neutrality requires continuous monitoring and adjustment.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 397, "en": "volatility skew", "pl": "zakrzywienie wolinności", "def": "The difference in implied volatilities across different strike prices for the same underlying asset.", "trap": "Volatility skew is not constant and changes with market conditions.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 398, "en": "premium risk", "pl": "ryzyko z premii", "def": "The risk associated with the cost of buying an option, which may not be realized if the underlying asset does not move favorably.", "trap": "Premium risk can significantly impact overall portfolio performance.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 399, "en": "counterparty credit risk", "pl": "ryzyko kredytowe kontrahenta", "def": "The risk that the party with whom a financial instrument is traded may default on its obligations.", "trap": "Counterparty credit risk can materialize suddenly and without warning.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 400, "en": "basis point value", "pl": "wartość punktu bazy", "def": "The monetary impact of a one-basis-point change in the interest rate or yield.", "trap": "Understanding the basis point value is crucial for precise financial modeling.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 401, "en": "maturity mismatch risk", "pl": "ryzyko niezgodności matur", "def": "The risk arising when the duration of assets and liabilities in a financial portfolio do not match.", "trap": "Maturity mismatch risk can lead to significant financial stress during periods of market volatility.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 402, "en": "balance of payments", "pl": "bilans płatniczy", "def": "A record of all economic transactions between the residents of a country and the rest of the world over a certain period.", "trap": "Not to be confused with trade balance, which only includes merchandise.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 403, "en": "current account deficit", "pl": "deficyt rachunku bieżącego", "def": "A situation where a country's imports of goods, services, and investment income exceed its exports.", "trap": "It's distinct from the capital account balance.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 404, "en": "liquidity trap", "pl": "wspinający się płynność", "def": "A situation where monetary policy becomes ineffective in stimulating economic activity because interest rates are very low, and the demand for money is highly inelastic.", "trap": "This concept is often misunderstood; it does not mean complete lack of liquidity.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 405, "en": "sovereign debt crisis", "pl": "krizys zaciągania długów państwowych", "def": "A situation where a country is unable to meet its external debt obligations, leading to significant financial distress.", "trap": "It's important to distinguish this from corporate debt crises.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 406, "en": "fiscal drag", "pl": "obniżenie zaciągania długów", "def": "The negative impact on economic growth resulting from high levels of government spending and taxation.", "trap": "Fiscal drag is often overlooked in discussions about economic stimulus.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 407, "en": "inflation targeting", "pl": "celowanie w inflację", "def": "A monetary policy framework where the primary goal is to maintain price stability by keeping inflation at a target level.", "trap": "It's distinct from quantity-based targets or other monetary goals.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 408, "en": "Severability Clause", "pl": "Klauzula separacyjna", "def": "A clause in a contract that specifies that if any part of the agreement is determined to be invalid or unenforceable, the remaining portions will remain in full force and effect.", "trap": "This clause can sometimes lead to unintended consequences if not carefully drafted.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 409, "en": "Liability Limitation Clause", "pl": "Klauzula ograniczenia odpowiedzialności", "def": "A clause that sets a maximum amount for which one party can be held liable for damages resulting from the breach of contract.", "trap": "This clause may not always protect against certain types of liability, such as fraud.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 410, "en": "Non-Compete Clause", "pl": "Klauzula zapobiegająca konkurencji", "def": "A clause in an employment contract that restricts the employee from engaging in competitive activities with the employer's business for a specified period after termination.", "trap": "Non-compete clauses can be difficult to enforce and may conflict with local labor laws.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 411, "en": "Confidentiality Agreement", "pl": "Porozumienie o utrzymywaniu w tajemnicy", "def": "A legal agreement between parties that obligates the receiving party to keep certain information confidential.", "trap": "Confidentiality agreements must be tailored to specific circumstances to avoid being overly broad or restrictive.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 412, "en": "Dispute Resolution Clause", "pl": "Klauzula rozstrzygania sporów", "def": "A disagreement or argument.", "trap": "Definicja lektorki: 'a disagreement or argument'. W prawie pracy: 'industrial dispute' (konflikt zbiorowy).", "category": "Contracts, Commercial Law & Governance", "source": "lekcja_handout_matching"}, {"id": 413, "en": "Fiduciary Duty Obligation", "pl": "Obowiązek fiducjarny", "def": "A legal obligation that requires a person in a position of trust to act solely in the interest of another party.", "trap": "Fiduciary duties are subject to judicial interpretation and can vary by jurisdiction.", "category": "Contracts, Commercial Law & Governance", "source": "dogenerowane"}, {"id": 414, "en": "Discounted Cash Flow (DCF) Analysis", "pl": "Analiza dyskontowanego przepływu gotówki (ADF)", "def": "Financial valuation method that estimates the value of an asset or project by discounting its expected future cash flows to their present value.", "trap": "Be aware that 'discount rate' is not synonymous with DCF; it is an input into the DCF model.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 415, "en": "Cost of Debt", "pl": "Koszt długów", "def": "The effective interest rate a borrower pays for the use of borrowed funds.", "trap": "Do not confuse 'cost of debt' with 'interest rate'; while related, they are distinct financial metrics.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 416, "en": "Capital Budgeting", "pl": "Planowanie finansowe kapitałowe", "def": "The process of identifying, evaluating, and selecting long-term investments that are consistent with the overall strategic objectives of the organization.", "trap": "Remember that 'capital budget' refers specifically to major business investments, not day-to-day expenses.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 417, "en": "Debt Capacity", "pl": "Pojemność długów", "def": "The maximum amount of debt that a company can take on while maintaining its financial health and meeting its obligations.", "trap": "Be cautious; 'debt capacity' does not imply unlimited borrowing but rather a calculated maximum.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 418, "en": "Hurdle Rate", "pl": "Punkt wyjściowy", "def": "The minimum rate of return that an investment must generate to be considered worthwhile.", "trap": "Do not confuse 'hurdle rate' with 'discount rate'; they serve different purposes in financial analysis.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 419, "en": "Equity Value", "pl": "Wartość udziałów", "def": "The market value of a company's equity or the total value of its outstanding shares.", "trap": "Note that 'equity value' refers specifically to the market valuation of shareholder equity, not total enterprise value.", "category": "Corporate Finance & Valuation", "source": "dogenerowane"}, {"id": 420, "en": "Equity Dilution", "pl": "zaciemnienie akcji", "def": "The decrease in the ownership percentage of existing shareholders when new shares are issued to investors.", "trap": "Not to be confused with 'Debt Dilution', which relates to an increase in leverage.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 421, "en": "Pre-Money Valuation", "pl": "wartość przed kapitałem", "def": "The estimated value of a company prior to the receipt of an equity investment.", "trap": "Distinct from 'Post-Money Valuation', which includes the amount of new investment.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 422, "en": "Leverage
