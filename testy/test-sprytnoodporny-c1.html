 must be regularly reviewed and adjusted as new information becomes available.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 843, "en": "Consolidated Financial Statements Preparation", "pl": "Przygotowanie zjednoczonych finansów", "def": "The process of compiling the financial statements for a group of companies.", "trap": "Ensure that all intercompany transactions are eliminated to avoid double-counting.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 844, "en": "Arm's Length Range", "pl": "Zakres cen arm's length", "def": "A range of prices that would be expected to be charged in a comparable independent transaction between unrelated parties.", "trap": "Misinterpreting Arm's Length Range as a fixed value rather than a range.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 845, "en": "Tax Avoidance Compliance", "pl": "Zgodność z regulacjami unikania podatku", "def": "The process of ensuring that tax avoidance strategies are implemented in accordance with applicable laws and regulations.", "trap": "", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 846, "en": "Base Erosion and Profit Shifting (BEPS) Mitigation", "pl": "Zmniejszanie wpływu Base Erosion and Profit Shifting (BEPS)", "def": "Strategies and measures implemented by companies to reduce the impact of base erosion and profit shifting on their tax position.", "trap": "", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 847, "en": "Double Taxation Agreement (DTAA) Utilization", "pl": "Zastosowanie Porozumienia o podwójnej opodatkowaniu", "def": "The process of applying a Double Taxation Agreement to avoid double taxation on income earned by individuals and businesses in different countries.", "trap": "", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 848, "en": "Fiscal Loophole Closure", "pl": "Zamknięcie fiskalnych luki", "def": "The action of identifying and eliminating tax loopholes to ensure fair taxation and maximize revenue.", "trap": "", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 849, "en": "Transfer Pricing Analysis", "pl": "Analiza Ceny Przesyłki", "def": "A method for determining the fair market value of transactions between related parties for tax purposes.", "trap": "Not to be confused with 'transfer pricing strategy', which involves setting prices.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 850, "en": "Fiscal Shielding Mechanisms", "pl": "Mechanizmy Ochrony Fiskalnej", "def": "Strategies and tools used to reduce tax liabilities through various fiscal incentives.", "trap": "It is distinct from 'fiscal optimization model', which is a broader framework.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 851, "en": "Base Erosion and Profit Shifting (BEPS) Strategy", "pl": "Strategia Berozenia Podstawy i Przekierowywania Zysków (BEPS)", "def": "A strategic approach to mitigate the effects of BEPS through internal restructuring and external partnerships.", "trap": "Not to be confused with 'BEPS Action Plan', which is a comprehensive set of measures.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 852, "en": "Double Taxation Treaty (DTT) Review", "pl": "Przegląd Umowy o Uniknięciu Podwójnego Opodatkowania", "def": "A thorough examination of the terms and conditions of a double taxation treaty to ensure optimal tax benefits.", "trap": "Be aware that 'DTTA' is an alternative abbreviation.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 853, "en": "Corporate Tax Residency Determination Review", "pl": "Przegląd Określania Miejsca Podatniczego S.A.", "def": "A detailed assessment of the criteria and procedures used to determine a company's tax residency status.", "trap": "Do not confuse with 'Corporate Tax Residency Determination Process', which is the method used.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 854, "en": "FX spot contract", "pl": "kontrakt odszukowy walutowy", "def": "A financial instrument used to buy or sell currency at the current market rate for immediate delivery.", "trap": "Do not confuse it with forward contracts, which are settled on a future date.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 855, "en": "FX swap agreement", "pl": "porozumienie wymiany walutowej", "def": "An agreement to exchange principal and interest payments on a loan or deposit in two different currencies.", "trap": "It involves both spot and forward transactions.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 856, "en": "FX options market", "pl": "rynок opcji walutowych", "def": "A financial market where investors can buy or sell options on foreign currencies.", "trap": "It is distinct from the spot and forward markets.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 857, "en": "FX barrier option", "pl": "opcja z poniższym/lub wyżej poziomem baru", "def": "An options contract where the payoff depends on whether an underlying asset crosses a predetermined price level.", "trap": "It can be either knock-in or knock-out type.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 858, "en": "FX volatility index", "pl": "indeks wariowalności walutowej", "def": "A statistical measure of the variation in currency prices over a given period.", "trap": "It reflects market sentiment and can influence option pricing.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 859, "en": "FX forward contract", "pl": "kontrakt odszukowy walutowy", "def": "A financial agreement to buy or sell currency at a predetermined rate on a future date.", "trap": "It is different from spot contracts, which are settled immediately.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 860, "en": "Monetary policy interest rate parity", "pl": "Parzystość stopy oprocentowania polityki monetarnej", "def": "An equilibrium condition where the difference in interest rates between two countries is equal to the expected change in their exchange rates.", "trap": "Do not confuse with simple interest rate parity, which excludes inflation.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 861, "en": "Cross-currency interest rate swap", "pl": "Zamiana stóp oprocentowania między walutami", "def": "A financial derivative in which two parties agree to exchange interest payments on different currencies for a specified period.", "trap": "Do not confuse with vanilla interest rate swaps, which are in the same currency.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 862, "en": "Inflation-linked bond", "pl": "Zajeczony do inflacji obligacja", "def": "A debt security whose principal and coupon payments are adjusted for inflation, often used as a hedge against currency devaluation.", "trap": "Not all bonds linked to inflation provide currency protection.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 863, "en": "Foreign exchange derivatives index", "pl": "Indeks derivatów pochodzenia zagranicznego", "def": "A benchmark that measures the performance of a basket of foreign exchange derivative instruments, used to assess market trends and volatility.", "trap": "It is distinct from individual FX spot or forward indices.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 864, "en": "Motion voting", "pl": "Głosowanie na propozycję", "def": "The process by which attendees vote to accept or reject a motion.", "trap": "Confusing with 'general voting', which can apply to various types of decisions, not specifically motions.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 865, "en": "Deadlock prevention", "pl": "Zapobieganie stawowaniu się stojakiem", "def": "Strategies used to avoid a situation where negotiations are unable to progress due to conflicting interests.", "trap": "Misunderstanding as 'deadlock resolution', which refers to resolving an existing impasse, not preventing one.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 866, "en": "Trade-off analysis", "pl": "Analiza alternatywnych wyborów i kompromisów", "def": "The process of evaluating the advantages and disadvantages of different options to determine the most acceptable compromise.", "trap": "Misinterpreting as 'trade-off strategy', which is about making decisions, not the process of analyzing options.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 867, "en": "Sustainable Competitive Advantage", "pl": "Ciągła Przewaga Kompetycyjna", "def": "A condition or circumstance that puts a company in a favourable or superior business position.", "trap": "Sustainable competitive advantages require continuous investment and adaptation.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 868, "en": "foreclosure process", "pl": "proces wykradania", "def": "The formal legal process by which a lender takes possession of property used as collateral for a loan when the borrower defaults.", "trap": "This term is often associated with real estate but can also apply to other types of secured loans.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 869, "en": "rehabilitation program", "pl": "program odnowy", "def": "A structured plan aimed at helping financially troubled individuals or companies restructure their debts and return to financial stability.", "trap": "This term can refer to both individual and corporate contexts, so it's crucial to understand the specific application.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 870, "en": "stakeholder buyout", "pl": "aktywowanie akcjonariuszy", "def": "A situation where existing stakeholders purchase a majority or controlling interest in a company to prevent its insolvency.", "trap": "This term is often associated with corporate governance issues, particularly when management or significant shareholders are involved.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 871, "en": "workout facility", "pl": "centrum odnowy kredytowej", "def": "An organization that provides services and resources to help debtors negotiate with creditors and restructure their debts.", "trap": "This term is often used in the context of financial advisory services and should not be confused with other types of debt management facilities.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 872, "en": "cross-collateralization", "pl": "współpłacenia collateralne", "def": "The practice of using multiple assets as collateral for a single loan or debt obligation to mitigate default risk.", "trap": "This term involves complex financial arrangements and should be understood in the context of securing multiple assets.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 873, "en": "creditor rights group", "pl": "grupa praw kredytorów", "def": "A collective organization of creditors who unite to protect their interests and negotiate with the debtor in cases of insolvency.", "trap": "This term highlights the collective action of creditors, which is distinct from individual creditor actions.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 874, "en": "carve-out strategy", "pl": "strategia odcięcia", "def": "A corporate restructuring technique where a business unit is extracted from its parent company to form an independent entity.", "trap": "Not to be confused with a spin-off, which involves the creation of a new company from an existing one.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 875, "en": "spin-off listing", "pl": "wystawienie na giełdę spin-offa", "def": "The process by which a newly created independent company from a parent firm is listed on the stock exchange.", "trap": "Ensure distinction between spin-off and carve-out; they are related but distinct processes.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 876, "en": "joint venture agreement", "pl": "porozumienie wspólnej działalności", "def": "A formal legal agreement between two or more parties to create a new business entity for the purpose of pursuing a specific project or opportunity.", "trap": "Joint ventures are not mergers; they involve collaboration without full integration.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 877, "en": "merger arbitrage strategy", "pl": "strategia speculacyjna łączącą firmy", "def": "A financial strategy that involves buying the stocks of companies targeted for acquisition at a discount before the deal is finalized.", "trap": "Merger arbitrage relies on market inefficiencies and may involve significant risk.", "category": "M&A and Corporate Restructuring", "source": "dogenerowane"}, {"id": 878, "en": "Senior Loan Participation Agreement", "pl": "Umowa o udział w kredycie seniorowym", "def": "A legal agreement that allows a bank to share the risk and rewards of a senior loan with other financial institutions.", "trap": "This term is often confused with junior loan participations, which involve different levels of risk and return.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 879, "en": "Credit Risk Mitigation Strategy", "pl": "Strategia redukcji ryzyka kredytowego", "def": "A comprehensive approach designed to reduce the potential losses from credit risk through various hedging and diversification techniques.", "trap": "This strategy is distinct from market risk or operational risk mitigation measures.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 880, "en": "Cross-Currency Swap Agreement", "pl": "Umowa o wymianę walut", "def": "A financial contract between two parties to exchange streams of payments in different currencies at an agreed-upon interest rate.", "trap": "This is distinct from interest rate swaps, which involve exchanges based on changes in interest rates rather than currencies.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 881, "en": "Credit Exposure Reporting", "pl": "Zgłaszanie ekspozycji kredytowej", "def": "The process of monitoring and reporting the amount of credit risk exposure that a financial institution has to counterparties.", "trap": "This is different from market exposure reporting, which focuses on trading activities rather than credit risk.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 882, "en": "Dual Listing", "pl": "Podwójna lista", "def": "The process of a company's securities being listed on more than one stock exchange.", "trap": "Dual listing is not the same as a joint venture.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 883, "en": "Regulatory Sandbox", "pl": "Poczekalnia regulatorów", "def": "A controlled environment where financial innovators can test new products, services, or business models under close regulatory oversight.", "trap": "Regulatory sandbox is not synonymous with deregulation.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 884, "en": "Market Capitalization Weighted Index", "pl": "Indeks ważony według kapitału rynkowego", "def": "A stock market index where the weight of each component is determined by its total market capitalization.", "trap": "Market capitalization weighting does not always reflect voting rights.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 885, "en": "Structured Credit Product", "pl": "Złożone produkt kredytowy", "def": "A financial instrument that combines various types of assets, such as loans or bonds, into a single security.", "trap": "Structured credit products are not always risk-free.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 886, "en": "Quantitative Trading Strategy", "pl": "Strategia handlu ilościowego", "def": "A trading approach that relies on mathematical and statistical models to identify market opportunities.", "trap": "Quantitative strategies can be highly complex and require significant computational resources.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 887, "en": "Non-Performing Loan (NPL)", "pl": "Złobiony kredyt", "def": "A loan that is in default, meaning the borrower has failed to make scheduled payments of principal or interest.", "trap": "NPLs are not just defaulted loans but those that have been classified as non-accrual due to their delinquency.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 888, "en": "Promotion Clause", "pl": "Klauzula promocyjna", "def": "A clause in an agreement that grants the investor rights to participate in future financing rounds.", "trap": "Not to be confused with the Drag-Along Rights, which are related to the sale of shares.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 889, "en": "First-Money-In (FMI) Agreement", "pl": "Umowa na pierwsze wpływy (FMI)", "def": "An agreement where an investor commits to provide the first round of funding for a project.", "trap": "This is distinct from a Co-Investment agreement, which involves multiple investors contributing to a single investment.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 890, "en": "Equity Ratchet", "pl": "Ratka zabezpieczający udział w akcjach", "def": "A mechanism that adjusts the ownership percentage in case of future dilutions to maintain the investor's equity stake.", "trap": "It is important to distinguish this from a simple anti-dilution clause, which only protects against downward adjustments.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 891, "en": "Second-Order Liquidation Preference", "pl": "Preferencje likwidacyjne drugiego stopnia", "def": "A provision that gives preferred shareholders the right to receive a return of capital before any other investors, including those with first-order preferences.", "trap": "This should not be confused with the First-Order Liquidation Preference, which provides priority over common shares but below second-order preferences.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 892, "en": "Mezzanine Financing", "pl": "Finansowanie mezzaninowe", "def": "A type of debt financing that ranks below senior debt but above equity, often used to bridge the gap between debt and equity funding.", "trap": "This is different from venture debt financing, which typically has more favorable terms for the borrower.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 893, "en": "Co-Investment Agreement", "pl": "Umowa na wspólne inwestycje", "def": "An agreement where multiple investors commit to investing a proportional amount of capital into a project together.", "trap": "This should not be confused with a Syndication agreement, which involves selling investment interests to other investors.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 894, "en": "Whistleblowing Protections", "pl": "Ochrona dla podziurawców", "def": "Legal protections designed to encourage employees to report misconduct or unethical practices within their organization.", "trap": "Weak whistleblowing protections can lead to a culture of silence and increased risk of ethical violations.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 895, "en": "sterilized intervention", "pl": "akcja wymiany walutowej z neutralizacją monetarną", "def": "A monetary policy tool where a central bank buys or sells foreign currency while simultaneously offsetting the impact on domestic money supply.", "trap": "Ensure distinction from non-sterilized interventions which can affect monetary base directly.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 896, "en": "core inflation", "pl": "inflacja podstawowa", "def": "A measure of inflation that excludes volatile items such as food and energy prices, providing a clearer view of underlying price trends.", "trap": "Different from headline inflation, which includes all items.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 897, "en": "marginal propensity to consume (MPC)", "pl": "znaczenie dodatkowe wydatków na konsumpcję", "def": "The proportion of an additional unit of income that a consumer spends on goods and services.", "trap": "Contrast with marginal propensity to save (MPS), which measures how much of an extra unit of income is saved.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 898, "en": "velocity of money", "pl": "szybkość obrotu pieniądza", "def": "A measure of the frequency with which one unit of currency is spent within an economy over a given period.", "trap": "Velocity of money is an important indicator of economic health but can be influenced by various factors including financial innovation and changes in consumer behavior.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 899, "en": "sterilized foreign exchange intervention", "pl": "neutralizowane interwencja na rynku wymiany walut", "def": "A monetary policy tool where a central bank buys or sells foreign currency in the open market while simultaneously taking offsetting measures to neutralize the impact on domestic money supply.", "trap": "Sterilized intervention is often misunderstood as having no impact on monetary policy; however, it still affects the currency's value and interest rates.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 900, "en": "capital flight", "pl": "wyprzedaż kapitału zagranicznego", "def": "The large-scale movement of financial assets out of a country, often in response to economic instability or political unrest.", "trap": "Capital flight is distinct from foreign direct investment (FDI); it refers specifically to short-term movements of financial assets rather than long-term investments.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 901, "en": "cyclical unemployment", "pl": "nieaktywność cykliczna", "def": "Unemployment that rises and falls with the business cycle, often associated with economic recessions and expansions.", "trap": "Distinguish from structural unemployment, which is caused by long-term changes in the economy.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 902, "en": "fiscal cliff", "pl": "kliff fiskalny", "def": "A situation where significant automatic reductions in government spending and increases in taxes occur simultaneously, potentially causing a severe economic downturn.", "trap": "Not to be confused with a gradual fiscal adjustment or a phased implementation of policy changes.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 903, "en": "price level targeting", "pl": "celowanie poziomu cen", "def": "An inflation targeting framework where central banks aim to maintain a stable price level over time.", "trap": "It should not be confused with price ceiling policies.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 904, "en": "sticky wages", "pl": "trwałe wynagrodzenia", "def": "A situation where wages do not adjust quickly to changes in the overall price level or economic conditions.", "trap": "It is different from wage flexibility policies.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 905, "en": "fiscal crowding out", "pl": "zajeczność fiskalna", "def": "A phenomenon where increased government spending or borrowing crowds out private sector investment and consumption.", "trap": "It should not be confused with fiscal stimulus.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 906, "en": "stagflationary spiral", "pl": "pętla stagflacyjna", "def": "A self-reinforcing process where both inflation and unemployment increase simultaneously.", "trap": "Confusing it with a normal economic recession where only one of these factors prevails.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 907, "en": "fiscal austerity measures", "pl": "środki austrijskie fiskalne", "def": "Government actions aimed at reducing budget deficits by cutting spending or increasing taxes.", "trap": "Confusing it with fiscal stimulus, which aims to boost economic activity through increased spending or tax cuts.", "category": "Macroeconomics & Monetary Policy", "source": "dogenerowane"}, {"id": 908, "en": "Withholding Tax Optimization", "pl": "Optymalizacja podatku od源泉", "def": "The process of reducing withholding taxes through strategic planning and legal means.", "trap": "This is not about avoiding taxes illegally but rather optimizing within legal bounds.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 909, "en": "Tax Shield Utilization", "pl": "Zastosowanie pomostu podatkowego", "def": "The strategic use of tax shields to reduce taxable income and lower overall tax liability.", "trap": "Tax shield refers to legitimate tax-saving mechanisms, not illegal avoidance.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 910, "en": "BEPS Action Plan Implementation", "pl": "Implementacja Planu Działalności BEPS", "def": "The execution of a comprehensive strategy to comply with the OECD's Base Erosion and Profit Shifting (BEPS) initiatives.", "trap": "This involves proactive measures, not just reactive adjustments.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 911, "en": "Double Taxation Treaty Review and Update", "pl": "Przegląd i aktualizacja Umowy o podwójne opodatkowanie", "def": "The process of reviewing and updating double taxation treaties to address new economic realities and tax laws.", "trap": "This requires staying current with international tax law changes.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 912, "en": "Corporate Tax Residency Assessment", "pl": "Ocena przynależności podatkowej firmy", "def": "The process of determining a company's tax residency status based on specific legal and operational criteria.", "trap": "This involves complex legal analysis, not just simple location checks.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 913, "en": "tax optimization framework", "pl": "ramka optymalizacji podatkowej", "def": "A structured approach for minimizing tax liabilities while adhering to legal requirements.", "trap": "Not to be confused with illegal tax avoidance practices.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 914, "en": "tax jurisdiction dispute", "pl": "spór o prawa podatkowe", "def": "A disagreement between tax authorities or entities regarding the correct application of tax laws.", "trap": "Can lead to significant legal and financial repercussions.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 915, "en": "fiscal risk assessment", "pl": "ocena ryzyka podatkowego", "def": "A comprehensive examination to identify and quantify potential tax liabilities and risks.", "trap": "Requires thorough understanding of local and international tax laws.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 916, "en": "tax credit utilization strategy", "pl": "strategia wykorzystania kredytów podatkowych", "def": "A strategic approach aimed at maximizing tax benefits through available credits and incentives.", "trap": "Not all credits are applicable or beneficial in every jurisdiction.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 917, "en": "tax compliance monitoring", "pl": "monitorowanie zgodności podatkowej", "def": "The continuous process of ensuring that an organization is in compliance with all relevant tax laws and regulations.", "trap": "Requires ongoing effort to keep up with changing tax codes.", "category": "Taxation & Fiscal Optimization", "source": "dogenerowane"}, {"id": 918, "en": "Currency Basket Hedging", "pl": "Korepetycja koszyka walutowego", "def": "A strategy involving the use of a portfolio of currencies to hedge against currency risk.", "trap": "This is not to be confused with single-currency hedging, which uses only one currency for protection.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 919, "en": "Spot-Foreign Exchange Market", "pl": "Market Spotowy Walutowy", "def": "The market for foreign currency transactions that are settled on the second business day after the trade date.", "trap": "It's important not to confuse this with the forward market, which deals with future settlements.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 920, "en": "Currency Pegging", "pl": "Pegowanie Walut", "def": "A monetary policy in which a currency's value is fixed relative to another currency or a basket of currencies.", "trap": "This should not be mistaken for free-floating exchange rates, where market forces determine the value.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 921, "en": "Foreign Exchange Reserves", "pl": "Reserve Walutowe", "def": "A country's foreign currency holdings and other assets held by the central bank to ensure its ability to meet foreign debt obligations and maintain exchange rate stability.", "trap": "It's crucial to distinguish between foreign exchange reserves and domestic financial assets.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 922, "en": "Quorum rule", "pl": "Zasada kworumatu", "def": "A formal requirement specifying the minimum number of attendees necessary for a meeting to proceed.", "trap": "Confusion with 'quorum' which means the minimum number itself.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 923, "en": "Minutes approval", "pl": "Zatwierdzenie aktów zjeczynu", "def": "The process of reviewing and formally accepting the minutes of a meeting.", "trap": "Mixing up with 'minute-taking' which is the act of recording.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 924, "en": "Motion to suspend", "pl": "Zmowa o zawieszeniu", "def": "A formal proposal to temporarily halt or postpone a discussion, meeting, or decision-making process.", "trap": "Confusion with 'adjournment' which is a formal end of a meeting.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 925, "en": "Stakeholder alignment strategy", "pl": "Strategia wyrównania interesów uczestników", "def": "A strategic approach to ensure that stakeholders' interests are in harmony with the organization's objectives.", "trap": "Mistaking it for 'stakeholder management plan', which focuses on managing rather than aligning interests.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 926, "en": "Win-win negotiation technique", "pl": "Technika win-win w negocjacjach", "def": "A negotiation approach aimed at achieving a mutually satisfactory outcome for all parties involved.", "trap": "Confusion with 'zero-sum game' which implies a competitive approach where one party's gain results in another's loss.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 927, "en": "Equity stake buyback", "pl": "Zakup z powrotem udziałów w akcji", "def": "A corporate policy allowing employees to sell back a portion of their equity holdings to the company.", "trap": "Not to be confused with stock option vesting, where employees earn the right to purchase shares over time.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 928, "en": "Severance package negotiation", "pl": "Negocjacje pakietu rozliczeniowego", "def": "The process of negotiating the terms and conditions of severance pay with departing employees.", "trap": "Ensure understanding that this is distinct from a golden handshake, which typically involves larger payouts and more favorable terms.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 929, "en": "Performance-based equity allocation", "pl": "Rozłożenie akcji zależne od wyników", "def": "A compensation strategy where employees receive equity or stock options based on their performance metrics.", "trap": "This should not be confused with fixed equity grants, which are typically given regardless of individual performance.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 930, "en": "Non-compete covenant enforcement", "pl": "Angażowanie umowy o niebieganie", "def": "The process of ensuring that employees adhere to non-compete clauses in their employment contracts.", "trap": "It's important to distinguish this from non-solicitation agreements, which focus on preventing soliciting of employees.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 931, "en": "Clawback mechanism implementation", "pl": "Zaimplementowanie mechanizmu odciągania", "def": "The process of implementing a clause that allows the company to reclaim bonuses or other compensation if certain conditions are not met.", "trap": "This should be differentiated from termination benefits, which are given upon leaving the company.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 932, "en": "Headhunting firm engagement", "pl": "Angażowanie agencji połączeń biznesowych", "def": "The process of hiring an external recruitment firm to find and attract top-level executives for the company.", "trap": "This is not the same as an internal recruitment process or career development program.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 933, "en": "Equity vesting schedule", "pl": "harmonogram odweselczania udziałów w akcjach", "def": "A predetermined timeline for the release of equity or stock options to employees.", "trap": "Be cautious of the difference between 'cliff' (a large initial restriction) and gradual vesting.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 934, "en": "Severance pay negotiation", "pl": "negocjacje o wynagrodzeniu zwolnieniowym", "def": "The process of discussing and agreeing upon severance benefits provided to an employee upon termination.", "trap": "Be aware that severance negotiations often involve complex legal considerations and varying regional regulations.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 935, "en": "Collective bargaining agreement", "pl": "porozumienie kogokolwiek", "def": "A legally binding agreement between an employer and a group of employees' representatives setting terms and conditions of employment.", "trap": "Differences between collective bargaining agreements and individual contracts; ensure distinction.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 936, "en": "Glass ceiling effect", "pl": "efekt szklanej sufitu", "def": "The phenomenon where employees encounter an invisible barrier preventing them from advancing beyond a certain level in their career.", "trap": "Understand that the glass ceiling is often subtle and can manifest differently across various demographics.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 937, "en": "Retention bonus structure", "pl": "struktura nagrody za lojalność", "def": "A compensation plan designed to reward employees for remaining with the company for a specified period.", "trap": "Retention bonuses are not the same as performance-based bonuses; ensure proper differentiation.", "category": "Human Resources, Labor & Compensation", "source": "dogenerowane"}, {"id": 938, "en": "Tenant Improvement Allowance (TIA)", "pl": "Odpłatność za przygotowanie lokalu użytkownika", "def": "A payment made by the landlord to the tenant for the purpose of improving or upgrading the leased property.", "trap": "Do not confuse with Tenant Work Letter (TWL), which outlines the scope of work required.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 939, "en": "Anchor Tenant", "pl": "Kluczowy użytkownik", "def": "A major tenant in a shopping center or commercial property that attracts other tenants and helps drive foot traffic.", "trap": "Ensure understanding of the role it plays in attracting other tenants.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 940, "en": "Break Clause", "pl": "Klauzula o zakończeniu leasingu", "def": "A clause in a lease agreement that allows either party to terminate the lease under specific conditions or after notice.", "trap": "Distinguish from renewal options, which typically require negotiation.", "category": "Real Estate & Commercial Leasing", "source": "dogenerowane"}, {"id": 941, "en": "Interest Rate Swap (IRS)", "pl": "Zmiana Stopy Procentowej", "def": "A financial derivative contract between two parties to exchange interest rate payments.", "trap": "IRS is not related to stock market swaps.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 942, "en": "Revolving Credit Line", "pl": "Linia Kredytowa Wobecnych", "def": "A type of loan that allows the borrower to draw funds up to a specified limit repeatedly.", "trap": "Revolving credit is not the same as a term loan.", "category": "Banking & Credit Facilities", "source": "dogenerowane"}, {"id": 943, "en": "Initial Public Offering (IPO) pricing", "pl": "Ceny oferty publicznej (IPO)", "def": "The process of determining the share price during an IPO.", "trap": "Be cautious of confusing IPO pricing with other capital raising methods.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 944, "en": "Greenshoe option", "pl": "Opcja zielonych butelek (greenshoe option)", "def": "An option granted to the underwriter in an IPO to purchase additional shares if demand exceeds expectations.", "trap": "Remember that greenshoe options are specific to IPOs and not applicable to secondary market trades.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 945, "en": "Credit spread", "pl": "Rozwijka kredytowa (credit spread)", "def": "The difference in yield between a risk-free bond and a corporate bond of similar maturity.", "trap": "Credit spread should not be confused with interest rate spread.", "category": "Capital Markets & Securities", "source": "dogenerowane"}, {"id": 946, "en": "Decarbonization Strategy", "pl": "Strategia Dezakwantyfikacji Węgla", "def": "A comprehensive plan aimed at reducing a company's carbon footprint through various initiatives and technologies.", "trap": "Decarbonization Strategy is often confused with Carbon Offsetting, but it involves active reduction rather than compensation.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 947, "en": "Corporate Governance Framework", "pl": "Ramowisko Zasobów Rządzenia Podmiotów Gospodarczych (RZPRPG)", "def": "A set of policies, procedures, and guidelines that define how a company is governed and operated.", "trap": "Corporate Governance Framework is distinct from Business Conduct Guidelines, though they are related.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 948, "en": "Impact Investment Fund", "pl": "Fundusz Inwestycyjny Wpływowy", "def": "An investment fund that seeks to generate social or environmental impact alongside financial returns.", "trap": "Impact Investment Fund is different from Traditional Investment Fund, which focuses primarily on financial return.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 949, "en": "Sustainable Procurement Policy", "pl": "Polityka Wnętrzna Wsparcia Sustentacji (PWWS)", "def": "A policy that ensures the purchase of goods and services aligns with sustainability criteria.", "trap": "Sustainable Procurement Policy should not be confused with Cost-cutting Procurement Policy, which focuses on minimizing costs.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 950, "en": "Transparency Reporting Standard", "pl": "Standard Zgłaszania Transparancji", "def": "A set of guidelines that outlines the type and format of information companies must disclose to stakeholders.", "trap": "Transparency Reporting Standard is different from Confidentiality Policy, which focuses on keeping information secret.", "category": "ESG, Sustainability & Corporate Ethics", "source": "dogenerowane"}, {"id": 951, "en": "Preferred Return", "pl": "Zwrot preferencyjny", "def": "A minimum rate of return guaranteed to preferred investors before profits are distributed to other stakeholders.", "trap": "Distinct from overall fund returns.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 952, "en": "Secondary Market Exit Strategy", "pl": "Strategia wyjścia z rynku sekundarnego", "def": "A method of selling a stake in a private equity portfolio company through the secondary market.", "trap": "Different from primary market exits.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 953, "en": "Irrational Exuberance", "pl": "Nierozsądna ekscytacja", "def": "A state of extreme optimism and overconfidence in the market value of assets, often leading to speculative bubbles.", "trap": "Can lead to market crashes.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 954, "en": "Exit Clause", "pl": "Klauzula wyjścia", "def": "A contractual provision that outlines the conditions under which a private equity investment can be exited.", "trap": "Can impact deal structure significantly.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 955, "en": "Synergy Effect", "pl": "Efekt synergiczny", "def": "The combined benefits of two or more companies operating together, leading to increased efficiency and profitability.", "trap": "Not always guaranteed.", "category": "Private Equity & Venture Capital", "source": "dogenerowane"}, {"id": 956, "en": "Blockchain interoperability protocol", "pl": "protokół komunikacji międzyblokowej", "def": "A standard or protocol that allows different blockchain networks to communicate and exchange data seamlessly.", "trap": "This term is distinct from 'blockchain compatibility,' which refers to the ability of different blockchains to work together but may not involve seamless data exchange.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 957, "en": "Digital asset liquidity provider", "pl": "dostawca płynności dla aktywów cyfrowych", "def": "A financial institution that ensures the smooth buying and selling of digital assets by providing necessary liquidity.", "trap": "This term is not to be confused with 'digital wallet provider,' which focuses on storing and managing digital assets rather than ensuring their liquidity.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 958, "en": "Open banking API standardization", "pl": "standardyzacja interfejsów API otwartej bankowości", "def": "The process of creating a consistent set of application programming interfaces (APIs) for open banking to facilitate data sharing and integration.", "trap": "This term differs from 'open banking API development,' which refers to creating new APIs rather than ensuring consistency across existing ones.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 959, "en": "Biometric authentication enhancement", "pl": "wzmocnienie uwierzytelniania biometycznego", "def": "The process of improving the accuracy and security of biometric authentication methods used in financial transactions.", "trap": "This term should not be mistaken for 'biometric authentication deployment,' which focuses on implementing new systems rather than improving existing ones.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 960, "en": "Distributed ledger technology scalability solution", "pl": "rozwiązanie skalowalności technologii łańcuchów rozproszonych", "def": "A strategy or tool designed to increase the capacity and efficiency of distributed ledger technology (DLT) networks.", "trap": "This term is distinct from 'distributed ledger technology optimization,' which focuses on improving existing DLT performance without necessarily increasing capacity.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 961, "en": "Regulatory sandbox monitoring framework", "pl": "ramka monitoringu rynku piaskownicznego regulacyjnego", "def": "A structured system for overseeing and ensuring compliance with regulations in a regulatory sandbox environment.", "trap": "This term should not be confused with 'regulatory sandbox testing,' which involves experimenting with new technologies within a controlled environment rather than strictly monitoring compliance.", "category": "Fintech, Payments & Digital Assets", "source": "dogenerowane"}, {"id": 962, "en": "Consolidated financial reporting", "pl": "Zespołowy sprawozdanie finansowe", "def": "A single set of financial statements that summarizes the activities of a parent company and its subsidiaries.", "trap": "Note that 'consolidated' refers to combining multiple entities, not just one.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 963, "en": "Deferred revenue recognition", "pl": "Odroczenie rozliczenia przychodów", "def": "The process of recognizing revenue at a different point in time than when the service or product is provided.", "trap": "Be careful not to confuse with 'accrued revenue', which refers to revenue that has been earned but not yet received.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 964, "en": "Impairment testing of intangible assets", "pl": "Badanie zaostrzenia wartości majątku niewidocznej", "def": "The process of determining whether an intangible asset's carrying amount exceeds its recoverable amount.", "trap": "Remember that impairment specifically relates to reducing the value, not increasing it.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 965, "en": "Forensic accounting analysis", "pl": "Analiza kontobankowa badawcza", "def": "A detailed examination of financial records to detect fraud or other irregularities.", "trap": "Forensic accounting is more rigorous than regular auditing and often involves legal implications.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 966, "en": "Balance sheet reconciliation process", "pl": "Proces zrównoważenia sprawozdania balansowego", "def": "The method of ensuring that all financial records for a specific period are accurate and consistent.", "trap": "Reconciliation involves comparing accounts to ensure they match, not just correcting them.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 967, "en": "Revaluation surplus", "pl": "nadwyżka oznaczona wartością", "def": "A positive difference arising from the revaluation of assets to their fair value.", "trap": "This term refers specifically to gains, not losses.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 968, "en": "Intangible assets impairment review", "pl": "badanie uszkodzenia majątku nienaruszalnego", "def": "A process to assess whether an intangible asset's carrying amount exceeds its recoverable amount.", "trap": "This is a specific type of impairment testing, focusing on intangibles.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 969, "en": "Deferred tax valuation allowance", "pl": "pozwolenie na oznaczenie wartości z opóźnionego podatku", "def": "An asset recognized in the balance sheet representing future tax benefits.", "trap": "This term specifically refers to assets, not liabilities.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 970, "en": "Contingent consideration analysis", "pl": "analiza potencjalnych zapłat zależnych", "def": "An evaluation of potential future payments or receipts contingent on future events.", "trap": "This involves both payments and receipts, not just liabilities.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 971, "en": "Equity method of accounting for investments", "pl": "metoda rachunkowości udziałów akcyjnych", "def": "An accounting method used to account for investments where the investor has significant influence but not control.", "trap": "This is distinct from the cost method and consolidation.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 972, "en": "Consolidated statement of cash flows", "pl": "zjednoczony bilans wpływów i wydatków", "def": "A financial statement that aggregates the cash flows of parent and subsidiary companies.", "trap": "This is different from individual company cash flow statements.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 973, "en": "Consolidated Intercompany Eliminations", "pl": "Wyrównania międzyfirmy w ramach scalonych sprawozdań finansowych", "def": "The process of removing intercompany transactions to prevent double-counting in consolidated financial statements.", "trap": "Confusing with 'Elimination Entries' used in general accounting, which might lead to double-counting.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 974, "en": "Revenue Smoothing", "pl": "Zgładzanie dochodów", "def": "The practice of adjusting revenue recognition over time to achieve a consistent level of earnings.", "trap": "Misinterpretation as 'Earnings Management', which is illegal, whereas Revenue Smoothing can be legal but requires careful documentation.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 975, "en": "Impairment of Goodwill", "pl": "Obniżenie wartości dobra wiarygodności", "def": "The process of reducing the carrying amount of goodwill when it is determined that its recoverable amount is lower than its carrying amount.", "trap": "Confusion with 'Receivables Impairment', which pertains specifically to accounts receivable.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 976, "en": "Deferred Tax Considerations in Consolidation", "pl": "Zagadnienia podatków odroczonego w kontekście scalonych sprawozdań finansowych", "def": "The accounting process that considers the impact of deferred taxes in the consolidation of financial statements.", "trap": "Mistaking with 'Intercompany Tax Adjustments', which focuses on tax between related parties rather than consolidation.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 977, "en": "Contingent Liabilities with Known Probable Outcomes", "pl": "Zależne zobowiązania z wyznaczonym prawdopodobnym wynikiem", "def": "A contingent liability where the potential loss is probable and can be reasonably estimated.", "trap": "Confusing with 'Remote Contingent Liabilities', which have only a small probability of occurring.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 978, "en": "Earnings Before Interest and Taxes (EBIT)", "pl": "Zysk zanim odsetki i podatek", "def": "A measure of a company's operating profitability that excludes interest payments and taxes.", "trap": "Mistaking with 'Net Profit', which includes all expenses, including taxes.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 979, "en": "IFRS harmonization", "pl": "harmonizacja standardów IFRS", "def": "The process of aligning national accounting standards with International Financial Reporting Standards (IFRS).", "trap": "Ensure not to confuse with 'IFRS compliance', which refers to adherence rather than alignment.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 980, "en": "Revenue recognition principles", "pl": "zasady rozpoznawania przychodów", "def": "A set of rules and criteria that determine when and how a company recognizes revenue in its financial statements.", "trap": "Be aware that these differ from 'sales recognition', which typically refers to recording sales transactions.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 981, "en": "Deferred tax provisions", "pl": "ustawienia opóźnionej podatności", "def": "Financial statements entries representing the difference between the amount of current taxes and the amount of deferred taxes.", "trap": "Do not mix up with 'provision for taxes', which is a different concept related to estimated future liabilities.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 982, "en": "Accruals and prepayments accounting", "pl": "księgowanie oczekiwań i zapłat", "def": "The practice of recording financial transactions based on when revenue is earned or expenses are incurred, rather than when cash changes hands.", "trap": "Ensure understanding that 'cash basis accounting' is the alternative method.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 983, "en": "Depreciation and amortization methods", "pl": "metody wywodzenia i amortyzacji", "def": "Various approaches used to allocate the cost of a tangible or intangible asset over its useful life.", "trap": "Be cautious not to confuse 'depreciation' with 'amortization', as they apply differently to tangible versus intangible assets.", "category": "Accounting, Audit & Reporting", "source": "dogenerowane"}, {"id": 984, "en": "interest rate cap", "pl": "kupony ograniczające stopy procentowe", "def": "A financial derivative that limits the maximum interest rate a borrower will pay over a specified period.", "trap": "Do not confuse with an interest rate floor, which provides a minimum interest rate.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 985, "en": "currency overlay", "pl": "nakładka walutowa", "def": "A strategic investment approach that involves taking on additional currency risk to achieve higher returns or protect against inflation.", "trap": "It is distinct from traditional currency hedging, which aims to eliminate risk.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 986, "en": "Over-the-counter (OTC) derivatives", "pl": "derivatywny rynek poza giełdą", "def": "Financial instruments traded directly between parties outside of an exchange.", "trap": "OTC derivatives are not standardized and may involve higher counterparty risks.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 987, "en": "Spot foreign exchange contract", "pl": "kontrakt wymiany walut spot", "def": "A financial instrument for immediate currency exchange with a predefined rate.", "trap": "Spot contracts differ from forward contracts, which involve future settlement dates.", "category": "Forex & Derivatives Trading", "source": "dogenerowane"}, {"id": 988, "en": "Agenda item prioritization", "pl": "Priorytetyzacja punktów porządku dnia", "def": "The process of assigning relative importance to items on a meeting agenda.", "trap": "Do not confuse with 'agenda setting,' which is about creating the agenda itself.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 989, "en": "Concession negotiation strategy", "pl": "Strategia zezwolenia na kompromis", "def": "A negotiation approach where one party makes concessions to reach an agreement.", "trap": "Avoid using 'concession' in a negative context; it should be seen as part of a balanced negotiation process.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 990, "en": "Deadlock prevention mechanism", "pl": "Mechanizm zapobiegania zapadzieczeniowi", "def": "A process or strategy designed to prevent negotiations from reaching a deadlock.", "trap": "Deadlock prevention is not just about avoiding impasse but also about maintaining open lines of communication.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 991, "en": "Stakeholder alignment facilitator", "pl": "Współautor zapewnienia zgodności interesariuszy", "def": "A person responsible for ensuring that all stakeholders are aligned with the objectives and decisions of a project or organization.", "trap": "Alignment does not mean unanimous agreement; it involves managing diverse interests to move towards a common goal.", "category": "Operations & Business Communication", "source": "dogenerowane"}, {"id": 992, "en": "Value Proposition Map", "pl": "Mapa Wartości Propozycyjnej", "def": "A graphical tool used to visualize the unique value a product or service offers to customers.", "trap": "This is not to be confused with Value Proposition Canvas, which is already in the database.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 993, "en": "Competitive Advantage Framework", "pl": "Ramka Korzyści Kompetycyjnych", "def": "A strategic tool for evaluating and enhancing the competitive position of a business.", "trap": "This is distinct from Competitive Landscape Analysis, which focuses on broader industry trends.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 994, "en": "Price Leadership Strategy", "pl": "Strategia Dominacji Cennych", "def": "A pricing strategy where a company sets the price for its products or services and competitors follow.", "trap": "This strategy is different from Market Penetration Pricing, which focuses on capturing a larger share of an existing market.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 995, "en": "Customer Lifetime Value (CLV) Model", "pl": "Model Wartości Życiowej Klienta", "def": "A financial metric used to assess the net profit attributed to a customer over their entire relationship with a company.", "trap": "This is distinct from Customer Acquisition Cost (CAC), which focuses on the cost of acquiring new customers.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 996, "en": "Strategic Positioning Framework", "pl": "Ramka Pozycjonowania Strategicznego", "def": "A tool used to define the target market and competitive position of a product or service.", "trap": "This is distinct from Value Proposition Canvas, which focuses on creating unique value propositions.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 997, "en": "Competitive Differentiation Matrix", "pl": "Macierz Dyskryminacji Kompetycyjnej", "def": "A matrix used to analyze competitive products or services in terms of their unique features and benefits.", "trap": "This is distinct from Differentiation Strategy, which focuses on creating unique value propositions.", "category": "Marketing, Strategy & Pricing", "source": "dogenerowane"}, {"id": 998, "en": "creditor's petition", "pl": "wyrok kredytora", "def": "A formal request made by a creditor to a court for the insolvency of a debtor.", "trap": "Not to be confused with 'bankruptcy filing', which is initiated by the debtor.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 999, "en": "debt moratorium", "pl": "wstrzymanie płatności długów", "def": "A temporary suspension of debt payments imposed by law or agreement.", "trap": "This is distinct from 'debt restructuring', which involves modifying terms rather than halting payments.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 1000, "en": "receivership order", "pl": "wyrok na nadzór nadmiernika", "def": "A person who officially deals with the business matters of companies who cannot pay their debts.", "trap": "Confuse with 'liquidation proceedings', which are broader in scope.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 1001, "en": "debt-to-equity conversion", "pl": "konwersja długów na udział akcyjny", "def": "The process of converting debt obligations into equity shares in a company.", "trap": "This is different from 'debt-to-equity swap', which involves swapping one debt instrument for equity.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 1002, "en": "priority of claims", "pl": "priorytet roszczeń", "def": "The order in which creditors are paid during insolvency proceedings.", "trap": "Do not confuse with 'priority creditor', which refers to a specific type of creditor.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 1003, "en": "fraudulent conveyance", "pl": "zakłócający prawo przekazanie majątku", "def": "The transfer of assets with the intent to defraud creditors.", "trap": "This term is often used in legal contexts and can lead to severe consequences.", "category": "Insolvency, Turnaround & Distressed Debt", "source": "dogenerowane"}, {"id": 1004, "en": "to incur debts", "pl": "zaciągnąć długi / popaść w zadłużenie (bardzo formalne C1)", "def": "To become legally subject to or liable for a financial debt as a consequence of borrowing or financial losses.", "trap": "Formalne słowo C1: to incur (nie mówimy *to take a debt*, lecz *to incur a debt* lub *to take on debt*).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1005, "en": "to take on debt", "pl": "wziąć dług / podjąć zadłużenie (zdecydować się na finansowanie długiem)", "def": "To voluntarily accept or assume financial debt obligations, typically to finance investments or operations.", "trap": "Zwrot korporacyjny: to take ON debt (z przyimkiem on).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1006, "en": "to run out of cash / funds", "pl": "wyczerpać gotówkę / stracić płynność finansową (skończyły się pieniądze)", "def": "To completely exhaust all available liquid capital or cash reserves.", "trap": "KLUCZOWA PUŁAPKA C1: RUN OUT OF = skończyć się (pieniądze się skończyły); RUN UP = nawarstwić / narobić (długów).", "category": "Money & Currency", "source": "lekcja"}, {"id": 1007, "en": "to call in a loan", "pl": "zażądać natychmiastowej spłaty kredytu / postawić kredyt w stan wymagalności", "def": "For a creditor or bank to formally demand the immediate and full repayment of a loan or credit facility.", "trap": "Nie oznacza zadzwonić! To call in a loan = wymusić natychmiastową spłatę przez bank.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1008, "en": "to clear / pay off a debt", "pl": "całkowicie spłacić dług / uregulować saldo do zera", "def": "To reimburse the full principal balance and all interest of a debt, settling the account completely.", "trap": "Rozróżnij: to service debt = płacić regularnie raty/odsetki; to clear/pay off a debt = spłacić dług całkowicie.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1009, "en": "to roll over a debt", "pl": "zrolować dług (przedłużyć termin spłaty lub zaciągnąć nowy dług na spłatę starego)", "def": "To replace a maturing debt obligation with a new one or extend the maturity date rather than paying it off in cash.", "trap": "Rzeczownik: debt rollover (rolowanie długu). Ryzyko, że bank nie przedłuży finansowania, to rollover risk.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1010, "en": "recession", "pl": "recesja (spadek PKB przez co najmniej 2 kwartały z rzędu)", "def": "A significant and widespread decline in economic activity across an economy, technically defined as two consecutive quarters of negative GDP growth.", "trap": "Techniczna definicja ekonomiczna: dokładnie 2 kolejne kwartały ujemnego realnego PKB. Głębsza i dłuższa recesja przechodzi w depresję (depression).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1011, "en": "economic depression", "pl": "depresja gospodarcza (długotrwały, głęboki kryzys ekonomiczny)", "def": "A severe and sustained long-term downturn in economic activity that is much more catastrophic and prolonged than a normal recession.", "trap": "Hierarchia kryzysów: Downturn (spowolnienie) -> Recession (recesja, min. 2 kwartały) -> Depression (wielka wieloletnia zapaść).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1012, "en": "market crash / stock market crash", "pl": "krach giełdowy (nagłe, gwałtowne załamanie cen akcji)", "def": "A sudden, dramatic, and unanticipated plunge in stock prices across a significant cross-section of a stock market, triggered by panic selling.", "trap": "Różnica: Correction (korekta) = spadek o 10-20%; Bear market = spadek >20%; Crash = nagłe pęknięcie bańki w ciągu godzin/dni.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1013, "en": "economic downturn", "pl": "spowolnienie gospodarcze / załamanie koniunktury", "def": "A period when business activity decreases, consumer spending drops, and macroeconomic indicators weaken.", "trap": "Przeciwieństwo: economic upturn / expansion (ożywienie/wzrost koniunkturalny).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1014, "en": "economic slump", "pl": "zapaść gospodarcza / gwałtowny spadek popytu i produkcji", "def": "A sudden severe or prolonged fall in the price, value, or amount of something, crisis.", "trap": "Definicja lektorki: 'a sudden severe or prolonged fall in the price, value, or amount of something, crisis'. Może być rzeczownikiem lub czasownikiem ('sales slumped').", "category": "Finance & Corporate Law", "source": "lekcja_handout_matching"}, {"id": 1015, "en": "boom and bust", "pl": "cykl hossy i bessy (okres gwałtownego wzrostu, po którym następuje krach)", "def": "A macroeconomic cycle characterized by alternating phases of rapid economic expansion followed by sharp contraction or collapse.", "trap": "Zwrot: The boom-and-bust cycle of capitalism. Przymiotnik: boom-and-bust (z dywizami).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1016, "en": "stock market", "pl": "giełda papierów wartościowych", "def": "A regulated public financial market where shares of publicly held companies and other securities are issued, bought, and sold.", "trap": "Stock market to rynek jako całość; stock exchange to konkretna instytucja (np. Warsaw Stock Exchange, NYSE).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1017, "en": "shares / stocks", "pl": "akcje (równe jednostki kapitału spółki akcyjnej)", "def": "Equal units of ownership into which a corporation's capital is divided, entitling the holder to a proportion of profits and assets.", "trap": "UK zazwyczaj mówi shares, US zazwyczaj mówi stocks (lub equities na rynkach kapitałowych).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1018, "en": "financial forecast / earnings forecast", "pl": "prognoza finansowa / prognoza zysków i wyników", "def": "A detailed projection of future financial performance, sales, cash flows, or economic indicators based on historical trends and analysis.", "trap": "Czasownik nieregularny: forecast: forecast: forecast (forma forecasted też występuje, ale w C1 preferuje się forecast).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1019, "en": "profit margin", "pl": "marża zysku (stosunek zysku do przychodów ze sprzedaży)", "def": "A key profitability ratio calculated as profit divided by revenue, measuring how many cents of profit a business retains per dollar of sales.", "trap": "Wzór: Profit Margin = (Net Income / Revenue) * 100%. Nie mylić z narzutem (markup)!", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 1020, "en": "pre-tax profits / profit before tax (PBT)", "pl": "zysk przed opodatkowaniem (PBT / zysk brutto firmy)", "def": "A company's total operating and non-operating earnings before deductions for corporate income taxes.", "trap": "Skrót PBT (Profit Before Tax). Jest to zysk po potrąceniu odsetek, ale PRZED zapłaceniem podatku dochodowego.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 1021, "en": "annual turnover", "pl": "roczny obrót / roczny przychód ze sprzedaży", "def": "The total amount of monetary revenue generated by a business through the sale of goods and services over the course of a fiscal year.", "trap": "Turnover w British English oznacza przychód ze sprzedaży (Revenue). W HR turnover to rotacja pracowników!", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 1022, "en": "capital gains / capital losses", "pl": "zyski kapitałowe (wzrost wartości sprzedanego aktywa / akcji)", "def": "The positive difference between an asset's selling price and its initial purchase price, realized upon sale.", "trap": "Podatek od zysków kapitałowych (podatek Belki w Polsce) to Capital Gains Tax (CGT).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1023, "en": "to bail someone out / to bail out a company", "pl": "uratować finansowo przed bankructwem / udzielić rządowej pomocy ratunkowej", "def": "To provide financial assistance, capital, or guarantees to rescue a failing corporation, bank, or economy from imminent bankruptcy.", "trap": "Phrasal verb: to bail somebody/something OUT. Rzeczownik pisany łącznie: a bailout (np. taxpayer-funded bailout).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1024, "en": "to go bankrupt / to become insolvent", "pl": "zbankrutować / stać się niewypłacalnym", "def": "To become legally declared unable to pay outstanding financial obligations and debt liabilities.", "trap": "C1 Verb Collocation: to GO bankrupt (z czasownikiem go, a nie *make* czy *have*!). Rzeczownik: bankruptcy.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1025, "en": "to recover / economic recovery", "pl": "odbić się od dna / wyjść z kryzysu (o rynkach, gospodarce lub spółce)", "def": "To return to a normal, healthy financial condition after enduring a period of difficulty, decline, or crisis.", "trap": "Rzeczownik to economic recovery. Zjawisko ożywienia bez nowych miejsc pracy to jobless recovery.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1026, "en": "to boom / booming markets", "pl": "przeżywać gwałtowny rozkwit / rozwijać się dynamicznie (o rynkach lub gospodarce)", "def": "To grow rapidly, trade successfully, and generate immense financial expansion.", "trap": "Czasownik: trade is booming. Rzeczownik: an economic boom (hossa/rozkwit). Przeciwieństwo: slump lub bust.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1027, "en": "savings / life savings", "pl": "oszczędności / oszczędności całego życia", "def": "Money accumulated and set aside over a long period, especially deposited in banks or retirement assets.", "trap": "Zawsze w liczbie mnogiej z s: my savings (nigdy *my saving* w znaczeniu odłożonych pieniędzy).", "category": "Money & Currency", "source": "lekcja"}, {"id": 1028, "en": "financial losses / heavy losses", "pl": "straty finansowe / ujemny wynik finansowy", "def": "A situation where a business or investor loses capital because total expenditures exceed total revenues or asset values decline.", "trap": "Zwroty: to suffer losses (ponieść straty), to cut one's losses (wycofać się w porę, by nie tracić więcej).", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 1029, "en": "real economy", "pl": "gospodarka realna (fizyczna produkcja, handel i usługi, w przeciwieństwie do rynków finansowych)", "def": "The sphere of economic activity concerned with the physical production of tangible goods and services, contrasted with paper speculation on financial markets.", "trap": "Podstawowy podział akademicki C1: Financial economy (giełda, derywaty, banki) vs Real economy (fabryki, płace, usługi).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1030, "en": "panic selling", "pl": "paniczna wyprzedaż (masowe pozbywanie się akcji w obawie przed dalszymi spadkami)", "def": "The rapid, large-scale liquidation of shares and securities driven by psychological fear, triggering a market crash.", "trap": "Psychologiczny motor każdego krachu (market crash). Przeciwieństwo: panic buying (paniczne wykupywanie).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 1031, "en": "to file for bankruptcy / to declare bankruptcy", "pl": "złożyć wniosek o upadłość w sądzie / ogłosić upadłość", "def": "Officially ask a court for something.", "trap": "Definicja lektorki: 'officially ask a court for something'. Zawsze łączy się z formą dopełnienia: file for bankruptcy, file for divorce.", "category": "Finance & Corporate Law", "source": "lekcja_handout_matching"}, {"id": 1032, "en": "to go bust", "pl": "splajtować / upaść finansowo (bardzo powszechne w prasie biznesowej)", "def": "For a business enterprise to become insolvent, exhaust all funds, and cease trading.", "trap": "Kluczowy zwrot w brytyjskiej prasie finansowej (FT, The Economist): to go bust. Przymiotnik: the company is bust.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1033, "en": "to go under", "pl": "pójść na dno / upaść finansowo (metafora tonącego statku)", "def": "To fail completely financially and be forced to dissolve or close down operations.", "trap": "Metafora biznesowa oznaczająca zatonąć w długach.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1034, "en": "to go belly up", "pl": "paść trupem / zbankrutować całkowicie (częsty idiom biznesowy C1)", "def": "A business idiom meaning to collapse financially and become bankrupt (derived from a dead fish floating belly-up).", "trap": "ULUBIONY IDIOM EGZAMINACYJNY C1: to go belly up = to go bankrupt / collapse.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1035, "en": "to go into administration", "pl": "przejść pod zarząd komisaryczny / postępowanie sanacyjne (UK)", "def": "A formal legal process where an insolvent company is placed under the control of an independent administrator to restructure debt and attempt to rescue the business as a going concern.", "trap": "Rozróżnij: Administration = próba RATOWANIA firmy; Liquidation = ostateczna wyprzedaż majątku i śmierć spółki.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1036, "en": "to go into liquidation / to wind up a company", "pl": "przejść w stan likwidacji / zlikwidować spółkę i wyprzedać majątek", "def": "The terminal legal phase of bankruptcy where business operations stop completely, all company assets are auctioned off, and proceeds are distributed to creditors.", "trap": "Czasownik: to wind up a company (/waɪnd ʌp/) = formalnie zamknąć i zlikwidować przedsiębiorstwo.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1037, "en": "to stave off bankruptcy", "pl": "oddalić widmo bankructwa / powstrzymać upadłość w ostatniej chwili", "def": "To temporarily avert, delay, or prevent imminent financial collapse through emergency measures, asset sales, or refinancing.", "trap": "Czasownik frazowy C1: to stave off (zażegnać / odeprzeć groźbę czegoś katastrofalnego).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 1038, "en": "cash-strapped", "pl": "cierpiący na brak gotówki / mający poważne problemy z płynnością", "def": "Experiencing a severe lack of liquid money or working capital, making it difficult to pay day-to-day bills.", "trap": "Przymiotnik: cash-strapped (z myślnikiem). Nie oznacza jeszcze bankructwa, lecz ostry kryzys płynnościowy (illiquidity).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1039, "en": "exorbitant", "pl": "wygórowany / astronomiczny / lichwiarski (o opłatach lub stopach procentowych)", "def": "(Of a price, fee, or interest rate) unreasonably or ridiculously high; far exceeding fair or standard market rates.", "trap": "C1 Przymiotnik: exorbitant (/ɪɡˈzɔː.bɪ.tənt/). Synonimy C1: extortionate, prohibitive, astronomical.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1040, "en": "current account", "pl": "rachunek bieżący / konto osobiste (ROR)", "def": "A regular bank account from which money can be withdrawn at any time by cashcard, transfer, or standing order, paying minimal interest.", "trap": "UK to current account; USA to checking account. Nie mylić z makroekonomicznym current account deficit (deficyt bilansu obrotów bieżących państwa)!", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1041, "en": "deposit account", "pl": "rachunek oszczędnościowy / konto depozytowe (z wyższym oprocentowaniem)", "def": "A bank account that earns higher interest than a standard current account, often with rules restricting immediate cash withdrawals.", "trap": "UK: deposit account / savings account; US: savings account lub certificate of deposit (CD).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1042, "en": "cash dispenser / ATM", "pl": "bankomat (urządzenie do wypłaty gotówki)", "def": "An automated computerized electronic machine that dispenses cash and offers banking services when a bank card is inserted.", "trap": "UK: cash dispenser lub cash machine; USA: ATM (Automated Teller Machine).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1043, "en": "standing order", "pl": "zlecenie stałe (cykliczny przelew o stałej kwocie)", "def": "An instruction by an account holder to a bank to pay a fixed, unvarying sum of money on regular specified dates to a named recipient.", "trap": "KLUCZOWA RÓŻNICA C1: Standing order = STAŁA KWOTA (np. czynsz); Direct debit = ZMIENNA KWOTA pobierana przez wystawcę (np. prąd, telefon).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1044, "en": "hire purchase (HP)", "pl": "zakup na raty / sprzedaż ratalna z zastrzeżeniem własności (HP)", "def": "A system of purchasing expensive consumer assets (like vehicles) where the buyer pays in regular instalments while renting the goods; legal ownership passes to the buyer only with the final payment.", "trap": "W hire purchase rzecz staje się Twoją własnością dopiero po wpłaceniu OSTATNIEJ raty!", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 1045, "en": "building society", "pl": "towarzystwo budowlano-kredytowe (brytyjska instytucja wzajemna oferująca kredyty hipoteczne)", "def": "A mutual financial organisation owned by its saving and borrowing members rather than shareholders, providing residential mortgages and savings accounts.", "trap": "Tradycyjna brytyjska instytucja typu mutual society (działa na rzecz członków, nie akcjonariuszy). Od
