<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprytnoodporny Test Słówek i Definicji C1</title>
<style>
:root {
  color-scheme: light;
  --akcent: #234a6b;
  --akcent-tlo: #eaf0f6;
  --papier: #fbfbf9;
  --karta: #ffffff;
  --tusz: #1a222b;
  --przygasly: #5d6b78;
  --slaby: #93a0ab;
  --linia: #e3e8ed;
  --dobrze: #2f6b4f;
  --dobrze-tlo: #eaf3ee;
  --zle: #8a3b3b;
  --zle-tlo: #f8efee;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--tusz);
  background: var(--papier);
  line-height: 1.6;
  font-size: 16px;
  max-width: 50rem;
  margin: 0 auto;
  padding: 0 20px 120px;
  -webkit-font-smoothing: antialiased;
}

header {
  padding: 32px 0 20px;
  border-bottom: 1px solid var(--linia);
  margin-bottom: 20px;
}

.tytul-glowny {
  font-size: 1.85rem;
  font-weight: 700;
  color: var(--akcent);
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}

.opis-metryki {
  font-size: 0.95rem;
  color: var(--przygasly);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.odznaka-test {
  display: inline-block;
  background: var(--akcent-tlo);
  color: var(--akcent);
  border: 1px solid var(--akcent);
  border-radius: 99px;
  padding: 4px 14px;
  font-size: 0.8rem;
  font-weight: 700;
}

/* PANEL STEROWANIA I KONFIGURACJI TESTU */
.panel-konfiguracji {
  background: var(--karta);
  border: 1px solid var(--linia);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.03);
}

.sekcja-konfig {
  margin-bottom: 16px;
}
.sekcja-konfig:last-child {
  margin-bottom: 0;
}

.etykieta-konfig {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--przygasly);
  letter-spacing: 0.05em;
  margin-bottom: 8px;
  display: block;
}

.grupa-przyciskow {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn-wybor {
  background: var(--papier);
  border: 1.5px solid var(--linia);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--tusz);
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-wybor:hover {
  border-color: var(--akcent);
  color: var(--akcent);
}

.btn-wybor.aktywny {
  background: var(--akcent);
  color: #fff;
  border-color: var(--akcent);
}

.btn-rozpocznij {
  width: 100%;
  padding: 14px;
  background: var(--akcent);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 14px;
  transition: opacity 0.15s;
}
.btn-rozpocznij:hover {
  opacity: 0.95;
}

/* PASEK POSTĘPU PODCZAS TESTU */
.pasek-postepu-kontener {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(251, 251, 249, 0.96);
  backdrop-filter: blur(12px);
  padding: 12px 0;
  border-bottom: 1px solid var(--linia);
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.licznik-pytania {
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--przygasly);
  text-transform: uppercase;
}

.wynik-na-zywo {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--akcent);
}

/* KARTA PYTANIA */
.karta-pytanie {
  background: var(--karta);
  border: 1px solid var(--linia);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 18px;
  box-shadow: 0 2px 14px rgba(0,0,0,0.03);
}

.kategoria-pytania {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--akcent);
  letter-spacing: 0.08em;
  margin-bottom: 10px;
  display: block;
}

.tresc-pytania {
  font-size: 1.22rem;
  font-weight: 700;
  color: var(--tusz);
  margin-bottom: 18px;
  line-height: 1.4;
}

.lista-opcji {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opcja-odpowiedzi {
  width: 100%;
  text-align: left;
  background: var(--karta);
  border: 1.5px solid var(--linia);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 0.96rem;
  font-weight: 500;
  color: var(--tusz);
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  line-height: 1.45;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.opcja-odpowiedzi:hover:not(:disabled) {
  border-color: var(--akcent);
  background: var(--akcent-tlo);
}

.opcja-litera {
  flex: 0 0 1.6rem;
  font-weight: 700;
  color: var(--slaby);
}

.opcja-odpowiedzi.dobra {
  border-color: var(--dobrze);
  background: var(--dobrze-tlo);
  color: var(--dobrze);
  font-weight: 700;
}
.opcja-odpowiedzi.dobra .opcja-litera {
  color: var(--dobrze);
}

.opcja-odpowiedzi.zla {
  border-color: var(--zle);
  background: var(--zle-tlo);
  color: var(--zle);
}
.opcja-odpowiedzi.zla .opcja-litera {
  color: var(--zle);
}

/* WYJAŚNIENIE I PUŁAPKA */
.blok-wyjasnienia {
  margin-top: 16px;
  padding: 14px 16px;
  background: var(--akcent-tlo);
  border-left: 3px solid var(--akcent);
  border-radius: 0 10px 10px 0;
  font-size: 0.92rem;
  color: var(--akcent);
  line-height: 1.45;
  display: none;
}

.blok-pulapki {
  margin-top: 10px;
  padding: 10px 14px;
  background: var(--zle-tlo);
  border-left: 3px solid var(--zle);
  border-radius: 0 10px 10px 0;
  font-size: 0.88rem;
  color: var(--zle);
  line-height: 1.4;
  display: none;
}

.btn-dalej {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  background: var(--akcent);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  display: none;
}

/* EKRAN KOŃCOWY WYNIKÓW */
.ekran-podsumowania {
  background: var(--karta);
  border: 1px solid var(--linia);
  border-radius: 16px;
  padding: 32px 24px;
  text-align: center;
  display: none;
}

.wynik-procent {
  font-size: 3rem;
  font-weight: 800;
  color: var(--akcent);
  margin: 12px 0 4px;
}

.ocena-slowna {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--tusz);
  margin-bottom: 20px;
}

.statystyki-szczegoly {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 24px;
}

.stat-pudelko {
  background: var(--papier);
  border: 1px solid var(--linia);
  border-radius: 12px;
  padding: 12px 20px;
}
.stat-liczba {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--akcent);
}
.stat-opis {
  font-size: 0.8rem;
  color: var(--przygasly);
}

.btn-restart {
  padding: 14px 28px;
  background: var(--akcent);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
}
</style>
</head>
<body>

<header>
  <div class="tytul-glowny">Sprytnoodporny Trener Słownictwa C1</div>
  <div class="opis-metryki">
    <span>Baza: 1382 pojęć akademickich Koźmiński</span>
    <span class="odznaka-test">Test 19 listopada: 21 dni</span>
  </div>
</header>

<!-- KONFIGURACJA TESTU -->
<div class="panel-konfiguracji" id="panel-konfig">
  <div class="sekcja-konfig">
    <span class="etykieta-konfig">Tryb pytań</span>
    <div class="grupa-przyciskow" id="grupa-tryb">
      <button class="btn-wybor aktywny" data-wartosc="en_to_pl">Słowo angielskie do znaczenia polskiego</button>
      <button class="btn-wybor" data-wartosc="en_to_def">Słowo angielskie do definicji angielskiej C1</button>
      <button class="btn-wybor" data-wartosc="def_to_en">Definicja angielska C1 do słowa angielskiego</button>
      <button class="btn-wybor" data-wartosc="pl_to_en">Znaczenie polskie do słowa angielskiego</button>
    </div>
  </div>

  <div class="sekcja-konfig">
    <span class="etykieta-konfig">Zakres słówek</span>
    <div class="grupa-przyciskow" id="grupa-zakres">
      <button class="btn-wybor aktywny" data-wartosc="lekcja">Tylko z bieżących lekcji (620 pojęć)</button>
      <button class="btn-wybor" data-wartosc="wszystko">Cała baza programowa (1382 pojęć)</button>
      <button class="btn-wybor" data-wartosc="finanse">Finanse i Bankowość</button>
      <button class="btn-wybor" data-wartosc="prawo">Prawo i Kontrakty</button>
      <button class="btn-wybor" data-wartosc="zarzadzanie">Zarządzanie i HR</button>
    </div>
  </div>

  <div class="sekcja-konfig">
    <span class="etykieta-konfig">Liczba pytań w serii</span>
    <div class="grupa-przyciskow" id="grupa-liczba">
      <button class="btn-wybor" data-wartosc="10">10 pytań</button>
      <button class="btn-wybor aktywny" data-wartosc="25">25 pytań</button>
      <button class="btn-wybor" data-wartosc="50">50 pytań</button>
      <button class="btn-wybor" data-wartosc="100">100 pytań</button>
    </div>
  </div>

  <button class="btn-rozpocznij" id="btn-start">Rozpocznij serię testową</button>
</div>

<!-- STREFA AKTYWNEGO TESTU -->
<div id="strefa-testu" style="display:none;">
  <div class="pasek-postepu-kontener">
    <span class="licznik-pytania" id="pasek-licznik">Pytanie 1 z 25</span>
    <span class="wynik-na-zywo" id="pasek-wynik">Wynik: 0 z 0</span>
  </div>

  <div class="karta-pytanie">
    <span class="kategoria-pytania" id="pyt-kategoria">Finanse</span>
    <div class="tresc-pytania" id="pyt-tresc">Treść pytania</div>
    <div class="lista-opcji" id="pyt-opcje"></div>
    <div class="blok-wyjasnienia" id="pyt-wyjasnienie"></div>
    <div class="blok-pulapki" id="pyt-pulapka"></div>
    <button class="btn-dalej" id="btn-dalej">Następne pytanie</button>
  </div>
</div>

<!-- EKRAN PODSUMOWANIA -->
<div class="ekran-podsumowania" id="ekran-podsumowania">
  <div class="kategoria-pytania">Podsumowanie serii</div>
  <div class="wynik-procent" id="podsum-procent">0%</div>
  <div class="ocena-slowna" id="podsum-ocena">Ocena 5.0</div>
  <div class="statystyki-szczegoly">
    <div class="stat-pudelko">
      <div class="stat-liczba" id="stat-dobre">0</div>
      <div class="stat-opis">Poprawne</div>
    </div>
    <div class="stat-pudelko">
      <div class="stat-liczba" id="stat-bledy">0</div>
      <div class="stat-opis">Błędne</div>
    </div>
    <div class="stat-pudelko">
      <div class="stat-liczba" id="stat-razem">0</div>
      <div class="stat-opis">Wszystkie</div>
    </div>
  </div>
  <button class="btn-restart" id="btn-restart">Rozpocznij nową serię</button>
</div>

ivalent rank, title, or function in another department, subsidiary, or organization.", "trap": "MAJOR EXAM TRAP: Does NOT mean an opponent or adversary! It means a peer or counterpart.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 8, "en": "appoint", "pl": "mianować / powołać na stanowisko", "def": "To officially select or assign someone to a job, post, or administrative role.", "trap": "Preposition: appoint somebody TO a post / AS managing director.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 9, "en": "delegate tasks", "pl": "przekazywać / delegować zadania podwładnym", "def": "To entrust duties, authority, or specific projects to subordinates.", "trap": "Preposition: delegate something TO someone.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 10, "en": "shortlist", "pl": "wybrać najlepszych kilku kandydatów (krótka lista)", "def": "To filter and select a small group of the most promising candidates from a wider pool for final evaluation or interviews.", "trap": "Can be both a noun ('draw up a shortlist') and a verb ('to shortlist applicants').", "category": "HR & Workplace", "source": "lekcja"}, {"id": 11, "en": "pay rise", "pl": "podwyżka pensji", "def": "An increase in employee remuneration, usually based on performance, promotion, or inflation.", "trap": "British English is 'pay rise'; American English is 'pay raise'.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 12, "en": "fringe benefits / perks", "pl": "dodatki pozapłacowe / dodatki do pensji", "def": "Supplementary perks or advantages provided to employees in addition to their statutory cash wages.", "trap": "'Perks' is informal/common; 'fringe benefits' is formal HR terminology.", "category": "HR & Workplace", "source": "lekcja"}, {"id": 13, "en": "workforce", "pl": "siła robocza / ogół pracowników", "def": "The collective total of employees working in an enterprise, sector, or whole economy.", "trap": "Always written as a single word: workforce.", -click), unlike traditional broadcast commercials.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 26, "en": "word-of-mouth", "pl": "marketing szeptany (z ust do ust)", "def": "Informal consumer recommendations and organic reviews passed orally or digitally between acquaintances.", "trap": "Always singular: word-of-mouth (never *words of mouths*).", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 27, "en": "point-of-sale advertising", "pl": "reklama w miejscu sprzedaży", "def": "Promotional fixtures, stands, and signs installed directly adjacent to the retail cash register or checkout zone.", "trap": "Abbreviated as POS advertising or POP (point-of-purchase).", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 28, "en": "advertorial", "pl": "artykuł sponsorowany", "def": "A commercial advertisement presented in the typographical style and voice of an objective journalistic article.", "trap": "Portmanteau: advertisement + editorial.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 29, "en": "hoarding", "pl": "tablica reklamowa / billboard (British English)", "def": "A massive roadside wooden or digital framework engineered for displaying large-scale promotional posters.", "trap": "MAJOR BRITISH/AMERICAN TRAP: UK calls it a 'hoarding', US calls it a 'billboard'!", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 30, "en": "tv commercial", "pl": "reklama telewizyjna", "def": "A paid televised advertisement broadcast between scheduled programs.", "trap": "Commercial refers to broadcast media (TV/radio); advertisement/ad can be print, online, or outdoor.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 31, "en": "transit advertising", "pl": "reklama na środkach transportu (autobusach, metrze)", "def": "Promotional signage displayed across public transport vehicles, subway cars, stations, and bus shelters.", "trap": "Includes vehicle wraps, interior subway cards, and platform posters.", "category": "Marketing & Advertising", "source": "lekcja"}, {"id": 32, "en": "retailer", "pl": "detalista / sprzedawca detaliczny", "def": "A commercial merchant who sells consumer merchandise in small quantities directly to end users.", "trap": "Contrast: Retailer sells to consumers (B2C); Wholesaler sells to retailers/businesses (B2B).", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 33, "en": "supplier", "pl": "dostawca", "def": "A business entity supplying raw materials, components, or services to manufacturing or commercial enterprises.", "trap": "Verb: to supply; noun: supply (supply and demand).", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 34, "en": "buy in bulk", "pl": "kupować hurtowo / w dużych ilościach", "def": "Purchasing substantial quantities of merchandise simultaneously to secure volume wholesale price reductions.", "trap": "Idiom: 'in bulk' (never *in bulks*).", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 35, "en": "warehouse / depot", "pl": "magazyn / skład towarowy", "def": "A spacious commercial facility specialized in stocking, handling, and consolidating goods prior to delivery.", "trap": "Depot often refers to transport hubs (bus depot, freight depot); warehouse is for merchandise storage.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 36, "en": "assembly line", "pl": "linia montażowa", "def": "A sequential manufacturing arrangement where interchangeable components are progressively added to create a finished product.", "trap": "Preposition: on the assembly line.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 37, "en": "production plant", "pl": "zakład produkcyjny / fabryka", "def": "An industrial facility comprising specialized machinery and staff dedicated to fabricating manufactured goods.", "trap": "'Plant' in business refers to industrial facilities and physical heavy equipment, not botanical flora.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 38, "en": "delay in dispatch", "pl": "opóźnienie w wysyłce", "def": "A lag or postponement in releasing and sending assembled goods from a warehouse to their destination.", "trap": "Verb: to dispatch goods (UK spelling usually dispatch, US sometimes despatch).", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 39, "en": "shipment", "pl": "wysyłka / partia towaru", "def": "A batch of goods destined for or delivered to someone.", "trap": "A shipment can travel by truck, rail, or airplane, not solely by ship!", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 40, "en": "value for money", "pl": "dobry stosunek jakości do ceny", "def": "The optimal utility and quality received by a customer relative to the monetary price paid.", "trap": "Common phrase: 'It represents excellent value for money'.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 41, "en": "bargain", "pl": "okazja cenowa / zakupowa; targować się", "def": "An item obtained at an advantageous price significantly below market value; as a verb, to haggle.", "trap": "'To drive a hard bargain' means to be a tough, uncompromising negotiator.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 42, "en": "after-sales service", "pl": "obsługa posprzedażowa", "def": "Ongoing technical support, repairs, and customer care provided after a transaction has concluded.", "trap": "Spelled with hyphens as an adjective: after-sales service.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 43, "en": "demand", "pl": "popyt / zapotrzebowanie", "def": "The quantity of a good or service that consumers are willing and able to purchase at various price points.", "trap": "Preposition: 'demand FOR something' (e.g. strong demand for microchips).", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 44, "en": "durable", "pl": "trwały / wytrzymały", "def": "Possessing the structural capacity to resist wear, damage, or degradation over an extensive operational lifespan.", "trap": "Durable goods are contrasted with non-durable goods (consumables like food).", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 45, "en": "congestion", "pl": "zatłoczenie / przeciążenie / zator", "def": "A condition of severe clogging, blockage, or saturation obstructing normal circulation or logistical transit.", "trap": "Used for both physical traffic/ports and network data flow.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 46, "en": "hostile takeover", "pl": "wrogie przejęcie", "def": "The acquisition of a target company by an aggressive buyer against the explicit opposition of the target's board.", "trap": "Contrast with friendly merger, where both boards willingly negotiate terms.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 47, "en": "merger", "pl": "fuzja (połączenie przedsiębiorstw)", "def": "The voluntary, collaborative consolidation of two or more independent corporations into a single commercial entity.", "trap": "Acronym M&A stands for Mergers and Acquisitions.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 48, "en": "gross profit", "pl": "zysk brutto", "def": "A company's total earnings remaining after subtracting direct production costs (COGS), before deducting operating expenses, overheads, and taxes.", "trap": "Gross profit = Revenue: COGS. Net profit is what remains after ALL expenses and taxes.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 49, "en": "revenues", "pl": "wpływy / przychody", "def": "The gross top-line monetary income accrued from commercial sales before calculating any operational deductions.", "trap": "Often called top-line growth (top line of the income statement).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 50, "en": "subsidy", "pl": "dotacja / subwencja państwowa", "def": "Direct financial aid or tax incentives provided by government authorities to bolster domestic industrial sectors.", "trap": "Remember: 'subvention' is NOT an English word! Always use 'subsidy' (or 'grant/government subsidy'). Verb: to subsidize.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 51, "en": "commission", "pl": "prowizja", "def": "A variable percentage fee paid to sales personnel, brokers, or agents proportionate to the value of transactions completed.", "trap": "Can be an uncountable concept ('paid on commission') or a count noun ('a 5% commission').", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 52, "en": "remittance", "pl": "przekaz pieniężny / płatność / przelew", "def": "The action of sending money in payment or as a gift.", "trap": "A formal financial term often found on invoices ('Remittance advice').", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 53, "en": "outstanding account", "pl": "zaległa płatność / nieuregulowane konto / zaległy rachunek", "def": "Money that has not yet been paid and is still owed to someone.", "trap": "In finance, 'outstanding' means UNPAID or UNRESOLVED, not magnificent/wonderful!", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 54, "en": "quotation", "pl": "wycena / oficjalna oferta cenowa", "def": "A formal, binding declaration specifying the exact monetary charge for executing agreed commercial work or providing items.", "trap": "Often abbreviated as 'quote'. Do not confuse with literary quotation (cytat).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 55, "en": "stipulate", "pl": "określać warunki / zastrzegać w umowie", "def": "To demand, require, or specify an explicit condition as an indispensable prerequisite of a formal legal contract.", "trap": "Formal C1 verb: 'stipulate that + clause' or 'stipulate terms'.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 56, "en": "take legal actions", "pl": "przedsięwziąć działania prawne / wstąpić na drogę sądową", "def": "To instigate official judicial or lawsuit measures to enforce rights or recover statutory damages.", "trap": "Usually singular uncountable 'take legal action', though plural 'actions' appears in colloquial/worksheet prompts.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 57, "en": "state company", "pl": "przedsiębiorstwo państwowe / firma państwowa", "def": "A commercial entity owned wholly or predominately by the government or sovereign state.", "trap": "Contrasted with private company; distinct from 'public company' (which is publicly traded on the stock exchange).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 58, "en": "stakeholder", "pl": "interesariusz", "def": "Any individual, constituent body, or entity maintaining a vested commercial or ethical interest in a corporation's actions.", "trap": "Shareholder = owns shares (akcjonariusz); Stakeholder = anyone affected by the firm (employees, community, customers).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 59, "en": "entrepreneur", "pl": "przedsiębiorca", "def": "A creative businessperson who initiates, organizes, and finances innovative commercial ventures, assuming financial risks.", "trap": "Spelling check: E-N-T-R-E-P-R-E-N-E-U-R (frequent spelling question on exams).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 60, "en": "subsidiary", "pl": "filia / spółka córka / podmiot zależny", "def": "A distinct corporate entity controlled through majority stock ownership by a dominant parent or holding corporation.", "trap": "Plural: subsidiaries. Do not confuse with 'subsidy' (dotacja).", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 61, "en": "headquarters", "pl": "główna siedziba firmy / centrala", "def": "The central administrative command center housing senior executive leadership of a multinational enterprise.", "trap": "Spelled with -s even in the singular: 'The company's headquarters IS located in London'.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 62, "en": "devalue", "pl": "obniżyć wartość / dewaluować", "def": "To officially lessen or discount the fixed sovereign exchange parity of a currency, or diminish an asset's perceived value.", "trap": "Devalue is intentional government/official action; depreciate is market-driven drop in value.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 63, "en": "profitable", "pl": "rentowny / zyskowny", "def": "Generating a healthy surplus of financial profit over all production and capital expenditure.", "trap": "Opposite: unprofitable or loss-making.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 64, "en": "adjourn the meeting", "pl": "przenieść spotkanie na później / odroczyć posiedzenie", "def": "To formally suspend an ongoing gathering or conference with the explicit resolution to reconvene at a designated subsequent date.", "trap": "VERY FORMAL: 'adjourn' is used for meetings/court; 'postpone' is used for events not yet started.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 65, "en": "to take the minutes", "pl": "sporządzić protokół (ze spotkania)", "def": "To transcribe the official written record documenting discussions, resolutions, and assigned actions during an official corporate proceeding.", "trap": "TOP C1 EXAM TRAP: 'minutes' here means a formal protocol/record, NOT 60 seconds!", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 66, "en": "itinerary", "pl": "plan podróży (służbowej)", "def": "A planned itinerary detailing destinations, flight schedules, hotel lodgings, and scheduled meetings for a business tour.", "trap": "Spelling check: I-T-I-N-E-R-A-R-Y.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 67, "en": "on behalf of", "pl": "w imieniu ...", "def": "Acting as the authorized proxy, delegate, or formal representative of another party or corporate body.", "trap": "Fixed prepositional phrase: 'on behalf of someone'.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 68, "en": "unanimously", "pl": "jednogłośnie", "def": "Executed with the total harmony, consent, and collective endorsement of every single voting participant without dissent.", "trap": "Adjective: unanimous (/juːˈnæn.ɪ.məs/); adverb: unanimously.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 69, "en": "tertiary sector", "pl": "sektor usług (trzeci sektor gospodarki)", "def": "The division of the economy dedicated to offering commercial, professional, and personal services rather than extracting resources or industrial fabrication.", "trap": "Primary = raw materials/farming; Secondary = manufacturing/construction; Tertiary = services.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 70, "en": "research and development department (R&D)", "pl": "dział badań i rozwoju (B+R)", "def": "The specialized corporate unit charged with pioneering technological innovations, scientific inquiry, and novel product engineering.", "trap": "Almost universally initialized as 'R&D'.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 71, "en": "radical approach", "pl": "radykalne podejście", "def": "A revolutionary, sweeping methodology that fundamentally breaks from traditional precedents to address entrenched problems.", "trap": "Radical in business signifies going to the root of a problem (fundamental), not extremist.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 72, "en": "long-term goals", "pl": "długoterminowe cele", "def": "Enduring, overarching strategic targets planned for fulfillment across a horizon of several fiscal years.", "trap": "Hyphenated before a noun: 'long-term goals', but 'in the long term'.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 73, "en": "objectives / target", "pl": "wyznaczony cel (do osiągnięcia w np. tydzień)", "def": "Precise, concrete, quantified milestones designated for prompt operational realization.", "trap": "Objectives are overarching aspirations; targets are exact numerical benchmarks.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 74, "en": "reliable", "pl": "rzetelny / niezawodny", "def": "Consistently trustworthy, punctual, and dependable in delivering promised performance standards.", "trap": "Noun: reliability.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 75, "en": "cautious", "pl": "ostrożny / rozważny", "def": "Characterized by deliberate prudence, risk aversion, and meticulous foresight before executing commitments.", "trap": "Noun: caution; preposition: cautious ABOUT / OF.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 76, "en": "consistent", "pl": "konsekwentny w działaniu / spójny", "def": "Demonstrating steady uniformity, unwavering discipline, and adhering rigorously to established principles without contradiction.", "trap": "Opposite: inconsistent. Preposition: consistent WITH.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 77, "en": "expansion", "pl": "rozrost firmy / ekspansja rynkowa", "def": "The strategic scaling and geographical enlargement of an enterprise's commercial footprint.", "trap": "Verb: to expand.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 78, "en": "participant", "pl": "uczestnik (spotkania, szkolenia, projektu)", "def": "An individual actively engaging or taking part in an institutional event, symposium, or commercial negotiation.", "trap": "Verb: to participate IN something.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 79, "en": "good manners", "pl": "dobre maniery / etykieta biznesowa", "def": "Cultivated, polite, and respectful social and professional conduct adhering to professional protocol.", "trap": "Always plural in this sense: 'good manners'.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 80, "en": "at the latest", "pl": "najpóźniej", "def": "An adverbial specification stipulating the absolute final cut-off deadline for an action to occur.", "trap": "Opposite: at the earliest.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 81, "en": "own", "pl": "posiadać / być właścicielem", "def": "To legally possess something as personal or commercial property.", "trap": "Do not confuse 'own' (posiadać) with 'owe' (być winnym pieniądze komuś!).", "category": "Money & Currency", "source": "lekcja"}, {"id": 82, "en": "owe", "pl": "być dłużnym / wisieć komuś pieniądze", "def": "To be under a legal or moral obligation to reimburse or repay someone a sum of money.", "trap": "Preposition: owe money TO someone (never owe for someone). Do not confuse with 'own'.", "category": "Money & Currency", "source": "lekcja"}, {"id": 83, "en": "lend", "pl": "pożyczyć komuś (udzielić pożyczki)", "def": "To allow someone else temporary use of your money or property on the condition that it will be repaid, usually with interest.", "trap": "Lend = dawać komuś pożyczkę (lend to); Borrow = brać pożyczkę od kogoś (borrow from). Irregular forms: lend: lent: lent.", "category": "Money & Currency", "source": "lekcja"}, {"id": 84, "en": "borrow", "pl": "pożyczać od kogoś (zaciągać pożyczkę)", "def": "To receive money or property from someone with the formal agreement to repay it in the future.", "trap": "Preposition: borrow something FROM someone (never borrow to someone).", "category": "Money & Currency", "source": "lekcja"}, {"id": 85, "en": "loan", "pl": "pożyczka / kredyt bankowy", "def": "An amount of money lent to a borrower that must be repaid over time, typically with accrued interest.", "trap": "Noun: loan (take out a loan). Borrowed money that has to be paid back constitutes a debt; the specific agreement/sum lent is a loan.", "category": "Money & Currency", "source": "lekcja"}, {"id": 86, "en": "debtor", "pl": "dłużnik", "def": "A natural person or institutional entity that has borrowed money and is obligated to repay a debt.", "trap": "Pronunciation trap: the letter 'b' is completely SILENT (/ˈdet.ər/), just like in 'debt' (/det/).", "category": "Money & Currency", "source": "lekcja"}, {"id": 87, "en": "creditor", "pl": "wierzyciel", "def": "A person, commercial bank, or institution to whom money is legally owed by a debtor.", "trap": "Opposite of debtor. Another word for a lender is a creditor.", "category": "Money & Currency", "source": "lekcja"}, {"id": 88, "en": "interest", "pl": "odsetki / oprocentowanie", "def": "The financial charge or income received by someone who lends money or credit, calculated as a percentage.", "trap": "Uncountable in finance ('to pay interest', not *interests*). Do not confuse with 'interests' (udziały, strefy wpływów lub zainteresowania).", "category": "Money & Currency", "source": "lekcja"}, {"id": 89, "en": "principal", "pl": "kwota główna kredytu / kapitał początkowy pożyczki", "def": "The original loan itself that has to be paid back, distinct from interest, fees, or premiums.", "trap": "CRITICAL C1 EXAM TRAP: Spelled PRINCIPAL (with -al), meaning the capital sum! 'Principle' (with -le) means a moral rule or fundamental truth (zasada).", "category": "Money & Currency", "source": "lekcja"}, {"id": 90, "en": "yield", "pl": "stopa zwrotu / rentowność (w %)", "def": "The amount of money a lender or investor receives for a loan or investment, expressed as a percentage.", "trap": "Yield is expressed as a PERCENTAGE rate of return, distinct from absolute cash income.", "category": "Money & Currency", "source": "lekcja"}, {"id": 91, "en": "cash", "pl": "gotówka (banknoty i monety)", "def": "Money in the physical form of notes and coins, providing instantaneous payment liquidity.", "trap": "Uncountable noun in English: 'how much cash', never *how many cashes*.", "category": "Money & Currency", "source": "lekcja"}, {"id": 92, "en": "currency", "pl": "waluta", "def": "A system of money in common use, especially within a particular nation (e.g. the dollar, the mark, the yen, the euro).", "trap": "Plural: currencies. Do not confuse with 'current' (bieżący/prąd).", "category": "Money & Currency", "source": "lekcja"}, {"id": 93, "en": "wages", "pl": "tygodniówka / płaca robotnicza (za pracę fizyczną)", "def": "The money earned for a week's or hourly manual, industrial, or blue-collar work.", "trap": "Contrast with salary: wages = manual/weekly work; salary = professional/monthly work.", "category": "Money & Currency", "source": "lekcja"}, {"id": 94, "en": "salary", "pl": "pensja miesięczna (za pracę umysłową/profesjonalną)", "def": "The fixed regular money paid for a month's professional, administrative, or white-collar work.", "trap": "False friend in Polish: 'pensja' = salary. English 'pension' = emerytura!", "category": "Money & Currency", "source": "lekcja"}, {"id": 95, "en": "fees", "pl": "honorarium / czesne / opłaty za usługi specjalistów", "def": "The money paid to certified professionals such as lawyers, architects, and private schools for specialized services.", "trap": "Never use 'salary' or 'wage' for independent specialists like lawyers or consultants; they charge fees.", "category": "Money & Currency", "source": "lekcja"}, {"id": 96, "en": "deposits", "pl": "depozyty / lokaty bankowe", "def": "Money placed in banks and savings institutions for safekeeping or earning interest.", "trap": "Can also denote an initial non-refundable down-payment or security deposit (kaucja).", "category": "Money & Currency", "source": "lekcja"}, {"id": 97, "en": "pension", "pl": "emerytura / świadczenie emerytalne", "def": "Money paid by the government or a company to a retired person after reaching pensionable age.", "trap": "TOP EXAM FALSE FRIEND: Polish 'pensja' is SALARY; English 'pension' is strictly EMERYTURA.", "category": "Money & Currency", "source": "lekcja"}, {"id": 98, "en": "fund", "pl": "fundusz (np. emerytalny, inwestycyjny)", "def": "A pool of capital accumulated and managed for a designated financial objective, such as future pensions.", "trap": "Verb: to fund (finansować); noun: a fund (fundusz). Plural: funds (środki pieniężne).", "category": "Money & Currency", "source": "lekcja"}, {"id": 99, "en": "capital", "pl": "kapitał (na założenie/działalność firmy)", "def": "The money, equity, or wealth needed to start or operate a company.", "trap": "Spelled with -al: capital (kapitał). The building where lawmakers meet in Washington is the Capitol (with -ol).", "category": "Money & Currency", "source": "lekcja"}, {"id": 100, "en": "instalments", "pl": "raty (regularne spłaty zadłużenia)", "def": "Regular part payments of debts or large purchases paid at agreed intervals.", "trap": "British English: instalments (one 'l'); American English: installments (two 'l's).", "category": "Money & Currency", "source": "lekcja"}, {"id": 101, "en": "rebate", "pl": "rabat / bonifikata / oficjalny zwrot części wpłaconej kwoty", "def": "Part of a payment officially given back or refunded to a buyer, taxpayer, or corporate client.", "trap": "A rebate is paid back AFTER the transaction; a discount is subtracted BEFORE the transaction.", "category": "Money & Currency", "source": "lekcja"}, {"id": 102, "en": "budget", "pl": "budżet (zestawienie planowanych dochodów i wydatków)", "def": "A financial statement or plan where estimated expenditure and income are written down.", "trap": "Can also be used as an adjective meaning inexpensive (budget flights, budget hotel).", "category": "Money & Currency", "source": "lekcja"}, {"id": 103, "en": "stake", "pl": "udział / wkład finansowy w przedsiębiorstwie", "def": "A person's or entity's financial share, ownership interest, or investment in a business.", "trap": "Idiom: 'at stake' = zagrożony / w grze ('Reputations are at stake'). Note related noun: stakeholder.", "category": "Money & Currency", "source": "lekcja"}, {"id": 104, "en": "foreign aid", "pl": "pomoc zagraniczna (dla krajów rozwijających się)", "def": "Money, loans, or material relief given to developing countries by richer ones to assist economic development.", "trap": "Uncountable in this sense ('provide aid', not *an aid*). Do not confuse with 'aide' (doradca/asystent).", "category": "Money & Currency", "source": "lekcja"}, {"id": 105, "en": "ROI (Return on Investment)", "pl": "zwrot z inwestycji / rentowność nakładów inwestycyjnych", "def": "A key financial performance metric used to evaluate the efficiency and profitability of an investment: (Net Profit / Initial Cost of Investment) * 100%.", "trap": "Contrast with yield: Yield is the ongoing annual cash-flow percentage (e.g. bond interest or dividend); ROI measures the total net gain relative to initial invested capital.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 106, "en": "overdraft", "pl": "debet na koncie / limit w rachunku bieżącym", "def": "A bank facility that permits an account holder to withdraw more money than they actually have in their account, up to an agreed limit.", "trap": "Short-term borrowing linked directly to a checking account. Differs from a formal loan which has a fixed term and schedule.", "category": "Money & Currency", "source": "lekcja"}, {"id": 107, "en": "tax rebate / tax refund", "pl": "zwrot podatku / zwrot nadpłaconego podatku", "def": "A reimbursement or refund of taxes sent to a taxpayer when they have paid more taxes to the government than they actually owed.", "trap": "EXAM TRAP: A TAX REBATE / REFUND is the money given back. A TAX RETURN is the formal tax declaration document (deklaracja PIT/CIT)!", "category": "Money & Currency", "source": "lekcja"}, {"id": 108, "en": "reimbursement", "pl": "zwrot wydatków / zwrot kosztów służbowych", "def": "The repayment of out-of-pocket expenses incurred by an employee or partner on behalf of the company.", "trap": "Verb: to reimburse (owe money -> reimburse someone). Noun: reimbursement.", "category": "Money & Currency", "source": "lekcja"}, {"id": 109, "en": "tax relief / tax allowance", "pl": "ulga podatkowa / kwota wolna od podatku", "def": "A government incentive that reduces the total amount of tax a person or company has to pay.", "trap": "Reduces taxable liability, unlike a rebate which is cash returned after paying.", "category": "Money & Currency", "source": "lekcja"}, {"id": 110, "en": "security deposit", "pl": "kaucja (zabezpieczająca np. przy wynajmie lokalu / kaucja gwarancyjna)", "def": "A sum of money paid in advance by a tenant or client to protect the owner against unpaid bills or property damage.", "trap": "EXAM TRAP: Kaucja za wynajem/sprzęt to SECURITY DEPOSIT! Kaucja sądowa/aresztowa to BAIL (nigdy nie mów bail przy umowie najmu!).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 111, "en": "collateral", "pl": "zabezpieczenie rzeczowe kredytu / zastaw majątkowy", "def": "Valuable property or assets pledged by a borrower as security for the repayment of a bank loan, forfeited if the loan defaults.", "trap": "Collateral to zabezpieczenie majątkowe pod kredyt bankowy (np. hipoteką). Nie mylić ze zwykłą kaucją (security deposit).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 112, "en": "bail", "pl": "kaucja sądowa / poręczenie majątkowe (w prawie karnym)", "def": "The temporary release of an accused person awaiting trial, sometimes on condition that a sum of money is lodged to guarantee their appearance in court.", "trap": "NIGDY nie używaj w biznesie do wynajmu biura czy samochodu! BAIL stosuje się wyłącznie w sprawach karnych i sądowych.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 113, "en": "shareholder / stockholder", "pl": "akcjonariusz / udziałowiec (właściciel części kapitału spółki)", "def": "An owner of shares or stock in a company, entitled to dividends and voting rights at general meetings.", "trap": "UK zazwyczaj: shareholder. US zazwyczaj: stockholder. Każdy shareholder jest stakeholderem, ale NIE każdy stakeholder jest shareholderem!", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 114, "en": "controlling stake / majority stake", "pl": "pakiet większościowy / pakiet kontrolny (ponad 50% głosów/akcji)", "def": "An ownership interest greater than 50% of voting shares, giving the owner direct decision-making control over corporate governance.", "trap": "Przeciwieństwo: minority stake (pakiet mniejszościowy).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 115, "en": "mortgage", "pl": "kredyt hipoteczny / hipoteka", "def": "A long-term loan granted by a bank or building society to purchase property, where the real estate itself serves as collateral.", "trap": "Wymowa: litera t jest całkowicie NIEMA! Czytamy: /ˈmɔː.ɡɪdʒ/ (jak mor-gidż).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 116, "en": "default", "pl": "niewypłacalność / niespłacenie długu w terminie / zaleganie ze spłatą", "def": "Failure to fulfill a legal obligation, especially the non-payment of a loan or bond coupon by the due date.", "trap": "Jako czasownik: to default ON something (nigdy *default something*). Rzeczownik: default.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 117, "en": "foreclosure", "pl": "przejęcie nieruchomości przez bank / egzekucja komornicza z hipoteki", "def": "The legal process by which a mortgage lender takes possession of mortgaged property after the debtor fails to make payments.", "trap": "Czasownik: to foreclose ON a property.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 118, "en": "grace period", "pl": "okres karencji (w spłacie kredytu) / okres bezodsetkowy", "def": "A designated period immediately after a deadline or payment date during which a late fee or interest is waived and no default occurs.", "trap": "Karencja to czas, w którym nie musisz spłacać kapitału (często spłaca się tylko same odsetki).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 119, "en": "creditworthiness / credit rating", "pl": "zdolność kredytowa / wiarygodność kredytowa", "def": "An evaluation of the likelihood that a borrower will reliably default on debt obligations, based on financial history and assets.", "trap": "Credit score to punktacja osoby fizycznej; Credit rating to ocena agencji (Moody s, S&P, Fitch) dla korporacji lub państwa.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 120, "en": "insolvency", "pl": "niewypłacalność (brak środków na bieżące spłaty zobowiązań)", "def": "The state of being unable to pay debts as they fall due, or having total liabilities that exceed the fair value of all assets.", "trap": "Przymiotnik: insolvent (niewypłacalny). Insolvency to stan faktyczny braku płynności; Bankruptcy to formalny wyrok sądu!", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 121, "en": "bankruptcy", "pl": "upadłość / bankructwo (sądowe orzeczenie niewypłacalności)", "def": "A legally declared inability of an individual or organization to pay their creditors, overseen by a bankruptcy trustee.", "trap": "Zwrot: to go bankrupt (zbankrutować) / to file for bankruptcy (złożyć wniosek o upadłość).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 122, "en": "bad debt", "pl": "nieściągalny dług / strata na pożyczce", "def": "An outstanding debt or monetary receivable that is officially deemed irrecoverable and must be written off as an accounting loss.", "trap": "Związany zwrot: WRITE-OFF = spisanie w straty.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 123, "en": "write-off", "pl": "odpisanie w straty / umorzenie wierzytelności", "def": "An accounting action that cancels an asset or debt from the balance sheet because it has zero remaining recoverable value.", "trap": "Rzeczownik z myślnikiem: a write-off; Czasownik rozłączny: to write off.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 124, "en": "balance sheet", "pl": "bilans (zestawienie aktywów i pasywów na dany dzień)", "def": "A formal financial statement that summarizes a company s assets, liabilities, and shareholders equity at a specific point in time.", "trap": "Złota reguła bilansowa: Assets = Liabilities + Equity (Aktywa = Pasywa = Zobowiązania + Kapitał własny).", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 125, "en": "assets", "pl": "aktywa / majątek przedsiębiorstwa", "def": "Economic resources and property owned by a company expected to produce economic benefit (current assets vs fixed assets).", "trap": "Current assets = aktywa obrotowe (krótkoterminowe); Fixed / non-current assets = aktywa trwałe.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 126, "en": "liabilities", "pl": "zobowiązania / pasywa / długi firmy", "def": "The state of being legally responsible for something.", "trap": "Definicja lektorki: 'the state of being legally responsible for something'. W bilansie 'liabilities' oznacza pasywa/zobowiązania.", "category": "Accounting & Financial Statements", "source": "lekcja_handout_matching"}, {"id": 127, "en": "profit and loss account (P&L) / income statement", "pl": "rachunek zysków i strat (RZiS) / sprawozdanie z wyników", "def": "A financial statement showing total revenue, costs, and resulting net profit or loss generated over an accounting period.", "trap": "UK standard: Profit and Loss account (P&L); US standard: Income Statement.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 128, "en": "revenue / turnover", "pl": "przychód / obrót (całość wpływów ze sprzedaży przed kosztami)", "def": "The total income received from the sale of goods or services before any costs or expenses are deducted.", "trap": "KARDYNALNY BŁĄD: Przychód (Revenue/Turnover) to NIE jest zysk (Profit)! Przychód minus koszty = Zysk.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 129, "en": "net profit / the bottom line", "pl": "zysk netto / zysk na czysto (ostatnia linijka bilansu)", "def": "The actual residual profit remaining after ALL operational costs, depreciation, interest, and taxes have been subtracted from revenue.", "trap": "The bottom line to idiom biznesowy oznaczający zysk netto lub ostateczną konkluzję.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 130, "en": "cash flow", "pl": "przepływy pieniężne / płynność gotówkowa", "def": "The net amount of actual cash and cash-equivalents moving in and out of a business over a fiscal interval.", "trap": "Można być zyskownym na papierze, ale zbankrutować z braku gotówki (cash flow crisis)!", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 131, "en": "liquidity", "pl": "płynność finansowa (zdolność do natychmiastowej spłaty krótkoterminowych zobowiązań)", "def": "The ease and speed with which an asset can be converted into ready cash without losing its market value.", "trap": "Liquid assets = aktywa płynne (gotówka, lokaty overnight, zbywalne papiery wartościowe).", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 132, "en": "accounts receivable (AR)", "pl": "należności od odbiorców / faktury do zapłacenia przez klientów", "def": "Money owed to a company by its customers for goods delivered or services rendered on credit but not yet paid for.", "trap": "Receivable = pieniądze, które TOBIE ktoś wisi (Twoje aktywa).", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 133, "en": "accounts payable (AP)", "pl": "zobowiązania wobec dostawców / faktury do zapłacenia dostawcom", "def": "Money owed by a company to its suppliers or creditors for raw materials or services delivered on credit terms.", "trap": "Payable = pieniądze, które TY wisisz dostawcy (Twoje pasywa/długi).", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 134, "en": "depreciation", "pl": "amortyzacja środków trwałych / spadek wartości majątku w czasie", "def": "A reduction in the value of an asset over time, due in particular to wear and tear.", "trap": "Definicja lektorki: 'a reduction in the value of an asset over time, due in particular to wear and tear'. W księgowości to amortyzacja majątku trwałego, w walutach: spadek kursu.", "category": "Accounting & Financial Statements", "source": "lekcja_handout_matching"}, {"id": 135, "en": "amortization", "pl": "amortyzacja wartości niematerialnych i prawnych (oraz stopniowa spłata kapitału kredytu)", "def": "The systematic spreading of intangible asset costs (patents, goodwill) over time, or the gradual repayment of loan principal through instalments.", "trap": "Ma dwa znaczenia: 1) amortyzacja patentów/praw, 2) harmonogram spłaty kapitału pożyczki.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 136, "en": "capital gain", "pl": "zysk kapitałowy (zysk ze sprzedaży akcji/nieruchomości po cenie wyższej niż zakup)", "def": "A financial profit realized from the sale of a capital asset or investment for a price exceeding its original purchase price.", "trap": "Przeciwieństwo: capital loss (strata kapitałowa).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 137, "en": "dividend", "pl": "dywidenda (część zysku spółki wypłacana akcjonariuszom)", "def": "A sum of money paid regularly by a corporation to its shareholders out of its distributed profits or reserves.", "trap": "Dividend yield = dywidenda podzielona przez cenę akcji (stopa dywidendy w %).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 138, "en": "due diligence", "pl": "badanie due diligence / dogłębna analiza prawno-finansowa przed przejęciem spółki", "def": "A comprehensive appraisal and audit of a business undertaken by a prospective buyer to evaluate its liabilities, contracts, and financial health.", "trap": "Prawidłowy czasownik: to conduct / to carry out due diligence.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 139, "en": "venture capital (VC)", "pl": "kapitał wysokiego ryzyka (fundusze inwestujące w innowacyjne startupy)", "def": "Financing that investors provide to startup companies and small businesses that are believed to have long-term growth potential.", "trap": "Venture capitalist to osoba/fundusz; Venture capital to sam kapitał.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 140, "en": "IPO (Initial Public Offering)", "pl": "pierwsza oferta publiczna / debiut spółki na giełdzie", "def": "The very first sale of company stock to the general public and institutional investors, transitioning a private firm into a public corporation.", "trap": "Zwrot synonimiczny: to go public (wejść na giełdę).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 141, "en": "leverage / gearing", "pl": "dźwignia finansowa / stopień zadłużenia spółki w stosunku do kapitału własnego", "def": "The use of borrowed debt capital to amplify the potential return and scale of an investment or business project.", "trap": "US zazwyczaj mówi: leverage. UK często mówi: gearing (gearing ratio = dług / kapitał własny).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 142, "en": "breach of contract", "pl": "naruszenie / zerwanie / niedotrzymanie warunków umowy", "def": "An unjustifiable failure to perform any promise, obligation, or duty that forms the whole or part of a binding legal agreement.", "trap": "Czasownik: to breach a contract (naruszyć umowę). Przeciwieństwo: to comply with a contract.", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 143, "en": "clause / provision", "pl": "klauzula / postanowienie / zapis w umowie", "def": "A distinct section, paragraph, or specific requirement in a legal document, contract, or treaty.", "trap": "Zwroty formalne: under the provisions of the contract (zgodnie z postanowieniami umowy).", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 144, "en": "non-disclosure agreement (NDA)", "pl": "umowa o zachowaniu poufności (NDA)", "def": "A legally enforceable contract establishing a confidential relationship, forbidding the signing party from disclosing sensitive commercial secrets.", "trap": "Popularny skrót korporacyjny: NDA (czytamy: /en-diː-eɪ/).", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 145, "en": "indemnity / indemnification", "pl": "zabezpieczenie przed odpowiedzialnością finansową / obowiązek naprawienia szkody / klauzula odszkodowawcza", "def": "A contractual guarantee by one party to compensate the other for any harm, liability, or loss that may arise.", "trap": "Czasownik: to indemnify somebody against losses (zabezpieczyć kogoś przed roszczeniami).", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 146, "en": "escrow", "pl": "rachunek powierniczy escrow / depozyt u strony trzeciej", "def": "A contractual arrangement in which a neutral third party holds funds or assets until specified conditions of the deal have been satisfied.", "trap": "Kluczowa cecha: neutralny pośrednik (third party) trzyma pieniądze do czasu spełnienia warunków umowy.", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 147, "en": "settlement", "pl": "ugoda (pozasądowa lub sądowa) / ostateczne rozliczenie transakcji", "def": "An official resolution and agreement ending a dispute or lawsuit without full judicial trial, often involving monetary compensation.", "trap": "Ma 2 kluczowe znaczenia: 1) ugoda prawna kończąca spór, 2) rozliczenie transakcji finansowej (T+2 settlement).", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 148, "en": "tax evasion vs tax avoidance", "pl": "uchylanie się od płacenia podatków (nielegalne) vs optymalizacja podatkowa (legalna)", "def": "Tax evasion is the illegal deliberate failure to pay taxes (fraud); Tax avoidance is the legal utilization of tax rules to reduce tax liability.", "trap": "ULUBIONE PODCHWYTLIWE PYTANIE PROWADZĄCYCH: Evasion = NIELEGALNE (przestępstwo); Avoidance = LEGALNA optymalizacja!", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 149, "en": "excise duty", "pl": "podatek akcyzowy / akcyza (na paliwo, tytoń, alkohol)", "def": "An indirect domestic tax levied on specific manufactured goods at the point of production, notably tobacco, fuel, and alcohol.", "trap": "Akcyza nakładana jest na konkretne dobra luksusowe lub szkodliwe, w odróżnieniu od powszechnego podatku VAT.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 150, "en": "customs duty / tariff", "pl": "cło / opłata celna na towary importowane", "def": "A tax or duty to be paid on a particular class of imports or exports.", "trap": "Tariff to cło (podatek importowy), Customs to urząd celny / cło.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 151, "en": "stay in credit / be in credit", "pl": "mieć dodatnie saldo na koncie / być na plusie (nie wchodzić w debet)", "def": "To maintain a bank balance above zero, ensuring the account is not overdrawn into debt.", "trap": "PRZECIWIEŃSTWO: to be in the red / to be overdrawn (być na minusie). Być na plusie to także idiom: TO BE IN THE BLACK.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 152, "en": "in the red vs in the black", "pl": "być na minusie (in the red) vs być na plusie (in the black)", "def": "Idiomatic financial states: in the red indicates debt, negative balance or operational loss; in the black signifies positive balance or profitability.", "trap": "Skąd nazwa: w dawnej księgowości straty wpisywano czerwonym atramentem (red), a zyski czarnym (black: stąd Black Friday!).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 153, "en": "bailout", "pl": "pakiet ratunkowy / pomoc finansowa ratująca przed upadłością", "def": "Emergency financial assistance or capital injection given to a failing business or economy to prevent its total collapse.", "trap": "Czasownik rozłączny: to bail out a company (ratować finansowo). Rzeczownik: a bailout.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 154, "en": "financial aid / financial assistance", "pl": "pomoc finansowa / wsparcie finansowe (zapomoga, stypendium, subwencja)", "def": "Funding provided to individuals, students, or businesses in the form of grants, low-interest loans, or subsidies.", "trap": "Jeśli to pomoc dla biednych krajów: foreign aid. Jeśli to ratunek dla upadającej firmy: bailout.", "category": "Finance & Corporate Law", "source": "lekcja"}, {"id": 155, "en": "syndicated loan", "pl": "kredyt konsorcjalny (udzielany wspolnie przez grupe bankow)", "def": "A substantial commercial loan provided by a group of financial lenders structured and administered by a lead arranger.", "trap": "Uzywany przy gigantycznych projektach (infrastruktura, M&A), gdzie ryzyko przewyzsza limit pojedynczego banku.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 156, "en": "bridge loan / bridging loan", "pl": "kredyt pomostowy (krotkoterminowy na sfinansowanie luki)", "def": "Short-term interim financing used until an individual or company secures permanent financing or settles an obligation.", "trap": "Kredyt o wysokim oprocentowaniu ze wzgledu na krotki horyzont czasowy i podwyzszone ryzyko.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 157, "en": "credit facility", "pl": "linia kredytowa / elastyczny limit kredytowy", "def": "An agreement between a financial institution and a business permitting the borrower to draw down funds up to a maximum limit over time.", "trap": "Revolving credit facility (RCF) to linia odnawialna: splacasz i mozesz ponownie dobierac srodki.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 158, "en": "letter of credit (L/C)", "pl": "akredytywa (bankowa gwarancja zaplaty w handlu zagranicznym)", "def": "A formal document issued by a commercial bank guaranteeing that a buyer payment to a seller will be received on time and for the correct amount.", "trap": "Kluczowe narzedzie ograniczania ryzyka w handlu morskim i miedzynarodowym.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 159, "en": "debt servicing", "pl": "obsluga zadluzenia (terminowe splaty rat kapitalu i odsetek)", "def": "The ongoing cash outlay required to cover scheduled repayments of loan principal and accrued interest.", "trap": "Nie mylic z samym dlugiem (debt). Debt service to biezacy koszt regularnego splacania tego dlugu.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 160, "en": "annual percentage rate (APR)", "pl": "rzeczywista roczna stopa oprocentowania (RRSO)", "def": "The annual rate charged for borrowing or earned through an investment, encompassing all mandatory fees and transaction charges.", "trap": "APR uwzglednia prowizje, ubezpieczenia i oplaty, w przeciwienstwie do golej stopy nominalnej (nominal rate).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 161, "en": "non-performing loans (NPL)", "pl": "kredyty zagrozone / niesplacane kredyty (NPL)", "def": "Bank loans where the borrower has defaulted and made zero scheduled principal or interest payments for at least 90 days.", "trap": "Kluczowy wskaznik stabilnosci sektora bankowego badany przez Europejski Bank Centralny.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 162, "en": "debt covenant", "pl": "klauzula w umowie kredytowej (zobowiazanie finansowe kredytobiorcy)", "def": "A legally binding restriction or condition placed on a borrower by a commercial lender to preserve financial solvency.", "trap": "Naruszenie covenantow daje bankowi prawo do natychmiastowego zadania splaty calosci dlugu.", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 163, "en": "standing order vs direct debit", "pl": "zlecenie stale (stala kwota) vs polecenie zaplaty (zmienna kwota pobierana przez wystawce)", "def": "A standing order is set up by the account holder to pay a fixed amount regularly; direct debit authorizes a third party to collect variable amounts directly.", "trap": "TOP ROZNICA: Standing order kontrolujesz Ty (kwota stala). Direct debit kontroluje odbiorca (pobiera zmienna kwote wg faktury).", "category": "Banking, Credit & Real Estate", "source": "lekcja"}, {"id": 164, "en": "EBITDA", "pl": "zysk operacyjny przed potraceniem odsetek, podatkow i amortyzacji (EBITDA)", "def": "A widely used metric of core operating profitability: Earnings Before Interest, Taxes, Depreciation, and Amortization.", "trap": "Czesto krytykowana przez Warrena Buffetta miara, poniewaz ignoruje realny koszt odnawiania maszyn i sprzetu.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 165, "en": "working capital", "pl": "kapital obrotowy netto (aktywa obrotowe minus zobowiazania krotkoterminowe)", "def": "A measure of an enterprise operational liquidity calculated as Current Assets minus Current Liabilities.", "trap": "Dodatni kapital obrotowy oznacza, ze firma moze splacic biezace rachunki bez zaciagania dlugow.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 166, "en": "accrual accounting", "pl": "rachunkowosc memorialowa (ksiegowanie w momencie transakcji, a nie zaplaty)", "def": "An accounting standard where revenues and costs are recognized when earned or incurred, regardless of when actual cash changes hands.", "trap": "Przeciwienstwo do cash accounting (ksiegowosc kasowa, gdzie liczy sie tylko wplyw i wyplyw gotowki).", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 167, "en": "goodwill", "pl": "wartosc firmy (dodatnia wartosc niematerialna przy przejeciu)", "def": "An intangible balance-sheet asset created when a purchasing entity acquires a company for a price higher than the net fair market value of identifiable assets.", "trap": "Goodwill to renoma marki, baza lojalnych klientów i patenty ujmowane w bilansie po przejeciu ponad wartosc ksiag.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 168, "en": "book value vs market value", "pl": "wartosc ksiegowa (z bilansu) vs wartosc rynkowa (wycena na gieldzie)", "def": "Book value is total assets minus liabilities recorded on the balance sheet; market value is total shares multiplied by current stock price.", "trap": "Dla spolek technologicznych wartosc rynkowa jest wielokrotnie wyzsza niz ksiegowa.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 169, "en": "operating margin", "pl": "marza operacyjna (zysk operacyjny podzielony przez przychody)", "def": "A profitability ratio calculating how much profit a company makes on a dollar of sales after paying for variable production costs.", "trap": "Pokazuje czysta efektywnosc podstawowej dzialalnosci bez wplywu podatkow i struktury zadluzenia.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 170, "en": "retained earnings", "pl": "zyski zatrzymane (czesc zysku niewyplacona w dywidendzie, przeznaczona na inwestycje)", "def": "The cumulative net income retained and reinvested in the corporation rather than disbursed to shareholders as dividends.", "trap": "Zrodlo finansowania wlasnego rozwoju (inwestycje bez zadluzania sie w banku).", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 171, "en": "contingent liability", "pl": "zobowiazanie warunkowe (dlug mogacy powstac w zaleznosci od przyszlych zdarzen)", "def": "A potential liability that may occur in the future depending on the outcome of an uncertain event, such as a pending court trial.", "trap": "Wymaga ujawnienia w notach objasniajacych do sprawozdania finansowego.", "category": "Accounting & Financial Statements", "source": "lekcja"}, {"id": 172, "en": "market capitalization (market cap)", "pl": "kapitalizacja rynkowa (laczna wartosc rynkowa wszystkich akcji spolki)", "def": "The total dollar market value of a company outstanding shares, calculated by multiplying current share price by total share count.", "trap": "Mega-cap / Large-cap to giganci; Small-cap to mniejsze, bardziej ryzykowne spolki.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 173, "en": "private equity (PE)", "pl": "fundusze private equity (inwestycje w dojrzale spolki nienotowane na gieldzie)", "def": "Investment funds that purchase equity stakes in private companies or take public companies private through restructuring.", "trap": "ROZNICA: Venture Capital inwestuje we wczesne startupy; Private Equity kupuje duze, dojrzale firmy i je restrukturyzuje.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 174, "en": "hedge fund", "pl": "fundusz hedgingowy (agresywny fundusz inwestycyjny dla zamoznych inwestorow)", "def": "An aggressively managed, lightly regulated alternative investment vehicle employing complex trading strategies (shorting, leverage, derivatives).", "trap": "Dla inwestorow kwalifikowanych/instytucjonalnych; uzywa zaawansowanych instrumentow pochodnych (derywatyw).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 175, "en": "short selling / shorting", "pl": "krotka sprzedaz / granie na spadek cen akcji", "def": "An investment strategy where an investor borrows shares, sells them immediately, and hopes to repurchase them later at a cheaper price to pocket the difference.", "trap": "Ryzyko krotkiej sprzedazy jest teoretycznie nieskonczone, bo cena akcji moze rosnac w nieskonczonosc.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 176, "en": "bull market vs bear market", "pl": "hossa (rynek byka, wzrosty) vs bessa (rynek niedzwiedzia, spadki)", "def": "A bull market is a sustained period of rising asset prices and investor confidence; a bear market describes a sustained downward trend of 20% or more.", "trap": "Byk atakuje rogami w gore (hossa / bullish); Niedzwiedz macha lapa w dol (bessa / bearish).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 177, "en": "blue-chip stocks", "pl": "spolki blue chip (najwieksze, najbardziej stabilne korporacje gieldowe)", "def": "Shares of nationally recognized, financially sound, and established corporations with a reliable history of profitability and dividend payouts.", "trap": "Nazwa pochodzi z kasyna (niebieskie zetony mialy najwyzsza nominalna wartosc).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 178, "en": "poison pill", "pl": "zatruta pigulka (strategia obrony przed wrogim przejeciem)", "def": "A corporate defense tactic used by a target firm to prevent a hostile takeover by making its acquisition prohibitively expensive or unpalatable.", "trap": "Strategia obronna rady nadzorczej przeciw wrogiemu inwestorowi (corporate raider).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 179, "en": "white knight", "pl": "bialy rycerz (przyjazny inwestor ratujacy przed wrogim przejeciem)", "def": "A friendly corporate suitor or individual who rescues a target company from a hostile takeover by submitting a welcome alternative acquisition bid.", "trap": "Przeciwienstwo do black knight (wrogiego napastnika).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 180, "en": "maturity date", "pl": "termin zapadalnosci / data wykupu (obligacji lub lokaty)", "def": "The contractual final date on which the principal sum of a loan, promissory note, or bond becomes fully due and must be repaid to the investor.", "trap": "Held to maturity = trzymanie obligacji do samego konca bez sprzedazy na gieldzie.", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 181, "en": "coupon", "pl": "kupon / odsetki wyplacane od obligacji", "def": "The fixed annual interest payment paid by a bond issuer to bondholders from issuance until final maturity.", "trap": "Zero-coupon bond to obligacja zerokuponowa (nie placi odsetek, kupuje sie ja z dyskontem ponizej nominalu).", "category": "Corporate Finance & Investments", "source": "lekcja"}, {"id": 182, "en": "force majeure", "pl": "sila wyzsza (klauzula zwalniajaca z odpowiedzialnosci przy zdarzeniach losowych)", "def": "A contractual clause freeing both parties from liability or obligation when an extraordinary event or circumstance beyond human control occurs (war, earthquake, epidemic).", "trap": "Zapozyczenie z francuskiego. Zdarzenie musi byc nieprzewidywalne i niemozliwe do powstrzymania.", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 183, "en": "liquidated damages", "pl": "kara umowna / z gory okreslone odszkodowanie w umowie", "def": "A designated monetary sum agreed upon by contracting parties during formation as compensation for a specific breach of contract (e.g. delivery delays).", "trap": "Pozwala uniknac procesu sadowego o wysokosc szkody, bo kwota za kazdy dzien opoznienia jest wprost w umowie.", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 184, "en": "Articles of Association", "pl": "statut spolki / umowa spolki (konstytucja dzialania firmy)", "def": "A foundational legal document establishing internal governance regulations, managerial authority, voting rights, and corporate operations.", "trap": "UK: Articles of Association; US: Corporate Bylaws.", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 185, "en": "power of attorney (PoA)", "pl": "pelnomocnictwo (pisemne upowaznienie do dzialania w imieniu innej osoby/firmy)", "def": "A person, typically a lawyer, appointed to act for another in business or legal matters.", "trap": "Definicja lektorki: 'a person, typically a lawyer, appointed to act for another in business or legal matters'. Nie mylić z sędzią (judge) ani ławnikiem.", "category": "Contracts & Business Law", "source": "lekcja_handout_matching"}, {"id": 186, "en": "fiduciary duty", "pl": "obowiazek powierniczy (obowiazek dzialania w najwyzszym interesie klienta/spolki)", "def": "The highest legal and ethical obligation imposed on an individual (such as a director or trustee) to act strictly for the benefit and financial best interest of another party.", "trap": "Kluczowa zasada prawa handlowego: czlonek zarzadu nie moze stawiac wlasnego interesu ponad interes spolki.", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 187, "en": "compliance", "pl": "zgodnosc z normami prawnymi i regulacyjnymi (compliance)", "def": "The department and process ensuring that an enterprise operates in full conformity with domestic laws, industry standards, and internal ethics.", "trap": "W bankowosci i korporacjach dzial compliance odpowiada za przeciwdzialanie praniu brudnych pieniedzy i korupcji.", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 188, "en": "disclaimer", "pl": "klauzula wylaczajaca lub ograniczajaca odpowiedzialnosc (disclaimer)", "def": "A public legal statement repudiating or limiting legal responsibility, warranty, or liability regarding information or products.", "trap": "Standard na dole kazdego e-maila lub raportu gieldowego.", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 189, "en": "arbitration vs litigation", "pl": "arbitraz (sad polubowny) vs proces sadowy (sad powszechny)", "def": "Arbitration resolves commercial disputes through private, confidential neutral arbitrators; litigation involves public court trials before state judges.", "trap": "Arbitraz jest prywatny, poufny i szybszy, ale czesto bardzo kosztowny.", "category": "Contracts & Business Law", "source": "lekcja"}, {"id": 190, "en": "inflation vs stagflation", "pl": "inflacja (wzrost cen) vs stagflacja (wysoka inflacja + recesja gospodarcza + bezrobocie)", "def": "Inflation is the general rise in price levels; stagflation is the toxic combination of stagnant economic output, high unemployment, and stubborn inflation.", "trap": "Stagflacja = Stagnacja gospodarcza + Inflacja. To najgorszy koszmar ekonomistow.", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 191, "en": "trade deficit vs trade surplus", "pl": "deficyt handlowy (import > eksport) vs nadwyzka handlowa (eksport > import)", "def": "An excess of production or supply.", "trap": "Definicja lektorki: 'an excess of production or supply'. Przeciwieństwo to 'deficit' lub 'shortage'.", "category": "Operations & Business Communication", "source": "lekcja_handout_matching"}, {"id": 192, "en": "quantitative easing (QE)", "pl": "luzowanie ilosciowe (skup obligacji przez bank centralny w celu zwiekszenia podazy pieniadza)", "def": "An unconventional monetary policy whereby a central bank buys long-term government bonds to inject liquidity and depress borrowing costs.", "trap": "Potocznie nazywane drukowaniem pieniedzy (zwiekszaniem bazy monetarnej).", "category": "Operations & Business Communication", "source": "lekcja"}, {"id": 193, "en": "Incoterms (FOB / CIF / EXW)", "pl": "miedzynarodowe reguly handlu Incoterms (np. FOB, CIF, EXW)", "def": "Pre-defined international commercial terms defining the precise division of costs, risks, and transport responsibilities between buyer and seller.", "trap": "EXW (Ex Works) = kupujacy odbiera z fabryki; CIF = sprzedajacy placi za transport i ubezpieczenie do portu przeznaczenia.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 194, "en": "lead time", "pl": "czas realizacji zamowienia / cykl produkcyjno-dostawczy", "def": "The total latency or amount of time that elapses from the initial placement of an order to its final physical delivery.", "trap": "Kluczowy parametr w zarzadzaniu logistyka i magazynem.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 195, "en": "just-in-time (JIT)", "pl": "system zarzadzania zapasami just-in-time (dostawa dokladnie na czas)", "def": "An inventory management strategy where materials are scheduled to arrive at the factory floor exactly when needed in the production cycle.", "trap": "Pozwala zaoszczedzic na magazynach, ale jest skrajnie podatny na zatory w dostawach.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 196, "en": "economies of scale vs diseconomies of scale", "pl": "korzysci skali (spadek kosztu jednostkowego) vs niekorzysci skali (wzrost kosztow przez przerost biurokracji)", "def": "Economies of scale occur when unit costs decline as production volume increases; diseconomies occur when firms become too massive and inefficient.", "trap": "Ulubione pytanie egzaminacyjne z mikro- i makroekonomii.", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 197, "en": "procurement", "pl": "zaopatrzenie / dzial zakupow strategicznych w firmie", "def": "The comprehensive business process of sourcing, negotiating, purchasing, and acquiring goods, raw materials, or services from external suppliers.", "trap": "Procurement to caly strategiczny proces (selekcja, audyt, negocjacje), a nie zwykle klikniecie zakupu (purchasing).", "category": "Commerce & Supply Chain", "source": "lekcja"}, {"id": 198, "en": "severance pay / severance package", "pl": "odprawa dla zwalnianego pracownika", "def": "Compensation and benefits provided to an employee whose employment is involuntarily terminated without disciplinary fault.", "trap": "Dla szeregowego pracownika to severance pay; dla prezesa/top menedzera to golden handshake / golden parachute.", "category": "HR & Workplace", "source": "l
