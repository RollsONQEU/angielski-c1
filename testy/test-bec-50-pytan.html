<!DOCTYPE html>
<html lang="pl" data-motyw="granat">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Słownictwa BEC C1 — 50 Pytań Egzaminacyjnych</title>
<style>
:root{
  color-scheme: light;
  --akcent:#234a6b; --akcent-tlo:#eaf0f6;
  --papier:#fbfbf9; --karta:#fff; --tusz:#1a222b; --przygasly:#5d6b78; --slaby:#93a0ab;
  --linia:#e3e8ed; --dobrze:#2f6b4f; --dobrze-tlo:#eaf3ee; --zle:#8a3b3b; --zle-tlo:#f8efee;
}

*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--tusz);background:var(--papier);line-height:1.65;font-size:17px;
  max-width:46rem;margin:0 auto;padding:0 24px 140px;-webkit-font-smoothing:antialiased}
h1{font-family:Georgia,serif;font-size:1.9rem;margin:34px 0 4px;font-weight:600}
.metryka{color:var(--przygasly);font-size:.93rem;padding-bottom:20px;border-bottom:1px solid var(--linia);margin-bottom:8px}

#ster{position:sticky;top:0;z-index:50;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  margin:0 -24px 24px;padding:10px 24px;border-bottom:1px solid var(--linia);
  background:color-mix(in srgb,var(--papier) 88%,transparent);backdrop-filter:blur(10px)}
#ster button{font:600 .74rem/1 -apple-system,sans-serif;color:var(--przygasly);background:var(--karta);
  border:1px solid var(--linia);border-radius:99px;padding:7px 13px;cursor:pointer;transition:.15s}
#ster button:hover{color:var(--akcent);border-color:var(--akcent)}
#ster button[aria-pressed="true"]{background:var(--akcent);border-color:var(--akcent);color:var(--papier)}
#ster .rozpieracz{flex:1}
#wynik{font:700 .8rem/1 -apple-system,sans-serif;color:var(--akcent)}

.pytanie{background:var(--karta);border:1px solid var(--linia);border-radius:12px;padding:20px 24px;margin:18px 0}
.pytanie.ok{border-color:var(--dobrze)}
.pytanie.blad{border-color:var(--zle)}
.pytanie > .numer{display:block;font:700 .66rem/1 -apple-system,sans-serif;letter-spacing:.14em;
  text-transform:uppercase;color:var(--slaby);margin-bottom:9px}
.pytanie .tresc{font-size:1.03rem;margin-bottom:14px}
.pytanie .tresc b{color:var(--akcent)}

.opcje{display:flex;flex-direction:column;gap:7px}
.opcja{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  font:inherit;color:var(--tusz);background:transparent;border:1px solid var(--linia);
  border-radius:9px;padding:11px 14px;cursor:pointer;transition:.14s;line-height:1.5}
.opcja:hover:not(:disabled){border-color:var(--akcent);background:var(--akcent-tlo)}
.opcja:disabled{cursor:default}
.opcja .klucz{flex:0 0 1.5rem;font:700 .84rem/1.5 -apple-system,sans-serif;color:var(--slaby)}
.opcja.wybrana{border-color:var(--akcent);background:var(--akcent-tlo)}
.opcja.dobra{border-color:var(--dobrze);background:var(--dobrze-tlo)}
.opcja.dobra .klucz{color:var(--dobrze)}
.opcja.zla{border-color:var(--zle);background:var(--zle-tlo)}
.opcja.zla .klucz{color:var(--zle)}

.wyjasnienie{margin-top:14px;padding:12px 16px;border-left:3px solid var(--slaby);
  background:var(--akcent-tlo);border-radius:0 8px 8px 0;font-size:.94rem;color:var(--przygasly)}
.wyjasnienie b{color:var(--akcent)}
.wyjasnienie[hidden]{display:none}

#podsumowanie{background:var(--karta);border:1px solid var(--linia);border-radius:12px;
  padding:26px 28px;margin:34px 0;text-align:center}
#podsumowanie[hidden]{display:none}
#podsumowanie .procent{font:600 3rem/1 Georgia,serif;color:var(--akcent);display:block}
#podsumowanie .opis{color:var(--przygasly);margin:10px 0 18px}
#podsumowanie button{font:600 .82rem -apple-system,sans-serif;color:var(--papier);background:var(--akcent);
  border:0;border-radius:9px;padding:11px 20px;cursor:pointer;margin:0 5px}

@media print{#ster{display:none}.opcja{break-inside:avoid}.pytanie{break-inside:avoid}}
</style>
</head>
<body>

<nav id="ster">
  <button id="btn-mieszaj" aria-pressed="false">Mieszaj pytania</button>
  <button id="btn-tylko-bledne" aria-pressed="false">Tylko błędne</button>
  <button id="btn-reset">Od nowa</button>
  <span class="rozpieracz"></span>
  <span id="wynik">0 / 0</span>
</nav>

<h1 id="tytul">Test Słownictwa BEC C1 — 50 Pytań</h1>
<p class="metryka" id="metryka">Business English Certificate Higher · 50 pytań zamkniętych · Część 1 (1–25) i Część 2 (26–50) z ćwiczeń</p>

<div id="pytania"></div>

<div id="podsumowanie" hidden>
  <span class="procent" id="procent">—</span>
  <p class="opis" id="opis-wyniku"></p>
  <button id="btn-powtorz-bledne">Powtórz błędne</button>
  <button id="btn-od-nowa">Od nowa</button>
</div>

    },
    {
      "typ": "abcd",
      "tresc": "3. The Government has just raised the minimum hourly ___.",

      "wyjasnienie": "Poprawnie: wage. Stawka godzinowa to wyłącznie 'hourly wage' (dla pracowników operacyjnych/fizycznych). 'Salary' to stała pensja miesięczna lub roczna (nie ma zwrotu *hourly salary*), a 'bonus' to premia."

<script>
(function(){
  const dane = JSON.parse(document.getElementById('dane').textContent);
  const kosz = document.getElementById('pytania');
  const wynikEl = document.getElementById('wynik');
  const podsum = document.getElementById('podsumowanie');

  document.title = dane.tytul;
  document.getElementById('tytul').textContent = dane.tytul;
  document.getElementById('metryka').textContent = dane.metryka || '';
  if (dane.motyw) document.documentElement.dataset.motyw = dane.motyw;

  const KLUCZE = ['a)','b)','c)','d)'];
  let stan = [];
  let mieszaj = false, tylkoBledne = false;

  function pomieszaj(tablica){
    const kopia = tablica.slice();
    for (let i = kopia.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [kopia[i], kopia[j]] = [kopia[j], kopia[i]];
    }
    return kopia;
  }

  function renderuj(){
    kosz.innerHTML = '';
    let widoczne = 0;
    stan.forEach((st, idx) => {
      if (tylkoBledne && st.poprawnie !== false) return;
      widoczne++;
      const el = document.createElement('article');
      el.className = 'pytanie';
      if (st.poprawnie === true) el.classList.add('ok');
      if (st.poprawnie === false) el.classList.add('blad');

      const nr = document.createElement('span');
      nr.className = 'numer';
      nr.textContent = `Pytanie ${st.nrOryginalny + 1} z ${dane.pytania.length}`;
      el.appendChild(nr);

      const tresc = document.createElement('div');
      tresc.className = 'tresc';
      tresc.textContent = st.pyt.tresc;
      el.appendChild(tresc);

      const opcjeDiv = document.createElement('div');
      opcjeDiv.className = 'opcje';
      st.pyt.opcje.forEach((opcjaTekst, opcIdx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'opcja';
        if (st.wybrano === opcIdx) btn.classList.add('wybrana');
        if (st.poprawnie !== null) {
          btn.disabled = true;
          if (opcIdx === st.pyt.poprawna) btn.classList.add('dobra');
          else if (st.wybrano === opcIdx) btn.classList.add('zla');
        }
        btn.innerHTML = `<span class="klucz">${KLUCZE[opcIdx] || ''}</span> <span>${opcjaTekst}</span>`;
        btn.addEventListener('click', () => {
          st.wybrano = opcIdx;
          st.poprawnie = (opcIdx === st.pyt.poprawna);
          aktualizujWynik();
          renderuj();
        });
        opcjeDiv.appendChild(btn);
      });
      el.appendChild(opcjeDiv);

      if (st.poprawnie !== null && st.pyt.wyjasnienie) {
        const wyj = document.createElement('div');
        wyj.className = 'wyjasnienie';
        wyj.innerHTML = `<b>Wyjaśnienie:</b> ${st.pyt.wyjasnienie}`;
        el.appendChild(wyj);
      }
      kosz.appendChild(el);
    });

    if (widoczne === 0 && tylkoBledne) {
      kosz.innerHTML = '<p class="metryka" style="text-align:center;padding:30px 0;">Brak błędnych odpowiedzi. Wszystko opanowane!</p>';
    }
  }

  function aktualizujWynik(){
    const zakonczone = stan.filter(s => s.poprawnie !== null);
    const poprawne = stan.filter(s => s.poprawnie === true).length;
    wynikEl.textContent = `${poprawne} / ${dane.pytania.length}`;

    if (zakonczone.length === dane.pytania.length) {
      podsum.hidden = false;
      const proc = Math.round((poprawne / dane.pytania.length) * 100);
      document.getElementById('procent').textContent = `${proc}%`;
      const opis = proc >= 80 ? `Wynik: ${poprawne}/${dane.pytania.length}. Próg zaliczenia osiągnięty z zapasem.` : `Wynik: ${poprawne}/${dane.pytania.length}. Przećwicz błędne odpowiedzi przyciskiem poniżej.`;
      document.getElementById('opis-wyniku').textContent = opis;
    } else {
      podsum.hidden = true;
    }
  }

  function inicjalizuj(){
    let lista = dane.pytania.map((pyt, idx) => ({ pyt, nrOryginalny: idx, poprawnie: null, wybrano: null }));
    if (mieszaj) lista = pomieszaj(lista);
    stan = lista;
    aktualizujWynik();
    renderuj();
  }

  document.getElementById('btn-mieszaj').addEventListener('click', function(){
    mieszaj = !mieszaj;
    this.setAttribute('aria-pressed', String(mieszaj));
    inicjalizuj();
  });

  document.getElementById('btn-tylko-bledne').addEventListener('click', function(){
    tylkoBledne = !tylkoBledne;
    this.setAttribute('aria-pressed', String(tylkoBledne));
    renderuj();
  });

  document.getElementById('btn-reset').addEventListener('click', inicjalizuj);
  document.getElementById('btn-od-nowa').addEventListener('click', inicjalizuj);
  document.getElementById('btn-powtorz-bledne').addEventListener('click', () => {
    tylkoBledne = true;
    document.getElementById('btn-tylko-bledne').setAttribute('aria-pressed', 'true');
    renderuj();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  inicjalizuj();
})();
</script>

</body>
